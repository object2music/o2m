<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O2M">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>O2M Mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script>
  /* Applique le thème avant le rendu pour éviter le flash */
  (function () {
    var t = new URLSearchParams(location.search).get('theme')
          || localStorage.getItem('o2m-theme') || 'mono';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ════════════ THÈME : Sombre (inverse du Mono) ════════════ */
  :root, [data-theme="dark"] {
    --bg: #181818; --surface: #181818; --card: #262626;
    --accent: #ffffff; --accent-soft: #ffffff1a;
    --text: #ffffff; --muted: #777777;
    --border: #ffffff18; --border-soft: #ffffff0c; --border-strong: #ffffff33;
    --fill-1: #ffffff06; --fill-2: #ffffff0f; --fill-3: #ffffff16;
    --track-bg: #2a2a2a;
    --c-energy: #ffffff; --c-valence: #888888; --c-dl: #ff3b00; --dial-txt: #ffffff;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #ff3b00;
    --mx-bg: #202020;
    --mx-q-calm: #ffffff04; --mx-q-happy: #ffffff09;
    --mx-q-dark: #ffffff0f; --mx-q-energetic: #ffffff07;
    --mx-line: #ffffff26; --mx-border: transparent;
    --mx-label: #ffffff33; --mx-axis: #ffffff55;
    --mx-dl-fill: #ff3b0012; --mx-dl-stroke: #ff3b0099;
    --mx-dot-core: #ffffff; --mx-pulse: 255,255,255;
    --mood-happy: 210,210,210; --mood-energetic: 255,59,0;
    --mood-calm: 150,150,150; --mood-dark: 90,90,90;
  }

  /* ════════════ THÈME : Crème (éditorial) ════════════ */
  [data-theme="creme"] {
    --bg: #f3efe6; --surface: #ece7db; --card: #e2dccb;
    --accent: #e8462a; --accent-soft: #e8462a1f;
    --text: #1a1a1a; --muted: #8a8578;
    --border: #1a1a1a1f; --border-soft: #1a1a1a12; --border-strong: #1a1a1a2e;
    --fill-1: #1a1a1a08; --fill-2: #1a1a1a10; --fill-3: #1a1a1a1a;
    --track-bg: #d8d2c4;
    --c-energy: #e8462a; --c-valence: #2e8b8b; --c-dl: #7c4dbe; --dial-txt: #1a1a1a;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: var(--accent);
    --mx-bg: #ece7db;
    --mx-q-calm: #00000006; --mx-q-happy: #0000000d;
    --mx-q-dark: #00000015; --mx-q-energetic: #0000000a;
    --mx-line: #1a1a1a26; --mx-border: transparent;
    --mx-label: #1a1a1a3a; --mx-axis: #1a1a1a55;
    --mx-dl-fill: #7c4dbe12; --mx-dl-stroke: #7c4dbe99;
    --mx-dot-core: #ffffff; --mx-pulse: 26,26,26;
    --mood-happy: 217,164,0; --mood-energetic: 232,70,42;
    --mood-calm: 124,77,190; --mood-dark: 44,74,112;
  }

  /* ════════════ THÈME : Mono (brut N&B) ════════════ */
  [data-theme="mono"] {
    --bg: #ffffff; --surface: #ffffff; --card: #f0f0f0;
    --accent: #111111; --accent-soft: #1111111a;
    --text: #000000; --muted: #9a9a9a;
    --border: #00000018; --border-soft: #0000000c; --border-strong: #00000033;
    --fill-1: #00000006; --fill-2: #0000000f; --fill-3: #00000016;
    --track-bg: #e2e2e2;
    --c-energy: #111111; --c-valence: #888888; --c-dl: #ff3b00; --dial-txt: #000000;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #ff3b00;
    --mx-bg: #f4f4f4;
    --mx-q-calm: #00000005; --mx-q-happy: #0000000b;
    --mx-q-dark: #00000012; --mx-q-energetic: #00000008;
    --mx-line: #00000026; --mx-border: transparent;
    --mx-label: #00000033; --mx-axis: #00000055;
    --mx-dl-fill: #ff3b0010; --mx-dl-stroke: #ff3b0099;
    --mx-dot-core: #ffffff; --mx-pulse: 0,0,0;
    --mood-happy: 60,60,60; --mood-energetic: 255,59,0;
    --mood-calm: 140,140,140; --mood-dark: 20,20,20;
  }

  /* ════════════ THÈME : Overprint (affiche éditoriale, orange) ════════════ */
  [data-theme="overprint"] {
    --bg: #ffffff; --surface: #ffffff; --card: #f0f0f0;
    --accent: #ff5a00; --accent-soft: #ff5a001a;
    --text: #000000; --muted: #9a9a9a;
    --border: #00000018; --border-soft: #0000000c; --border-strong: #00000033;
    --fill-1: #00000006; --fill-2: #0000000f; --fill-3: #00000016;
    --track-bg: #e2e2e2;
    --hero-accent: #ff5a00;
    --c-energy: #111111; --c-valence: #888888; --c-dl: #ff5a00; --dial-txt: #000000;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #ff5a00;
    --mx-bg: #f4f4f4;
    --mx-q-calm: #00000005; --mx-q-happy: #0000000b;
    --mx-q-dark: #00000012; --mx-q-energetic: #00000008;
    --mx-line: #00000026; --mx-border: transparent;
    --mx-label: #00000033; --mx-axis: #00000055;
    --mx-dl-fill: #ff5a0010; --mx-dl-stroke: #ff5a0099;
    --mx-dot-core: #ffffff; --mx-pulse: 0,0,0;
    --mood-happy: 60,60,60; --mood-energetic: 255,59,0;
    --mood-calm: 140,140,140; --mood-dark: 20,20,20;
  }

  /* ════════════ THÈME : Invert (cinématique, couleur dynamique) ════════════ */
  [data-theme="invert"] {
    --bg: #0c0c0c; --surface: #0c0c0c; --card: #1c1c1c;
    --accent: var(--hero-accent, #ff3b00); --accent-soft: #ffffff1a;
    --text: #ffffff; --muted: #777777;
    --border: #ffffff18; --border-soft: #ffffff0c; --border-strong: #ffffff33;
    --fill-1: #ffffff06; --fill-2: #ffffff0f; --fill-3: #ffffff16;
    --track-bg: #2a2a2a;
    --hero-accent: #ff3b00;
    --c-energy: #ffffff; --c-valence: #888888; --c-dl: var(--hero-accent, #ff3b00); --dial-txt: #ffffff;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: var(--hero-accent, #ff3b00);
    --mx-bg: #161616;
    --mx-q-calm: #ffffff04; --mx-q-happy: #ffffff09;
    --mx-q-dark: #ffffff0f; --mx-q-energetic: #ffffff07;
    --mx-line: #ffffff26; --mx-border: transparent;
    --mx-label: #ffffff33; --mx-axis: #ffffff55;
    --mx-dl-fill: #ffffff12; --mx-dl-stroke: var(--hero-accent, #ff3b00);
    --mx-dot-core: #ffffff; --mx-pulse: 255,255,255;
    --mood-happy: 210,210,210; --mood-energetic: 255,59,0;
    --mood-calm: 150,150,150; --mood-dark: 90,90,90;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         display: flex; flex-direction: column; overflow: hidden; height: 100dvh;
         transition: background .25s, color .25s; }


  /* Couleurs des potentiomètres (override des attributs SVG inline) */
  #fill-energy  { stroke: var(--c-energy);  }
  #knob-energy  { fill:   var(--c-energy);  }
  #fill-valence { stroke: var(--c-valence); }
  #knob-valence { fill:   var(--c-valence); }
  #fill-dl      { stroke: var(--c-dl);      }
  #knob-dl      { fill:   var(--c-dl);      }
  .dial-svg text { fill: var(--dial-txt); }

  /* Marqueur éditorial devant les libellés de section */
  .panel-head::before,
  #genres-label::before,
  #tracklist-label > span:first-child::before {
    content: var(--eyebrow-mark, ""); color: var(--eyebrow-color, var(--accent));
  }

  /* Sélecteur de thème */
  #theme-switcher { display: flex; gap: 6px; margin-left: auto; }
  .theme-chip {
    font-size: 11px; cursor: pointer; padding: 3px 11px; border-radius: 0;
    background: var(--fill-1); border: none; color: var(--muted);
    transition: all .15s; font-family: var(--font);
  }
  .theme-chip.active { background: var(--accent); color: #fff; }
  [data-theme="mono"] .theme-chip.active { color: #fff; }

  /* ── Top zone : pochette colonne + infos/contrôles à droite ── */
  #top-zone {
    display: flex; align-items: stretch; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #cover-col { flex: 0 0 auto; display: flex; padding: 12px; }
  #top-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ── Colonne détails du morceau ── */
  #track-details {
    flex: 0 0 230px; min-width: 0; border-left: 1px solid var(--border);
    padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
  }
  #track-details .td-head {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-head); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: .02em; color: var(--text);
  }
  #btn-edit-lock {
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px 4px; line-height: 1; transition: color .15s;
    display: inline-flex; align-items: center;
  }
  #btn-edit-lock svg { width: 15px; height: 15px; display: block; }
  #btn-edit-lock.unlocked { color: var(--accent); }
  #track-details .td-list { display: flex; flex-direction: column; gap: 7px; margin: 0; }
  #track-details .td-list > div {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  #track-details dt {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; flex-shrink: 0;
  }
  #track-details dd {
    margin: 0; font-size: 13px; color: var(--text); font-weight: 600;
    text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  #td-fav { line-height: 1; user-select: none; display: inline-flex; }
  #td-fav svg { width: 16px; height: 16px; display: block; }
  #td-fav.on { color: #e0245e; }
  body.edit-mode #td-fav { cursor: pointer; }
  .td-playlists { display: none; }
  body.edit-mode .td-playlists {
    display: block; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px;
  }
  .td-playlists .pl-head {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 6px;
  }
  .td-playlists .pl-list {
    display: flex; flex-direction: column; gap: 5px; max-height: 168px; overflow-y: auto;
  }
  .td-playlists label {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text); cursor: pointer; min-width: 0;
  }
  .td-playlists label span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .td-playlists input { accent-color: var(--accent); flex-shrink: 0; }
  .td-playlists .pl-empty { font-size: 11px; color: var(--muted); line-height: 1.4; }
  body.edit-mode #mood-matrix { box-shadow: inset 0 0 0 2px var(--accent); }

  /* ── Now Playing ── */
  #now-playing {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 12px 16px; background: var(--surface);
    flex-shrink: 0;
  }
  #cover-wrap {
    position: relative; aspect-ratio: 1 / 1; height: 100%;
    background: var(--surface); overflow: hidden;
  }
  #cover {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    filter: grayscale(1); transition: filter .4s;
  }
  #cover-wrap:hover #cover { filter: grayscale(0); }
  #track-info { flex: 1; min-width: 0; padding-top: 2px; }
  #track-name { font-size: 21px; white-space: nowrap; line-height: 1.1;
                overflow: hidden; text-overflow: ellipsis; color: var(--eyebrow-color, var(--accent));
                font-family: var(--font-head); font-weight: var(--head-weight);
                text-transform: var(--head-transform); letter-spacing: var(--head-spacing); }
  #artist-name { font-size: 14px; color: var(--muted); margin-top: 3px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* track status badge — texte plat lisible, avec carré de couleur en tête */
  #track-status-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    font-family: var(--font-head); color: var(--text);
    text-transform: uppercase; transition: color .2s;
  }
  #track-status-badge::before {
    content: ''; width: 9px; height: 9px; flex-shrink: 0;
    background: var(--muted); /* couleur par défaut, surchargée par statut */
  }
  #track-status-badge.s-library::before   { background: #2196f3; }
  #track-status-badge.s-favorites::before { background: #4caf50; }
  #track-status-badge.s-incoming::before  { background: #ff9800; }
  #track-status-badge.s-new::before        { background: #ff5722; }
  #track-status-badge.s-trash::before      { background: #f44336; }
  #track-status-badge.s-hidden::before     { background: #9c27b0; }
  #track-status-badge.s-podcast::before    { background: #607d8b; }

  /* volume row */
  #volume-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 2px 14px 0;
  }
  #volume-icon { flex-shrink: 0; color: var(--muted); display: flex; align-items: center; }
  #volume-icon svg { width: 16px; height: 16px; display: block; }
  #volume-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 0; outline: none; cursor: pointer;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--vol-pct, 50%), var(--border-strong) var(--vol-pct, 50%));
  }
  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  #volume-val { font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; flex-shrink: 0; }

  /* ── Track tags row (inside now-playing) ── */
  #track-tags-row {
    display: flex; align-items: baseline; gap: 0; margin-top: 7px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; flex-wrap: nowrap;
  }
  #track-tags-row::-webkit-scrollbar { display: none; }
  .tag-chip {
    padding: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .01em;
    color: var(--text); font-weight: 600; font-family: var(--font-head);
    white-space: nowrap; flex-shrink: 0;
  }
  .tag-chip:not(:first-child)::before {
    content: "/"; margin: 0 9px; color: var(--eyebrow-color, var(--accent)); font-weight: 700;
  }
  /* Énergie/valence retirées d'à côté des tags : déjà présentes dans le status,
     les dials et le panneau détails (info redondante) */
  #track-ev { display: none; }
  #track-ev svg, #matrix-tooltip .tt-ev svg {
    width: 12px; height: 12px; vertical-align: -2px;
  }

  /* ── Controls ── */
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 28px;
    padding: 10px 16px; background: var(--surface);
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    line-height: 1; padding: 8px; border-radius: 0;
    transition: background .15s, transform .1s; display: flex; align-items: center;
  }
  .ctrl-btn svg { width: 24px; height: 24px; display: block; }
  .ctrl-btn:active { background: var(--fill-3); transform: scale(.92); }
  #btn-play { color: var(--accent); }
  #btn-play svg { width: 32px; height: 32px; }

  /* Snapcast inline dans la volume-row */
  #btn-snapcast {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 0 0 0 6px; display: flex; align-items: center; flex-shrink: 0;
    transition: color .15s;
  }
  #btn-snapcast svg { width: 18px; height: 18px; display: block; }
  #btn-snapcast.playing { color: var(--accent); }

  /* ── Progress bar ── */
  #progress-wrap {
    padding: 6px 16px 10px; background: var(--surface);
    flex-shrink: 0;
  }
  #progress-bar {
    height: 5px; background: var(--track-bg); border-radius: 0;
    cursor: pointer; position: relative; touch-action: none;
  }
  #progress-fill {
    height: 100%; background: var(--accent); border-radius: 0;
    width: 0%; transition: width 1s linear; position: relative;
  }
  /* poignée de glisser-déposer : visible au survol / pendant le seek */
  #progress-fill::after {
    content: ''; position: absolute; right: -6px; top: 50%;
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    transform: translateY(-50%) scale(0); transition: transform .14s var(--ease, ease);
  }
  #progress-wrap:hover #progress-fill::after,
  #progress-bar.seeking #progress-fill::after { transform: translateY(-50%) scale(1); }
  #progress-bar.seeking #progress-fill { transition: none; }
  #progress-time {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 3px;
  }

  /* ── Scrollable content ── */
  #scroll-area {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Dials ── */
  #dials {
    display: flex; flex-direction: row; justify-content: space-around;
    align-items: flex-end; padding: 14px 8px 6px; gap: 4px;
  }
  .dial-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .dial-label { font-size: 13px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .08em; text-align: center; }
  .dial-svg { touch-action: none; cursor: grab; display: block; }
  .dial-svg:active { cursor: grabbing; }
  .dial-track { fill: none; stroke: var(--border); stroke-width: 8; stroke-linecap: round; }
  .dial-fill  { fill: none; stroke-width: 8; stroke-linecap: round;
                transition: stroke-dashoffset .05s; }
  .dial-sub { font-size: 11px; color: var(--muted); text-align: center; }

  /* ── 3-column layout ── */
  #main-cols { display: flex; flex-direction: column; }
  #left-panel { display: flex; flex-direction: column; }
  #boxes-panel { padding: 12px 14px; border-top: 1px solid var(--border); }
  .panel-head {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: var(--text);
    margin-bottom: 10px; cursor: default;
  }
  .panel-body { display: block; }
  #boxes-wrap { display: flex; flex-direction: column; gap: 6px; }
  .box-btn {
    padding: 8px 4px; border-radius: 0;
    border: none; background: none; color: var(--muted);
    cursor: pointer; transition: color .15s, opacity .15s; text-align: left;
    display: flex; align-items: center; gap: 12px; width: 100%;
  }
  .box-swatch {
    width: 14px; height: 14px; flex-shrink: 0;
    background: currentColor; opacity: .35; transition: all .15s;
  }
  .box-name { font-size: 14px; font-weight: 600; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .box-btn.active { color: var(--text); }
  .box-btn.active .box-swatch { opacity: 1; background: var(--accent); }
  .box-btn:active { opacity: .6; }
  .box-btn:disabled { opacity: .5; cursor: wait; }

  @media (min-width: 700px) {
    /* 3 colonnes scrollables indépendamment, footer fixe en bas */
    #scroll-area { display: flex; flex-direction: column; overflow: hidden; }
    #main-cols { flex-direction: row; align-items: stretch; flex: 1; min-height: 0; }
    .col { overflow-y: auto; min-height: 0; }
    #footer-links { flex-shrink: 0; }
    #boxes-panel { flex: 0 0 25%; border-top: none; border-right: 1px solid var(--border);
                   padding: 0; }
    #left-panel  { flex: 0 0 35%; border-right: 1px solid var(--border); min-width: 0; }
    #tracklist-col { flex: 0 0 40%; min-width: 0; }
    /* En-têtes de colonnes : alignés (même top/left) et statiques au scroll */
    #boxes-panel-label, #settings-label, #tracklist-label {
      position: sticky; top: 0; z-index: 6; background: var(--bg);
      padding: 13px 12px 10px; margin: 0;
    }
    #boxes-panel .panel-body { padding: 0 12px 14px; }
    #dials { padding: 8px 10px 6px; }
    #matrix-section { padding: 4px 10px 8px; min-width: 0; }
    #genres-section { padding: 8px 10px 10px; border-top: 1px solid var(--border); }
    #tracklist-section { padding: 0; }
    #tracklist-wrap { padding: 0 12px 10px; }

    /* En-têtes de menu (Boxes / Settings / Tracklist) figés en haut de chaque
       colonne scrollable — toujours visibles au défilement, comme en mobile. */
    .col > .panel-head,
    #tracklist-label {
      position: sticky; top: 0; z-index: 6;
      background: var(--bg); padding-top: 4px; padding-bottom: 8px; margin-bottom: 2px;
    }
  }

  @media (max-width: 699px) {
    /* En-tête compact et lisible */
    #cover-col { padding: 10px; }
    #cover-wrap { aspect-ratio: auto; width: 84px; height: 84px; }
    #now-playing { padding: 10px 12px; gap: 10px; }
    #track-name { font-size: 17px; }

    /* Colonne détails → bloc repliable pleine largeur sous l'en-tête */
    #top-zone { flex-wrap: wrap; }
    #track-details {
      flex: 1 1 100%; border-left: none; border-top: 1px solid var(--border);
      padding: 8px 12px; gap: 0;
    }
    #track-details .td-head { cursor: pointer; padding-right: 22px; position: relative; }
    #track-details .td-head::after {
      content: '▸'; position: absolute; right: 26px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 11px;
    }
    #track-details.open .td-head::after { content: '▾'; }
    #track-details:not(.open) .td-body { display: none; }
    #track-details .td-body { margin-top: 8px; }
    #controls { flex-wrap: wrap; gap: 16px; padding: 8px 12px; }

    /* Panneaux Boxes / Réglages repliables — tracklist prioritaire */
    .collapsible .panel-head { cursor: pointer; position: relative; padding-right: 22px; }
    .collapsible .panel-head::after {
      content: '▸'; position: absolute; right: 2px; top: 0; color: var(--muted); font-size: 11px;
    }
    .collapsible.open .panel-head::after { content: '▾'; }
    .collapsible:not(.open) .panel-body { display: none; }

    /* Settings (#left-panel) aligné à la même marge gauche que Boxes/Tracklist */
    #left-panel { padding: 12px 14px; }

    /* En-têtes de menu (Boxes / Settings / Tracklist) épinglés en haut au scroll.
       NB : on cible .collapsible .panel-head pour battre la règle position:relative
       (même spécificité, déclarée plus haut) qui empêchait le sticky. */
    .collapsible .panel-head, #tracklist-label {
      position: sticky; top: 0; z-index: 6; background: var(--bg);
    }
    .collapsible .panel-head { padding: 9px 0; margin-bottom: 4px; }
    #tracklist-label { padding: 9px 0 6px; margin-bottom: 0; }
    .collapsible .panel-head::after { top: 50%; transform: translateY(-50%); }
  }

  /* ── Matrix ── */
  #matrix-section { padding: 4px 14px 6px; }
  #mood-matrix { display: block; width: 100%; aspect-ratio: 1 / 1;
                 touch-action: none; cursor: crosshair; border-radius: 0; }
  #mood-matrix.cursor-resize { cursor: ew-resize; }

  /* ── Auto toggle (mood en direct) ── */
  #auto-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #btn-auto {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 0; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    border: 1px solid var(--muted); background: transparent; color: var(--muted);
    text-transform: uppercase; transition: color .15s, border-color .15s, background .15s;
  }
  #btn-auto svg { width: 14px; height: 14px; display: block; }
  #btn-auto.active {
    color: var(--bg); background: var(--accent); border-color: var(--accent);
  }
  #auto-hint { font-size: 11px; color: var(--muted); }

  /* ── Matrix tooltip ── */
  #matrix-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 200;
    background: var(--surface); border-radius: 0;
    padding: 8px 12px; max-width: 200px;
    box-shadow: 0 4px 20px #00000070;
  }
  #matrix-tooltip .tt-name   { font-size: 13px; font-weight: 600; white-space: nowrap;
                                overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-artist { font-size: 11px; color: var(--muted); margin-top: 2px;
                                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-ev     { font-size: 10px; color: var(--muted); margin-top: 5px;
                                display: flex; gap: 8px; }

  /* ── Genres ── */
  #genres-section { padding: 10px 14px 6px; }
  #genres-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                  letter-spacing: .08em; margin-bottom: 8px; }
  #genres-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .genre-chip {
    padding: 5px 13px; border-radius: 0; font-size: 13px; font-weight: 500;
    border: none; background: var(--fill-2); color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .genre-chip.active { background: var(--accent); color: #fff; }
  .genre-chip:active { transform: scale(.95); }

  /* ── Tracklist ── */
  #tracklist-section { padding: 10px 14px 4px; }
  #tracklist-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #tracklist-count { font-size: 11px; color: var(--muted); }

  /* Harmonisation des titres de section (comme les tags sous le titre) */
  .panel-head, .dial-label, #genres-label,
  #tracklist-label > span:first-child {
    font-family: var(--font-head); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: .02em; color: var(--text);
  }

  /* ── Equalizer playing animation ── */
  .eq-icon {
    display: inline-flex; align-items: flex-end; gap: 2px;
    width: 18px; height: 18px; flex-shrink: 0;
  }
  .eq-icon i {
    flex: 1; background: var(--accent); display: block; border-radius: 0;
    animation: eq-bounce 0.9s ease-in-out infinite alternate;
  }
  .eq-icon i:nth-child(1) { animation-duration: 0.8s; animation-delay: 0s; }
  .eq-icon i:nth-child(2) { animation-duration: 1.1s; animation-delay: 0.2s; }
  .eq-icon i:nth-child(3) { animation-duration: 0.7s; animation-delay: 0.1s; }
  @keyframes eq-bounce {
    from { height: 3px; opacity: .5; }
    to   { height: 16px; opacity: 1; }
  }

  #tracklist-wrap { display: flex; flex-direction: column; gap: 2px; }
  .tl-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 4px; border-radius: 0; cursor: pointer;
    transition: background .12s;
  }
  .tl-item:active { background: var(--fill-2); }
  .tl-item.current .tl-name { color: var(--accent); }
  .tl-num {
    font-family: var(--font-head); font-size: 22px; font-weight: 800;
    color: var(--muted); min-width: 36px; text-align: left; flex-shrink: 0;
    letter-spacing: -.03em; line-height: 1; opacity: .55;
    display: flex; align-items: center;
  }
  .tl-item.current .tl-num { color: var(--accent); opacity: 1; }
  .tl-texts { flex: 1; min-width: 0; align-self: center; }
  .tl-name { font-size: 14px; font-weight: 600; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .tl-artist { font-size: 12px; color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tl-dur { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .tl-status {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tl-status.s-library   { color: #4fc3f7; }
  .tl-status.s-favorites { color: #81c784; }
  .tl-status.s-incoming  { color: #ffb74d; }
  .tl-status.s-new       { color: #ff8a65; }
  .tl-status.s-trash     { color: #ef9a9a; }
  .tl-status.s-hidden    { color: #ce93d8; }
  .tl-status.s-podcast   { color: #90a4ae; }

  /* ── Footer links ── */
  #footer-links {
    padding: 7px 14px; padding-bottom: max(7px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  }
  .footer-link {
    font-size: 11px; color: var(--muted); text-decoration: none;
    padding: 3px 10px; border-radius: 0;
    background: var(--fill-1); border: none;
    transition: background .15s; white-space: nowrap;
  }
  .footer-link:hover { background: var(--border); color: var(--text); }
  button.footer-link { cursor: pointer; }

  /* ── Feedback (toast flottant, ne réserve plus de ligne) ── */
  #feedback {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(8px);
    z-index: 250; pointer-events: none; max-width: 90vw;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); box-shadow: 0 6px 24px #00000055;
    font-size: 12px; padding: 9px 16px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility .2s;
  }
  #feedback.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  /* ── Clear tracklist button ── */
  #btn-clear-tl {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 2px; border-radius: 0; display: flex; align-items: center;
    transition: color .15s; flex-shrink: 0;
  }
  #btn-clear-tl svg { width: 13px; height: 13px; display: block; }
  #btn-clear-tl:hover { color: var(--accent); }

  /* ── Footer link SVG icons ── */
  .footer-link { display: inline-flex; align-items: center; gap: 5px; }
  .footer-link svg { width: 13px; height: 13px; flex-shrink: 0; }
  #btn-fullscreen.on { background: var(--accent); color: #fff; }
  /* App installée (PWA) : le bouton Fullscreen ne sert plus */
  @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
    #btn-fullscreen { display: none; }
  }

  /* ════════════ Styles AFFICHE : Overprint & Invert ════════════ */
  #hero-title { display: none; }

  /* — commun aux deux affiches — */
  [data-theme="overprint"] #top-zone,
  [data-theme="invert"]    #top-zone {
    position: relative; padding: 0;
  }
  [data-theme="overprint"] #now-playing #track-name,
  [data-theme="invert"]    #now-playing #track-name { display: none; }
  /* La colonne détails reste à droite du top zone (grille) */
  [data-theme="overprint"] #track-details,
  [data-theme="invert"]    #track-details {
    grid-area: details; height: 100%; border-left: 1px solid var(--border); border-top: none;
  }
  /* Titre : pleine largeur dispo ; taille ajustée en JS (fitHeroTitle), coupe à la fin si trop long */
  [data-theme="overprint"] #hero-title,
  [data-theme="invert"]    #hero-title {
    display: block; z-index: 3; pointer-events: none; text-align: left;
    font-family: var(--font-head); font-weight: 900;
    line-height: 0.86; letter-spacing: -0.03em; text-transform: uppercase;
    overflow: hidden;
  }

  /* ===== Overprint : pochette à gauche, titre pleine largeur en haut, contrôles centre-bas ===== */
  /* Largeur pochette DÉFINIE (vh/vw) : un % se résoudrait à 0 dans la grille → effondrement */
  [data-theme="overprint"] #top-zone {
    --ovp-w: min(33vh, 29vw);   /* réduit pour dégager la matrice (était 39vh/35vw) */
    display: grid; align-items: start;
    grid-template-columns: auto 1fr minmax(190px, 240px);
    grid-template-areas: "cover mid details";
  }
  /* align-self:start → la colonne épouse la hauteur du carré (plus de bande vide
     sous la pochette) ; padding:0 → la pochette touche les bords */
  [data-theme="overprint"] #cover-col {
    grid-area: cover; position: relative; display: block; overflow: hidden;
    width: var(--ovp-w); align-self: start; padding: 0;
  }
  [data-theme="overprint"] #cover-wrap {
    aspect-ratio: 1 / 1; height: auto; width: 100%; max-width: none;
    background: var(--card);  /* tuile visible même sans visuel */
  }
  /* Titre superposé en haut, débordant de la pochette sur l'espace central */
  [data-theme="overprint"] #hero-title {
    grid-column: 1 / 3; grid-row: 1; align-self: start; justify-self: stretch;
    margin: 12px 16px 0; white-space: normal; overflow-wrap: anywhere; line-height: 0.9;
    color: rgba(255, 90, 0, 0.92); mix-blend-mode: multiply;
  }
  /* Contrôles + infos dans l'espace central vide, alignés en bas */
  [data-theme="overprint"] #top-right {
    grid-area: mid; align-self: end; justify-self: stretch;
    width: auto; margin: 0; padding: 0 14px 14px; background: none;
  }
  [data-theme="overprint"] #now-playing  { padding: 10px 6px 4px; }
  [data-theme="overprint"] #controls     { justify-content: flex-start; padding: 4px 6px; }
  [data-theme="overprint"] #progress-wrap { padding: 4px 6px 6px; }
  [data-theme="overprint"] #artist-name  { font-size: 22px; font-weight: 600; color: var(--text); }

  /* ===== Invert : bandeau pleine largeur, titre superposé en bas ===== */
  [data-theme="invert"] #top-zone {
    display: grid; align-items: start;
    grid-template-columns: 1fr minmax(190px, 240px);
    grid-template-areas: "cover cover" "right details";
  }
  [data-theme="invert"] #cover-col {
    grid-area: cover; position: relative; display: block; padding: 0; width: 100%;
  }
  [data-theme="invert"] #top-right { grid-area: right; width: 100%; }
  [data-theme="invert"] #cover-wrap {
    aspect-ratio: 16 / 9; height: auto; width: 100%; max-height: 54vh;
    background: #000;
  }
  [data-theme="invert"] #cover { filter: grayscale(1) contrast(1.1); }
  [data-theme="invert"] #cover-wrap:hover #cover { filter: grayscale(0) contrast(1.05); }
  /* Titre superposé en bas du bandeau (même cellule que la pochette) */
  [data-theme="invert"] #hero-title {
    grid-column: 1 / 3; grid-row: 1; align-self: end; justify-self: stretch;
    margin: 0 22px 18px; white-space: nowrap;
    color: var(--hero-accent, #ffffff); mix-blend-mode: difference;
  }
  [data-theme="invert"] #now-playing { padding-top: 14px; }
  [data-theme="invert"] #artist-name { font-size: 16px; }

  /* Affiches en mobile : grille → bloc, détails masqués (titre en haut, pleine largeur) */
  @media (max-width: 699px) {
    [data-theme="overprint"] #top-zone,
    [data-theme="invert"]    #top-zone { display: block; }
    [data-theme="overprint"] #track-details,
    [data-theme="invert"]    #track-details { display: none; }
    [data-theme="overprint"] #cover-col { width: 72vw; max-width: 340px; }
    [data-theme="overprint"] #top-right,
    [data-theme="invert"]    #top-right { width: 100%; margin: 0; padding: 8px 12px; background: none; }
    /* Titre superposé sur la pochette (en haut) — effet overprint conservé en mobile */
    [data-theme="overprint"] #hero-title,
    [data-theme="invert"]    #hero-title {
      position: absolute; top: 10px; left: 14px; right: 14px; z-index: 3;
      margin: 0; height: auto; font-size: clamp(32px, 11vw, 78px);
    }

    /* Overprint mobile : tous les éléments empilés et alignés à gauche sur une
       même colonne (petite marge, comme les en-têtes Boxes/Tracklist) */
    [data-theme="overprint"] #top-right { display: block; padding: 6px 14px 10px; }
    [data-theme="overprint"] #now-playing { padding: 0; gap: 0; }
    [data-theme="overprint"] #track-info { width: 100%; min-width: 0; padding: 0; }
    [data-theme="overprint"] #artist-name {
      font-size: 14px; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    [data-theme="overprint"] #track-status-badge { margin-top: 4px; }
    [data-theme="overprint"] #track-tags-row { margin-top: 6px; }
    [data-theme="overprint"] #controls {
      justify-content: flex-start; flex-wrap: nowrap; gap: 12px; padding: 8px 0 0;
      background: none;
    }
    [data-theme="overprint"] #controls .ctrl-btn { padding: 4px; }
    /* volume à droite des boutons, sur la même ligne (gagne une ligne). On masque
       le % et on laisse le slider se compresser pour que le bouton snapcast
       (dernier enfant) reste visible à droite de la ligne. */
    [data-theme="overprint"] #volume-row {
      flex: 1 1 auto; width: auto; min-width: 0; padding: 0; margin-left: 4px; gap: 6px;
    }
    [data-theme="overprint"] #volume-val { display: none; }
    [data-theme="overprint"] #btn-snapcast { flex-shrink: 0; }
    [data-theme="overprint"] #progress-wrap { padding: 8px 0 2px; }
  }
</style>
</head>
<body>

<!-- Top zone : grande pochette à gauche, infos + contrôles à droite -->
<div id="top-zone">
  <div id="hero-title"></div>
  <div id="cover-col">
    <div id="cover-wrap"><img id="cover" src="" alt=""></div>
  </div>
  <div id="top-right">

    <!-- Now playing -->
    <div id="now-playing">
      <div id="track-info">
        <div id="track-name">—</div>
        <div id="artist-name">O2M</div>
        <div id="track-status-badge"></div>
        <div id="track-tags-row"><span id="track-ev"></span></div>
      </div>
    </div>

    <!-- Playback controls -->
    <div id="controls">
      <button class="ctrl-btn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg></button>
      <button class="ctrl-btn" id="btn-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="ctrl-btn" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg></button>
      <div id="volume-row">
        <span id="volume-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        <input type="range" id="volume-slider" min="0" max="100" value="50">
        <span id="volume-val">50%</span>
        <button id="btn-snapcast" title="Snapcast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></button>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-time">
        <span id="prog-elapsed">0:00</span>
        <span id="prog-duration"></span>
      </div>
    </div>

  </div><!-- /top-right -->

  <!-- Colonne détails du morceau courant (desktop) -->
  <div id="track-details">
    <div class="td-head">
      <span>Details</span>
      <button id="btn-edit-lock" title="Enable editing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
    </div>
    <div class="td-body">
      <dl class="td-list">
        <div><dt>Status</dt><dd id="td-type">—</dd></div>
        <div><dt>Favorite</dt><dd id="td-fav" class="td-fav">—</dd></div>
        <div><dt>Energy</dt><dd id="td-energy">—</dd></div>
        <div><dt>Valence</dt><dd id="td-valence">—</dd></div>
        <div><dt>Mood</dt><dd id="td-mood">—</dd></div>
        <div><dt>Plays</dt><dd id="td-plays">—</dd></div>
        <div><dt>Library</dt><dd id="td-library">—</dd></div>
      </dl>
      <div id="td-playlists" class="td-playlists"></div>
    </div>
  </div>
</div><!-- /top-zone -->

<!-- Scrollable area -->
<div id="scroll-area">

  <!-- 3 colonnes : Boxes | Matrice+Genres | Tracklist -->
  <div id="main-cols">

  <!-- Col 1 : Boxes (repliable en mobile) -->
  <div id="boxes-panel" class="col collapsible">
    <button class="panel-head" id="boxes-panel-label">Boxes</button>

    <div class="panel-body">
      <div id="auto-bar">
        <button id="btn-auto" type="button" title="Auto: les réglages rafraîchissent le mix en direct">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>Auto</span>
        </button>
        <span id="auto-hint">live</span>
      </div>
      <div id="boxes-wrap"></div>
    </div>

<script>
const API = location.origin + '/api';

/* ── Icônes SVG inline (Feather, N&B — jamais d'emoji) ── */
const ICON = {
  lock:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  unlock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>',
  zap:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
  sun:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  heart:  f => `<svg viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
};

/* ── State ── */
let appState = { energy: 0.5, valence: 0.6, dl: 5, genres: [] };
let applyTimer = null;
let currentTlid = null;
let lastScrolledTlid = null;
let currentTracklistLength = 0;
let snapWsUrl = null;
let snapPlayer = null;

/* Mode mood/auto : un changement de réglage rafraîchit le mix en direct
   - autoToggle      : interrupteur manuel "Auto" (persisté)
   - moodSessionActive : actif dès qu'un mix mood a été généré (potards/matrice)
   - autoBoxActive   : une box active contient le mot "auto" */
let autoToggle = false;
let moodSessionActive = false;
let autoBoxActive = false;

/* ── Dial geometry ── */
const R = 42, CX = 55, CY = 55;
const CIRC = 2 * Math.PI * R;
const ARC  = CIRC * 270 / 360;

function setupDial(id) {
  const svg   = document.getElementById('dial-' + id);
  const track = svg.querySelector('.dial-track');
  const fill  = svg.querySelector('.dial-fill');
  track.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  track.setAttribute('stroke-dashoffset', 0);
  fill.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  fill.setAttribute('stroke-dashoffset', ARC);
}

function setDial(id, v01) {
  const fill = document.getElementById('fill-' + id);
  const knob = document.getElementById('knob-' + id);
  const txt  = document.getElementById('txt-' + id);
  fill.setAttribute('stroke-dashoffset', ARC * (1 - v01));
  const a = (135 + v01 * 270) * Math.PI / 180;
  knob.setAttribute('cx', (CX + R * Math.cos(a)).toFixed(1));
  knob.setAttribute('cy', (CY + R * Math.sin(a)).toFixed(1));
  txt.textContent = Math.round(v01 * 10);
}

function makeDraggable(id, onChange) {
  const svg = document.getElementById('dial-' + id);
  let active = false;
  function v01fromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - (rect.left + rect.width / 2);
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - (rect.top  + rect.height / 2);
    let deg = Math.atan2(py, px) * 180 / Math.PI - 135;
    if (deg < 0) deg += 360;
    return Math.min(Math.max(deg, 0), 270) / 270;
  }
  svg.addEventListener('pointerdown', e => {
    active = true; svg.setPointerCapture(e.pointerId);
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointermove', e => {
    if (!active) return; e.preventDefault();
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointerup', () => { active = false; scheduleApply(); });
}

/* ── Mode mood/auto ── */
function isAutoMode() {
  return autoToggle || moodSessionActive || autoBoxActive;
}
function updateAutoBtn() {
  document.getElementById('btn-auto')?.classList.toggle('active', isAutoMode());
}
function setAutoToggle(on) {
  autoToggle = on;
  localStorage.setItem('mood-auto', on ? '1' : '0');
  updateAutoBtn();
}

/* ── Apply ── */
function shouldApplyMood() {
  // Rafraîchit le mix si la tracklist est vide OU si on est en mode mood/auto.
  return currentTracklistLength === 0 || isAutoMode();
}

function scheduleApply() {
  if (!shouldApplyMood()) return;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyMood, 1800);
}

async function applyMood() {
  if (!shouldApplyMood()) return;
  setFeedback('Applying…');
  try {
    const body = { energy: appState.energy, valence: appState.valence,
                   discover_level: appState.dl, genres: appState.genres };
    const r = await fetch(API + '/mood', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    setFeedback(d.tracks_added > 0 ? `${d.tracks_added} tracks loaded` : 'No matching tracks');
    moodSessionActive = true;   // on est désormais dans un mix mood → potards en direct
    updateAutoBtn();
    setTimeout(refreshNowPlaying, 600);
  } catch(e) { setFeedback('Network error'); }
}

/* ── Mopidy RPC ── */
// ─── Mopidy WebSocket (real-time, Iris-style) ───────────────────────────────
// RPCs go over the WS when it's open → no more POST /api/mopidy_rpc (quieter
// logs) and Mopidy events arrive via push (no more 1/s polling). Automatic
// fallback to the HTTP proxy /api/mopidy_rpc when the WS is unavailable.
let mopidyWsUrl = null, mopidyWS = null, wsReqId = 1;
const wsPending = new Map();
let _wsReadyResolve = null;
const wsReady = new Promise(res => { _wsReadyResolve = res; });   // résolu à la 1re ouverture (ou si pas de WS)
function _markWsReady() { if (_wsReadyResolve) { _wsReadyResolve(); _wsReadyResolve = null; } }
function connectMopidyWS() {
  if (!mopidyWsUrl) { _markWsReady(); return; }   // pas de WS configuré → ne bloque pas l'init
  let ws;
  try { ws = new WebSocket(mopidyWsUrl); } catch (e) { _markWsReady(); return; }
  mopidyWS = ws;
  ws.addEventListener('open', _markWsReady);
  ws.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.id != null && wsPending.has(m.id)) {
      const p = wsPending.get(m.id); wsPending.delete(m.id); clearTimeout(p.t); p.resolve(m);
    } else if (m.event) { onMopidyEvent(m); }
  });
  ws.addEventListener('close', () => {
    if (mopidyWS === ws) mopidyWS = null;
    setTimeout(connectMopidyWS, 3000);          // auto-reconnect
  });
  ws.addEventListener('error', () => { try { ws.close(); } catch (_) {} });
}
function wsRpc(method, params) {
  return new Promise((resolve) => {
    const id = wsReqId++;
    const t = setTimeout(() => { if (wsPending.has(id)) { wsPending.delete(id); resolve(null); } }, 5000);
    wsPending.set(id, { resolve, t });
    try { mopidyWS.send(JSON.stringify({ jsonrpc: '2.0', id, method, params })); }
    catch (e) { wsPending.delete(id); clearTimeout(t); resolve(null); }
  });
}
async function rpc(method, params = {}) {
  if (mopidyWS && mopidyWS.readyState === 1) {        // 1 = OPEN
    const r = await wsRpc(method, params);
    if (r) return r;                                  // otherwise HTTP fallback below
  }
  try {
    const r = await fetch(API + '/mopidy_rpc', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc: '2.0', id: 1, method, params})
    });
    return await r.json();
  } catch(e) { return null; }
}

/* ── Controls ── */
let currentDurationMs = 0;

document.getElementById('btn-play').addEventListener('click', async () => {
  const isPlaying = document.getElementById('btn-play').dataset.state === 'playing';
  if (isPlaying) {
    await rpc('core.playback.pause');
  } else {
    await fetch(API + '/toogle_play');
  }
  setTimeout(refreshNowPlaying, 500);
});
document.getElementById('btn-next').addEventListener('click', async () => {
  await rpc('core.playback.next');
  setTimeout(refreshNowPlaying, 800);
});
document.getElementById('btn-prev').addEventListener('click', async () => {
  await rpc('core.playback.previous');
  setTimeout(refreshNowPlaying, 800);
});

/* ── Now playing + tracklist ── */
function msToMin(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function imageUrl(uri) {
  if (!uri) return '';
  if (uri.startsWith('http')) return uri;
  return API + '/mopidy_image?uri=' + encodeURIComponent(uri);
}

function renderTracklist(tracks, activeTlid) {
  const wrap = document.getElementById('tracklist-wrap');
  const count = document.getElementById('tracklist-count');
  wrap.innerHTML = '';
  currentTracklistLength = tracks.length;
  count.textContent = tracks.length ? `${tracks.length} tracks` : '';
  let scrollTarget = null;
  tracks.forEach(({tlid, track}, i) => {
    const item = document.createElement('div');
    item.className = 'tl-item' + (tlid === activeTlid ? ' current' : '');
    const num = document.createElement('div');
    num.className = 'tl-num';
    if (tlid === activeTlid) {
      num.innerHTML = '<span class="eq-icon"><i></i><i></i><i></i></span>';
    } else {
      num.textContent = String(i + 1).padStart(2, '0');
    }
    const texts = document.createElement('div');
    texts.className = 'tl-texts';
    const cached = getCachedStatus(track.uri);
    const statusHtml = cached
      ? `<div class="tl-status ${STATUS_CLASS[(cached.split(' - ')[0]||'').trim().toLowerCase()]||''}"
              data-uri="${track.uri.replace(/"/g,'&quot;')}">${formatStatus(cached)}</div>`
      : `<div class="tl-status" data-uri="${track.uri.replace(/"/g,'&quot;')}"></div>`;
    texts.innerHTML = `<div class="tl-name">${track.name || '?'}</div>
      <div class="tl-artist">${(track.artists||[]).map(a=>a.name).join(', ')}</div>
      ${statusHtml}`;
    const dur = document.createElement('div');
    dur.className = 'tl-dur';
    dur.textContent = msToMin(track.length);
    item.append(num, texts, dur);
    item.addEventListener('click', () => {
      rpc('core.playback.play', {tlid}).then(() => setTimeout(refreshNowPlaying, 500));
    });
    wrap.appendChild(item);
    if (tlid === activeTlid) scrollTarget = item;
  });
  // Auto-scroll vers le titre en cours (uniquement quand il change, pour ne pas gêner)
  if (scrollTarget && activeTlid !== lastScrolledTlid) {
    lastScrolledTlid = activeTlid;
    requestAnimationFrame(() => scrollTracklistToCurrent(scrollTarget));
  }
  fetchTracklistStatuses(tracks);
}

/* Remonte jusqu'au premier ancêtre réellement scrollable (desktop = .col,
   mobile = #scroll-area). */
function scrollableAncestor(el) {
  for (let n = el && el.parentElement; n && n !== document.body; n = n.parentElement) {
    const oy = getComputedStyle(n).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
  }
  return null;
}

/* Centre le titre courant dans son conteneur scrollable (no-op si rien ne scrolle) */
function scrollTracklistToCurrent(item) {
  const container = scrollableAncestor(item);
  if (!container) return;
  const cRect = container.getBoundingClientRect();
  const iRect = item.getBoundingClientRect();
  const offset = (iRect.top - cRect.top) - (container.clientHeight - item.offsetHeight) / 2;
  container.scrollBy({ top: offset, behavior: 'smooth' });
}

const STATUS_CLASS = {
  library: 's-library', normal: 's-library',
  favorites: 's-favorites', incoming: 's-incoming',
  new: 's-new', trash: 's-trash', hidden: 's-hidden', podcast: 's-podcast',
};

/* ── Status helpers ── */
const statusCache = new Map(); // uri → {text, ts}
const STATUS_TTL  = 5 * 60 * 1000;

function getCachedStatus(uri) {
  const e = statusCache.get(uri);
  if (!e || Date.now() - e.ts > STATUS_TTL) return null;
  return e.text;
}

function formatStatus(raw) {
  if (!raw || raw === 'Manual') return '';
  const parts = raw.split(' - ');
  const ot    = parts[0] || '';
  const score = parts[1] || '';
  let lib     = (parts[2] || '').replace(/^(playlist|album|artist):/, '').trim();
  if (score && lib) return lib.startsWith('(')
    ? `${ot} · ${score} ${lib}`
    : `${ot} · ${score} · ${lib}`;
  if (score) return `${ot} · ${score}`;
  return ot;
}

function applyStatusEl(el, raw) {
  const ot  = (raw || '').split(' - ')[0].trim().toLowerCase();
  const cls = STATUS_CLASS[ot] || '';
  el.textContent = formatStatus(raw);
  el.className   = 'tl-status' + (cls ? ' ' + cls : '');
}

async function fetchStatus(uri) {
  const cached = getCachedStatus(uri);
  if (cached !== null) return cached;
  try {
    const r = await fetch(API + '/track_status?uri=' + encodeURIComponent(uri));
    const t = r.ok ? await r.text() : '';
    statusCache.set(uri, { text: t, ts: Date.now() });
    return t;
  } catch(e) { return ''; }
}

function updateStatusBadge(text) {
  const el = document.getElementById('track-status-badge');
  const ot = (text || '').split(' - ')[0].trim().toLowerCase();
  el.textContent = formatStatus(text);
  el.className   = STATUS_CLASS[ot] || '';
}

async function fetchTracklistStatuses(tracks) {
  const CONCURRENCY = 4;
  for (let i = 0; i < tracks.length; i += CONCURRENCY) {
    await Promise.all(
      tracks.slice(i, i + CONCURRENCY).map(async ({ track }) => {
        if (!track?.uri) return;
        const text = await fetchStatus(track.uri);
        const el = document.querySelector(`.tl-status[data-uri="${CSS.escape(track.uri)}"]`);
        if (el && text) applyStatusEl(el, text);
      })
    );
  }
}

async function refreshVolume() {
  const r = await rpc('core.mixer.get_volume');
  const vol = r?.result ?? null;
  if (vol === null) return;
  const slider = document.getElementById('volume-slider');
  const val = document.getElementById('volume-val');
  slider.value = vol;
  slider.style.setProperty('--vol-pct', vol + '%');
  val.textContent = vol + '%';
  const volSvg = vol === 0
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
    : vol < 50
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  document.getElementById('volume-icon').innerHTML = volSvg;
}

async function refreshNowPlaying() {
  const [curR, stateR, tlR] = await Promise.all([
    rpc('core.playback.get_current_tl_track'),
    rpc('core.playback.get_state'),
    rpc('core.tracklist.get_tl_tracks'),
  ]);

  const tlt   = curR?.result;
  const track = tlt?.track;
  const tlid  = tlt?.tlid ?? null;
  const playing = stateR?.result === 'playing';
  const tracks  = tlR?.result || [];

  currentTlid      = tlid;
  matrixCurUri     = track?.uri ?? null;
  currentDurationMs = track?.length || 0;
  document.getElementById('prog-duration').textContent = msToMin(currentDurationMs);
  matrixTlItems  = tracks.map(({tlid: id, track: t}) => ({
    uri: t?.uri, tlid: id,
    name:   t?.name || '',
    artist: (t?.artists || []).map(a => a.name).join(', '),
  }));
  const trackChanged = matrixCurUri !== lastNpUri;
  lastNpUri = matrixCurUri;
  setClock((await rpc('core.playback.get_time_position'))?.result ?? 0, playing);

  fetchTrackFeatures([matrixCurUri, ...matrixTlItems.map(i => i.uri)].filter(Boolean));
  if (trackChanged) fetchAndRenderTrackTags(matrixCurUri);

  const playBtn = document.getElementById('btn-play');
  playBtn.dataset.state = playing ? 'playing' : 'paused';
  playBtn.innerHTML = playing
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

  if (track) {
    document.getElementById('track-name').textContent  = track.name || '—';
    document.getElementById('hero-title').textContent   = track.name || '';
    updateHeroAccent(track.uri);
    fitHeroTitle();
    document.getElementById('artist-name').textContent =
      (track.artists || []).map(a => a.name).join(', ') || '—';

    // O2M metadata (status badge, cover, details): only on track change —
    // avoids /track_status and /track_info being refetched every 10s.
    if (trackChanged) {
      try {
        const statusText = await fetch(API + '/track_status?uri=' + encodeURIComponent(track.uri))
          .then(r => r.ok ? r.text() : '');
        updateStatusBadge(statusText);
      } catch(e) { updateStatusBadge(''); }

      const imgR = await rpc('core.library.get_images', {uris: [track.uri]});
      const imgs = imgR?.result?.[track.uri] || [];
      const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
      lastCoverUrl = best ? imageUrl(best.uri || best) : '';
      document.getElementById('cover').src = lastCoverUrl || placeholderForUri(track.uri);
      renderTrackDetails(track.uri);
    }
    updateMediaSession(track, playing, lastCoverUrl);
  } else {
    document.getElementById('cover').src = placeholderForUri(null);
    document.getElementById('hero-title').textContent = '';
    fitHeroTitle();
    updateStatusBadge('');
    updateMediaSession(null, playing, '');
    renderTrackDetails(null);
  }

  renderTracklist(tracks, tlid);
}

/* ── Media Session API (Bluetooth / notification controls) ── */
function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const setH = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e) {} };
  setH('play',          async () => { await rpc('core.playback.resume');   setTimeout(refreshNowPlaying, 300); });
  setH('pause',         async () => { await rpc('core.playback.pause');    setTimeout(refreshNowPlaying, 300); });
  setH('previoustrack', async () => { await rpc('core.playback.previous'); setTimeout(refreshNowPlaying, 800); });
  setH('nexttrack',     async () => { await rpc('core.playback.next');     setTimeout(refreshNowPlaying, 800); });
  setH('seekto', async (d) => {
    if (d && d.seekTime != null) {
      await rpc('core.playback.seek', { time_position: Math.round(d.seekTime * 1000) });
      setTimeout(refreshNowPlaying, 300);
    }
  });
}

function updateMediaSession(track, isPlaying, coverUrl) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  if (track) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  track.name || '',
      artist: (track.artists || []).map(a => a.name).join(', ') || '',
      album:  track.album?.name || '',
      artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [],
    });
  }
}

/* ── Ancre Media Session ───────────────────────────────────────────────────────
   Snapcast joue via WebAudio (gainNode → ctx.destination, inchangé). WebAudio seul
   ne crée PAS de session média OS, et un <audio srcObject=MediaStream> est traité
   comme de l'audio « communication » → pas de notification sur Android.
   On joue donc un fichier silencieux réel en boucle dans un <audio> : Chrome/Android
   le reconnaît comme média « contenu » actif → métadonnées + contrôles remontent. */
let mediaAnchorEl = null;

function _ensureMediaAnchor() {
  if (!mediaAnchorEl) {
    mediaAnchorEl = document.createElement('audio');
    mediaAnchorEl.id = 'media-anchor';
    mediaAnchorEl.src = '/static/silence.wav';
    mediaAnchorEl.loop = true;
    mediaAnchorEl.preload = 'auto';
    mediaAnchorEl.setAttribute('aria-hidden', 'true');
    mediaAnchorEl.style.display = 'none';
    document.body.appendChild(mediaAnchorEl);
  }
  return mediaAnchorEl;
}

function startMediaAnchor() {
  const el = _ensureMediaAnchor();
  // Doit être appelé dans un geste utilisateur (cas via _snapStart / armMediaAnchor)
  if (!el.paused) return;
  el.play().then(() => console.log('[media-anchor] playing'))
           .catch(e => console.warn('[media-anchor] play blocked', e));
}

function stopMediaAnchor() {
  if (mediaAnchorEl) { try { mediaAnchorEl.pause(); } catch(e) {} }
}

/* Arme l'ancre dès le 1er geste utilisateur, indépendamment de Snapcast :
   la session média OS (titre/pochette/contrôles BT) doit remonter aussi en
   mode « télécommande » desktop (comme Iris), même sans flux Snapcast local. */
function armMediaAnchor() {
  const onGesture = () => {
    startMediaAnchor();
    setTimeout(refreshNowPlaying, 400);  // pousse les métadonnées une fois la session active
  };
  document.addEventListener('click',      onGesture, { once: true });
  document.addEventListener('touchstart', onGesture, { once: true, passive: true });
  document.addEventListener('keydown',    onGesture, { once: true });
}

let favLocal = false, favSpotify = null;  // états favori courants

async function loadEditablePlaylists() {
  if (editablePlaylists) return editablePlaylists;
  try {
    const all = await fetch(API + '/playlists').then(r => r.json());
    editablePlaylists = Array.isArray(all) ? all.filter(p => p.owned) : [];
  } catch(e) { editablePlaylists = []; }
  return editablePlaylists;
}

async function renderPlaylistEditor(uri) {
  const box = document.getElementById('td-playlists');
  if (!box) return;
  if (!editUnlocked || !uri) { box.innerHTML = ''; return; }
  const pls = await loadEditablePlaylists();
  const inSet = new Set();
  try {
    const inPls = await fetch(API + '/track_playlists?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (Array.isArray(inPls)) inPls.forEach(p => inSet.add(p.id));
  } catch(e) {}
  if (!pls.length) {
    box.innerHTML = '<div class="pl-head">Playlists</div>'
      + '<div class="pl-empty">No editable playlists cached. Open backoffice → cache playlists first.</div>';
    return;
  }
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const rows = pls.map(p =>
    '<label><input type="checkbox" data-pid="' + esc(p.id) + '"' + (inSet.has(p.id) ? ' checked' : '') + '>'
    + '<span>' + esc(p.name || p.id) + '</span></label>').join('');
  box.innerHTML = '<div class="pl-head">Playlists</div><div class="pl-list">' + rows + '</div>';
  box.querySelectorAll('input[type=checkbox]').forEach(cb =>
    cb.addEventListener('change', () => togglePlaylistMembership(cb, uri)));
}

async function togglePlaylistMembership(cb, uri) {
  const pid = cb.dataset.pid, add = cb.checked;
  cb.disabled = true;
  try {
    const r = await fetch(API + '/track_playlist', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri, playlist_id: pid, action: add ? 'add' : 'remove' })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); cb.checked = !add; return; }
    const j = await r.json().catch(() => ({}));
    if (j.error) { setFeedback('Playlist: ' + j.error); cb.checked = !add; return; }
    setFeedback(add ? 'Added to playlist' : 'Removed from playlist');
  } catch(e) { setFeedback('Playlist error'); cb.checked = !add; }
  finally { cb.disabled = false; }
}

function renderFav() {
  const el = document.getElementById('td-fav');
  if (!el) return;
  const fav = favLocal || favSpotify === true;
  el.innerHTML = ICON.heart(fav);
  el.classList.toggle('on', fav);
  const src = [favLocal ? 'local' : null, favSpotify === true ? 'Spotify' : null].filter(Boolean).join(' + ');
  el.title = (fav ? 'Favorite' + (src ? ' (' + src + ')' : '') : 'Not a favorite')
           + (editUnlocked ? ' — click to toggle' : '');
}

async function renderTrackDetails(uri) {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  if (!uri) {
    ['td-type','td-energy','td-valence','td-mood','td-plays','td-library'].forEach(id => set(id, '—'));
    detailsUri = null; favLocal = false; favSpotify = null; renderFav();
    return;
  }
  try {
    const info = await fetch(API + '/track_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    const ev = x => (x === null || x === undefined) ? '—' : Math.round(x * 10) + '/10';
    set('td-type',    info.option_type || '—');
    set('td-energy',  ev(info.energy));
    set('td-valence', ev(info.valence));
    set('td-mood',    info.mood || '—');
    set('td-plays',   (info.read_count_end ?? 0) + '');
    set('td-library', info.library || '—');
    favLocal = !!info.liked;
    // Statut Spotify : seulement quand l'uri change, pour ne pas spammer l'API
    if (uri !== detailsUri) {
      favSpotify = null;
      renderFav();
      if (uri.startsWith('spotify:track:')) {
        fetch(API + '/track_saved?uri=' + encodeURIComponent(uri))
          .then(r => r.json()).then(d => { favSpotify = d.saved; renderFav(); })
          .catch(() => {});
      }
      if (editUnlocked) renderPlaylistEditor(uri);
    }
    detailsUri = uri;
    renderFav();
  } catch(e) {
    ['td-type','td-energy','td-valence','td-mood','td-plays','td-library'].forEach(id => set(id, '—'));
  }
}

async function toggleFavorite() {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!detailsUri) return;
  const next = !(favLocal || favSpotify === true);
  try {
    const r = await fetch(API + '/track_favorite', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri: detailsUri, favorite: next })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    const d = await r.json();
    if ('liked_local' in d) favLocal = d.liked_local;
    if ('liked_spotify' in d) favSpotify = d.liked_spotify;
    else if (!detailsUri.startsWith('spotify:track:')) favSpotify = null;
    renderFav();
    setFeedback(next ? 'Added to favorites' : 'Removed from favorites');
  } catch(e) { setFeedback('Favorite error'); }
}

const IRIS_AUTH_URL = 'https://jamesbarnsley.co.nz/iris/auth_spotify.php';
const IRIS_AUTH_ORIGIN = 'https://jamesbarnsley.co.nz';
let editUnlocked = false;

function setEditUnlocked(on, id) {
  editUnlocked = on;
  const btn = document.getElementById('btn-edit-lock');
  if (btn) {
    btn.innerHTML = on ? ICON.unlock : ICON.lock;
    btn.classList.toggle('unlocked', on);
    btn.title = on ? ('Editing enabled' + (id ? ' (' + id + ')' : '') + ' — click to exit')
                   : 'Enable editing';
  }

  if (typeof renderFav === 'function') renderFav();

async function checkEditStatus() {
  try {
    const s = await fetch(API + '/edit_status').then(r => r.json());
    setEditUnlocked(!!s.unlocked, s.id);
  } catch(e) {}
}

function startEditAuth() {
  if (editUnlocked) {  // déjà déverrouillé → déconnexion
    fetch(API + '/edit_logout', {method: 'POST'}).then(() => {
      setEditUnlocked(false); setFeedback('Editing disabled');
    });
    return;
  }
  const scope = encodeURIComponent('user-read-private');
  const popup = window.open(IRIS_AUTH_URL + '?action=authorize&scope=' + scope,
                            'o2m_spotify_auth', 'height=600,width=400');
  if (!popup) { setFeedback('Popup blocked — allow popups'); return; }
  setFeedback('Connecting to Spotify…');

  let done = false;
  function finish() {
    done = true;
    window.removeEventListener('message', onMsg);
    clearInterval(watch);
  }

  function sendToken(token) {
    fetch(API + '/edit_auth', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ access_token: token })
    }).then(async r => {
      let j = {};
      try { j = await r.json(); } catch(e) {}
      console.log('[edit-auth] /edit_auth', r.status, j);
      if (r.status === 404) { setFeedback('Backend not deployed — restart o2m container'); return; }
      if (r.ok && j.ok) { setEditUnlocked(true, j.id); setFeedback('Editing enabled'); }
      else if (j.reason === 'not_in_allowlist')
        setFeedback('Not authorized — your Spotify id: ' + (j.id || '?'));
      else setFeedback('Auth failed: ' + (j.error || ('HTTP ' + r.status)));
    }).catch(err => { console.log('[edit-auth] network error', err); setFeedback('Auth network error'); });
  }

  function onMsg(event) {
    // Security relies on server-side re-verification (/v1/me), so we do NOT
    // hard-drop on event.origin (which would fail silently); we just warn.
    let data = event.data;
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e) { return; } }
    if (!data || typeof data !== 'object' || data.origin !== 'auth_spotify') return;
    console.log('[edit-auth] message from', event.origin, 'keys:', Object.keys(data));
    if (event.origin !== IRIS_AUTH_ORIGIN)
      console.warn('[edit-auth] unexpected message origin:', event.origin);
    finish();
    if (data.error) { setFeedback('Spotify: ' + data.error); return; }
    if (!data.access_token) { setFeedback('No token received'); return; }
    sendToken(data.access_token);
  }
  window.addEventListener('message', onMsg);

  // Watchdog: popup closed without posting a message
  const watch = setInterval(() => {
    if (done) { clearInterval(watch); return; }
    if (popup.closed) { finish(); setFeedback('Auth cancelled (no token returned)'); }
  }, 1000);
}
