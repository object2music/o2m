}

// Form-field helpers shared by the box editor and the new-box wizard.
const bxOpt = (v, l, cur) => `<option value="${objEsc(v)}"${String(v) === String(cur ?? '') ? ' selected' : ''}>${objEsc(l)}</option>`;
const bxNum = (id, val, attrs) => `<input class="bx-input bx-num" type="number" id="bx-${id}" value="${val == null ? '' : val}" ${attrs}>`;
const bxChk = (id, on) => `<input type="checkbox" id="bx-${id}"${on ? ' checked' : ''}>`;
const bxField = (label, ctrl, cls) => `<div class="obj-field${cls ? ' ' + cls : ''}"><label class="obj-field-label">${label}</label><div class="obj-field-ctrl">${ctrl}</div></div>`;
const BX_TYPES = ['library','favorites','new','incoming','hidden','trash','podcast','info'];
const bxTypeSel = cur => `<select class="bx-input" id="bx-option_type">` + BX_TYPES.map(t => bxOpt(t, t, cur)).join('') + `</select>`;
/* Sort/order options in plain language. '' (stored NULL) and 'smart' both take
   the smart selection path; 'smart' additionally forces a reshuffle, which is
   the recommended default, so it leads. '' is kept as an explicit entry (it
   follows the global shuffle setting) so existing boxes round-trip unchanged. */
const BX_SORTS = [
  ['smart',   'Smart shuffled (recommended)'],
  ['',        'Smart'],
  ['shuffle', 'Shuffle'],
  ['asc',     'In order (A→Z, oldest first)'],
  ['desc',    'Reverse (Z→A, newest first)'],
];
const bxSortSel = cur => `<select class="bx-input" id="bx-option_sort">`
  + BX_SORTS.map(([v, l]) => bxOpt(v, l, cur || '')).join('') + `</select>`;

function renderBoxEditor(info) {
  return bxField('Name', `<input class="bx-input bx-wide" type="text" id="bx-description" value="${objEsc(info.description || '')}">`)
    + bxField('Image URL', `<input class="bx-input bx-wide" type="url" id="bx-image_url" placeholder="https://…" value="${objEsc(info.image_url || '')}">`)
    + bxField('Type', bxTypeSel(info.option_type))
    + bxField('Discover level', bxNum('option_discover_level', info.option_discover_level, 'min="0" max="10" step="1"'))
    + bxField('Sort', bxSortSel(info.option_sort))
    + bxField('Max results', bxNum('option_max_results', info.option_max_results, 'min="0" step="1" placeholder="default"'))
    + bxField('Energy', bxNum('option_energy', info.option_energy, 'min="0" max="1" step="0.05" placeholder="inherit"'))
    + bxField('Ambiance', bxNum('option_valence', info.option_valence, 'min="0" max="1" step="0.05" placeholder="inherit"'))
    + bxField('Favorite', bxChk('favorite', info.favorite))
    + bxField('Public', bxChk('public', info.public))
    + bxField('Content', `<div id="bx-editor-host">${renderDataEditor(_bxItems || [])}</div>`, 'obj-data-field')
    + `<div class="obj-save-row">`
    +   `<button class="obj-save-btn" id="bx-save">Save box</button>`
    +   `<button class="bx-danger-btn" id="bx-delete" data-armed="0">${ICON.x}<span>Delete box</span></button>`
    + `</div>`;
}

function wireBoxEditor(info) {
  document.getElementById('bx-save')?.addEventListener('click', saveBox);
  document.getElementById('bx-delete')?.addEventListener('click', armDeleteBox);
  wireDataEditor();
  resolveDataItems();
}

/* Deleting is irreversible, so the button double-checks itself: the first click
   arms it ("Confirm delete"), the second one goes through. It disarms on its own
   after a few seconds so a stray tap can't leave a live trigger sitting there. */
let _bxDeleteTimer = null;
function armDeleteBox() {
  const btn = document.getElementById('bx-delete');
  if (!btn) return;
  if (btn.dataset.armed === '1') { clearTimeout(_bxDeleteTimer); deleteBox(); return; }
  btn.dataset.armed = '1';
  btn.classList.add('armed');
  btn.querySelector('span').textContent = 'Confirm delete';
  clearTimeout(_bxDeleteTimer);
  _bxDeleteTimer = setTimeout(() => {
    btn.dataset.armed = '0';
    btn.classList.remove('armed');
    const s = btn.querySelector('span');
    if (s) s.textContent = 'Delete box';
  }, 5000);
}

async function deleteBox() {
  if (!_boxEditUid) return;
  try {
    const r = await fetch(API + '/box_delete', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uid: _boxEditUid }),
    }).then(r => r.json());
    if (r.ok) {
      const extra = r.referenced_by ? ` (${r.referenced_by} box${r.referenced_by > 1 ? 'es' : ''} referenced it)` : '';
      setFeedback('Box deleted' + extra);
      _boxEditUid = null; _boxEditInfo = null;
      if (typeof loadBoxes === 'function') loadBoxes();
      closeObjPanel();
    }
    else if (r.error === 'edit_auth_required') setFeedback('Editing not authorized');
    else setFeedback(r.error || 'Delete failed');
  } catch(e) { setFeedback('Delete error'); }
}

async function saveBox() {
  if (!_boxEditUid) return;
  const el = id => document.getElementById('bx-' + id);
  const numOrNull = e => (e && e.value !== '' ? Number(e.value) : null);
  const payload = {
    uid: _boxEditUid,
    description: el('description')?.value ?? '',
    image_url: el('image_url')?.value ?? '',
    option_type: el('option_type')?.value,
    option_sort: el('option_sort')?.value ?? '',
    option_discover_level: numOrNull(el('option_discover_level')),
    option_max_results: numOrNull(el('option_max_results')),
    option_energy: numOrNull(el('option_energy')),
    option_valence: numOrNull(el('option_valence')),
    favorite: !!el('favorite')?.checked,
    public: !!el('public')?.checked,
    data: getDataEditorValue(),
  };
  try {
    const r = await fetch(API + '/box_edit', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    }).then(r => r.json());
    // Saving is the end of the task → close the modal instead of re-opening the
    // editor (which would also leave a stale form in the ◂ ▸ history).
    if (r.ok) { setFeedback('Box saved'); if (typeof loadBoxes === 'function') loadBoxes(); closeObjPanel(); }
    else if (r.error === 'edit_auth_required') setFeedback('Editing not authorized');
    else setFeedback(r.error || 'Save failed');
  } catch(e) { setFeedback('Save error'); }
}

async function openBox(uid) {
  if (!uid) return;
  objNavTo();
  objSetHead('Box', 'Box', '');
  openObjPanel(); objSetActionUris([], 'box:' + uid); objLoading();
  try {
    const info = await fetch(API + '/box_info?uid=' + encodeURIComponent(uid)).then(r => r.json());
    if (info.error) { objBody().innerHTML = `<div class="obj-empty">${objEsc(info.error)}</div>`; return; }
    _boxEditUid = uid;
    _boxEditInfo = info;
    objSetHead('Box', info.description || uid, info.option_type || '');
    if (editUnlocked) {
      _bxItems = parseBoxData(info.data);
      _bxHost = 'editor';
      _bxRawMode = false;
      _bxTab = null; _bxBrowseNode = null; _bxSearchQ = '';
      objBody().innerHTML = renderBoxEditor(info);
      wireBoxEditor(info);
    }
    else { objBody().innerHTML = renderBoxReadonly(info); }
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load box.</div>'; }
}

/* ── Structured box-data editor ───────────────────────────────────────────
   Box `data` is a multi-line text where each line is a directive (spotify uri,
   podcast+feed, stream url, special keyword, box include) and a '#Text' line
   right before a directive is its human label (the convention the radio/podcast
   search already consumes). parseBoxData/serializeBoxData round-trip that text
   losslessly: anything unrecognized is kept verbatim as a raw line. */
const BOX_KEYWORDS = {
  'auto:library':          'Auto mix',
  'auto_simple:library':   'Auto mix (simple)',
  'auto_podcast:library':  'Auto podcasts',
  'spotify:library':       'Spotify library (albums + artists)',
  'spotify:library2':      'Spotify library (albums + artists + liked)',
  'o2m:favorites':         'O2M favorites',
  'spotify:favorites':     'O2M favorites (legacy)',
  'newrecent:library':     'Recent additions',
  'newnotcompleted:library': 'New, not finished yet',
  'now:library':           'Usual tracks for this hour',
  'herenow:library':       'Daily habits',
  'albums:spotify':        'Random saved album / artist',
  'albums:local':          'Local albums',
  'podcasts:unfinished':   'Unfinished podcasts',
  'podcasts:channel':      'Podcast channels of this box',
  'infos:library':         'News flash (scheduled)',
  'meta_podcasts':         'All podcast sources',
  'meta_infos':            'All info sources',
  'meta_radios':           'All radio sources',
  // Settings, not sources: read before the box is filled (see boxdirectives.py).
  'mood:calm':             'Force a mood (calm · intense · normy · happy · energetic)',
  'dl:5':                  'Force the discovery level (0-10)',
};
const _bxIsKeyword = line => Object.prototype.hasOwnProperty.call(BOX_KEYWORDS, line);
/* A line may be prefixed by a time window ("08:00-10:00 > …"), which says WHEN it
   applies and nothing about what it is — so strip it before asking what kind of
   line this is, and keep the two apart everywhere below. */
const BX_WINDOW_RE = /^\s*(\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2})\s*>\s*(.*)$/;
function _bxSplitWindow(line) {
  const m = BX_WINDOW_RE.exec(line || '');
  return m ? { window: m[1].replace(/\s+/g, ''), rest: m[2].trim() } : { window: '', rest: (line || '').trim() };
}
/* mood:calm | mood:0.3,0.8 | dl:7 — read by the pre-pass server-side, never served
   as content, so the editor must show them as settings rather than as sources. */
const BX_SETTING_RE = /^(dl|mood)\s*:\s*\S/i;

function _bxIsDirective(line) {
  const { rest } = _bxSplitWindow(line);
  return /^(spotify:(album|artist|track|playlist):|box:|podcast\+|rf:(show|subject|sujet):|https?:\/\/|tunein:|local:|m3u:|file:|yt:|youtube:|web:|xp:)/.test(rest)
      || BX_SETTING_RE.test(rest)
      || _bxIsKeyword(rest);
}
function _bxNewItem(line, label, disabled) {
  // The window travels with the line: it is part of what the user typed, and
  // serializeBoxData writes `uri`/`value` back verbatim, so keeping it here is what
  // makes a gated line survive an edit untouched.
  const { window, rest } = _bxSplitWindow(line);
  if (!window && _bxIsKeyword(rest)) return { kind: 'keyword', value: rest, label: label || null, disabled: !!disabled };
  // 'uri' is the classification that gets its display name looked up
  // (resolveDataItems asks only for these), which is why 'web:' belongs here: a
  // page line would otherwise show its raw address for ever. The !window guard
  // above is what makes this safe — a 'uri' item stores `rest`, i.e. WITHOUT the
  // time prefix, so a gated line must stay a 'pair' or its window is dropped on
  // the next save.
  if (!window && /^(spotify:(album|artist|track|playlist):|box:|web:|xp:)/.test(rest))
    return { kind: 'uri', uri: rest, label: label || null, disabled: !!disabled };
  return { kind: 'pair', uri: line.trim(), label: label || null, disabled: !!disabled };
}
function parseBoxData(text) {
  const items = [];
  let pending = null;   // last '#' line that wasn't itself a directive → label candidate
  const flushPending = () => { if (pending) { items.push({ kind: 'comment', text: pending.raw }); pending = null; } };
  for (const rawLine of String(text || '').split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line) continue;   // like the backend scanners, blank lines don't break a label
    if (line.startsWith('#')) {
      const stripped = line.replace(/^#+\s*/, '');
      if (_bxIsDirective(stripped)) {   // '#'-disabled directive
        items.push(_bxNewItem(stripped, pending ? pending.text : null, true));
        pending = null;
      } else {
        flushPending();                 // the previous '#' line was a plain comment after all
        pending = { raw: line, text: stripped };
      }
      continue;
    }
    if (_bxIsDirective(line)) {
      items.push(_bxNewItem(line, pending ? pending.text : null, false));
      pending = null;
    } else {
      flushPending();
      items.push({ kind: 'raw', text: line });
    }
  }
  flushPending();
  return items;
}
function serializeBoxData(items) {
  const out = [];
  for (const it of (items || [])) {
    if (it.kind === 'comment' || it.kind === 'raw') { out.push(it.text); continue; }
    const line = it.kind === 'keyword' ? it.value : it.uri;
    if (it.label) out.push('#' + it.label);
    out.push(it.disabled ? '#' + line : line);
  }
  return out.join('\n');
}

// Display metadata for one item: kind glyph + main text (label > resolved name > raw).
const BX_BLOCK_OPEN_RE = /^\s*(\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2})\s*>\s*\{\s*$/;
function _bxItemMeta(it) {
  if (it.kind === 'comment') return { icon: ICON.hash, tag: 'comment', name: it.text.replace(/^#+\s*/, ''), sub: '' };
  if (it.kind === 'raw') {
    // Block delimiters read as structure, not as an unknown line.
    const om = BX_BLOCK_OPEN_RE.exec(it.text || '');
    if (om) return { icon: ICON.clock || ICON.zap, tag: 'window', name: om[1] + ' — from here', sub: '' };
    if ((it.text || '').trim() === '}') return { icon: ICON.clock || ICON.zap, tag: 'window', name: 'end of window', sub: '' };
    return { icon: ICON.hash, tag: 'raw', name: it.text, sub: '' };
  }
  // Settings come first and cover BOTH classifications: the picker seeds exact
  // strings ('mood:calm', 'dl:5') which land as keywords, while anything the user
  // types ('mood:happy', 'dl:7') lands as a pair. Reading them here keeps the two
  // looking the same instead of one showing its help text as a name.
  const raw = it.kind === 'keyword' ? it.value : it.uri;
  const { window, rest } = _bxSplitWindow(raw || '');
  const when = window ? window + ' · ' : '';
  if (raw && BX_SETTING_RE.test(rest)) {
    const isDl = /^dl/i.test(rest);
    const val = rest.split(':').slice(1).join(':').trim();
    return {
      icon: isDl ? ICON.zap : ICON.sun,
      tag: (isDl ? 'discovery' : 'mood') + (window ? ', timed' : ''),
      name: it.label || (when + (isDl ? 'Discovery ' + val : 'Mood ' + val)),
      sub: it.label ? raw : '',
    };
  }
  if (it.kind === 'keyword') return { icon: ICON.zap, tag: 'auto', name: it.label || BOX_KEYWORDS[it.value], sub: it.value };
  // A gated keyword is still that keyword: without this a window turned
  // 'infos:library' into an anonymous "uri" row.
  if (_bxIsKeyword(rest)) {
    return { icon: ICON.zap, tag: 'auto, timed',
             name: it.label || (when + BOX_KEYWORDS[rest]), sub: raw };
  }
  const u = rest;
  const res = _resolveCache.get(u);
  const resolved = res ? (res.name + (res.sub ? ' — ' + res.sub : '')) : null;
  let icon = ICON.hash, tag = 'uri';
  if (u.startsWith('spotify:track:'))         { icon = ICON.music; tag = 'track'; }
  else if (u.startsWith('spotify:album:'))    { icon = ICON.disc;  tag = 'album'; }
  else if (u.startsWith('spotify:artist:'))   { icon = ICON.user;  tag = 'artist'; }
  else if (u.startsWith('spotify:playlist:')) { icon = ICON.list;  tag = 'playlist'; }
  else if (u.startsWith('box:'))              { icon = ICON.box;   tag = 'box'; }
  else if (u.startsWith('podcast+'))          { icon = ICON.rss;   tag = 'podcast'; }
  else if (u.startsWith('rf:show:'))          { icon = ICON.rss;   tag = 'rf show'; }
  else if (/^rf:(subject|sujet):/.test(u))    { icon = ICON.zap;   tag = 'rf subject'; }
  else if (/^(web|xp):/.test(u))              { icon = ICON.globe; tag = 'web page'; }
  else if (/^(https?:|tunein:)/.test(u))      { icon = ICON.radio; tag = 'stream'; }
  else if (/^(local:|m3u:|file:)/.test(u))    { icon = ICON.music; tag = 'local'; }
  if (window) tag += ', timed';
  return { icon, tag, name: when + (it.label || resolved || u), sub: (it.label || resolved) ? raw : '' };
}

/* ── Content editor + inline "Add content" browser ────────────────────────
   Layout (same organism in the wizard's content step and in the box editor):
     1. List / Raw switch
     2. the box's current content (or "No content yet")
     3. "Add content" → Search · Browse · Smart patterns
   Opening one of the 3 panels never hides 1/2 or the tab row: the panel is
   rendered into its own container, which stacks below on mobile and becomes a
   second column on desktop. Sources depend on the box kind, and 'hybrid'
   (advanced mode / box editor) offers every source at once. */
let _bxTab = null;         // null | 'search' | 'browse' | 'patterns'
let _bxBrowseNode = null;  // null = subsection list, a WC_BROWSE_NODES key, or 'podgenre:<id>'
let _bxGenreName = '';
let _bxSearchQ = '';
let _wcSearchTimer = null;

const WC_BROWSE_NODES = {
  favorites:   { label: 'Favourite tracks',       icon: ICON.heart(true) },
  podfavorites:{ label: 'Favourite episodes',     icon: ICON.heart(true) },
  podrecent:   { label: 'Episodes you listened to', icon: ICON.clock },
  playlists:   { label: 'Your playlists',         icon: ICON.list },
  artists:     { label: 'Your artists',           icon: ICON.user },
  albums:      { label: 'Your albums',            icon: ICON.disc },
  podtop:      { label: 'Top podcasts',           icon: ICON.rss },
  podnews:     { label: 'Top news podcasts',      icon: ICON.rss },
  podgenres:   { label: 'Podcast genres',         icon: ICON.list },
  podchannels: { label: 'Channels in your boxes', icon: ICON.hash },
  rfsubjects:  { label: 'Radio France subjects',   icon: ICON.zap },
  radiotop:    { label: 'Top stations near you',  icon: ICON.radio },
};
const WC_BROWSE_BY_KIND = {
  music:   ['playlists', 'artists', 'albums', 'radiotop'],
  podcast: ['rfsubjects', 'podtop', 'podgenres', 'podchannels', 'radiotop'],
  info:    ['rfsubjects', 'podnews', 'podgenres', 'podchannels', 'radiotop'],
  radio:   ['radiotop'],
  hybrid:  ['playlists', 'artists', 'albums', 'rfsubjects', 'podtop', 'podgenres', 'podchannels', 'radiotop'],
};
/* Which result sections a search shows, in order. Radios are offered for every
   kind (a stream is welcome in any box). Podcast channels are deliberately NOT:
   during guided creation the box has committed to a kind, so channels only show
   for podcast/info. 'hybrid' — the box editor and advanced creation, where a box
   may hold anything — shows the lot, so an existing box of any kind can still be
   given a podcast. */
const WC_SEARCH_BY_KIND = {
  music:   ['tracks', 'artists', 'albums', 'radios'],
  podcast: ['channels', 'podcasts', 'radios'],
  info:    ['channels', 'info', 'podcasts', 'radios'],
  radio:   ['radios'],
  hybrid:  ['tracks', 'artists', 'albums', 'channels', 'podcasts', 'info', 'radios', 'boxes'],
};
const WC_PATTERNS_BY_KIND = {
  music:   ['auto:library', 'spotify:library', 'o2m:favorites', 'newrecent:library', 'now:library', 'herenow:library'],
  podcast: ['podcasts:unfinished', 'meta_podcasts'],
  info:    ['infos:library', 'meta_infos'],
  radio:   ['meta_radios'],
  hybrid:  ['auto:library', 'spotify:library', 'o2m:favorites', 'newrecent:library', 'now:library',
            'herenow:library', 'podcasts:unfinished', 'meta_podcasts', 'infos:library', 'meta_infos', 'meta_radios'],
};

/* Simple mode commits to one kind; advanced mode and the box editor build
   hybrid boxes, so they get every source. */
function _bxKind() {
  if (_bxHost === 'wizard' && _boxDraft && _boxDraft.mode === 'simple' && _boxDraft.kind) return _boxDraft.kind;
  return 'hybrid';
}

function _bxRowsHtml(items) {
  if (_bxRawMode) {
    return `<textarea class="bx-input bx-data" id="bx-data" rows="4" spellcheck="false">${objEsc(serializeBoxData(items))}</textarea>`;
  }
  if (!(items || []).length) return '<div class="bx-empty">No content yet.</div>';
  return items.map((it, i) => {
    const m = _bxItemMeta(it);
    const editable = (it.kind !== 'comment' && it.kind !== 'raw');
    const sub = m.sub ? `<span class="bx-sub">${objEsc(m.sub)}</span>` : '';
    const nameAttr = editable ? ` data-bx-label="${i}" title="Edit label"` : '';
    const toggleBtn = editable
      ? `<button type="button" class="bx-line-btn" data-bx-toggle="${i}" title="${it.disabled ? 'Enable' : 'Disable'}">${it.disabled ? ICON.eyeOff : ICON.eye}</button>`
      : '';
    return `<div class="bx-line${it.disabled ? ' disabled' : ''}" data-idx="${i}">`
      + `<span class="bx-kind" title="${objEsc(m.tag)}">${m.icon}</span>`
      + `<span class="bx-main"><span class="bx-name${editable ? ' bx-name-editable' : ''}"${nameAttr}>${objEsc(m.name)}</span>${sub}</span>`
      + toggleBtn
      + `<button type="button" class="bx-line-btn" data-bx-remove="${i}" title="Remove">${ICON.x}</button>`
      + `</div>`;
  }).join('');
}

function renderDataEditor(items) {
  const tab = (id, icon, label) =>
    `<button type="button" class="wc-tab${_bxTab === id ? ' on' : ''}" data-wc-tab="${id}">${icon}<span>${label}</span></button>`;
  const addSection = _bxRawMode ? '' :
    `<div class="wc-add">`
    + `<div class="wc-add-head">Add content</div>`
    + `<div class="wc-tabs">`
    +   tab('search', ICON.plus, 'Search')
    +   tab('browse', ICON.list, 'Browse')
    +   tab('patterns', ICON.zap, 'Smart patterns')
    + `</div></div>`;
  return `<div class="wc">`
    + `<div class="wc-toolbar">`
    +   `<button type="button" class="wc-seg${!_bxRawMode ? ' on' : ''}" data-wc-view="list">${ICON.list}<span>List</span></button>`
    +   `<button type="button" class="wc-seg${_bxRawMode ? ' on' : ''}" data-wc-view="raw">${ICON.code}<span>Raw</span></button>`
    + `</div>`
    + `<div class="wc-body${_bxTab && !_bxRawMode ? ' has-detail' : ''}">`
    +   `<div class="wc-main"><div id="bx-rows">${_bxRowsHtml(items || [])}</div>${addSection}</div>`
    +   `<div class="wc-detail" id="bx-add-panel">${_bxDetailHtml()}</div>`
    + `</div></div>`;
}

/* Shell of the active panel. Result lists are filled in asynchronously by the
   loaders, so opening a panel is instant. */
function _bxDetailHtml() {
  if (_bxRawMode || !_bxTab) return '';
  const kind = _bxKind();
  if (_bxTab === 'search') {
    return `<div class="wc-panel"><div class="wc-panel-head">Search</div>`
      + `<input class="bx-input bx-wide" type="search" id="wc-search-input" placeholder="Search, or paste a page address…" autocomplete="off" value="${objEsc(_bxSearchQ)}">`
      + `<div class="wc-hint">Paste the address of a web page and O2M reads what is playable inside it — a film's own site, a replay listing, a conference page.</div>`
      + `<div id="wc-results"><div class="obj-empty">Type at least 2 characters.</div></div></div>`;
  }
  if (_bxTab === 'patterns') {
    const keys = WC_PATTERNS_BY_KIND[kind] || WC_PATTERNS_BY_KIND.hybrid;
    // Parametric patterns can't be plain toggles (they carry a value), so they get
    // a chip that opens their picker instead. 'rf:sujet:' is the Radio France
    // subject box — as dynamic as the keyword patterns, hence its place here and
    // not only under Browse, which is where it was findable before.
    const pickers = (kind === 'podcast' || kind === 'info' || kind === 'hybrid')
      ? [{ node: 'rfsubjects', label: 'Radio France subject…', prefix: 'rf:sujet:' }] : [];
    return `<div class="wc-panel"><div class="wc-panel-head">Smart patterns</div>`
      + `<div class="wc-hint">Dynamic sources — the box refills itself from your library instead of a fixed list.</div>`
      + `<div class="wiz-chips">` + keys.map(k => {
          const on = (_bxItems || []).some(it => it.kind === 'keyword' && it.value === k);
          return `<button type="button" class="bx-chip${on ? ' on' : ''}" data-wc-pattern="${objEsc(k)}">`
            + `${on ? ICON.check : ICON.plus}<span>${objEsc(BOX_KEYWORDS[k] || k)}</span></button>`;
        }).join('')
      + pickers.map(p => {
          const n = (_bxItems || []).filter(it => it.uri && String(it.uri).startsWith(p.prefix)).length;
          return `<button type="button" class="bx-chip${n ? ' on' : ''}" data-wc-picker="${objEsc(p.node)}">`
            + `${ICON.zap}<span>${objEsc(p.label)}${n ? ' (' + n + ')' : ''}</span></button>`;
        }).join('') + `</div></div>`;
  }
  // browse
  if (!_bxBrowseNode) {
    const nodes = WC_BROWSE_BY_KIND[kind] || WC_BROWSE_BY_KIND.hybrid;
    return `<div class="wc-panel"><div class="wc-panel-head">Browse</div><div class="obj-tracks">`
      + nodes.map(n => {
          const c = WC_BROWSE_NODES[n];
          return `<div class="obj-row obj-clickable" data-wc-browse="${n}"><span class="bx-kind">${c.icon}</span>`
            + `<span class="ot-name">${objEsc(c.label)}</span>${CHEVRON_SVG}</div>`;
        }).join('') + `</div></div>`;
  }
  const isGenre = String(_bxBrowseNode).startsWith('podgenre:');
  const title = isGenre ? (_bxGenreName || 'Genre') : (WC_BROWSE_NODES[_bxBrowseNode]?.label || 'Browse');
  return `<div class="wc-panel"><div class="wc-panel-head">`
    + `<button type="button" class="wc-back" data-wc-back title="Back">${ICON.x}</button><span>${objEsc(title)}</span></div>`
    + `<div id="wc-results"><div class="obj-loading">Loading…</div></div></div>`;
}

function _bxRenderRows() {
  const el = document.getElementById('bx-rows');
  if (el) el.innerHTML = _bxRowsHtml(_bxItems || []);
  resolveDataItems();
}

/* Only the panel is re-rendered when a tab/section changes, so the content list
   above it (and any pending edit) stays untouched. */
function _bxRenderDetail() {
  const p = document.getElementById('bx-add-panel');
  if (!p) return;
  p.innerHTML = _bxDetailHtml();
  document.querySelectorAll('#bx-editor-host [data-wc-tab]').forEach(b =>
    b.classList.toggle('on', b.dataset.wcTab === _bxTab));
  document.querySelector('#bx-editor-host .wc-body')
    ?.classList.toggle('has-detail', !!_bxTab && !_bxRawMode);
  if (_bxTab === 'search') {
    // The panel was re-created → its input needs its listeners back.
    _wcWireSearchInput();
    document.getElementById('wc-search-input')?.focus();
    if (_bxSearchQ.length >= 2) _wcRunSearch(_bxSearchQ);
  } else if (_bxTab === 'browse' && _bxBrowseNode) {
    _wcLoadBrowse(_bxBrowseNode);
  }
}

// Debounced inline search (the panel keeps its own field — no modal nav).
let _bxSubjectQ = '', _bxSubjectPath = '', _wcSubjectTimer = null;
function _wcWireSubjectInput() {
  const inp = document.getElementById('wc-subject-input');
  if (!inp || inp.dataset.wired) return;
  inp.dataset.wired = '1';
  const run = () => { clearTimeout(_wcSubjectTimer); _wcLoadBrowse('rfsubjects'); };
  inp.addEventListener('input', () => {
    _bxSubjectQ = inp.value.trim();
    clearTimeout(_wcSubjectTimer);
    _wcSubjectTimer = setTimeout(run, 400);
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') e.stopPropagation();   // don't close the modal
  });
  // keep the caret where the user left it across the re-render
  try { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
}

function _wcWireSearchInput() {
  const inp = document.getElementById('wc-search-input');
  if (!inp || inp.dataset.wired) return;
  inp.dataset.wired = '1';
  const run = () => { clearTimeout(_wcSearchTimer); if (_bxSearchQ.length >= 2) _wcRunSearch(_bxSearchQ); };
  inp.addEventListener('input', () => {
    _bxSearchQ = inp.value.trim();
    clearTimeout(_wcSearchTimer);
    _wcSearchTimer = setTimeout(run, 450);
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Escape') e.stopPropagation();   // don't close the modal
  });
}

function _bxRerender() {
  const host = document.getElementById('bx-editor-host');
  if (!host) return;
  host.innerHTML = renderDataEditor(_bxItems || []);
  wireDataEditor();
  resolveDataItems();
  if (_bxTab === 'search') document.getElementById('wc-search-input')?.focus();
  else if (_bxTab === 'browse' && _bxBrowseNode) _wcLoadBrowse(_bxBrowseNode);
}

function wireDataEditor() {
  const host = document.getElementById('bx-editor-host');
  if (!host) return;
  // onclick (not addEventListener): the host element survives re-renders, so a
  // property assignment stays idempotent.
  host.onclick = (e) => {
    // ── content rows ──
    const rm = e.target.closest('[data-bx-remove]');
    if (rm) { _bxItems.splice(Number(rm.dataset.bxRemove), 1); _bxRenderRows(); _bxSyncPanelState(); return; }
    const tg = e.target.closest('[data-bx-toggle]');
    if (tg) { const it = _bxItems[Number(tg.dataset.bxToggle)]; if (it) it.disabled = !it.disabled; _bxRenderRows(); return; }
    const lb = e.target.closest('[data-bx-label]');
    if (lb) { editBxLabel(Number(lb.dataset.bxLabel), lb); return; }
    // ── list / raw ──
    const vw = e.target.closest('[data-wc-view]');
    if (vw) { setRawMode(vw.dataset.wcView === 'raw'); return; }
    // ── add-content tabs & panels ──
    const tb = e.target.closest('[data-wc-tab]');
    if (tb) {
      const id = tb.dataset.wcTab;
      _bxTab = (_bxTab === id) ? null : id;   // clicking the open tab closes it
      if (_bxTab !== 'browse') _bxBrowseNode = null;
      _bxRenderDetail();
      return;
    }
    const br = e.target.closest('[data-wc-browse]');
    if (br) { _bxBrowseNode = br.dataset.wcBrowse; _bxRenderDetail(); return; }
    if (e.target.closest('[data-wc-back]')) {
      // A genre's results go back to the genre list, everything else to the menu.
      _bxBrowseNode = String(_bxBrowseNode).startsWith('podgenre:') ? 'podgenres' : null;
      _bxRenderDetail(); return;
    }
    const gn = e.target.closest('[data-wc-genre]');
    if (gn) { _bxBrowseNode = 'podgenre:' + gn.dataset.wcGenre; _bxGenreName = gn.dataset.genreName; _bxRenderDetail(); return; }
    const pk = e.target.closest('[data-wc-picker]');
    if (pk) { _bxTab = 'browse'; _bxBrowseNode = pk.dataset.wcPicker; _bxSubjectPath = ''; _bxSubjectQ = ''; _bxRenderDetail(); return; }
    const pikc = e.target.closest('[data-wc-pick]');
    if (pikc) {
      if (_wcAdd(pikc.dataset.wcPick, (pikc.dataset.name || '').trim())) pikc.classList.add('picked');
      return;
    }
    const sj = e.target.closest('[data-wc-subject]');
    if (sj) { _bxSubjectPath = sj.dataset.wcSubject; _wcLoadBrowse('rfsubjects'); return; }
    const su = e.target.closest('[data-wc-subject-up]');
    if (su) { _bxSubjectPath = su.dataset.wcSubjectUp || ''; _wcLoadBrowse('rfsubjects'); return; }
    const pt = e.target.closest('[data-wc-pattern]');
    if (pt) {
      const k = pt.dataset.wcPattern;
      const i = (_bxItems || []).findIndex(it => it.kind === 'keyword' && it.value === k);
      if (i >= 0) _bxItems.splice(i, 1);
      else _bxItems.push({ kind: 'keyword', value: k, label: null, disabled: false });
      _bxRenderRows(); _bxRenderDetail();
      return;
    }
    // ── a result row: add it to the box ──
    const row = e.target.closest('#bx-add-panel .tl-item[data-uri]');
    if (row) {
      const name = row.dataset.name || row.querySelector('.tl-name')?.textContent || '';
      if (_wcAdd(row.dataset.uri, name.trim())) row.classList.add('picked');
    }
  };
  _wcWireSearchInput();
  // Auto-size the raw-mode textarea to its content (grows/shrinks as you type).
  const ta = document.getElementById('bx-data');
  if (ta) {
    const grow = () => {
      ta.style.height = 'auto';
      const max = Math.round(window.innerHeight * 0.6);
      const min = parseInt(getComputedStyle(ta).minHeight, 10) || 0;
      ta.style.height = Math.min(Math.max(ta.scrollHeight + 2, min), max) + 'px';
    };
    ta.addEventListener('input', grow);
    requestAnimationFrame(() => requestAnimationFrame(grow));
  }
}

// Keep the patterns panel's on/off chips in sync after a removal.
function _bxSyncPanelState() {
  if (_bxTab === 'patterns') _bxRenderDetail();
}

// Add one picked row to the box. Returns false when it was already there.
function _wcAdd(uri, name) {
  if (!uri || !_bxItems) return false;
  if (_bxItems.some(it => it.uri === uri)) { setFeedback('Already added'); return false; }
  _bxItems.push(_bxNewItem(uri, (name || '').trim() || null, false));
  setFeedback('Added: ' + ((name || '').trim() || uri));
  _bxRenderRows();
  return true;
}

function setRawMode(on) {
  if (on === _bxRawMode) return;
  if (on) {
    _bxTab = null; _bxBrowseNode = null;
  } else {
    const ta = document.getElementById('bx-data');
    _bxItems = parseBoxData(ta ? ta.value : serializeBoxData(_bxItems));
    if (_bxHost === 'wizard' && _boxDraft) _boxDraft.items = _bxItems;   // keep the draft alias
  }
  _bxRawMode = on;
  _bxRerender();
}

function getDataEditorValue() {
  if (_bxRawMode) {
    const ta = document.getElementById('bx-data');
    if (ta) return ta.value;
  }
  return serializeBoxData(_bxItems || []);
}

// Mirror the box-editor form fields back into _boxEditInfo, so that a re-render
// (after a ◂ ▸ restore) keeps unsaved edits.
function _bxCaptureEditorFields() {
  if (_bxHost !== 'editor' || !_boxEditInfo) return;
  const el = id => document.getElementById('bx-' + id);
  if (!el('description')) return;   // editor form not in the DOM
  const numOrNull = e => (e && e.value !== '' ? Number(e.value) : null);
  _boxEditInfo.description = el('description').value;
  _boxEditInfo.image_url = el('image_url')?.value ?? _boxEditInfo.image_url;
  _boxEditInfo.option_type = el('option_type')?.value ?? _boxEditInfo.option_type;
  _boxEditInfo.option_sort = el('option_sort')?.value || null;
  _boxEditInfo.option_discover_level = numOrNull(el('option_discover_level'));
  _boxEditInfo.option_max_results = numOrNull(el('option_max_results'));
  _boxEditInfo.option_energy = numOrNull(el('option_energy'));
  _boxEditInfo.option_valence = numOrNull(el('option_valence'));
  _boxEditInfo.favorite = el('favorite')?.checked ? 1 : 0;
  _boxEditInfo.public = el('public')?.checked ? 1 : 0;
}

// Inline label edit — same commit/revert pattern as the track panel number edits.
function editBxLabel(idx, span) {
  const it = (_bxItems || [])[idx];
  if (!it) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'bx-input bx-label-input';
  input.value = it.label || '';
  input.placeholder = 'Label';
  span.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const commit = () => {
    if (done) return; done = true;
    it.label = input.value.trim() || null;
    _bxRenderRows();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.stopPropagation(); done = true; _bxRenderRows(); }
  });
}

// One batched cache-only lookup for unlabelled uris; patches the rendered rows
// in place (never re-renders — the user may be mid-edit).
async function resolveDataItems() {
  if (_bxRawMode) return;
  const uris = [...new Set((_bxItems || [])
    .filter(it => it.kind === 'uri' && !it.label && !_resolveCache.has(it.uri))
    .map(it => it.uri))];
  if (!uris.length) return;
  try {
    const r = await fetch(API + '/resolve_uris', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ uris }),
    }).then(r => r.json());
    const res = r?.results || {};
    Object.keys(res).forEach(u => _resolveCache.set(u, res[u]));
    document.querySelectorAll('#bx-rows .bx-line').forEach(row => {
      const it = (_bxItems || [])[Number(row.dataset.idx)];
      if (!it || it.kind !== 'uri' || it.label || !_resolveCache.has(it.uri)) return;
      const m = _bxItemMeta(it);
      const nameEl = row.querySelector('.bx-name');
      if (nameEl) nameEl.textContent = m.name;
      if (m.sub) {
        let subEl = row.querySelector('.bx-sub');
        if (!subEl) {
          subEl = document.createElement('span'); subEl.className = 'bx-sub';
          row.querySelector('.bx-main')?.appendChild(subEl);
        }
        subEl.textContent = m.sub;
      }
    });
  } catch(e) {}
}

/* ── Add-content data sources ─────────────────────────────────────────────
   Everything below returns rows shaped for _searchObjRows / objRenderTracks,
   whose data-uri is already a valid box data line ('spotify:…', 'podcast+<feed>',
   a stream URL or 'box:<uid>'), so a click goes straight through _wcAdd. */
/* Why a pasted page yielded nothing. The three reasons are not interchangeable:
   a challenge cannot be worked around (solving it means running a browser), an
   unreachable page is an accident of the minute and worth retrying, and a page
   that was read and simply holds no audio is a fact about the page. Saying which
   is the whole reason find_media returns a code rather than an empty list. */
const WC_PAGE_REASONS = {
  'challenge':   'This site refuses automated readers, so its media cannot be listed. Opening the page yourself and pasting the address of the video or audio it holds does work.',
  'unreachable': 'This page could not be reached just now. Nothing is remembered, so it is worth trying again.',
  'not-a-url':   'That does not look like a page address.',
};
function _wcPageNotice(wp) {
  const why = WC_PAGE_REASONS[wp.reason] || wp.message || 'This page could not be read.';
  return `<div class="search-section-label">Web page</div>`
       + `<div class="wc-hint wc-hint-warn">${ICON.globe} ${objEsc(why)}</div>`;
}

function _wcResults(html) {
  const el = document.getElementById('wc-results');
  if (el) el.innerHTML = html;
}
const _wcSection = (label, html) => html ? `<div class="search-section-label">${label}</div>${html}` : '';
const _wcDirRows = items => (items || []).map(i => ({ uri: i.uri, name: i.name, artist: i.sub || '', image: i.image || '' }));

async function _wcJson(url) {
  try { return await fetch(API + url).then(r => r.json()); } catch(e) { return null; }
}

async function _wcRunSearch(q) {
  const kind = _bxKind();
  const want = WC_SEARCH_BY_KIND[kind] || WC_SEARCH_BY_KIND.hybrid;
  _wcResults('<div class="obj-loading">Searching…</div>');
  // /api/search already merges the podcast directory into podcast_channels;
  // only the radio directory still needs its own call.
  const jobs = [_wcJson('/search?q=' + encodeURIComponent(q))];
  jobs.push(want.includes('radios') ? _wcJson('/directory?kind=radio&q=' + encodeURIComponent(q)) : null);
  const [d, radioDir] = await Promise.all(jobs);
  if (_bxSearchQ !== q) return;    // a newer query already fired
  if (!d || d.error) { _wcResults(`<div class="obj-empty">${objEsc((d && d.error) || 'Search failed')}</div>`); return; }

  const merge = (a, b) => { const seen = new Set((a || []).map(x => x.uri)); return (a || []).concat((b || []).filter(x => !seen.has(x.uri))); };
  const sp = d.spotify || {};
  const channels = d.podcast_channels || [];
  const radios = merge(_wcDirRows(d.radios), _wcDirRows((radioDir && radioDir.items) || []));
  const build = {
    tracks:   () => _wcSection('Tracks', objRenderTracks(_searchTracksNorm(merge(d.tracks, sp.tracks)), 'track', true)),
    artists:  () => _wcSection('Artists', _searchObjRows(merge(d.artists, sp.artists), 'artist')),
    albums:   () => _wcSection('Albums', _searchObjRows(merge(d.albums, sp.albums), 'album')),
    channels: () => _wcSection('Podcast channels', _searchObjRows(_wcDirRows(channels), 'podcast')),
    podcasts: () => _wcSection('Episodes', objRenderTracks(_searchTracksNorm(d.podcasts || []), 'track', true)),
    info:     () => _wcSection('Info', objRenderTracks(_searchTracksNorm(d.info || []), 'track', true)),
    radios:   () => _wcSection('Radios', _searchObjRows(radios, 'radio')),
    boxes:    () => _wcSection('Boxes', _searchObjRows((d.boxes || []).map(b => ({ uri: 'box:' + b.uid, name: b.description || b.uid, image: b.image || '' })), 'box')),
  };
  let html = '';
  want.forEach(sec => { try { if (build[sec]) html += build[sec](); } catch(e) {} });
  // A pasted page that could not be read is reported, never folded into
  // "No results." — a refusal and an empty page call for opposite reactions:
  // one is worth nothing more, the other is worth trying again later.
  if (d.web_page) html = _wcPageNotice(d.web_page) + html;
  _wcResults(html || '<div class="obj-empty">No results.</div>');
}

/* Where a browse node gets its rows. Shared by the box editor's Add panel and the
   Browse modal: both ask the same question — "what is in here?" — and differ only
   in what a click then does, add a line or open the object.

   Returns null for the two INTERACTIVE nodes (podcast genres, Radio France
   subjects): those are a tree to walk and a filter to type, not a list, and the
   editor renders them itself. A Radio France subject is not an object you can play
   either — it is a pattern that refills — so the Browse modal has no use for it. */
async function browseFetch(node, opts) {
  const off = (opts && opts.offset) || 0;
  const lim = (opts && opts.limit) || 50;
  if (node === 'playlists' || node === 'albums' || node === 'artists') {
    const d = await _wcJson('/library_browse?kind=' + node);
    return { rows: _wcDirRows((d && d.items) || []),
             kind: node === 'playlists' ? 'playlist' : (node === 'albums' ? 'album' : 'artist'),
             empty: 'Nothing cached yet — use Search instead.' };
  }
  if (node === 'favorites' || node === 'podfavorites') {
    const d = await _wcJson('/library_browse?kind=' + node + '&limit=' + lim + '&offset=' + off);
    // 'track', not 'podcast': these rows are EPISODES. The kind drives both the row
    // click (objOpenByKind) and the + menu (objMenuItems), and 'podcast' means a
    // CHANNEL — a feed to browse and play whole. Tagged that way, a single episode
    // opened the channel view and offered "play the whole show". Search has spelled
    // an episode 'track' all along; these two nodes had drifted from it.
    return { rows: _wcDirRows((d && d.items) || []),
             kind: 'track',
             hasMore: !!(d && d.has_more),
             empty: node === 'favorites'
               ? 'No favourite tracks yet.'
               : 'No favourite episodes yet — tap the heart on one while it plays.' };
  }
  if (node === 'podrecent') {
    const d = await _wcJson('/library_browse?kind=podrecent&limit=' + lim + '&offset=' + off);
    return { rows: _wcDirRows((d && d.items) || []), kind: 'track',   // episodes, see above
             hasMore: !!(d && d.has_more),
             empty: 'Nothing listened to yet.' };
  }
  if (node === 'podchannels') {
    const d = await _wcJson('/podcast_channels');
    return { rows: _wcDirRows(Array.isArray(d) ? d : []), kind: 'podcast',
             empty: 'No channels referenced in your boxes yet.' };
  }
  if (node === 'radiotop') {
    const d = await _wcJson('/directory?kind=radio');
    return { rows: _wcDirRows((d && d.items) || []), kind: 'radio',
             empty: 'Radio directory unavailable.' };
  }
  if (node === 'podtop' || node === 'podnews') {
    const d = await _wcJson('/directory?kind=podcast' + (node === 'podnews' ? '&genre=1489' : ''));
    return { rows: _wcDirRows((d && d.items) || []), kind: 'podcast',
             empty: 'Podcast directory unavailable.' };
  }
  return null;
}

async function _wcLoadBrowse(node) {
  _wcResults('<div class="obj-loading">Loading…</div>');
  const done = (html) => { if (_bxBrowseNode === node) _wcResults(html); };   // ignore a stale response
  const rowsOr = (rows, kindTag, empty) => rows.length
    ? _searchObjRows(rows, kindTag) : `<div class="obj-empty">${empty}</div>`;

  // Everything that is just a list comes from the shared fetcher; only the two
  // interactive nodes below are the editor's own.
  const got = await browseFetch(node);
  if (got) { done(rowsOr(got.rows, got.kind, got.empty)); return; }
  if (node === 'rfsubjects') {
    // Picking a subject writes 'rf:sujet:<title>', a DYNAMIC line that refills
    // with whatever was published on it. Browsing walks the THEME tree (12 roots
    // / 89 / 242) — the 1146 tags carry no path so they cannot sit in it, and a
    // flat dump of ~1500 entries was unusable (it stopped mid-alphabet). Tags
    // stay reachable through the filter, which searches both kinds.
    const qs = _bxSubjectQ ? '?q=' + encodeURIComponent(_bxSubjectQ)
                           : (_bxSubjectPath ? '?parent=' + encodeURIComponent(_bxSubjectPath) : '');
    const d = await _wcJson('/rf_subjects' + qs);
    const items = (d && d.items) || [];
    let html = `<input class="bx-input bx-wide" type="search" id="wc-subject-input"`
             + ` placeholder="Filter every subject (politique, cinéma…)" autocomplete="off"`
             + ` value="${objEsc(_bxSubjectQ)}">`;
    if (!_bxSubjectQ) {
      // Two distinct actions per theme, both explicit: the NAME adds the theme to
      // the box, the CHEVRON opens its sub-themes. Making the whole row navigate
      // (the first cut) meant a broad theme like "Politique" could not be picked
      // at all without drilling in, and nothing said the row was a door.
      const crumb = (d.current ? d.current.name : 'All themes');
      html += `<div class="wc-hint">${objEsc(crumb)} — tap a name to add it, ${'\u203A'} to open its sub-themes.</div>`;
      if (_bxSubjectPath)
        html += `<div class="obj-row obj-clickable" data-wc-subject-up="${objEsc(d.parent_of_current || '')}">`
              + `<span class="bx-kind">${ICON.hash}</span>`
              + `<span class="ot-name">← Back</span></div>`;
      if (d.current)   // the branch itself is a usable subject, broader than its children
        html += `<div class="obj-row"><span class="bx-kind">${ICON.zap}</span>`
              + `<span class="ot-name rf-pick" data-wc-pick="${objEsc(d.current.uri)}"`
              + ` data-name="${objEsc(d.current.name)}">Add “${objEsc(d.current.name)}” itself</span></div>`;
      html += items.map(i =>
          `<div class="obj-row"><span class="bx-kind">${ICON.zap}</span>`
        + `<span class="ot-name rf-pick" data-wc-pick="${objEsc(i.uri)}" data-name="${objEsc(i.name)}">`
        + `${objEsc(i.name)}</span>`
        + (i.has_children
            ? `<button type="button" class="rf-into" data-wc-subject="${objEsc(i.path)}"`
              + ` title="Open sub-themes">${CHEVRON_SVG}</button>`
            : '')
        + `</div>`
      ).join('');
    } else {
      html += items.length ? _searchObjRows(_wcDirRows(items), 'podcast')
                           : `<div class="obj-empty">No subject matches.</div>`;
    }
    if (!items.length && !_bxSubjectQ)
      html += `<div class="obj-empty">No Radio France subjects indexed yet (no API key, or warmup pending).</div>`;
    done(html);
    _wcWireSubjectInput();
    return;
  }
  if (node === 'podgenres') {
    const d = await _wcJson('/directory_genres');
    const genres = (d && d.genres) || [];
    done(genres.length
      ? `<div class="obj-tracks">` + genres.map(g =>
          `<div class="obj-row obj-clickable" data-wc-genre="${objEsc(g.id)}" data-genre-name="${objEsc(g.name)}">`
          + `<span class="bx-kind">${ICON.rss}</span><span class="ot-name">${objEsc(g.name)}</span>${CHEVRON_SVG}</div>`
        ).join('') + `</div>`
      : '<div class="obj-empty">Genres unavailable.</div>');
    return;
  }
  // Only a genre picked from the list above reaches here; the fixed podcast nodes
  // come from browseFetch at the top.
  const d = await _wcJson('/directory?kind=podcast&genre='
                          + encodeURIComponent(String(node).slice(9)));
  done(rowsOr(_wcDirRows((d && d.items) || []), 'podcast', 'Podcast directory unavailable.'));
}

/* ── New-box wizard ───────────────────────────────────────────────────────
   4 steps rendered in the object modal from a module-level draft (the modal's
   snapshot nav doesn't keep typed input values, so every step re-renders from
   _boxDraft). Step 1 picks the route:
     simple   → kind (music/podcast/info/radio) → content → essentials
     advanced → name+type → content → all options
   Creation is one atomic POST /api/box_new at the end. */
let _boxDraft = null;
const WIZ_STEPS = {
  simple:   [null, 'mode', 'kind', 'content', 'finish'],
  advanced: [null, 'mode', 'basics', 'content', 'options'],
};
const WIZ_TYPE_HINTS = {
  library:   'Music box — plays tracks, albums, artists, playlists.',
  favorites: 'Its tracks are marked as favorites.',
  new:       'Discovery box — plays new tracks only.',
  incoming:  'Incoming queue — content to sort later.',
  hidden:    'Played but excluded from listening stats.',
  trash:     'Content you never want to hear again.',
  podcast:   'Podcast box — episodes from channel feeds.',
  info:      'News / info flashes (short items).',
};
/* The 4 simple kinds. `type` is the stored option_type; radio has no dedicated
   option_type — a box counts as radio because its data holds stream URLs (see
   _box_category), and option_type 'info' would override that, so radio uses
   'library'. `name` pre-fills the box name (editable). */
const WIZ_KINDS = {
  music:   { label: 'Music',    icon: ICON.music, type: 'library', name: 'Music',
             hint: 'Albums, artists, playlists and tracks.' },
  podcast: { label: 'Podcasts', icon: ICON.rss,   type: 'podcast', name: 'Podcasts',
             hint: 'Long episodes, from channel feeds.' },
  info:    { label: 'Info',     icon: ICON.zap,   type: 'info',    name: 'Info',
             hint: 'Short news flashes.' },
  radio:   { label: 'Radio',    icon: ICON.radio, type: 'library', name: 'Radio',
             hint: 'Live streams, played as-is.' },
};

function wizStepName() {
  const d = _boxDraft;
  if (!d || d.step === 1) return 'mode';
  return (WIZ_STEPS[d.mode] || WIZ_STEPS.advanced)[d.step] || 'mode';
}

function openBoxWizard() {
  _boxDraft = {
    step: 1, mode: null, kind: null,
    description: '', option_type: 'library', items: [],
    option_sort: 'smart', option_discover_level: 5, option_max_results: null,
    option_energy: null, option_valence: null, favorite: true, public: false, image_url: '',
  };
  _bxHost = 'wizard';
  _bxRawMode = false;
  _bxTab = null; _bxBrowseNode = null; _bxSearchQ = '';
  _bxItems = _boxDraft.items;
  objNavTo();
  openObjPanel();
  renderWizardStep();
}

function _wizCard(attr, icon, label, hint, on) {
  return `<button type="button" class="wiz-card${on ? ' on' : ''}" ${attr}>`
    + `<span class="wiz-card-icon">${icon}</span>`
    + `<span class="wiz-card-text"><b>${objEsc(label)}</b><span>${objEsc(hint)}</span></span></button>`;
}

function renderWizardStep() {
  const d = _boxDraft;
  if (!d) return;
  const step = wizStepName();
  objSetHead('New box', d.description || 'New box', `Step ${d.step} of 4`);
  objSetActionUris([]);
  let body = '';

  if (step === 'mode') {
    body = `<div class="wiz-hint">How do you want to create this box?</div><div class="wiz-cards">`
      + _wizCard('data-wiz-mode="simple"', ICON.check, 'Guided',
                 'Pick a kind, add content, done. Sensible defaults.', d.mode === 'simple')
      + _wizCard('data-wiz-mode="advanced"', ICON.code, 'Advanced',
                 'All box types and options — and hybrid boxes, mixing music, podcasts, info and radio in one box.', d.mode === 'advanced')
      + `</div>`;

  } else if (step === 'kind') {
    body = `<div class="wiz-hint">What kind of box is it?</div><div class="wiz-cards">`
      + Object.keys(WIZ_KINDS).map(k => {
          const c = WIZ_KINDS[k];
          return _wizCard(`data-wiz-kind="${k}"`, c.icon, c.label, c.hint, d.kind === k);
        }).join('')
      + `</div>`
      + bxField('Name', `<input class="bx-input bx-wide" type="text" id="bx-description" value="${objEsc(d.description)}" placeholder="Box name" autocomplete="off">`);

  } else if (step === 'basics') {
    body = bxField('Name', `<input class="bx-input bx-wide" type="text" id="bx-description" value="${objEsc(d.description)}" placeholder="e.g. Sunday morning" autocomplete="off">`)
      + bxField('Type', bxTypeSel(d.option_type))
      + `<div class="wiz-hint" id="wiz-type-hint">${objEsc(WIZ_TYPE_HINTS[d.option_type] || '')}</div>`;

  } else if (step === 'content') {
    _bxItems = d.items;   // re-point the shared editor at the draft
    body = `<div id="bx-editor-host">${renderDataEditor(d.items)}</div>`;

  } else if (step === 'finish') {
    // Simple mode: only the two questions that really change playback.
    body = bxField('Order', bxSortSel(d.option_sort))
      + `<div class="wiz-hint">Smart picks tracks by taste and mood; the others play the content plainly.</div>`
      + bxField('Max tracks', bxNum('option_max_results', d.option_max_results, 'min="0" step="1" placeholder="default"'))
      + `<div class="wiz-hint">How many items this box adds to the tracklist. Leave empty for the default.</div>`;

  } else {
    body = bxField('Order', bxSortSel(d.option_sort))
      + bxField('Max tracks', bxNum('option_max_results', d.option_max_results, 'min="0" step="1" placeholder="default"'))
      + bxField('Discover level', bxNum('option_discover_level', d.option_discover_level, 'min="0" max="10" step="1"'))
      + bxField('Energy', bxNum('option_energy', d.option_energy, 'min="0" max="1" step="0.05" placeholder="inherit"'))
      + bxField('Ambiance', bxNum('option_valence', d.option_valence, 'min="0" max="1" step="0.05" placeholder="inherit"'))
      + bxField('Favorite', bxChk('favorite', d.favorite))
      + `<div class="wiz-hint">Favorite boxes are shown in the Boxes panel.</div>`
      + bxField('Public', bxChk('public', d.public))
      + bxField('Image URL', `<input class="bx-input bx-wide" type="url" id="bx-image_url" placeholder="https://…" value="${objEsc(d.image_url)}">`);
  }

  const last = (d.step === 4);
  const foot = `<div class="wiz-foot">`
    + (d.step > 1 ? `<button type="button" class="bx-foot-btn ghost" id="wiz-back">Back</button>` : '<span></span>')
    + (step === 'mode' ? '<span></span>'      // the mode cards advance on their own
       : last ? `<button type="button" class="obj-save-btn" id="wiz-create">Create box</button>`
              : `<button type="button" class="obj-save-btn" id="wiz-next">Next</button>`)
    + `</div>`;
  objBody().innerHTML = `<div id="bx-wizard">${body}${foot}</div>`;
  wireWizardStep();
  _objUpdateNav();   // the wizard is now on screen → hide the modal's ◂ ▸
}

function _wizReadStep() {
  const d = _boxDraft;
  if (!d) return;
  const step = wizStepName();
  const el = id => document.getElementById('bx-' + id);
  const numOrNull = e => (e && e.value !== '' ? Number(e.value) : null);
  if (step === 'kind') {
    if (el('description')) d.description = el('description').value.trim();
  } else if (step === 'basics') {
    if (el('description')) d.description = el('description').value.trim();
    if (el('option_type')) d.option_type = el('option_type').value;
  } else if (step === 'content') {
    // Leaving the content step with the raw textarea open → parse it back.
    if (_bxRawMode) {
      const ta = document.getElementById('bx-data');
      if (ta) { _bxItems = parseBoxData(ta.value); d.items = _bxItems; }
      _bxRawMode = false;
    }
  } else if (step === 'finish' || step === 'options') {
    if (el('option_sort')) d.option_sort = el('option_sort').value;
    d.option_max_results = numOrNull(el('option_max_results'));
    if (step === 'options') {
      d.option_discover_level = numOrNull(el('option_discover_level')) ?? 5;
      d.option_energy = numOrNull(el('option_energy'));
      d.option_valence = numOrNull(el('option_valence'));
      if (el('favorite')) d.favorite = !!el('favorite').checked;
      if (el('public')) d.public = !!el('public').checked;
      if (el('image_url')) d.image_url = el('image_url').value.trim();
    }
  }
}

function _wizSetKind(k) {
  const c = WIZ_KINDS[k];
  if (!c) return;
  const d = _boxDraft;
  const nameEl = document.getElementById('bx-description');
  const typed = (nameEl?.value || '').trim();
  d.kind = k;
  d.option_type = c.type;
  // Pre-fill the name from the kind, unless the user typed their own.
  const isPreset = !typed || Object.keys(WIZ_KINDS).some(o => WIZ_KINDS[o].name === typed);
  d.description = isPreset ? c.name : typed;
  renderWizardStep();
}

function wireWizardStep() {
  const d = _boxDraft;
  const step = wizStepName();
  document.getElementById('wiz-back')?.addEventListener('click', () => { _wizReadStep(); d.step--; renderWizardStep(); });
  document.getElementById('wiz-next')?.addEventListener('click', () => {
    if ((step === 'kind' || step === 'basics') && !(document.getElementById('bx-description')?.value || '').trim()) {
      setFeedback('Give the box a name first');
      document.getElementById('bx-description')?.focus();
      return;
    }
    if (step === 'kind' && !d.kind) { setFeedback('Pick a kind first'); return; }
    _wizReadStep(); d.step++; renderWizardStep();
  });
  document.getElementById('wiz-create')?.addEventListener('click', createBoxSubmit);

  if (step === 'mode') {
    document.querySelectorAll('#bx-wizard [data-wiz-mode]').forEach(card => card.addEventListener('click', () => {
      d.mode = card.dataset.wizMode;
      d.step = 2;
      renderWizardStep();
    }));
  }
  if (step === 'kind') {
    document.querySelectorAll('#bx-wizard [data-wiz-kind]').forEach(card =>
      card.addEventListener('click', () => _wizSetKind(card.dataset.wizKind)));
  }
  if (step === 'basics') {
    document.getElementById('bx-option_type')?.addEventListener('change', (e) => {
      d.option_type = e.target.value;
      const h = document.getElementById('wiz-type-hint');
      if (h) h.textContent = WIZ_TYPE_HINTS[e.target.value] || '';
    });
  }
  if (step === 'content') {
    wireDataEditor();
    resolveDataItems();
    if (_bxTab === 'browse' && _bxBrowseNode) _wcLoadBrowse(_bxBrowseNode);
  }
}

async function createBoxSubmit() {
  _wizReadStep();
  const d = _boxDraft;
  if (!d) return;
  if (!d.description) { setFeedback('Give the box a name first'); return; }
  const payload = {
    description: d.description,
    option_type: d.option_type,
    option_sort: d.option_sort ?? '',
    option_discover_level: d.option_discover_level,
    option_max_results: d.option_max_results,
    option_energy: d.option_energy,
    option_valence: d.option_valence,
    favorite: !!d.favorite,
    public: !!d.public,
    image_url: d.image_url || '',
    data: getDataEditorValue(),
  };
  try {
    const r = await fetch(API + '/box_new', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    }).then(r => r.json());
    if (r.ok) {
      _boxDraft = null;
      setFeedback('Box created');
      if (typeof loadBoxes === 'function') loadBoxes();
      closeObjPanel();   // last step done → leave the modal (same as Save/Delete)
    }
    else if (r.error === 'edit_auth_required') setFeedback('Editing not authorized');
    else setFeedback(r.error || 'Create failed');
  } catch(e) { setFeedback('Create error'); }
}

/* ── Content search ────────────────────────────────────────────────────────
   Renders /api/search results into the shared object modal, grouped by type,
   reusing the exact same row components (and therefore the exact same click
   behaviour) as everywhere else: tracks/podcast/info/radio as .tl-item rows
   with the ⓘ actions menu; artists/albums as .obj-nav rows whose title-click
   opens the existing detail sheet. No new click wiring — the #obj-body
   delegated handler already dispatches all of these. */
function _searchTracksNorm(list) {
  // objRenderTracks expects artists as [{name}]; search returns [string].
  return (list || []).map(t => ({ ...t, artists: (t.artists || []).map(n => (typeof n === 'string' ? { name: n } : n)) }));
}
// Artists/albums rendered with the SAME .tl-item row as tracks (harmonized size)
// and a kind-tagged ⓘ badge, so they get Play next/now + See details instead of
// a bare chevron. No click-to-navigate on the row itself — everything is behind ⓘ.
function _searchObjRows(items, kind) {
  if (!items.length) return '';
  return '<div class="obj-tracks">' + items.map(a => {
    const inner = trackRowInnerHTML({
      name: a.name,
      artist: a.artist || '',
      uri: a.uri,
      kind,
      image: a.image || '',
      coverSeed: a.uri,                              // generated cover, deterministic
    });
    // obj-openable + data-* → a click anywhere on the row (except the +) opens the
    // object's detail view, in addition to the + menu. data-name seeds the header
    // so the title shows instantly (esp. podcasts, whose name isn't refetched).
    return `<div class="tl-item obj-openable" data-uri="${objEsc(a.uri)}" data-kind="${objEsc(kind)}" data-name="${objEsc(a.name || '')}">${inner}</div>`;
  }).join('') + '</div>';
}
/* Search paging state. Only the DB-backed buckets can be paged, so "load more"
   asks for the next offset and MERGES into what is already displayed rather
   than replacing it (the directory/Spotify halves are page-0 only). */
let _searchState = null;   // { q, limit, offset, data }
const _SEARCH_BUCKETS = ['tracks', 'artists', 'albums', 'playlists', 'podcasts',
                         'info', 'boxes', 'podcast_channels', 'radios'];

function _searchMerge(into, more) {
  _SEARCH_BUCKETS.forEach(k => {
    const a = into[k] || [], b = more[k] || [];
    const seen = new Set(a.map(x => x && (x.uri || x.uid)));
    into[k] = a.concat(b.filter(x => x && !seen.has(x.uri || x.uid)));
  });
  into.has_more = !!more.has_more;
  return into;
}

async function searchLoadMore() {
  if (!_searchState) return;
  const st = _searchState;
  const btn = document.querySelector('[data-search-more]');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    const next = st.offset + st.limit;
    const d = await fetch(API + '/search?q=' + encodeURIComponent(st.q)
                          + '&limit=' + st.limit + '&offset=' + next).then(r => r.json());
    if (d && !d.error) { st.offset = next; _searchMerge(st.data, d); _searchRender(); }
    else if (btn) { btn.disabled = false; btn.textContent = 'Load more'; }
  } catch (e) { if (btn) { btn.disabled = false; btn.textContent = 'Load more'; } }
}

/* A tag chip opens everything carrying that tag. It reuses the search view's
   renderer — same rows, same sections — but its kind is 'Tag', not 'Search': the
   header's editable query field belongs to a text search, and a tag is not one.
   The answer is capped per type rather than paged (has_more false server-side), so
   no "Load more" appears. */
/* ── Browse: walk the library and open what you find ──────────────────────
   The box editor's Add panel answers the same question — "what is in here?" — so
   the node catalogue (WC_BROWSE_NODES) and the row fetcher (browseFetch) are
   shared. Only the verb differs: there a row is added to a box, here it opens the
   object, where it can be played. Rendering goes through _searchObjRows, so those
   rows already carry the click behaviour the search results have.

   The two interactive nodes are left out on purpose: a podcast-genre tree is a
   detour rather than a destination, and a Radio France subject is not an object
   you can open at all — it is a pattern that refills a box. */
const BROWSE_NODES = ['favorites', 'podfavorites', 'podrecent', 'playlists', 'albums',
                      'artists', 'podchannels', 'podtop', 'podnews', 'radiotop'];
let _browseState = null;   // { node, offset, rows } for the paged nodes

function openBrowse() {
  objNavTo();
  objSetHead('Browse', 'Your library', '');
  objSetActionUris([]);
  openObjPanel();
  objBody().innerHTML = '<div class="obj-tracks">' + BROWSE_NODES.map(n => {
    const c = WC_BROWSE_NODES[n];
    return `<div class="obj-row obj-clickable" data-browse-node="${n}">`
         + `<span class="bx-kind">${c.icon}</span>`
         + `<span class="ot-name">${objEsc(c.label)}</span>${CHEVRON_SVG}</div>`;
  }).join('') + '</div>';
}

async function openBrowseNode(node, opts) {
  const more = !!(opts && opts.more);
  const c = WC_BROWSE_NODES[node];
  if (!more) {
    objNavTo();
    objSetHead('Browse', (c && c.label) || 'Browse', '');
    objSetActionUris([]);
    openObjPanel();
    objLoading('Loading…');
    _browseState = { node, offset: 0, rows: [] };
  }
  const got = await browseFetch(node, { offset: _browseState ? _browseState.offset : 0 });
  if (!got) { objBody().innerHTML = '<div class="obj-empty">Nothing to browse here.</div>'; return; }
  _browseState.rows = _browseState.rows.concat(got.rows);
  _browseState.offset += got.rows.length;
  _browseState.hasMore = !!got.hasMore;
  _browseRender(got);
}

function _browseRender(got) {
  const st = _browseState || { rows: [] };
  let html = st.rows.length ? _searchObjRows(st.rows, got.kind)
                            : `<div class="obj-empty">${objEsc(got.empty || 'Nothing here.')}</div>`;
  if (st.hasMore)
    html += '<div class="search-more"><button type="button" class="wc-seg" data-browse-more>Load more</button></div>';
  objBody().innerHTML = html;
}

async function browseLoadMore() {
  const btn = document.querySelector('[data-browse-more]');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  if (_browseState) await openBrowseNode(_browseState.node, { more: true });
}

async function openTagSearch(tag) {
  if (!tag) return;
  objNavTo();
  objSetHead('Tag', tag, 'tracks · albums · artists');
  objSetActionUris([]);
  openObjPanel();
  objLoading('Loading…');
  let d;
  try { d = await fetch(API + '/tag_search?tag=' + encodeURIComponent(tag) + '&limit=25').then(r => r.json()); }
  catch (e) { objBody().innerHTML = '<div class="obj-empty">Tag search failed.</div>'; return; }
  if (!d || d.error) {
    objBody().innerHTML = `<div class="obj-empty">${objEsc((d && d.error) || 'Tag search failed')}</div>`;
    return;
  }
  _searchState = { q: tag, limit: 25, offset: 0, data: d };
  _searchRender();
}

async function openSearch(q, opts) {
  const inPlace = !!(opts && opts.inPlace);   // live-edit from the header field: no nav push, no spinner
  if (!inPlace) objNavTo();
  objSetHead('Search', q, '');
  objSetActionUris([]);          // a search view has no single object to act on
  if (!inPlace) { openObjPanel(); objLoading('Searching…'); }
  let d;
  const _limit = 15;
  try { d = await fetch(API + '/search?q=' + encodeURIComponent(q) + '&limit=' + _limit).then(r => r.json()); }
  catch(e) { objBody().innerHTML = '<div class="obj-empty">Search failed.</div>'; return; }
  if (!d || d.error) { objBody().innerHTML = `<div class="obj-empty">${objEsc((d && d.error) || 'Search failed')}</div>`; return; }
  _searchState = { q, limit: _limit, offset: 0, data: d };
  _searchRender();
}

function _searchRender() {
  const d = (_searchState && _searchState.data) || {};

  // Merge DB-cache + live Spotify per music type, dedup by uri (cache wins).
  const merge = (a, b) => { const seen = new Set((a || []).map(x => x.uri)); return (a || []).concat((b || []).filter(x => !seen.has(x.uri))); };
  const sp = d.spotify || {};
  const tracks  = merge(d.tracks, sp.tracks);
  const artists = merge(d.artists, sp.artists);
  const albums  = merge(d.albums, sp.albums);
  const sec = (label, html) => html ? `<div class="search-section-label">${label}</div>${html}` : '';

  const boxToRow = b => ({ uri: 'box:' + b.uid, name: b.description || b.uid, image: b.image || '' });

  let html = '';
  if (tracks.length)          html += sec(`Tracks (${tracks.length})`,   objRenderTracks(_searchTracksNorm(tracks), 'track', true));
  if (artists.length)         html += sec(`Artists (${artists.length})`, _searchObjRows(artists, 'artist'));
  if (albums.length)          html += sec(`Albums (${albums.length})`,   _searchObjRows(albums, 'album'));
  if ((d.playlists||[]).length) html += sec(`Playlists (${d.playlists.length})`, _searchObjRows(d.playlists, 'playlist'));
  // Podcasts: channels (browsable feeds, from #Label lines) first, then episodes.
  const chans = d.podcast_channels || [];
  const podCount = chans.length + (d.podcasts || []).length;
  if (podCount) {
    let podHtml = '';
    if (chans.length)           podHtml += _searchObjRows(chans, 'podcast');
    if ((d.podcasts||[]).length)podHtml += objRenderTracks(_searchTracksNorm(d.podcasts), 'track', true);
    html += sec(`Podcasts (${podCount})`, podHtml);
  }
  if ((d.info||[]).length)    html += sec(`Info (${d.info.length})`,     objRenderTracks(_searchTracksNorm(d.info), 'track', true));
  if ((d.radios||[]).length)  html += sec(`Radios (${d.radios.length})`, objRenderTracks(_searchTracksNorm(d.radios), 'radio', true));
  if ((d.boxes||[]).length)   html += sec(`Boxes (${d.boxes.length})`,   _searchObjRows(d.boxes.map(boxToRow), 'box'));
  if (d.has_more)
    html += '<div class="search-more"><button type="button" class="wc-seg" data-search-more>Load more</button></div>';
  objBody().innerHTML = html || '<div class="obj-empty">No results.</div>';
}

// Resync immédiat de l'état actif de toutes les boxes (ex: la box auto que le
// backend vient d'activer suite à un réglage mood) — sans attendre le poll 10min.
/* The dials show what is DRIVING the mix, not merely what they were last set to.
   A box can force a mood or a discover level and outrank the session (see
   effective_mood server-side), and until this existed the matrix read 0.5/0.5/5
   while the mix ran on the box's "calm" — the control lying about what it
   controls. Refreshed when a box is toggled, which is exactly when what drives
   the mix changes. */
async function syncMoodDials() {
  // Never clobber a pending gesture, and never fight a rebuild in progress.
  if (_moodDirty || mixBusy) return;
  let s;
  try { s = await fetch(API + '/mood?light=1').then(r => r.json()); } catch (e) { return; }
  const e2  = s.effective_energy  ?? s.energy  ?? 0.5;
  const v2  = s.effective_valence ?? s.valence ?? 0.6;
  const dl2 = s.effective_dl      ?? s.discover_level ?? 5;
  appState.energy = e2; appState.valence = v2; appState.dl = dl2;
  setDial('energy', e2); setDial('valence', v2); setDial('dl', dl2 / 10);
  if (typeof setBasicMoodDial === 'function') setBasicMoodDial(basicMoodIndex());
  if (typeof setBasicDlDial === 'function') setBasicDlDial(basicDlIndex());
  // Say WHERE the value comes from when it is not the dials' own: a forced value
  // that looks hand-set is worse than no indication at all.
  const hint = s.forced_by ? 'set by ' + s.forced_by : '';
  document.querySelectorAll('[data-mood-forced]').forEach(el => {
    el.textContent = hint;
    el.hidden = !hint;
  });
  document.body.classList.toggle('mood-forced', !!s.forced_by);
}

async function toggleBox(uid, btn) {
  btn.disabled = true;
  try {
    await fetch(API + '/box?uid=' + encodeURIComponent(uid) + '&mode=toogle');
    moodSessionActive = false;   // lancer une box termine la session mood implicite
    await new Promise(r => setTimeout(r, 200));
    await checkBoxActive(uid, btn);
    // First refresh: box badge state visible early; second: full tracklist after O2M async refill
    setTimeout(refreshNowPlaying, 800);
    setTimeout(refreshNowPlaying, 3000);
    const boxName = btn.querySelector('.box-name')?.textContent || '';
    setFeedback(btn.classList.contains('active') ? `▶ ${boxName}` : `⏹ ${boxName}`);
  } catch(e) { setFeedback('Box error'); }
  finally { btn.disabled = false; }
}

let lastTagsUri = null;

/* Hide the tags row when it carries nothing, so its grid row collapses instead of
   leaving a gap. :empty is no help: the row always contains the #track-ev span. */
function syncTagsRow() {
  const bar = document.getElementById('track-tags-row');
  if (!bar) return;
  const ev = document.getElementById('track-ev');
  const hasContent = !!bar.querySelector('.tag-chip') || !!(ev && ev.textContent.trim());
  bar.classList.toggle('is-empty', !hasContent);
}

/* Empty the tags row (chips + energy/valence) and forget which track it showed. */
function clearTrackTags() {
  lastTagsUri = null;
  const bar = document.getElementById('track-tags-row');
  const evEl = document.getElementById('track-ev');
  if (!bar) return;
  [...bar.querySelectorAll('.tag-chip')].forEach(el => el.remove());
  if (evEl) evEl.textContent = '';
  syncTagsRow();
}

async function fetchAndRenderTrackTags(uri) {
  if (!uri || uri === lastTagsUri) return;   // same track: keep what is there
  clearTrackTags();
  lastTagsUri = uri;
  const bar = document.getElementById('track-tags-row');
  const evEl = document.getElementById('track-ev');

  try {
    const tags = await fetch(API + '/track_tags?uri=' + encodeURIComponent(uri)).then(r => r.json());
    tags.slice(0, 12).forEach(({name}) => {
      // A button, not a span: it is an action, so it gets keyboard focus and a role
      // for free rather than a click handler bolted onto inert text.
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tag-chip';
      chip.textContent = name;
      chip.title = 'Show everything tagged ' + name;
      chip.addEventListener('click', () => openTagSearch(name));
      bar.insertBefore(chip, evEl);
    });
  } catch(e) {}
  syncTagsRow();

  // Energy/valence from matrixFeatures (may need a short wait for the fetch to complete)
  function updateEV() {
    if (lastTagsUri !== uri) return; // Track changed since we started
    const f = matrixFeatures[uri];
    if (f) evEl.innerHTML = `${ICON.zap} ${f.energy.toFixed(2)} · ${ICON.sun} ${f.valence.toFixed(2)}`;
    syncTagsRow();
  }
  updateEV();
  setTimeout(updateEV, 1200);
}
