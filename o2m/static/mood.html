    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border); color: var(--muted);
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .wc-seg svg { width: 13px; height: 13px; display: block; }
  .wc-seg:hover { color: var(--text); }
  .wc-seg.on { color: var(--accent); border-color: var(--accent); }
  .wc-main { min-width: 0; }
  .wc-add { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  .wc-add-head {
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em;
    font-size: 10px; color: var(--muted); margin-bottom: 8px;
  }
  .wc-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .wc-tab {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .wc-tab:hover { border-color: var(--accent); }
  .wc-tab.on { border-color: var(--accent); color: var(--accent); }
  .wc-tab svg { width: 13px; height: 13px; display: block; }
  .wc-detail:empty { display: none; }
  .wc-panel { min-width: 0; }
  .wc-panel-head {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em;
    font-size: 10px; color: var(--muted); margin-bottom: 8px;
  }
  .wc-back {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 0; display: inline-flex; flex-shrink: 0;
  }
  .wc-back:hover { color: var(--accent); }
  .wc-back svg { width: 13px; height: 13px; display: block; }
  .wc-hint { font-size: 11px; color: var(--muted); padding-bottom: 8px; }
  #wc-search-input { margin-bottom: 8px; }
  /* Result rows add content on click — no per-row action menu here. */
  #bx-add-panel .tl-item { cursor: copy; }
  #bx-add-panel .tl-info { display: none; }
  #bx-add-panel .tl-item.picked { outline: 1px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
  /* Mobile: the panel stacks below, so content + tabs stay visible above it.
     Desktop: it becomes a second column next to them. */
  .wc-detail { margin-top: 14px; }
  @media (min-width: 700px) {
    .wc-body.has-detail {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px; align-items: start;
    }
    .wc-body.has-detail .wc-detail {
      margin-top: 0; border-left: 1px solid var(--border); padding-left: 18px;
      max-height: 46vh; overflow-y: auto;
    }
  }

  /* ── New-box wizard ── */
  .wiz-hint { font-size: 11px; color: var(--muted); padding: 4px 2px 8px; }
  .wiz-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
  .bx-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 14px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .bx-chip:hover { border-color: var(--accent); }
  .bx-chip.on { border-color: var(--accent); color: var(--accent); }
  .bx-chip svg { width: 12px; height: 12px; display: block; }
  .wiz-foot {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-top: 16px;
  }
  .wiz-cards { display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
  .wiz-card {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font: inherit; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .wiz-card:hover { border-color: var(--accent); }
  .wiz-card.on { border-color: var(--accent); }
  .wiz-card.on .wiz-card-icon { color: var(--accent); }
  .wiz-card-icon { flex-shrink: 0; display: inline-flex; color: var(--muted); }
  .wiz-card-icon svg { width: 18px; height: 18px; display: block; }
  .wiz-card-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wiz-card-text b { font-size: 14px; font-weight: 600; }
  .wiz-card-text span { font-size: 11px; color: var(--muted); }


  /* Desktop / tablet: overlay the lower area in place (over the columns). */
  @media (min-width: 700px) {
    #obj-panel {
      position: absolute; inset: 0; z-index: 60;
      max-height: none; overflow-y: auto;
      /* Slide up from the bottom edge of the lower area (scroll-area clips it). */
      transform: translateY(100%); opacity: 0; visibility: hidden;
      border-top: 1px solid var(--border-strong);
      box-shadow: 0 -14px 34px rgba(0,0,0,.30); background: var(--surface);
      transition: transform .28s cubic-bezier(.22,.61,.36,1),
                  opacity .2s var(--ease, ease), visibility .28s var(--ease, ease);
      padding: 16px 20px 20px;
    }
    body.obj-open #obj-panel { transform: translateY(0); opacity: 1; visibility: visible; }
    #obj-backdrop { display: none !important; }
  }

  /* ════════════ Basic view (/basic — default on mobile) ════════════
     Top zone and footer are kept; the 3 middle columns are replaced by a single
     section: 4 ON/OFF actuators (music/podcast/info/radio) + 2 dials. */
  #basic-section { display: none; }
  html.basic #main-cols { display: none !important; }
  html.basic #basic-section {
    display: flex; flex-direction: column; gap: 26px;
    width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 16px 30px;
    /* Shrinkable with internal scroll, like the full-view accordion — otherwise on
       short viewports the section's natural height pushes the footer below the
       fold of the overflow-hidden #scroll-area (footer unreachable on phones). */
    /* overflow-x:hidden is required: with only overflow-y:auto set, CSS computes
       overflow-x to 'auto' too → a phantom horizontal scrollbar appeared whenever
       the dials row was a few px wider than the section. */
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  }
  /* Always 2×2, desktop included: the ALL meta-button is centred in absolute
     position, so only a 2×2 grid puts it on a real crossing between the four
     actuators. In a single 4-column row it landed on top of the middle two. */
  .basic-toggles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    position: relative; }   /* anchor for the central ALL meta-button */
  /* ALL meta-button: round, floating at the centre of the 2×2 grid.
     One tap = everything on / everything off. */
  #basic-all {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 62px; height: 62px; border-radius: 50%; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--muted); cursor: pointer; font: inherit; font-size: 10px; font-weight: 700;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    transition: color .15s, border-color .15s;
  }
  #basic-all svg { width: 20px; height: 20px; }
  #basic-all.on { color: var(--accent); border-color: var(--accent); }
  #basic-all:disabled { cursor: wait; animation: basic-pulse 1s ease-in-out infinite; }
  .basic-toggle {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 18px 8px 14px; background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    transition: color .15s, border-color .15s;
  }
  .basic-toggle svg { width: 26px; height: 26px; }
  .basic-toggle.on { color: var(--accent); border-color: var(--accent); }
  .basic-toggle:disabled { cursor: wait; animation: basic-pulse 1s ease-in-out infinite; }
  @keyframes basic-pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  /* Playback status line above the actuators: animated eq (freezes when paused
     via body.is-paused) + track/box counts + network dot. */
  #basic-status {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
    color: var(--muted); text-transform: uppercase;
  }
  #basic-status .eq-icon { position: static; }
  #basic-status .bs-sep { opacity: .5; }
  #basic-dials { display: flex; justify-content: center; gap: 24px; align-items: flex-start; }
  /* Both dials' viewBox is wider (label ring): give them their own size so the
     knob circle renders as large as a plain dial (.dial-svg caps at 108px). */
  #dial-bmood, #dial-bdl { width: 172px; height: 123px; }
  #txt-bmood, #txt-bdl { font-size: 11px; letter-spacing: .04em; }
  /* Desktop: the basic view was pinned to the phone-sized 560px column, leaving
     most of the window empty. Scale the whole block up by roughly the same factor
     (~1.4×) so actuators, the ALL knob and the dials keep their proportions. */
  @media (min-width: 700px) {
    /* Vertically centred + trimmed so the whole block fits under the (kept)
       top-zone without a phantom internal scrollbar on typical desktop heights;
       overflow-y:auto stays as a safety net for genuinely short windows. */
    html.basic #basic-section { max-width: 820px; gap: 24px; padding: 20px 24px 24px; justify-content: center; }
    .basic-toggle { padding: 22px 10px 17px; font-size: 15px; gap: 11px; }
    .basic-toggle svg { width: 36px; height: 36px; }
    .basic-toggles { gap: 14px; }
    #basic-all { width: 86px; height: 86px; font-size: 11px; }
    #basic-all svg { width: 27px; height: 27px; }
    #basic-dials { gap: 40px; }
    #dial-bmood, #dial-bdl { width: 224px; height: 158px; }
    #txt-bmood, #txt-bdl { font-size: 13px; }
  }
  /* Network quality dot (green/orange/red) — fed by a periodic latency probe.
     Sits on the status line of the now-playing header. */
  /* Network quality dot — colour driven by html[data-net], so several dots
     (now-playing header + basic status line) stay in sync from one probe. */
  .net-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--border-strong); vertical-align: middle; transition: background .3s;
  }
  #net-dot { margin-top: 4px; }
  html[data-net="green"]  .net-dot { background: #3fbf6f; }
  html[data-net="orange"] .net-dot { background: #f0a000; }
  html[data-net="red"]    .net-dot { background: #e0245e; }
  html.basic #net-dot { display: none; }   /* basic shows it in the status line instead */

  /* Detent labels around a basic-view dial (Mood, Opening level) — the active
     one lights up. Shared by both dials for a consistent appearance. */
  .bmood-lbl, .bdl-lbl {
    font-size: 10px; letter-spacing: .05em; fill: var(--muted);
    cursor: pointer; user-select: none; transition: fill .15s;
  }
  .bmood-lbl.on, .bdl-lbl.on { fill: var(--accent); font-weight: 700; }
  .bdl-tick { fill: var(--muted); opacity: .6; }
  /* Footer view-switch: show the counterpart link only. Sits right after the O2M
     brand (order 0 + DOM position) and stands out in accent. The #footer-links
     prefix is required to out-rank `#footer-links .footer-link { order: 2 }`. */
  #footer-links #link-basic, #footer-links #link-full {
    order: 0; color: var(--accent);
    border: 1px solid var(--border-strong); padding: 3px 9px;
  }
  #footer-links #link-full { display: none; }
  html.basic #footer-links #link-full { display: inline-flex; }
  html.basic #footer-links #link-basic { display: none; }

  /* Content search — collapsed to an icon; expands the input in place when active. */
  #footer-links #search-box { order: 1; display: inline-flex; align-items: center; gap: 0;
    padding: 0; background: none; border: none; }
  #search-box #btn-search { background: none; border: none; color: var(--muted); cursor: pointer;
    display: inline-flex; padding: 3px 6px; }
  #search-box #btn-search:hover, #search-box.open #btn-search { color: var(--accent); }
  #search-box #btn-search svg { width: 15px; height: 15px; }
  #search-input { width: 0; padding: 0; border: none; opacity: 0; background: var(--fill-1);
    color: var(--text); font: inherit; font-size: 12px; outline: none;
    transition: width .2s var(--ease, ease), opacity .2s, padding .2s; }
  #search-box.open #search-input { width: 160px; padding: 4px 8px; opacity: 1;
    border: 1px solid var(--border-strong); }
  /* Search results inside the object modal. */
  .search-section-label { font-family: var(--font-mono); text-transform: uppercase;
    letter-spacing: .12em; font-size: 10px; color: var(--muted); margin: 14px 0 4px; }
  .search-section-label:first-child { margin-top: 0; }
</style>
</head>
<body>

<div id="details-backdrop"></div>

<!-- Top zone: large cover on the left, info + controls on the right -->
<div id="top-zone">
  <div id="hero-title"></div>
  <div id="cover-col">
    <div id="cover-wrap"><img id="cover" src="" alt=""></div>
  </div>
  <div id="top-right">

    <!-- Now playing -->
    <div id="now-playing">
      <div id="track-info">
        <div id="track-name">—</div>
        <div id="artist-album">
          <span id="artist-name">O2M</span>
          <span id="album-name"></span>
        </div>
        <div id="status-line">
          <div id="track-status-badge"></div>
          <span id="net-dot" class="net-dot" title="Network quality"></span>
        </div>
        <div id="track-tags-row"><span id="track-ev"></span></div>
      </div>
      <button id="btn-details" title="Track details &amp; edit" aria-label="Track details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </button>
    </div>

    <!-- Playback controls -->
    <div id="controls">
      <button class="ctrl-btn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg></button>
      <button class="ctrl-btn" id="btn-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="ctrl-btn" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg></button>
      <div id="volume-row">
        <span id="volume-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        <input type="range" id="volume-slider" min="0" max="100" value="50">
        <span id="volume-val">50%</span>
        <button id="btn-snapcast" title="Snapcast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></button>
      </div>
    </div>

    <!-- Progress bar -->
    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-time">
        <span id="prog-elapsed">0:00</span>
        <span id="prog-duration"></span>
      </div>
    </div>

  </div><!-- /top-right -->

  <!-- Colonne détails du morceau courant (desktop) -->
  <div id="track-details">
    <div class="td-head">
      <span>Details</span>
      <div class="td-head-actions">
        <!-- Actions live in the header (like the modal's obj-actions). -->
        <button id="btn-track-menu" class="track-menu-trigger" title="More" aria-label="More" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
        <button id="btn-edit-lock" title="Enable editing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <button id="btn-details-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <!-- Body is generated by tdPanel.render() — same shared markup as the modal. -->
    <div class="td-body"></div>
  </div>
</div><!-- /top-zone -->

<!-- Scrollable area -->
<div id="scroll-area">

  <!-- ══ Basic view (/basic) : 4 actuators + 2 dials — replaces the 3 columns ══ -->
  <div id="basic-section">
    <div id="basic-status">
      <span class="eq-icon" id="bs-eq" title="Playback"><i></i><i></i><i></i></span>
      <span class="bs-sep">·</span>
      <span id="bs-tracks">0 tracks</span>
      <span class="bs-sep">·</span>
      <span id="bs-boxes">0 boxes</span>
      <span class="bs-sep">·</span>
      <span class="net-dot" title="Network"></span>
    </div>
    <div class="basic-toggles" id="basic-toggles">
      <button class="basic-toggle" data-cat="music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Music</button>
      <button class="basic-toggle" data-cat="podcast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>Podcast</button>
      <button class="basic-toggle" data-cat="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Info</button>
      <button class="basic-toggle" data-cat="radio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>Radio</button>
      <button id="basic-all" title="All on / all off" aria-label="All on / all off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>All</button>
    </div>
    <div id="basic-dials">
      <div class="dial-wrap">
        <div class="dial-label">Opening level</div>
        <!-- Same presentation as the Mood dial: wider viewBox, detent labels around
             the arc (135°→405°), clickable shortcuts. 3 detents reuse the Mood
             dial's bottom-left/top/bottom-right label positions (indices 0/2/4 of
             its 5-slot layout land exactly there). Appearance only — still the
             same continuous discover_level(0-10) underneath, just snapped. -->
        <svg class="dial-svg" id="dial-bdl" width="196" height="136" viewBox="-33 -14 176 126">
          <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
          <circle class="dial-fill" id="fill-bdl" cx="55" cy="55" r="42"
                  stroke="#00bcd4" transform="rotate(135 55 55)"/>
          <text class="bdl-lbl" data-i="0" x="16" y="99"  text-anchor="end">focused</text>
          <text class="bdl-lbl" data-i="2" x="55" y="-4"  text-anchor="middle">regular</text>
          <text class="bdl-lbl" data-i="4" x="94" y="99"  text-anchor="start">crazy</text>
          <!-- 2 extra (unlabelled) detents between the 3 words -->
          <circle class="bdl-tick" cx="16" cy="39" r="2"/>
          <circle class="bdl-tick" cx="94" cy="39" r="2"/>
          <circle id="knob-bdl" cx="55" cy="13" r="7" fill="#00bcd4"/>
          <text x="55" y="60" text-anchor="middle" fill="#eaeaea" font-weight="700" id="txt-bdl">regular</text>
        </svg>
      </div>
      <div class="dial-wrap">
        <div class="dial-label">Mood</div>
        <!-- Wider viewBox: the 5 detent labels sit around the knob, at their angle
             on the arc (135°→405°). Labels are clickable shortcuts. -->
        <svg class="dial-svg" id="dial-bmood" width="196" height="136" viewBox="-33 -14 176 126">
          <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
          <circle class="dial-fill" id="fill-bmood" cx="55" cy="55" r="42"
                  stroke="#ff5a00" transform="rotate(135 55 55)"/>
          <text class="bmood-lbl" data-i="0" x="16" y="99"  text-anchor="end">intense</text>
          <text class="bmood-lbl" data-i="1" x="0"  y="35"  text-anchor="end">calm</text>
          <text class="bmood-lbl" data-i="2" x="55" y="-4"  text-anchor="middle">normy</text>
          <text class="bmood-lbl" data-i="3" x="110" y="35" text-anchor="start">happy</text>
          <text class="bmood-lbl" data-i="4" x="94" y="99"  text-anchor="start">energetic</text>
          <circle id="knob-bmood" cx="55" cy="13" r="7" fill="#ff5a00"/>
          <text x="55" y="60" text-anchor="middle" fill="#eaeaea" font-weight="700" id="txt-bmood">normy</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- 3 colonnes : Boxes | Matrice+Genres | Tracklist -->
  <div id="main-cols">

  <!-- Col 1 : Boxes (repliable en mobile) -->
  <div id="boxes-panel" class="col collapsible">
    <div class="panel-head" id="boxes-panel-label">
      <span>Boxes</span>
      <span id="boxes-count"></span>
      <button id="btn-clear-boxes" type="button" title="Clear all boxes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>

    <div class="panel-body">
      <div id="auto-bar">
        <button id="btn-auto" type="button" title="Auto: les réglages rafraîchissent le mix en direct">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>Auto</span>
        </button>
        <span id="auto-hint">live</span>
      </div>
      <div id="boxes-wrap"></div>
    </div>
  </div>

  <!-- Col 2 : Réglages — potentiomètres + matrice + genres (repliable en mobile) -->
  <div id="left-panel" class="col collapsible">
  <div class="panel-head" id="settings-label">
    <span>Mood</span>
    <button id="btn-reset-mood" type="button" title="Reset mood to defaults"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  </div>
  <div class="panel-body">
  <div id="matrix-section">
    <canvas id="mood-matrix"></canvas>
  </div>
  <div id="dials">
    <div class="dial-wrap">
      <div class="dial-label">Energy</div>
      <svg class="dial-svg" id="dial-energy" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-energy" cx="55" cy="55" r="42"
                stroke="#e94560" transform="rotate(135 55 55)"/>
        <circle id="knob-energy" cx="55" cy="13" r="7" fill="#e94560"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-energy">5</text>
      </svg>
      <div class="dial-sub">calm ↔ intense</div>
    </div>
    <div class="dial-wrap">
      <div class="dial-label">Ambiance</div>
      <svg class="dial-svg" id="dial-valence" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-valence" cx="55" cy="55" r="42"
                stroke="#7c4dff" transform="rotate(135 55 55)"/>
        <circle id="knob-valence" cx="55" cy="13" r="7" fill="#7c4dff"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-valence">5</text>
      </svg>
      <div class="dial-sub">dark ↔ bright</div>
    </div>
    <div class="dial-wrap">
      <div class="dial-label">Discovery</div>
      <svg class="dial-svg" id="dial-dl" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-dl" cx="55" cy="55" r="42"
                stroke="#00bcd4" transform="rotate(135 55 55)"/>
        <circle id="knob-dl" cx="55" cy="13" r="7" fill="#00bcd4"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-dl">5</text>
      </svg>
      <div class="dial-sub">focused ↔ adventurous</div>
    </div>
  </div>
  <div id="genres-section">
    <div id="genres-label">Genres</div>

    <div id="genres-wrap"></div>
  </div>
  </div><!-- /panel-body -->
  </div><!-- /left-panel -->

  <!-- Col 3 : Tracklist (prioritaire) -->
  <div id="tracklist-col" class="col collapsible open">
    <div id="tracklist-section">
      <div id="tracklist-label">
        <span>Tracklist</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="tracklist-count"></span>
          <button id="btn-clear-tl" title="Clear tracklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
      </div>
      <div id="tracklist-wrap"></div>
    </div>
  </div>

  </div><!-- /main-cols -->


  <!-- ══ Object detail / edit overlay (album · artist · box) ══
       Covers the lower area. Desktop: overlays the columns in place.
       Mobile: bottom-sheet like the track edit space. Read-only for now. -->
  <div id="obj-panel" aria-hidden="true">
    <div class="obj-head">
      <button id="obj-prev" class="hide" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button id="obj-next" class="hide" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div class="obj-head-main">
        <span class="obj-kind" id="obj-kind">—</span>
        <span class="obj-title" id="obj-title">—</span>
        <span class="obj-sub" id="obj-sub"></span>
        <!-- Editable query, shown only in search views (obj-panel.search-mode) so the
             search can be refined without closing the modal. -->
        <input id="obj-search-input" class="obj-search-input" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      </div>
      <button id="obj-actions" class="hide" title="Actions" aria-label="Actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
      <button id="obj-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="obj-body" id="obj-body"></div>
  </div>

</div><!-- /scroll-area -->

  <!-- Footer links -->
  <div id="footer-links">
    <div class="tb-brand">
      <span class="tb-mark">O2M</span>
    </div>
    <!-- Content search: collapsed to an icon; expands to a text field in place. -->
    <div id="search-box" class="footer-link">
      <button id="btn-search" title="Search content" aria-label="Search content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <input id="search-input" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
    </div>
    <div id="theme-switcher">
      <button class="theme-chip" data-theme-set="dark">Dark</button>
      <button class="theme-chip" data-theme-set="creme">Light</button>
      <button class="theme-chip" data-theme-set="mono">Mono</button>
      <button class="theme-chip" data-theme-set="overprint">Overprint</button>
      <button class="theme-chip" data-theme-set="invert">Invert</button>

const API = location.origin + '/api';

/* ── Icônes SVG inline (Feather, N&B — jamais d'emoji) ── */
const ICON = {

  eye:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  code:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',

/* ── State ── */
let appState = { energy: 0.5, valence: 0.6, dl: 5, genres: [] };
let applyTimer = null;
let currentTlid = null;
let lastScrolledTlid = null;
let currentTracklistLength = 0;
let snapWsUrl = null;
let snapPlayer = null;
let backofficeUrl = null;

/* Mode mood/auto : un changement de réglage rafraîchit le mix en direct
   - autoToggle      : interrupteur manuel "Auto" (persisté)
   - moodSessionActive : actif dès qu'un mix mood a été généré (potards/matrice)
   - autoBoxActive   : une box active contient le mot "auto" */
let autoToggle = false;
let moodSessionActive = false;
let autoBoxActive = false;

/* ── Dial geometry ── */
const R = 42, CX = 55, CY = 55;
const CIRC = 2 * Math.PI * R;
const ARC  = CIRC * 270 / 360;

function setupDial(id) {
  const svg   = document.getElementById('dial-' + id);
  const track = svg.querySelector('.dial-track');
  const fill  = svg.querySelector('.dial-fill');
  track.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  track.setAttribute('stroke-dashoffset', 0);
  fill.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  fill.setAttribute('stroke-dashoffset', ARC);
}

function setDial(id, v01) {
  const fill = document.getElementById('fill-' + id);
  const knob = document.getElementById('knob-' + id);
  const txt  = document.getElementById('txt-' + id);
  fill.setAttribute('stroke-dashoffset', ARC * (1 - v01));
  const a = (135 + v01 * 270) * Math.PI / 180;
  knob.setAttribute('cx', (CX + R * Math.cos(a)).toFixed(1));
  knob.setAttribute('cy', (CY + R * Math.sin(a)).toFixed(1));
  txt.textContent = Math.round(v01 * 10);
}

function makeDraggable(id, onChange) {
  const svg = document.getElementById('dial-' + id);
  let active = false;
  function v01fromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - (rect.left + rect.width / 2);
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - (rect.top  + rect.height / 2);
    let deg = Math.atan2(py, px) * 180 / Math.PI - 135;
    if (deg < 0) deg += 360;
    return Math.min(Math.max(deg, 0), 270) / 270;
  }
  svg.addEventListener('pointerdown', e => {
    active = true; svg.setPointerCapture(e.pointerId);
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointermove', e => {
    if (!active) return; e.preventDefault();
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointerup', () => { active = false; scheduleApply(); });
}

/* ── Mode mood/auto ── */
function isAutoMode() {
  return autoToggle || moodSessionActive || autoBoxActive;
}
function updateAutoBtn() {
  document.getElementById('btn-auto')?.classList.toggle('active', isAutoMode());
}
function setAutoToggle(on) {
  autoToggle = on;
  localStorage.setItem('mood-auto', on ? '1' : '0');
  updateAutoBtn();
}

/* ── Apply ── */
function shouldApplyMood() {
  // Rafraîchit le mix si la tracklist est vide OU si on est en mode mood/auto.
  // Vue basic : les potards sont des commandes directes → toujours appliquer.
  return isBasic() || currentTracklistLength === 0 || isAutoMode();
}

function scheduleApply() {
  if (!shouldApplyMood()) return;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyMood, 4500);   // débounce : laisse régler plusieurs potards avant d'appliquer
}

async function applyMood() {
  if (!shouldApplyMood()) return;
  // Basic view: the dials are settings, the actuators are the switches. With no
  // actuator on, just save the values server-side — don't launch anything.
  const basicIdle = isBasic() && basicCats
    && !Object.values(basicCats).some(l => Array.isArray(l) && l.some(b => b.active));
  setFeedback(basicIdle ? 'Saving…' : 'Applying…');
  try {
    const body = { energy: appState.energy, valence: appState.valence,
                   discover_level: appState.dl, genres: appState.genres };
    if (basicIdle) body.apply = false;
    const r = await fetch(API + '/mood', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.status === 'settings_saved') {
      setFeedback('Settings saved — turn Music on to start');
      return;
    }
    setFeedback(d.status === 'boxes_active'
      ? 'Boxes active — mood applied to recommendations (empty the boxes to rebuild)'
      : d.tracks_added > 0 ? `${d.tracks_added} tracks loaded` : 'No matching tracks');
    moodSessionActive = true;   // on est désormais dans un mix mood → potards en direct
    updateAutoBtn();
    setTimeout(refreshNowPlaying, 400);
    setTimeout(refreshBoxStates, 500);   // allume tout de suite la box auto activée côté serveur
  } catch(e) { setFeedback('Network error'); }
}

/* ── Network quality indicator (green / orange / red) ──────────────────────────
   Periodic latency probe against the o2m API + Network Information API when
   available. Thresholds chosen against the snapcast reality: the web stream has
   ~1s of buffer, so RTT spikes beyond ~1.2s mean audible dropouts (red). */
async function netProbe() {
  const el = document.getElementById('net-dot');
  if (!el) return;
  const t0 = performance.now();
  let ms = Infinity;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 5000);
    await fetch(API + '/dl?_t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(to);
    ms = performance.now() - t0;
  } catch (e) { ms = Infinity; }
  const conn = navigator.connection || {};
  let level = 'green';
  if (ms > 1200 || conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g') level = 'red';
  else if (ms > 400 || conn.effectiveType === '3g') level = 'orange';
  document.documentElement.dataset.net = level;   // drives every .net-dot via CSS
  const title = 'Network: ' + (ms === Infinity ? 'offline'
    : Math.round(ms) + ' ms' + (conn.effectiveType ? ' · ' + conn.effectiveType : ''));
  document.querySelectorAll('.net-dot').forEach(d => d.title = title);
}

/* ── Basic view (/basic — default on mobile) ─────────────────────────────────
   A simplified façade over the existing mechanisms: the 4 actuators add/remove
   pinned boxes by category via /api/box, the 2 dials drive the same appState +
   scheduleApply() pipeline as the full view. No backend behavior change. */
// Dynamic: the view can switch in place (SPA) — always read the live class.
function isBasic() { return document.documentElement.classList.contains('basic'); }
// 5 detents; the 4 moods sit at the center of their matrix quadrant (X=energy,
// Y=valence), "intense" being the dark quadrant (already labelled Intense in the UI).
const BASIC_MOODS = [
  ['intense',   0.25, 0.25],
  ['calm',      0.25, 0.75],
  ['normy',     0.50, 0.50],   // default — center
  ['happy',     0.75, 0.75],
  ['energetic', 0.75, 0.25],
];
let basicCats = null;

function basicMoodIndex() {
  let best = 2, bd = Infinity;
  BASIC_MOODS.forEach(([, e, v], i) => {
    const d = Math.hypot(appState.energy - e, appState.valence - v);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function setBasicMoodDial(i) {
  setDial('bmood', i / (BASIC_MOODS.length - 1));
  const txt = document.getElementById('txt-bmood');
  if (txt) txt.textContent = BASIC_MOODS[i][0];
  document.querySelectorAll('.bmood-lbl').forEach(l =>
    l.classList.toggle('on', Number(l.dataset.i) === i));
}

// Opening level, presented the same way as Mood (detent labels around the dial)
// — appearance only, still the same continuous discover_level(0-10) underneath.
// 5 detents but only 3 are labelled (focused/regular/crazy at indices 0/2/4);
// the 2 in-between (indices 1/3) are extra stops shown as ticks, their centre
// text is the numeric discover_level. Same underlying discover_level(0-10).
const BASIC_DL_LEVELS = [['focused', 0], ['', 3], ['regular', 5], ['', 8], ['crazy', 10]];
function basicDlIndex() {
  let best = 2, bd = Infinity;
  BASIC_DL_LEVELS.forEach(([, dl], i) => {
    const d = Math.abs((appState.dl ?? 5) - dl);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function setBasicDlDial(i) {
  setDial('bdl', i / (BASIC_DL_LEVELS.length - 1));
  const [label, dl] = BASIC_DL_LEVELS[i];
  const txt = document.getElementById('txt-bdl');
  if (txt) txt.textContent = label || String(dl);
  document.querySelectorAll('.bdl-lbl').forEach(l =>
    l.classList.toggle('on', Number(l.dataset.i) === i));
}

let basicLimit = 30;   // fill target — refreshed from api_result_limit via /api/basic_boxes

function updateBasicStatus() {
  const tl = document.getElementById('bs-tracks');
  const bx = document.getElementById('bs-boxes');
  if (tl) tl.textContent = `${currentTracklistLength} track${currentTracklistLength === 1 ? '' : 's'}`;
  if (bx && basicCats) {
    const n = ['music', 'podcast', 'info', 'radio']
      .reduce((s, c) => s + (basicCats[c] || []).filter(b => b.active).length, 0);
    bx.textContent = `${n} box${n === 1 ? '' : 'es'}`;
  }
}

// Called from the now-playing refresh (10s + WS events): re-syncs the basic box
// states/count from the server so changes made elsewhere (e.g. the full view on
// another device) show up, without refetching on every rapid WS event.
let _lastBasicRefresh = 0;
function syncBasicFromNowPlaying() {
  if (!isBasic()) return;
  updateBasicStatus();                       // cheap, local: track count always fresh
  const now = Date.now();
  if (now - _lastBasicRefresh < 3000) return;
  _lastBasicRefresh = now;
  refreshBasicToggles();                      // refetch /basic_boxes → box states + count
}

async function refreshBasicToggles() {
  if (!isBasic()) return;
  try {
    basicCats = await fetch(API + '/basic_boxes').then(r => r.json());
    if (basicCats.limit) basicLimit = basicCats.limit;
    updateBasicStatus();
    document.querySelectorAll('#basic-toggles .basic-toggle').forEach(btn => {
      const boxes = basicCats[btn.dataset.cat] || [];
      btn.classList.toggle('on', boxes.some(b => b.active));
    });
    const allBtn = document.getElementById('basic-all');
    if (allBtn) allBtn.classList.toggle('on',
      ['music', 'podcast', 'info', 'radio'].every(c => (basicCats[c] || []).some(b => b.active)));
  } catch(e) {}
}

// ALL meta-button: any category active → everything off; nothing active → everything on.
async function toggleBasicAll(btn) {
  if (!basicCats) return;
  const cats = ['music', 'podcast', 'info', 'radio'];
  const anyActive = cats.some(c => (basicCats[c] || []).some(b => b.active));
  btn.disabled = true;
  try {
    for (const c of cats) {
      const cbtn = document.querySelector(`.basic-toggle[data-cat="${c}"]`);
      const isOn = (basicCats[c] || []).some(b => b.active);
      // OFF pass: only categories currently on; ON pass: only those off.
      if (anyActive === isOn && cbtn) await toggleBasicCat(cbtn);
    }
  } finally { btn.disabled = false; }
  await refreshBasicToggles();
}

async function toggleBasicCat(btn) {
  const boxes = (basicCats && basicCats[btn.dataset.cat]) || [];
  if (!boxes.length) { setFeedback('No ' + btn.dataset.cat + ' box'); return; }
  const turnOn = !boxes.some(b => b.active);
  btn.disabled = true;
  try {
    // One atomic server-side call: meta_fill (sources drawn recency × chance up
    // to the limit) or meta_remove. A reload / phone lock can't leave a partial
    // category state anymore — the server finishes the job either way.
    setFeedback((turnOn ? 'Starting ' : 'Stopping ') + btn.dataset.cat + '…');
    await fetch(API + '/basic_toggle?cat=' + encodeURIComponent(btn.dataset.cat)
                + '&mode=' + (turnOn ? 'add' : 'remove'));
    if (turnOn) {
      moodSessionActive = false;   // like toggleBox: launching boxes ends the implicit mood session
      // Basic view: an actuator is a switch — if the box fill left playback idle
      // (box_action only fills the tracklist), start playing. NOTE: from a stale
      // 'paused' state with no current track, a bare play() does nothing — target
      // the current tlid, or the first tracklist row, explicitly.
      try {
        const st = (await rpc('core.playback.get_state'))?.result;
        if (st !== 'playing') {
          const cur = (await rpc('core.playback.get_current_tl_track'))?.result;
          if (cur && cur.tlid != null) {
            await rpc('core.playback.play', {tlid: cur.tlid});
          } else {
            const tl = (await rpc('core.tracklist.get_tl_tracks'))?.result || [];
            if (tl.length) { resetProgress(); await rpc('core.playback.play', {tlid: tl[0].tlid}); }
          }
        }
      } catch(e) {}
    }
  } catch(e) { setFeedback('Box error'); }
  btn.disabled = false;
  await refreshBasicToggles();
  refreshBoxStates();   // sync the hidden full-view buttons too (keeps autoBoxActive right)
  setTimeout(refreshNowPlaying, 800);
  setTimeout(refreshNowPlaying, 3000);
}

function initBasicView() {
  document.querySelectorAll('#basic-toggles .basic-toggle').forEach(btn =>
    btn.addEventListener('click', () => toggleBasicCat(btn)));
  document.getElementById('basic-all')?.addEventListener('click', (e) => toggleBasicAll(e.currentTarget));
  // Opening level — snaps to the 3 detents (focused/regular/crazy), same
  // interaction pattern as Mood; same underlying discover_level(0-10) value.
  makeDraggable('bdl', v => {
    const i = Math.round(v * (BASIC_DL_LEVELS.length - 1));
    appState.dl = BASIC_DL_LEVELS[i][1];
    setBasicDlDial(i);
    setDial('dl', appState.dl / 10);           // keep the (hidden) full dial in sync
  });
  // Mood — snaps to the 5 detents; sets energy+valence to the detent's pair.
  makeDraggable('bmood', v => {
    const i = Math.round(v * (BASIC_MOODS.length - 1));
    const [, e, val] = BASIC_MOODS[i];
    appState.energy = e; appState.valence = val;
    setBasicMoodDial(i);
    setDial('energy', e); setDial('valence', val);   // keep hidden full dials in sync
  });
  setBasicDlDial(basicDlIndex());
  setBasicMoodDial(basicMoodIndex());
  refreshBasicToggles();
  setInterval(refreshBasicToggles, 60000);
  // In-place view switch (SPA): keep the page — and the Snapcast stream, Web
  // Audio unlock, WS — alive; a full navigation would force a reconnect + a new
  // "tap to start audio" gesture on mobile.
  document.getElementById('link-basic')?.addEventListener('click', (e) => { e.preventDefault(); switchView(true); });
  document.getElementById('link-full')?.addEventListener('click', (e) => { e.preventDefault(); switchView(false); });
  window.addEventListener('popstate', () => switchView(/\/basic\/?$/.test(location.pathname), false));
}

function switchView(toBasic, push = true) {
  if (toBasic === isBasic()) return;
  document.documentElement.classList.toggle('basic', toBasic);
  try { localStorage.setItem('o2m-view', toBasic ? 'basic' : 'full'); } catch (e) {}
  if (push) history.pushState({}, '', toBasic ? '/basic' : '/mood?full=1');
  if (toBasic) {
    // Sync the basic controls with the current state on entry.
    setBasicDlDial(basicDlIndex());
    setBasicMoodDial(basicMoodIndex());
    refreshBasicToggles();
  } else {
    // Entering full. Default to the Tracklist panel scrolled to the current
    // track — UNLESS the user has already chosen a panel in full view this
    // session (_fullPanelTouched), in which case that prior state is preserved
    // (the DOM keeps the open panel across in-place switches). No-op visually on
    // desktop (.open only matters in the ≤699px accordion CSS).
    if (!_fullPanelTouched) {
      document.querySelectorAll('#main-cols .collapsible').forEach(p =>
        p.classList.toggle('open', p.id === 'tracklist-col'));
      lastScrolledTlid = null;   // force renderTracklist / the scroll below to re-center
      requestAnimationFrame(() => {
        const cur = document.querySelector('#tracklist-wrap .tl-item.current');
        if (cur) scrollTracklistToCurrent(cur);
      });
    }
  }
  try { fitHeroTitle(); } catch (e) {}
}
let _fullPanelTouched = false;   // set once the user opens an accordion panel in full view

/* ── Mopidy RPC ── */
// ─── Mopidy WebSocket (real-time, Iris-style) ───────────────────────────────
// RPCs go over the WS when it's open → no more POST /api/mopidy_rpc (quieter
// logs) and Mopidy events arrive via push (no more 1/s polling). Automatic
// fallback to the HTTP proxy /api/mopidy_rpc when the WS is unavailable.
let mopidyWsUrl = null, mopidyWS = null, wsReqId = 1;
const wsPending = new Map();
let _wsReadyResolve = null;
const wsReady = new Promise(res => { _wsReadyResolve = res; });   // résolu à la 1re ouverture (ou si pas de WS)
function _markWsReady() { if (_wsReadyResolve) { _wsReadyResolve(); _wsReadyResolve = null; } }
function connectMopidyWS() {
  if (!mopidyWsUrl) { _markWsReady(); return; }   // pas de WS configuré → ne bloque pas l'init
  let ws;
  try { ws = new WebSocket(mopidyWsUrl); } catch (e) { _markWsReady(); return; }
  mopidyWS = ws;
  ws.addEventListener('open', _markWsReady);
  ws.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.id != null && wsPending.has(m.id)) {
      const p = wsPending.get(m.id); wsPending.delete(m.id); clearTimeout(p.t); p.resolve(m);
    } else if (m.event) { onMopidyEvent(m); }
  });
  ws.addEventListener('close', () => {
    if (mopidyWS === ws) mopidyWS = null;
    setTimeout(connectMopidyWS, 3000);          // auto-reconnect
  });
  ws.addEventListener('error', () => { try { ws.close(); } catch (_) {} });
}
function wsRpc(method, params) {
  return new Promise((resolve) => {
    const id = wsReqId++;
    const t = setTimeout(() => { if (wsPending.has(id)) { wsPending.delete(id); resolve(null); } }, 5000);
    wsPending.set(id, { resolve, t });
    try { mopidyWS.send(JSON.stringify({ jsonrpc: '2.0', id, method, params })); }
    catch (e) { wsPending.delete(id); clearTimeout(t); resolve(null); }
  });
}
async function rpc(method, params = {}) {
  if (mopidyWS && mopidyWS.readyState === 1) {        // 1 = OPEN
    const r = await wsRpc(method, params);
    if (r) return r;                                  // otherwise HTTP fallback below
  }
  try {
    const r = await fetch(API + '/mopidy_rpc', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc: '2.0', id: 1, method, params})
    });
    return await r.json();
  } catch(e) { return null; }
}

/* ── Controls ── */
let currentDurationMs = 0;

document.getElementById('btn-play').addEventListener('click', async () => {
  const isPlaying = document.getElementById('btn-play').dataset.state === 'playing';
  if (isPlaying) {

  }

});
/* Optimistic skip: paint the destination track's name/artist IMMEDIATELY from the
   tracklist we already hold, then let the server confirm (WS event + refresh). The
   UI feels instant instead of waiting a full network round-trip. */
function optimisticSkip(delta) {
  const i = matrixTlItems.findIndex(it => it.tlid === currentTlid);
  const dest = i >= 0 ? matrixTlItems[i + delta] : null;
  if (!dest) return;
  document.getElementById('track-name').textContent = dest.name || '—';
  document.getElementById('hero-title').textContent = dest.name || '';
  const aa = document.getElementById('artist-name');
  if (aa) aa.textContent = dest.artist || '—';
  fitHeroTitle();
}
document.getElementById('btn-next').addEventListener('click', async () => {
  resetProgress();
  optimisticSkip(1);
  await rpc('core.playback.next');
  refreshNowPlaying();
});
document.getElementById('btn-prev').addEventListener('click', async () => {
  resetProgress();
  optimisticSkip(-1);
  await rpc('core.playback.previous');
  refreshNowPlaying();
});

/* ── Now playing + tracklist ── */
function msToMin(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function imageUrl(uri) {
  if (!uri) return '';
  if (uri.startsWith('http')) return uri;
  return API + '/mopidy_image?uri=' + encodeURIComponent(uri);
}

// Signature of the rendered list (tlids + uris). Lets us skip the full DOM
// rebuild when refreshNowPlaying fires but the list content is unchanged — which
// is the common case (10s safety net, play/pause, spurious tracklist_changed).
let lastTracklistSig = null;

// Lightweight update when only the active track moved within the same list:
// move the `.current` class + eq-icon instead of wiping and rebuilding the DOM.
/* Shared track-row markup — the single pattern reused by the tracklist AND the
   object modal (album/artist). Returns the row inner HTML:
   number (or eq-icon) · name + artist (+ optional status) · duration · info badge. */
// Options trigger: a plus-in-circle (replaces the former info ⓘ) — same circular
// footprint, used for every row's actions menu (tracklist, search, object lists).
const TL_INFO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
const CHEVRON_SVG = '<svg class="obj-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
const ICON_PLAYNEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>';
const ICON_PLAYNOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
const ICON_REMOVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>';
const ICON_DETAILS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
function trackRowInnerHTML({ indexLabel = '', name = '', artist = '', artistUri = '', uri = '', durText = '', statusHtml = '', isCurrent = false, kind = '', image = '' }) {
  // Visual in the leading slot: eq-icon if current, else a thumbnail when the
  // item has one (album/artist/box cover), else the index number.
  const numHtml = isCurrent ? '<span class="eq-icon"><i></i><i></i><i></i></span>'
    : (image ? `<img class="tl-thumb" src="${objEsc(image)}" alt="" loading="lazy">` : indexLabel);
  const aCls = 'tl-artist' + (artistUri ? ' obj-link' : '');
  const aAttr = artistUri ? ` data-artist-uri="${objEsc(artistUri)}"` : '';
  // data-kind lets the shared ⓘ handler build a kind-aware menu (track vs
  // artist/album/radio: the latter get Play next/now over the object's tracks +
  // "See details"). Absent = plain track (tracklist, detail track lists).
  const infoAttr = uri ? ` data-uri="${objEsc(uri)}"${kind ? ` data-kind="${objEsc(kind)}"` : ''}` : '';
  return `<div class="tl-num">${numHtml}</div>`
    + `<div class="tl-texts"><div class="tl-name">${objEsc(name || '?')}</div>`
    + `<div class="${aCls}"${aAttr}>${objEsc(artist)}</div>${statusHtml}</div>`
    + `<div class="tl-dur">${objEsc(durText)}</div>`
    + `<button class="tl-info" title="Track actions" aria-label="Track actions"${infoAttr}>${TL_INFO_SVG}</button>`;
}

function updateCurrentRow(wrap, activeTlid) {
  wrap.querySelectorAll('.tl-item').forEach((item, i) => {
    const num = item.querySelector('.tl-num');
    if (Number(item.dataset.tlid) === activeTlid) {
      item.classList.add('current');
      if (num && !num.querySelector('.eq-icon'))
        num.innerHTML = '<span class="eq-icon"><i></i><i></i><i></i></span>';
    } else {
      item.classList.remove('current');
      if (num && num.querySelector('.eq-icon'))
        num.textContent = String(i + 1).padStart(2, '0');
    }
  });
  const cur = wrap.querySelector('.tl-item.current');
  if (cur && activeTlid !== lastScrolledTlid) {
    lastScrolledTlid = activeTlid;
    requestAnimationFrame(() => scrollTracklistToCurrent(cur));
  }
}

function renderTracklist(tracks, activeTlid) {
  const wrap = document.getElementById('tracklist-wrap');
  const count = document.getElementById('tracklist-count');
  currentTracklistLength = tracks.length;

  const sig = tracks.map(({tlid, track}) => tlid + ':' + (track?.uri || '')).join('|');
  if (sig === lastTracklistSig) {
    // Same list — at most the current row changed. No wipe, no re-fetch.
    updateCurrentRow(wrap, activeTlid);
    return;
  }
  lastTracklistSig = sig;

  wrap.innerHTML = '';
  count.textContent = tracks.length ? `${tracks.length} tracks` : '';
  let scrollTarget = null;
  tracks.forEach(({tlid, track}, i) => {
    registerTrackMeta(track);   // so the row's "Copy link" can resolve a podcast episode page
    const item = document.createElement('div');
    item.className = 'tl-item' + (tlid === activeTlid ? ' current' : '');
    item.dataset.tlid = tlid;
    const cached = getCachedStatus(track.uri);
    const statusCls = cached ? (STATUS_CLASS[(cached.split(' - ')[0]||'').trim().toLowerCase()] || '') : '';
    const statusHtml = `<div class="tl-status ${statusCls}" data-uri="${(track.uri||'').replace(/"/g,'&quot;')}">${cached ? formatStatus(cached) : ''}</div>`;
    item.innerHTML = trackRowInnerHTML({
      indexLabel: String(i + 1).padStart(2, '0'),
      name: track.name,
      artist: (track.artists || []).map(a => a.name).join(', '),
      artistUri: (track.artists || [])[0]?.uri || '',
      uri: track.uri,
      durText: msToMin(track.length),
      statusHtml,
      isCurrent: tlid === activeTlid,
    });
    item.addEventListener('click', (e) => {
      // Info badge → row actions menu.
      const ib = e.target.closest('.tl-info');
      if (ib) { e.stopPropagation(); openActionMenu(ib, trackMenuItems(ib.dataset.uri || track.uri, tlid)); return; }
      // Clicking the artist name opens the artist detail instead of playing the row.
      const al = e.target.closest('.tl-artist[data-artist-uri]');
      if (al) { e.stopPropagation(); openArtist(al.dataset.artistUri, al.textContent.trim()); return; }
      resetProgress();
      rpc('core.playback.play', {tlid}).then(() => setTimeout(refreshNowPlaying, 200));
    });
    wrap.appendChild(item);
    if (tlid === activeTlid) scrollTarget = item;
  });
  // Auto-scroll vers le titre en cours (uniquement quand il change, pour ne pas gêner)
  if (scrollTarget && activeTlid !== lastScrolledTlid) {
    lastScrolledTlid = activeTlid;
    requestAnimationFrame(() => scrollTracklistToCurrent(scrollTarget));
  }
  fetchTracklistStatuses(tracks);
}

/* Remonte jusqu'au premier ancêtre réellement scrollable (desktop = .col,
   mobile = #scroll-area). */
function scrollableAncestor(el) {
  for (let n = el && el.parentElement; n && n !== document.body; n = n.parentElement) {
    const oy = getComputedStyle(n).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
  }
  return null;
}

/* Cale le titre courant en haut de son conteneur scrollable, sous l'en-tête
   sticky s'il y en a un (no-op si rien ne scrolle) */
function scrollTracklistToCurrent(item) {
  const container = scrollableAncestor(item);
  if (!container) return;
  const cRect = container.getBoundingClientRect();
  const iRect = item.getBoundingClientRect();
  const header = container.querySelector('#tracklist-label');
  const topPad = (header && getComputedStyle(header).position === 'sticky')
    ? header.getBoundingClientRect().height
    : 0;
  const offset = (iRect.top - cRect.top) - topPad - 6;
  container.scrollBy({ top: offset, behavior: 'smooth' });
}

const STATUS_CLASS = {
  library: 's-library', normal: 's-library',
  favorites: 's-favorites', incoming: 's-incoming',
  new: 's-new', trash: 's-trash', hidden: 's-hidden', podcast: 's-podcast',
};

/* ── Status helpers ── */
const statusCache = new Map(); // uri → {text, ts}
const STATUS_TTL  = 5 * 60 * 1000;

function getCachedStatus(uri) {
  const e = statusCache.get(uri);
  if (!e || Date.now() - e.ts > STATUS_TTL) return null;
  return e.text;
}

function formatStatus(raw) {
  if (!raw || raw === 'Manual') return '';
  const parts = raw.split(' - ');
  const ot    = parts[0] || '';
  const score = parts[1] || '';
  let lib     = (parts[2] || '').replace(/^(playlist|album|artist):/, '').trim();
  if (score && lib) return lib.startsWith('(')
    ? `${ot} · ${score} ${lib}`
    : `${ot} · ${score} · ${lib}`;
  if (score) return `${ot} · ${score}`;
  return ot;
}

function applyStatusEl(el, raw) {
  const ot  = (raw || '').split(' - ')[0].trim().toLowerCase();
  const cls = STATUS_CLASS[ot] || '';
  el.textContent = formatStatus(raw);
  el.className   = 'tl-status' + (cls ? ' ' + cls : '');
}

async function fetchStatus(uri) {
  const cached = getCachedStatus(uri);
  if (cached !== null) return cached;
  try {
    const r = await fetch(API + '/track_status?uri=' + encodeURIComponent(uri));
    const t = r.ok ? await r.text() : '';
    statusCache.set(uri, { text: t, ts: Date.now() });
    return t;
  } catch(e) { return ''; }
}

function updateStatusBadge(text) {
  const el = document.getElementById('track-status-badge');
  const ot = (text || '').split(' - ')[0].trim().toLowerCase();
  el.textContent = formatStatus(text);
  el.className   = STATUS_CLASS[ot] || '';
}

async function fetchTracklistStatuses(tracks) {
  const CONCURRENCY = 4;
  for (let i = 0; i < tracks.length; i += CONCURRENCY) {
    await Promise.all(
      tracks.slice(i, i + CONCURRENCY).map(async ({ track }) => {
        if (!track?.uri) return;
        const text = await fetchStatus(track.uri);
        const el = document.querySelector(`.tl-status[data-uri="${CSS.escape(track.uri)}"]`);
        if (el && text) applyStatusEl(el, text);
      })
    );
  }
}

async function refreshVolume() {
  const r = await rpc('core.mixer.get_volume');
  const vol = r?.result ?? null;
  if (vol === null) return;
  const slider = document.getElementById('volume-slider');
  const val = document.getElementById('volume-val');
  slider.value = vol;
  slider.style.setProperty('--vol-pct', vol + '%');
  val.textContent = vol + '%';
  const volSvg = vol === 0
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
    : vol < 50
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  document.getElementById('volume-icon').innerHTML = volSvg;
}

async function refreshNowPlaying() {
  const [curR, stateR, tlR] = await Promise.all([
    rpc('core.playback.get_current_tl_track'),
    rpc('core.playback.get_state'),
    rpc('core.tracklist.get_tl_tracks'),
  ]);

  const tlt   = curR?.result;
  const track = tlt?.track;
  const tlid  = tlt?.tlid ?? null;
  const playing = stateR?.result === 'playing';
  const tracks  = tlR?.result || [];

  currentTlid      = tlid;
  matrixCurUri     = track?.uri ?? null;
  registerTrackMeta(track);   // so the "More" menu's Copy link can resolve a podcast episode page
  currentTrackObj  = track || null;
  currentDurationMs = track?.length || 0;
  document.getElementById('prog-duration').textContent = msToMin(currentDurationMs);
  matrixTlItems  = tracks.map(({tlid: id, track: t}) => ({
    uri: t?.uri, tlid: id,
    name:   t?.name || '',
    artist: (t?.artists || []).map(a => a.name).join(', '),
  }));
  const trackChanged = matrixCurUri !== lastNpUri;
  lastNpUri = matrixCurUri;
  setClock((await rpc('core.playback.get_time_position'))?.result ?? 0, playing);

  fetchTrackFeatures([matrixCurUri, ...matrixTlItems.map(i => i.uri)].filter(Boolean));
  if (trackChanged) fetchAndRenderTrackTags(matrixCurUri);

  const playBtn = document.getElementById('btn-play');
  const playState = playing ? 'playing' : 'paused';
  // Only rewrite the SVG when the state actually flips — rewriting innerHTML on
  // every refresh (10s safety net + each WS event) repaints the button and makes
  // it flicker during playback.
  if (playBtn.dataset.state !== playState) {
    playBtn.dataset.state = playState;
    playBtn.innerHTML = playing
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  }

  if (track) {
    // For radios the mopidy "track" IS the stream; its header (title/artist/album)
    // is driven live by maybeShowRadioTitle. Skip the raw stream-name writes here so
    // the title doesn't flip stream-name↔song on every refresh (that was the flicker).
    if (!_isStreamUri(track.uri)) {
      document.getElementById('track-name').textContent  = track.name || '—';
      document.getElementById('hero-title').textContent   = track.name || '';
      fitHeroTitle();
      const artistEl = document.getElementById('artist-name');
      artistEl.textContent = (track.artists || []).map(a => a.name).join(', ') || '—';
      artistEl.classList.toggle('obj-link', !!((track.artists || [])[0]?.uri));
      const albumEl = document.getElementById('album-name');
      if (albumEl) albumEl.textContent = (track.album && track.album.uri) ? (track.album.name || '') : '';
    }
    // Radio → header artist/album inert (see .radio-np CSS).
    document.getElementById('now-playing')?.classList.toggle('radio-np', _isStreamUri(track.uri));
    updateHeroAccent(track.uri);

    // Radios: live now-playing (song title on line 1, "STATION · artist" on line 2).
    maybeShowRadioTitle(track);

    // O2M metadata (status badge, cover, details): only on track change —
    // avoids /track_status and /track_info being refetched every 10s.
    // Fetches run in PARALLEL (they were sequential → the cover lagged behind).
    if (trackChanged) {
      fetch(API + '/track_status?uri=' + encodeURIComponent(track.uri))
        .then(r => r.ok ? r.text() : '').then(updateStatusBadge)
        .catch(() => updateStatusBadge(''));
      renderTrackDetails(track.uri);
      rpc('core.library.get_images', {uris: [track.uri]}).then(imgR => {
        const imgs = imgR?.result?.[track.uri] || [];
        const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
        lastCoverUrl = best ? imageUrl(best.uri || best) : '';
        setCoverSmooth(lastCoverUrl || placeholderForUri(track.uri));
        updateMediaSession(track, playing, lastCoverUrl);
        prefetchNextCover();
      }).catch(() => {});
    }
    updateMediaSession(track, playing, lastCoverUrl);
  } else {
    document.getElementById('cover').src = placeholderForUri(null);
    document.getElementById('hero-title').textContent = '';
    fitHeroTitle();
    updateStatusBadge('');
    updateMediaSession(null, playing, '');
    renderTrackDetails(null);
  }

  renderTracklist(tracks, tlid);
  if (typeof syncBasicFromNowPlaying === 'function') syncBasicFromNowPlaying();   // basic status line: tracks + boxes
}

/* ── Media Session API (Bluetooth / notification controls) ── */
function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const setH = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e) {} };
  setH('play',          async () => { await rpc('core.playback.resume');   setTimeout(refreshNowPlaying, 300); });
  setH('pause',         async () => { await rpc('core.playback.pause');    setTimeout(refreshNowPlaying, 300); });
  setH('previoustrack', async () => { resetProgress(); await rpc('core.playback.previous'); setTimeout(refreshNowPlaying, 300); });
  setH('nexttrack',     async () => { resetProgress(); await rpc('core.playback.next');     setTimeout(refreshNowPlaying, 300); });
  setH('seekto', async (d) => {
    if (d && d.seekTime != null) {
      await rpc('core.playback.seek', { time_position: Math.round(d.seekTime * 1000) });
      setTimeout(refreshNowPlaying, 300);
    }
  });
}

function updateMediaSession(track, isPlaying, coverUrl) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  if (track) {
    // Only rebuild metadata when the track or cover actually changes. Assigning a
    // new MediaMetadata makes Android re-fetch the artwork and redraw the media
    // notification — doing it on every 10s refresh flashes the system controls.
    const sig = (track.uri || '') + '|' + (coverUrl || '');
    if (sig !== _mediaMetaSig) {
      _mediaMetaSig = sig;
      navigator.mediaSession.metadata = new MediaMetadata({
        title:  track.name || '',
        artist: (track.artists || []).map(a => a.name).join(', ') || '',
        album:  track.album?.name || '',
        artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [],
      });
    }
  } else {
    _mediaMetaSig = null;
  }
}
let _mediaMetaSig = null;

/* ── Media Session anchor ─────────────────────────────────────────────────────
   Snapcast plays through WebAudio (gainNode → ctx.destination, unchanged). WebAudio
   alone does NOT create an OS media session, and an <audio srcObject=MediaStream>
   is treated as "communication" audio → no notification on Android. So we loop a
   real audio file in an <audio> element: Chrome/Android recognizes it as active
   "content" media → metadata + controls surface. The file is named silence.wav but
   actually carries a faint 40 Hz tone at -54 dBFS (acoustically imperceptible):
   Chrome exempts fully *silent* players from the "audio becoming noisy" auto-pause
   (BT/headphone removal), and we rely on that pause to detect route loss. */
let mediaAnchorEl = null;
let _anchorIntentionalPause = false;   // set when WE pause the anchor (vs. the OS)

function _ensureMediaAnchor() {
  if (!mediaAnchorEl) {
    mediaAnchorEl = document.createElement('audio');
    mediaAnchorEl.id = 'media-anchor';
    mediaAnchorEl.src = '/static/silence.wav';
    mediaAnchorEl.loop = true;
    mediaAnchorEl.preload = 'auto';
    mediaAnchorEl.setAttribute('aria-hidden', 'true');
    mediaAnchorEl.style.display = 'none';
    // Auto-pause on "audio becoming noisy": when a Bluetooth/wired output is
    // removed (or audio focus is lost to a call/another app), the OS pauses this
    // <audio>. WebAudio (the Snapcast stream) does NOT honor this, so we mirror it
    // to the server. Note: Chrome only auto-pauses *audible* players, which is why
    // silence.wav actually carries a faint -54dBFS tone (see its generator note).
    mediaAnchorEl.addEventListener('pause', () => {
      if (_anchorIntentionalPause) { _anchorIntentionalPause = false; return; }
      console.log('[media-anchor] external pause');
      pauseFromRouteLoss('output lost');
    });
    document.body.appendChild(mediaAnchorEl);
  }
  return mediaAnchorEl;
}

function startMediaAnchor() {
  const el = _ensureMediaAnchor();
  // Doit être appelé dans un geste utilisateur (cas via _snapStart / armMediaAnchor)
  if (!el.paused) return;
  el.play().then(() => console.log('[media-anchor] playing'))
           .catch(e => console.warn('[media-anchor] play blocked', e));
}

function stopMediaAnchor() {
  // Only arm the flag when a pause event will actually fire (element is playing),
  // otherwise it would stay set and swallow the next genuine external pause.
  if (mediaAnchorEl && !mediaAnchorEl.paused) {
    _anchorIntentionalPause = true;
    try { mediaAnchorEl.pause(); } catch(e) {}
  }
}

/* Shared reaction to "the audio route died" (BT/headphones removed, audio focus
   lost). Fed by two detectors: the media-anchor pause event above and the
   devicechange watcher below. Only acts when this device is the audio sink
   (snapPlayer active) and we believe playback is running. */
function pauseFromRouteLoss(source) {
  if (!snapPlayer || !progPlaying) return;
  console.log('[route-loss] ' + source + ' → pausing server');
  rpc('core.playback.pause').catch(() => {});
  try { snapPlayer.stop(); } catch (e) {}
  snapPlayer = null;
  _releaseWakeLock();
  _snapBtnOff();
  setFeedback('Paused (' + source + ')');
  setTimeout(refreshNowPlaying, 300);
}

/* Publish the playback header's height as --sheet-top. Every bottom sheet (track
   details, object modal) anchors its top edge there, so they all open at the same
   line — right under the controls — with the same height, instead of each one
   sizing itself from its content. Kept in sync because the header's height changes
   with the theme, the track (wrapped titles) and orientation. */
function watchSheetTop() {
  const tz = document.getElementById('top-zone');
  if (!tz) return;
  const publish = () =>
    document.documentElement.style.setProperty('--sheet-top', tz.offsetHeight + 'px');
  publish();
  try { new ResizeObserver(publish).observe(tz); } catch (e) {}
  window.addEventListener('resize', publish);
  window.addEventListener('orientationchange', () => setTimeout(publish, 200));
}

/* Fallback detector: Bluetooth audio devices almost always expose a microphone
   (HFP), so unpairing/powering one off fires mediaDevices.devicechange with a
   shorter device list. Counting works without mic permission (entries are just
   unlabeled). We react only to a *shrinking* list — connecting a device grows it. */
function watchAudioDevices() {
  const md = navigator.mediaDevices;
  if (!md || !md.enumerateDevices || !md.addEventListener) return;
  let lastCount = null;
  const countDevices = () => md.enumerateDevices()
    .then(ds => ds.filter(d => d.kind === 'audioinput' || d.kind === 'audiooutput').length)
    .catch(() => null);
  countDevices().then(n => { lastCount = n; });
  md.addEventListener('devicechange', async () => {
    const n = await countDevices();
    const prev = lastCount;
    lastCount = n;
    console.log('[route-loss] devicechange: audio devices ' + prev + ' → ' + n);
    if (n != null && prev != null && n < prev) pauseFromRouteLoss('device removed');
  });
}

/* Arme l'ancre dès le 1er geste utilisateur, indépendamment de Snapcast :
   la session média OS (titre/pochette/contrôles BT) doit remonter aussi en
   mode « télécommande » desktop (comme Iris), même sans flux Snapcast local. */
function armMediaAnchor() {
  const onGesture = () => {
    startMediaAnchor();
    setTimeout(refreshNowPlaying, 400);  // pousse les métadonnées une fois la session active
  };
  document.addEventListener('click',      onGesture, { once: true });
  document.addEventListener('touchstart', onGesture, { once: true, passive: true });
  document.addEventListener('keydown',    onGesture, { once: true });
}

/* ── Colonne détails du morceau (read-only) ── */
let detailsUri = null;            // uri actuellement affichée (détecte le changement)
let favLocal = false, favSpotify = null;  // états favori courants
let editablePlaylists = null;     // cache des playlists possédées (éditables)

async function loadEditablePlaylists() {
