/* ══ Offline — the device holds the audio and plays it itself ═══════════════
   Everywhere else on this page the browser is a remote control: Mopidy plays,
   Snapcast streams the result here, and every button is an RPC. Offline turns
   that around. The device keeps its own copies of what it could download and,
   while the toggle is on, plays them through a plain <audio> element with the
   server out of the loop entirely — which is the only arrangement that still
   works in a tunnel.

   What can be held is narrow, and saying so is not a caveat but the design:
   Spotify cannot be downloaded (librespot decrypts into GStreamer, never into
   a file), so a music track is only available once spotdl has fetched a file
   for it on the server. `/api/offline/plan` queues exactly that and reports the
   track as `pending` until it lands. Spoken content is always available — an
   episode is an mp3 behind a feed. See o2m_core/offline.py.

   The switch is MANUAL on purpose. Two players exist; you always know which one
   has the hand, and losing the network is not a reason for the page to start
   playing something else behind your back.

   Blobs live in IndexedDB rather than the Cache API: Cache needs a secure
   context, and the dev instances are served over plain HTTP, so the feature
   would have been untestable exactly where it is developed. */

const OFF_QUOTA_KEY = 'o2m-offline-quota-mb';
const OFF_INV_KEY   = 'o2m-offline-inv';
const OFF_PLAYS_KEY = 'o2m-offline-plays';
const OFF_POS_KEY   = 'o2m-offline-pos';
const OFF_DEFAULT_QUOTA_MB = 1024;
const OFF_DB = 'o2m-offline', OFF_STORE = 'audio';

const OFF = {
  on: false,            // the local player has the hand
  queue: [],            // [{uri, name, artist, album, length}]
  i: -1,                // index in queue
  el: null,             // the <audio> element
  url: null,            // current object URL (revoked on every change)
  inv: null,            // uri -> metadata, lazily read from localStorage
  pending: new Map(),   // uri -> meta, waiting on spotdl
  downloading: false,
  loggedAt: -1,         // queue index whose play has already been recorded
  posAt: 0,             // last bookmark write, ms — throttles the checkpoint
  pass: new Set(),      // downloaded during the pass in progress — never evicted by it
};

const OFF_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.9A7 7 0 0 0 16 4a5 5 0 0 0-4.5-3A6 6 0 0 0 6 9"/><path d="M6 9a5 5 0 0 0 0 10h12"/><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/></svg>`;

/* ── Blob store (IndexedDB) ───────────────────────────────────────────────── */
let _offDbP = null;
function offDb() {
  if (_offDbP) return _offDbP;
  _offDbP = new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(OFF_DB, 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(OFF_STORE)) d.createObjectStore(OFF_STORE);
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
  return _offDbP;
}
function offTx(mode, fn) {
  return offDb().then(d => new Promise((res, rej) => {
    const tx = d.transaction(OFF_STORE, mode);
    let req;
    try { req = fn(tx.objectStore(OFF_STORE)); } catch (e) { rej(e); return; }
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror    = () => rej(tx.error);
    tx.onabort    = () => rej(tx.error);
  }));
}
const offBlobPut = (uri, blob) => offTx('readwrite', st => st.put(blob, uri));
const offBlobGet = (uri)       => offTx('readonly',  st => st.get(uri));
const offBlobDel = (uri)       => offTx('readwrite', st => st.delete(uri));

/* ── Inventory and quota ──────────────────────────────────────────────────── */
function offInv() {
  if (OFF.inv) return OFF.inv;
  try { OFF.inv = JSON.parse(_lsGet(OFF_INV_KEY) || '{}') || {}; } catch (e) { OFF.inv = {}; }
  return OFF.inv;
}
function offInvSave() {
  try { localStorage.setItem(OFF_INV_KEY, JSON.stringify(OFF.inv || {})); } catch (e) {}
}
function offQuotaMB() {
  const v = parseInt(_lsGet(OFF_QUOTA_KEY), 10);
  return Number.isFinite(v) && v > 0 ? v : OFF_DEFAULT_QUOTA_MB;
}
function offQuota() { return offQuotaMB() * 1024 * 1024; }
function offUsed() {
  return Object.values(offInv()).reduce((s, m) => s + (m.bytes || 0), 0);
}
function offHas(uri) { return !!offInv()[uri]; }
function offSizeText(b) {
  if (b >= 1024 * 1024 * 1024) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1024 * 1024) return Math.round(b / 1048576) + ' MB';
  return Math.round(b / 1024) + ' kB';
}

async function offForget(uri) {
  try { await offBlobDel(uri); } catch (e) {}
  delete offInv()[uri];
  offInvSave();
}
async function offClearAll() {
  for (const u of Object.keys(offInv())) { try { await offBlobDel(u); } catch (e) {} }
  OFF.inv = {}; offInvSave();
  offRenderBadges(); offPaintToggle();
}

/* Evict least-recently-used until `bytes` fit, never touching what is queued to
   play — freeing space by deleting the next track is not freeing space. */
async function offMakeRoom(bytes) {
  const inv = offInv();
  let free = offQuota() - offUsed();
  if (free >= bytes) return true;
  // Protected: what is queued to play, and what this very pass downloaded —
  // freeing space by deleting the track we fetched a second ago is not freeing
  // space, it is a loop.
  const keep = new Set([...OFF.queue.map(t => t.uri), ...OFF.pass]);
  const victims = Object.keys(inv)
    .filter(u => !keep.has(u))
    .sort((a, b) => (inv[a].used || inv[a].at || 0) - (inv[b].used || inv[b].at || 0));
  for (const u of victims) {
    if (free >= bytes) break;
    free += inv[u].bytes || 0;
    await offForget(u);
  }
  return free >= bytes;
}

/* ── Downloading ──────────────────────────────────────────────────────────── */
/* Returns 'ok' | 'quota' | 'fail' rather than a boolean: a full allowance is
   not a failed download, and the two call for different reactions — one stops
   the pass and asks the person a question, the other just moves on. */
async function offStore(meta) {
  const uri = meta.uri;
  if (!uri || offHas(uri)) return 'ok';
  let blob;
  try {
    const r = await fetch(API + '/audio?uri=' + encodeURIComponent(uri));
    if (!r.ok) return 'fail';
    blob = await r.blob();
  } catch (e) { return 'fail'; }
  if (!blob || !blob.size) return 'fail';
  if (blob.size > offQuota()) return 'quota';
  if (!(await offMakeRoom(blob.size))) return 'quota';
  try { await offBlobPut(uri, blob); } catch (e) { return 'quota'; }   // QuotaExceededError
  offInv()[uri] = {
    name: meta.name || '', artist: meta.artist || '', album: meta.album || '',
    length: meta.length || meta.srvLength || 0, kind: meta.kind || 'music',
    adSkip: meta.adSkip || 0,
    bytes: blob.size, at: Date.now(),
  };
  offInvSave();
  // Seed the bookmark from the server, once, at download time: a half-heard
  // episode must not restart from zero just because the network went away.
  // Spoken only (music does not resume), never over a local bookmark — that
  // one is by definition the newer of the two — and marked as already synced,
  // since it came FROM the server and sending it straight back would count a
  // read for a track nobody has played here.
  if (meta.kind === 'spoken' && meta.position > 0 && !offPos()[uri]) {
    offPosSet(uri, meta.position, meta.length || meta.srvLength || 0, true);
  }
  OFF.pass.add(uri);
  return 'ok';
}

/* One download pass over a list of tracklist rows. Tracks the server does not
   hold yet are left in OFF.pending and re-checked on a timer — spotdl needs
   minutes, and the person should not have to press the button again. */
/* `retry` asks the server to have another go at tracks spotdl already failed
   on. Only a deliberate gesture sets it — arming offline, or the Settings
   button. The 60s pending re-check must NOT, or "give up" never happens and
   the same unfetchable tracks are re-downloaded for ever. */
async function offSync(items, { quiet = false, retry = false } = {}) {
  if (OFF.downloading) return;
  const list = (items || []).filter(t => t && t.uri && !offHas(t.uri));
  if (!list.length) {
    if (!quiet) setFeedback('Everything in the tracklist is already on this device');
    return;
  }
  OFF.downloading = true; offPaintToggle();
  OFF.pass = new Set();
  let got = 0, wait = 0, lost = 0, full = false;
  try {
    const r = await fetch(API + '/offline/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uris: list.map(t => t.uri), retry_failed: retry }),
    });
    const plan = await r.json();
    const by = {};
    (plan.items || []).forEach(i => { by[i.uri] = i; });
    for (const t of list) {
      const p = by[t.uri];
      if (!p) continue;
      if (p.state === 'pending') { OFF.pending.set(t.uri, t); wait++; continue; }
      OFF.pending.delete(t.uri);
      if (p.state !== 'ready') { lost++; continue; }
      const res = await offStore({ ...t, kind: p.kind, position: p.position || 0,
                                  srvLength: p.length || 0, adSkip: p.ad_skip || 0 });
      if (res === 'quota') { full = true; break; }
      if (res !== 'ok') continue;
      got++;
      if (OFF.on) offQueueAdd(t);          // what is playing grows as files land
      offRenderBadges(); offPaintToggle();
    }
  } catch (e) {
    // No network, or the server is gone. Nothing to sync and nothing to report:
    // being unreachable is the situation this whole feature is for.
  }
  OFF.downloading = false;
  offPaintToggle(); offRenderBadges();
  if (!quiet) {
    setFeedback(got + ' downloaded'
      + (wait ? ' · ' + wait + ' being fetched by the server' : '')
      + (lost ? ' · ' + lost + ' cannot be downloaded' : '')
      + (full ? ' · quota full (' + offQuotaMB() + ' MB), raise it in Settings' : ''));
  }
  offSchedulePendingCheck();
}

let _offPendTimer = null;
function offSchedulePendingCheck() {
  clearTimeout(_offPendTimer);
  if (!OFF.pending.size) return;
  _offPendTimer = setTimeout(() => {
    offSync([...OFF.pending.values()], { quiet: true });
  }, 60000);
}

/* ── Play log, replayed when the server is back ───────────────────────────── */
function offPlays() {
  try { return JSON.parse(_lsGet(OFF_PLAYS_KEY) || '[]') || []; } catch (e) { return []; }
}
function offPlaysSave(v) {
  try { localStorage.setItem(OFF_PLAYS_KEY, JSON.stringify(v.slice(-300))); } catch (e) {}
}
/* Bookmarks — "where I am in this track", one per uri, overwritten.
   Distinct from the play log on purpose. A completed play is an EVENT and
   appends; a position is a STATE and replaces. Keeping them in one list would
   have inflated read_count by one per checkpoint, since the server counts a
   read on every record it receives. */
function offPos() {
  if (OFF._pos) return OFF._pos;
  try { OFF._pos = JSON.parse(_lsGet(OFF_POS_KEY) || '{}') || {}; } catch (e) { OFF._pos = {}; }
  return OFF._pos;
}
function offPosSave() {
  try { localStorage.setItem(OFF_POS_KEY, JSON.stringify(OFF._pos || {})); } catch (e) {}
}
function offPosSet(uri, position, length, synced) {
  if (!uri) return;
  const at = new Date().toISOString();
  offPos()[uri] = { position: Math.max(0, Math.round(position || 0)),
                    length: Math.round(length || 0), at,
                    syncedAt: synced ? at : null };
  offPosSave();
}
function offPosClear(uri) { delete offPos()[uri]; offPosSave(); }

/* Write the bookmark for whatever is playing. Called on pause, on the way out
   of a track, when the page is hidden, and on a throttled tick — because the
   position that matters most is the one from the session nobody ended
   cleanly: a phone put in a pocket, a tab killed by the OS. */
function offCheckpoint(force) {
  const t = OFF.queue[OFF.i], el = OFF.el;
  if (!t || !el || !OFF.on) return;
  const now = Date.now();
  if (!force && now - OFF.posAt < 10000) return;
  OFF.posAt = now;
  offPosSet(t.uri, el.currentTime * 1000, t.length || el.duration * 1000 || 0);
}

function offLogPlay(finished) {
  const t = OFF.queue[OFF.i], el = OFF.el;
  if (!t || !el || !t.length) return;
  // 'ended' logs the play, then skips — and the skip would log the very same
  // track a second time, at the same position. One index, one record.
  if (OFF.loggedAt === OFF.i) return;
  OFF.loggedAt = OFF.i;
  const position = Math.round(finished ? t.length : el.currentTime * 1000);
  if (position / t.length < 0.05) return;        // an artefact, same rule as the server's
  const plays = offPlays();
  plays.push({ uri: t.uri, name: t.name, length: t.length, position,
               at: new Date().toISOString() });
  offPlaysSave(plays);
  // Finished: the bookmark has done its job and must go, or the episode would
  // resume ten seconds before its own end for ever.
  if (finished) offPosClear(t.uri); else offPosSet(t.uri, position, t.length);
  const m = offInv()[t.uri];
  if (m) { m.used = Date.now(); offInvSave(); }
}
async function offFlushPlays() {
  const plays = offPlays();
  const pos = offPos();
  // Only bookmarks that MOVED since the last successful flush. The server
  // counts a read on every record it receives, so re-sending an unchanged
  // position on each reconnection would quietly inflate read_count — and
  // read_count feeds popularity and the cooldown.
  const fresh = Object.keys(pos).filter(u => pos[u].at !== pos[u].syncedAt);
  const positions = fresh.map(u => ({ uri: u, name: (offInv()[u] || {}).name,
                                      length: pos[u].length,
                                      position: pos[u].position, at: pos[u].at }));
  if (!plays.length && !positions.length) return;
  try {
    const r = await fetch(API + '/offline/plays', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plays, positions }),
    });
    if (!r.ok) return;
    offPlaysSave([]);
    // Bookmarks are NOT cleared — they are state, and the device keeps needing
    // them to resume offline. They are marked as sent instead.
    fresh.forEach(u => { if (pos[u]) pos[u].syncedAt = pos[u].at; });
    offPosSave();
    console.log('[offline] ' + plays.length + ' plays and '
                + positions.length + ' positions synced');
  } catch (e) { /* still offline — they keep */ }
}

/* ── The queue: rule is the tracklist first, the whole device second ──────── */
function offBuildQueue() {
  const inv = offInv();
  const fromTl = (matrixTlItems || [])
    .filter(t => t.uri && inv[t.uri])
    .map(t => ({ uri: t.uri, name: t.name || inv[t.uri].name, album: t.album || '',
                 artist: t.artist || inv[t.uri].artist,
                 length: t.length || inv[t.uri].length || 0 }));
  if (fromTl.length) return fromTl;
  // The tracklist holds nothing we have (or holds nothing at all): fall back to
  // everything on the device, newest first. "Full" here is about the tracklist,
  // never about the quota.
  return Object.keys(inv)
    .sort((a, b) => (inv[b].at || 0) - (inv[a].at || 0))
    .map(u => ({ uri: u, name: inv[u].name, artist: inv[u].artist,
                 album: inv[u].album, length: inv[u].length || 0 }));
}
function offQueueAdd(t) {
  if (!t || !t.uri || OFF.queue.some(x => x.uri === t.uri)) return;
  OFF.queue.push({ uri: t.uri, name: t.name || '', artist: t.artist || '',
                   album: t.album || '', length: t.length || 0 });
  offRenderQueue();
  if (OFF.i < 0 && OFF.queue.length === 1) offPlayAt(0);   // first arrival starts it
}

/* ── The local player ─────────────────────────────────────────────────────── */
function offAudio() {
  if (OFF.el) return OFF.el;
  const el = document.createElement('audio');
  el.id = 'offline-audio';
  el.preload = 'auto';
  el.setAttribute('aria-hidden', 'true');
  el.style.display = 'none';
  // The clock is set at events only, never on timeupdate: setClock pushes the
  // OS position state, and doing that 4×/s makes the Android media controls
  // flicker (same reason pushPositionState is kept out of tickProgress).
  el.addEventListener('play',   () => { paintPlayState(true);  setClock(el.currentTime * 1000, true); });
  el.addEventListener('pause',  () => { paintPlayState(false); setClock(el.currentTime * 1000, false);
                                        offCheckpoint(true); });
  el.addEventListener('seeked', () => { setClock(el.currentTime * 1000, !el.paused);
                                        offCheckpoint(true); });
  el.addEventListener('timeupdate', () => offCheckpoint(false));   // throttled to 10s
  el.addEventListener('ended',  () => { offLogPlay(true); offSkip(1); });
  el.addEventListener('error',  () => { setFeedback('This file will not play'); offSkip(1); });
  document.body.appendChild(el);
  OFF.el = el;
  return el;
}

async function offPlayAt(i) {
  if (!OFF.queue.length) return;
  const t = OFF.queue[((i % OFF.queue.length) + OFF.queue.length) % OFF.queue.length];
  if (!t) return;
  if (OFF.i >= 0) offLogPlay(false);          // what was playing ends here
  OFF.i = OFF.queue.indexOf(t);
  OFF.loggedAt = -1;
  const blob = await offBlobGet(t.uri).catch(() => null);
  if (!blob) {
    // The inventory and the store disagreed — the row is a ghost. Drop it and
    // move on rather than stalling on a track that does not exist.
    await offForget(t.uri);
    OFF.queue = OFF.queue.filter(x => x.uri !== t.uri);
    offRenderQueue();
    return OFF.queue.length ? offPlayAt(OFF.i) : setFeedback('Nothing left on this device');
  }
  const el = offAudio();
  if (OFF.url) { try { URL.revokeObjectURL(OFF.url); } catch (e) {} }
  OFF.url = URL.createObjectURL(blob);
  el.src = OFF.url;
  offSeekOnStart(el, t);
  currentDurationMs = t.length || 0;
  document.getElementById('prog-duration').textContent = msToMin(currentDurationMs);
  offPaintNow(t);
  try { await el.play(); } catch (e) { setFeedback('Tap play to start'); }
}
/* The same two rules `track_started_event` applies on the server, so a track
   behaves identically whichever player has it: resume ten seconds before the
   saved position, or — on a genuinely fresh start — skip the pre-roll ad.
   Never both: a saved position already sits past the ad.
   `currentTime` cannot be set before the element knows its duration, hence
   loadedmetadata rather than an immediate assignment. */
function offSeekOnStart(el, t) {
  const inv = offInv()[t.uri] || {};
  // Spoken only, like `_is_spoken_uri` guards it on the server. A music track
  // played to the end carries read_position == its own duration — measured on
  // a real row — so honouring it for music would restart every favourite ten
  // seconds before its last note.
  const spoken = inv.kind === 'spoken';
  const bm = spoken ? offPos()[t.uri] : null;
  const saved = bm ? bm.position : 0;
  const len = t.length || bm?.length || 0;
  let target = 0;
  if (saved > 10000 && (!len || saved <= len)) target = Math.max(saved - 10000, 0);
  else if (saved > 10000 && len && saved > len) target = Math.max(len - 10000, 0);
  else if (inv.adSkip && (!len || inv.adSkip < len)) target = inv.adSkip;
  if (!target) return;
  const seek = () => { try { el.currentTime = target / 1000; } catch (e) {} };
  el.addEventListener('loadedmetadata', seek, { once: true });
}

function offSkip(d) { if (OFF.queue.length) { resetProgress(); offPlayAt(OFF.i + d); } }
function offTogglePlay() {
  const el = offAudio();
  if (!OFF.queue.length) { setFeedback('Nothing downloaded on this device'); return; }
  if (!el.src) return offPlayAt(Math.max(0, OFF.i));
  if (el.paused) el.play().catch(() => {}); else el.pause();
}
function offSeekAbsolute(ms) {
  const el = OFF.el, t = OFF.queue[OFF.i];
  if (!el || !t) return;
  const len = t.length || (el.duration * 1000) || 0;
  const clamped = Math.max(0, len ? Math.min(ms, len - 500) : ms);
  try { el.currentTime = clamped / 1000; } catch (e) {}
}
function offSeekFraction(p) {
  const el = OFF.el, t = OFF.queue[OFF.i];
  if (!el || !t || !t.length) return;
  try { el.currentTime = (p * t.length) / 1000; } catch (e) {}
}

function offPaintNow(t) {
  paintTrackText(t.name || '', t.artist || 'O2M', t.album || '', '');
  setCoverGenerated(t.uri);      // no cover is cached: the generated one is local
  clearTrackTags();
  renderTrackDetails(null);      // the details panel is a server read; blank it
  setClock(0, true);
  offRenderQueue();
  updateMediaSession({ uri: t.uri, name: t.name,
                       artists: t.artist ? [{ name: t.artist }] : [],
                       album: t.album ? { name: t.album } : null }, true, '');
}

function offRenderQueue() {
  const tracks = OFF.queue.map((t, i) => ({
    tlid: i,
    track: { uri: t.uri, name: t.name, length: t.length,
             artists: t.artist ? [{ name: t.artist }] : [],
             album: t.album ? { uri: 'offline:album', name: t.album } : null },
  }));
  // No signature reset: the sig is tlid:uri, so handing over in either
  // direction repaints by itself, while a mere track change inside the queue
  // takes renderTracklist's cheap path and only moves the current row.
  renderTracklist(tracks, OFF.i);
}

/* Which rows this device is holding — shown online too, so you can see what an
   offline switch would actually give you before pressing it. */
function offRenderBadges() {
  const inv = offInv();
  document.querySelectorAll('#tracklist-wrap .tl-item').forEach(it => {
    it.classList.toggle('has-offline', !!inv[it.dataset.uri || '']);
  });
}

/* Fills the "Where it is stored" rows. Both halves are asynchronous and one of
   them can be unreachable, so the sheet renders with placeholders and this
   replaces them as answers arrive — a Settings panel must not wait on the
   network to open. */
async function offFillStorage() {
  const dev = document.getElementById('off-store-device');
  const srv = document.getElementById('off-store-server');
  if (dev) {
    const n = Object.keys(offInv()).length;
    let line = 'IndexedDB “' + OFF_DB + '” · store “' + OFF_STORE + '” — '
             + n + ' track' + (n === 1 ? '' : 's') + ', ' + offSizeText(offUsed());
    try {
      const est = await navigator.storage.estimate();
      if (est && est.quota) {
        line += '\nBrowser allows ' + offSizeText(est.quota)
             +  ' for this site, ' + offSizeText(est.usage || 0) + ' in use';
      }
      if (await navigator.storage.persisted()) line += ' · kept under pressure';
    } catch (e) { /* no Storage API: the first line still says what matters */ }
    dev.textContent = line;
  }
  // The intermediate stats — plays not yet sent, and the bookmarks. They live
  // in localStorage, which means nowhere a person can look; showing them here
  // is the difference between "it syncs" and "I can see that it syncs".
  const st = document.getElementById('off-store-stats');
  const list = document.getElementById('off-stats-list');
  if (st) {
    const plays = offPlays(), pos = offPos();
    const keys = Object.keys(pos);
    const unsent = keys.filter(u => pos[u].at !== pos[u].syncedAt).length;
    st.textContent = plays.length + ' play' + (plays.length === 1 ? '' : 's')
      + ' waiting · ' + keys.length + ' bookmark' + (keys.length === 1 ? '' : 's')
      + ' (' + unsent + ' not yet sent)'
      + '\nlocalStorage “' + OFF_PLAYS_KEY + '” and “' + OFF_POS_KEY + '”';
    if (list) {
      const when = v => { try { return new Date(v).toLocaleString(); } catch (e) { return v; } };
      const nm = u => (offInv()[u] || {}).name || u;
      const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
      const rows = [
        ...plays.map(p => '▸ played  ' + (p.name || nm(p.uri)) + ' — '
                        + pct(p.position, p.length) + ' · ' + when(p.at)),
        ...keys.map(u => '▸ at ' + pct(pos[u].position, pos[u].length) + '  ' + nm(u)
                       + ' — ' + msToMin(pos[u].position) + ' · ' + when(pos[u].at)
                       + (pos[u].at === pos[u].syncedAt ? ' · sent' : ' · pending')),
      ];
      list.textContent = rows.length ? rows.join('\n') : 'Nothing waiting.';
    }
  }
  if (srv) {
    try {
      const d = await fetch(API + '/offline/storage').then(r => r.json());
      const cap = d.cap_bytes
        ? ' of ' + offSizeText(d.cap_bytes) + ' (' + d.cap_env_var + ')'
        : ' · no cap set';
      srv.textContent = d.host_path + ' on the O2M machine'
        + '\n' + d.cache_dir + ' inside the container'
        + '\n' + d.files + ' files, ' + offSizeText(d.bytes || 0) + cap
        + (d.registered != null ? ' · ' + d.registered + ' tracks registered' : '')
        + '\nkept ' + d.retention_days + ' days · change the folder with ' + d.env_var;
    } catch (e) { srv.textContent = 'unreachable'; }
  }
}

function offPaintToggle() { paintPlaybackTarget(); }

/* ── The switch ───────────────────────────────────────────────────────────── */
async function offStart() {
  const snapshot = (matrixTlItems || []).slice();   // before anything stops
  try { await rpc('core.playback.pause'); } catch (e) {}
  if (snapPlayer) {
    try { snapPlayer.stop(); } catch (e) {}
    snapPlayer = null; _releaseWakeLock(); _snapBtnOff();
  }
  // The silent anchor exists to give WebAudio an OS media session; a real
  // <audio> has its own, and two of them fight over the notification.
  stopMediaAnchor();

  OFF.on = true;
  document.documentElement.classList.add('offline-mode');
  offPaintToggle();

  OFF.queue = offBuildQueue();
  offRenderQueue();
  if (OFF.queue.length) offPlayAt(0);
  else setFeedback('Nothing downloaded yet — fetching what the tracklist allows');
  offSync(snapshot, { retry: true });
}

function offStop() {
  OFF.on = false;
  document.documentElement.classList.remove('offline-mode');
  if (OFF.el) {
    offLogPlay(false);
    try { OFF.el.pause(); } catch (e) {}
    OFF.el.removeAttribute('src');
    try { OFF.el.load(); } catch (e) {}
  }
  if (OFF.url) { try { URL.revokeObjectURL(OFF.url); } catch (e) {} OFF.url = null; }
  OFF.i = -1;
  offPaintToggle();
  offFlushPlays();
  lastTracklistSig = null;
  setFeedback('Back to the server');
  refreshNowPlaying();
}

function offToggle() { return OFF.on ? offStop() : offStart(); }

function offInit() {
  // No button of its own: offline is the third stop of the playback-target
  // cycle on #btn-snapcast (see cyclePlaybackTarget).
  paintPlaybackTarget();
  offFlushPlays();                                   // a previous session's plays
  window.addEventListener('online', () => { offFlushPlays(); offSchedulePendingCheck(); });
  // pagehide fires where unload does not (bfcache, iOS); visibilitychange
  // catches a phone going into a pocket, which is when a position is most
  // likely to be lost and most annoying to lose.
  window.addEventListener('pagehide', () => offCheckpoint(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') offCheckpoint(true);
  });
}

/* ── Snapcast — wrapper autour de SnapStream (bundle Iris/snapstream.ts) ── */
const SNAP_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`;

function _snapBtnOff() { paintPlaybackTarget(); }

/* Screen Wake Lock — best-effort. iOS Safari suspends the WebAudio AudioContext
   as soon as the screen locks (and WebAudio can't play in the background at all),
   so a phone used as a Snapcast speaker goes silent on auto-lock. Holding a wake
   lock while playing keeps the screen on and avoids that. The browser releases the
   lock whenever the page is hidden, so we re-acquire it on visibilitychange. */
let _wakeLock = null;
async function _acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      _wakeLock = await navigator.wakeLock.request('screen');
      _wakeLock.addEventListener?.('release', () => { _wakeLock = null; });
    }
  } catch (e) { /* unsupported or blocked (needs a recent iOS + user gesture) */ }
}
function _releaseWakeLock() {
  try { _wakeLock?.release?.(); } catch (e) {}
  _wakeLock = null;
}

// Returning to the foreground: re-arm the wake lock and resume the audio context
// that iOS suspended while backgrounded (best-effort; may need a tap on iOS).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !snapPlayer) return;
  _acquireWakeLock();
  try {
    if (snapPlayer.ctx && snapPlayer.ctx.state === 'suspended') snapPlayer.ctx.resume();
  } catch (e) {}
});

function _snapStart() {
  if (snapPlayer || !snapWsUrl || !window.SnapStream) return;
  snapPlayer = new window.SnapStream(snapWsUrl);
  _acquireWakeLock();
  startMediaAnchor();
  // Pousse les métadonnées une fois la session média devenue active
  setTimeout(refreshNowPlaying, 600);
  paintPlaybackTarget();
  setFeedback('Connecting…');
}

/* ── One control, three states ───────────────────────────────────────────────
   Where the audio comes out is a single question with three answers, so it is
   a single button cycling through them rather than two that can contradict
   each other:

     1. remote   — the server plays, this device is only a remote
     2. snapcast — the server plays AND this device is a speaker
     3. offline  — this device plays its own files, server out of the loop

   They are mutually exclusive in fact (offStart already stops the Snapcast
   stream), and two separate toggles made that exclusivity something the user
   had to know rather than something the control expressed. Where Snapcast is
   not configured the cycle is two states, not a dead button: offline has to
   stay reachable. */
function playbackTarget() {
  if (OFF.on) return 'offline';
  return snapPlayer ? 'snapcast' : 'remote';
}

const TARGET_SVG = {
  remote:   SNAP_SVG,
  snapcast: SNAP_SVG,
  offline:  OFF_SVG,
};
const TARGET_TITLE = {
  remote:   'Playing on the server — tap to listen here',
  snapcast: 'This device is a Snapcast speaker — tap to go offline',
  offline:  'Playing this device\u2019s own files — tap to hand back to the server',
};

function paintPlaybackTarget() {
  const btn = document.getElementById('btn-snapcast');
  if (!btn) return;
  const st = playbackTarget();
  btn.innerHTML = TARGET_SVG[st];
  btn.classList.toggle('playing', st !== 'remote');
  btn.dataset.target = st;
  btn.classList.toggle('busy', st === 'offline' && OFF.downloading);
  let title = TARGET_TITLE[st];
  if (st !== 'offline') {
    const n = Object.keys(offInv()).length;
    if (n) title += ' (' + n + ' track' + (n === 1 ? '' : 's') + ' held here)';
    // The colour says green/orange/red; the tooltip says how many ms that was.
    // Without it the reading is a hue with nothing behind it — which is what the
    // dot's own tooltip used to answer.
    title += '\n' + netTitle;
  }
  btn.title = title;
  btn.setAttribute('aria-label', title);
}

function snapAvailable() { return !!(snapWsUrl && window.SnapStream); }

async function cyclePlaybackTarget() {
  switch (playbackTarget()) {
    case 'remote':
      if (snapAvailable()) {
        _snapStart();
        localStorage.setItem('snap-autoconnect', '1');
      } else {
        // No Snapcast here: skip the middle state rather than stall the cycle.
        await offStart();
      }
      break;
    case 'snapcast':
      // offStart stops the stream itself; doing it here too would double-stop.
      localStorage.setItem('snap-autoconnect', '0');
      await offStart();
      break;
    default:
      offStop();
      break;
  }
  paintPlaybackTarget();
}

// Kept as the name the rest of the page (and habit) uses.
function toggleSnapcast() { return cyclePlaybackTarget(); }

function autoConnectSnapIfNeeded() {
  const pref = localStorage.getItem('snap-autoconnect');
  // Phone: auto-connect (it's the designated speaker). Tablet/desktop: only
  // restore the last local state ('1' = was connected → reconnect; '0'/null = stay off).
  const shouldConnect = isPhoneDevice() || pref === '1';
  if (!shouldConnect || !snapWsUrl) return;
  // Connect on the first user gesture (browsers require it for AudioContext).
  // Don't use {once}: if the SnapStream bundle isn't loaded yet, _snapStart() is a
  // no-op — keep the listeners until a player is actually created, then detach.
  const onGesture = () => {
    _snapStart();
    if (snapPlayer) {
      document.removeEventListener('click', onGesture);
      document.removeEventListener('touchstart', onGesture);
    }
  };
  document.addEventListener('click',      onGesture);
  document.addEventListener('touchstart', onGesture, { passive: true });
}

/* Téléphone uniquement (exclut tablette + desktop) — utilisé pour tout ce qui
   doit rester "tablette ne fait rien d'auto" (auto-connect Snapcast, auto-lecture).
   Astuce UA : iPad se déclare "iPad" et n'a jamais iPhone/iPod dans l'UA. Certaines
   petites tablettes Android (≤ 7-8") gardent "Mobile" dans l'UA même si ce n'est pas
   un téléphone : on confirme donc toujours avec la taille d'écran (≤ 600px de petit
   côté) plutôt que de se fier à "Mobile" seul. */
function isPhoneDevice() {
  const ua = navigator.userAgent;
  const minSide = Math.min(window.screen?.width || 9999, window.screen?.height || 9999);
  if (/iPad/.test(ua)) return false;
  if (/iPhone|iPod/.test(ua)) return true;
  if (/Android/.test(ua) && /Mobile/.test(ua)) return minSide <= 600;
  if (/Windows Phone|BlackBerry|Opera Mini|IEMobile/.test(ua)) return true;
  // Repli : écran tactile avec petit côté ≤ 480px (téléphone), exclut tablettes/desktop
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  return touch && minSide <= 480;
}
function autoInitPlaybackIfPhone() {
  if (!isPhoneDevice()) return;
  setTimeout(() => {
    // Basic view: never auto-launch a box (unmute + resume only).
    fetch(API + '/initialize_playback' + (isBasic() ? '?nobox=1' : ''))
      .then(r => r.text())
      .then(t => { if (t && t !== 'no_action') setTimeout(refreshNowPlaying, 800); })
      .catch(() => {});
  }, 1500);
}

/* Mobile "tap to start audio" splash — a deliberate single tap that reliably
   satisfies the browser's user-gesture requirement (more robust than catching a
   random click). On tap: unlock Web Audio, connect Snapcast, start playback. */
function showAudioTapOverlay() {
  if (!isPhoneDevice() || !snapWsUrl) return;           // only when the browser is the speaker (Snapcast)
  if (document.getElementById('audio-tap-overlay')) return;
  const ov = document.createElement('div');
  ov.id = 'audio-tap-overlay';
  ov.innerHTML =
    '<div class="tap-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>'
    + '<div class="tap-label">Tap to start audio</div>';
  const go = async () => {
    ov.removeEventListener('click', go);
    // 1. Unlock the Web Audio API for the whole page (resumes suspended contexts).
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { const t = new AC(); t.resume().then(() => t.close()).catch(() => {}); } } catch (e) {}
    // 2. Connect Snapcast (the phone becomes the speaker).
    _snapStart();
    localStorage.setItem('snap-autoconnect', '1');
    ov.classList.add('hide');
    setTimeout(() => ov.remove(), 320);
    // 3. Make sure something is playing (basic view: resume only, no box auto-launch).
    try { await fetch(API + '/initialize_playback' + (isBasic() ? '?nobox=1' : '')); } catch (e) {}
    // 4. Nothing queued? Then the tap has to produce something to listen to, so
    //    start the whole auto mix — the four actuators, exactly what the ALL
    //    button does. With a non-empty tracklist the tap only restores sound and
    //    the queue is left untouched. Hits the API rather than the ALL button so
    //    it works from the full view too, where that button is not rendered.
    try {
      const len = (await rpc('core.tracklist.get_length'))?.result ?? 0;
      if (!len) {
        setFeedback('Starting the auto mix…');
        setMixBusy(true, true);
        for (const c of shuffledCats()) {
          try { await fetch(API + '/basic_toggle?cat=' + c + '&mode=add'); } catch (e) {}
        }
        // meta_fill only fills the queue; from a stale 'paused' state a bare
        // play() is a no-op, so target a tlid explicitly (as toggleBasicCat does).
        const st = (await rpc('core.playback.get_state'))?.result;
        if (st !== 'playing') {
          const cur = (await rpc('core.playback.get_current_tl_track'))?.result;
          if (cur && cur.tlid != null) await rpc('core.playback.play', { tlid: cur.tlid });
          else {
            const first = ((await rpc('core.tracklist.get_tl_tracks'))?.result || [])[0];
            if (first) await rpc('core.playback.play', { tlid: first.tlid });
          }
        }
        setMixBusy(false);
        if (typeof refreshBasicToggles === 'function') refreshBasicToggles();
      }
    } catch (e) { setMixBusy(false); }
    setTimeout(refreshNowPlaying, 800);
  };
  ov.addEventListener('click', go);
  document.body.appendChild(ov);
}

/* ── Pochette de remplacement (quand un morceau n'a pas de visuel) ── */
/* Pour utiliser tes propres images : remplace/complète cette liste par tes URLs. */
// Pochettes "maison" du design system (orange + neutres, géométrie plate)
const PLACEHOLDER_COVERS = [
  '/static/ds/covers/o2m-cover1.png',  '/static/ds/covers/o2m-cover2.png',
  '/static/ds/covers/o2m-cover3.png',  '/static/ds/covers/o2m-cover4.png',
  '/static/ds/covers/o2m-cover5.png',  '/static/ds/covers/o2m-cover6.png',
  '/static/ds/covers/o2m-cover7.png',  '/static/ds/covers/o2m-cover8.png',
  '/static/ds/covers/o2m-cover9.png',  '/static/ds/covers/o2m-cover10.png',
  '/static/ds/covers/o2m-cover11.png', '/static/ds/covers/o2m-cover12.png',
];
/* Crossfade the cover: preload the new image off-DOM, then swap + fade in.
   Avoids the blank flash of setting src directly and makes track changes feel
   snappier. No-op when the URL is unchanged. */
/* No-artwork fallback: a design-system cover derived from the uri (same hash as
   placeholderForUri, so a track keeps "its" cover).
   Returns false when the library is absent, to allow a PNG fallback. */
function setCoverGenerated(uri) {
  const wrap = document.getElementById('cover-wrap');
  const gen  = document.getElementById('cover-gen');
  if (!wrap || !gen || !window.O2M) return false;
  gen.innerHTML = O2M.coverFor(uri || 'o2m');
  const svg = gen.firstElementChild;
  // Required: the viewBox is 1:1 while #cover-wrap is 16/9 in invert and
  // 84x84 on mobile — without "slice" you get empty letterbox bands.
  if (svg) svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  wrap.classList.add('gen');
  // Forced style pass: #cover-gen has just become displayed at opacity 0 (when a
  // switch is in progress); lifting the class in the same pass would skip the fade.
  void gen.offsetWidth;
  wrap.classList.remove('switching');
  return true;
}

function setCoverSmooth(url) {
  const el = document.getElementById('cover');
  const wrap = document.getElementById('cover-wrap');
  if (!el || !url) return;
  // Before the early return: otherwise going back to an unchanged real cover would
  // leave the <img> hidden behind the generated one.
  wrap?.classList.remove('gen');
  if (el.src === url) { wrap?.classList.remove('switching'); return; }
  const img = new Image();
  const swap = () => { el.src = url; el.classList.remove('cover-fading'); wrap?.classList.remove('switching'); };
  img.onload = () => {
    // A track switch has already faded the old artwork out: swap and fade in.
    // Otherwise (same track, new artwork — radios) run the short crossfade.
    if (wrap?.classList.contains('switching')) { swap(); return; }
    el.classList.add('cover-fading');
    setTimeout(swap, 120);
  };
  img.onerror = swap;
  img.src = url;
}

/* Artwork url per track uri ('' = no artwork). Filled by the prefetch of the next
   track and by every lookup, so a skip to a prefetched track paints its cover with
   no round trip at all. Bounded; a failed lookup is not cached. */
const coverUrlCache = new Map();
async function resolveCoverUrl(uri) {
  if (coverUrlCache.has(uri)) return coverUrlCache.get(uri);
  const r = await rpc('core.library.get_images', {uris: [uri]});
  const imgs = r?.result?.[uri] || [];
  const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
  const url = best ? imageUrl(best.uri || best) : '';
  if (r && r.result) {
    if (coverUrlCache.size > 400) coverUrlCache.delete(coverUrlCache.keys().next().value);
    coverUrlCache.set(uri, url);
  }
  return url;
}
function applyCover(uri, url) {
  lastCoverUrl = url;
  if (url) setCoverSmooth(url); else setCoverGenerated(uri);
  if (currentTrackObj && currentTrackObj.uri === uri) updateMediaSession(currentTrackObj, progPlaying, url);
  prefetchNextCover();
}
/* Cover for the track that just became current: immediate when cached, otherwise
   the previous artwork fades out while the lookup runs — the header never shows
   the old cover under the new title. Guarded against a lookup outrun by another
   skip. */
function loadCover(uri) {
  if (coverUrlCache.has(uri)) { applyCover(uri, coverUrlCache.get(uri)); return; }
  document.getElementById('cover-wrap')?.classList.add('switching');
  resolveCoverUrl(uri).then(url => { if (npTargetUri() === uri) applyCover(uri, url); }).catch(() => {});
}

/* Warm the caches with the NEXT track's cover so pressing next shows it instantly:
   the url goes into coverUrlCache (get_images is served from mopidy's cache) and
   the image itself into the browser cache (from the CDN once). */
let _prefetchedCoverUri = null;
async function prefetchNextCover() {
  try {
    const i = matrixTlItems.findIndex(it => it.tlid === currentTlid);
    const next = (i >= 0 && matrixTlItems[i + 1]) ? matrixTlItems[i + 1] : null;
    if (!next?.uri || next.uri === _prefetchedCoverUri) return;
    _prefetchedCoverUri = next.uri;
    const url = await resolveCoverUrl(next.uri);
    if (url) { const im = new Image(); im.src = url; }
  } catch (e) {}
}

function placeholderForUri(uri) {            // déterministe : même morceau → même pochette (pas de scintillement)
  let h = 0; const s = uri || 'o2m';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PLACEHOLDER_COVERS[h % PLACEHOLDER_COVERS.length];
}

/* ── Hero accent (couleur dynamique du style Invert) ── */
const HERO_PALETTE = ['#ff3b00','#1e6bff','#ff0091','#00c878','#ffc400','#8b5cff','#00d4d4'];
function heroAccentForUri(uri) {
  let h = 0;
  const s = uri || '';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return HERO_PALETTE[h % HERO_PALETTE.length];
}
function updateHeroAccent(uri) {
  if (document.documentElement.getAttribute('data-theme') !== 'invert') return;
  document.documentElement.style.setProperty('--hero-accent', heroAccentForUri(uri));
  readThemeColors();
}

/* Ajuste la taille du titre pour remplir l'espace dispo (affiches) ; coupe si vraiment trop long */
function fitHeroTitle() {
  const el = document.getElementById('hero-title');
  if (!el) return;
  const theme = document.documentElement.getAttribute('data-theme');
  if ((theme !== 'overprint' && theme !== 'invert') || !el.textContent) return;
  // Mobile : pas de fit JS, on laisse le clamp CSS gérer (titre au-dessus de la pochette)
  if (window.innerWidth < 700) { el.style.fontSize = ''; return; }

  const availW = el.clientWidth;
  if (availW <= 0) return;

  // Invert : titre-légende, ajusté à la largeur (une ligne), plafonné
  if (theme === 'invert') {
    el.style.fontSize = '100px';
    const w = el.scrollWidth;
    if (w <= 0) return;
    el.style.fontSize = Math.max(22, Math.min(130, Math.floor(100 * availW / w))) + 'px';
    return;
  }

  // Overprint : remplit toute la zone (largeur ET hauteur) jusqu'au-dessus des contrôles.
  // align-self:start + hauteur auto → scrollHeight reflète bien la hauteur du texte.
  el.style.fontSize = '20px';   // base petite pour mesurer la zone de façon stable
  const right = document.getElementById('top-right');
  const titleTop = el.getBoundingClientRect().top;
  let availH = right ? right.getBoundingClientRect().top - titleTop - 8 : 0;
  if (availH <= 24) availH = Math.max(80, window.innerHeight * 0.35);  // garde-fou
  let lo = 14, hi = 480, best = 14;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + 'px';
    if (el.scrollWidth <= availW + 1 && el.scrollHeight <= availH + 1) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  el.style.fontSize = best + 'px';
}

/* ── Thèmes ── */
function applyTheme(name) {
  // See the pre-paint script: bulletin2 is Bulletin plus a skin.
  const base = name === 'bulletin2' ? 'creme' : name;
  document.documentElement.setAttribute('data-theme', base);

  document.querySelectorAll('.theme-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.themeSet === name));

  else document.documentElement.style.removeProperty('--hero-accent');
  document.getElementById('top-zone')?.classList.remove('cover-lit');  // reset overprint recolor toggle
  // Re-measure the veil: the ground and the pane token it is computed against are
  // per-theme. Same picture, no re-draw — only initBasicBackground draws one.
  tuneBasicBackdrop(_basicBgUrl);

  requestAnimationFrame(syncDetailsWidth);   // standard themes: re-match details↔cover width
}

function setupCollapsibles() {

  // 3 headers stay visible. On desktop the .open class has no effect (all shown).
  const heads = document.querySelectorAll(
    '#boxes-panel .panel-head, #left-panel .panel-head, #tracklist-col #tracklist-label');
