<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O2M">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>O2M Mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Design system: single source of the 5 themes' tokens + component layer.
     Must precede the page's own mood.css, whose rules then win on equal specificity. -->
<link rel="stylesheet" href="/static/ds/o2m.css">
<!-- Marks and generated cover art. Loaded in <head>, NOT at the end of <body>:
     init() runs synchronously at the end of the inline script, so window.O2M must
     already exist by then. The library defers its own mount() to DOMContentLoaded. -->
<script src="/static/ds/o2m-marks.js"></script>
<script>
  /* Applique le thème avant le rendu pour éviter le flash.
     mood2 utilise une clé de stockage séparée (o2m2-theme) et part en dark
     (palette chaude du design system) par défaut. */
  (function () {
    var t = new URLSearchParams(location.search).get('theme')
          || localStorage.getItem('o2m2-theme') || 'dark';
    /* Bulletin2 is a SKIN over Bulletin, not a sixth token set. It rides on
       data-theme="creme", so every Bulletin rule — the design system's included,
       and that file is replaced wholesale on each sync — applies to it unchanged,
       and data-skin carries only what it changes. Declaring a sixth theme name
       would have meant copying fifty tokens the design system already owns. */
    var base = t === 'bulletin2' ? 'creme' : t;
    document.documentElement.setAttribute('data-theme', base);
    if (t !== base) document.documentElement.setAttribute('data-skin', t);
    /* Basic view: /basic = simplified actuators (default on mobile). Same page,
       the mode is a root class so CSS can swap the middle section without flash. */
    var basic = /\/basic\/?$/.test(location.pathname);
    if (basic) document.documentElement.classList.add('basic');
    try {
      if (location.search.indexOf('full=1') !== -1) localStorage.setItem('o2m-view', 'full');
      if (!basic && /\/mood2?\/?$/.test(location.pathname)
          && window.matchMedia('(max-width: 699px)').matches
          && localStorage.getItem('o2m-view') !== 'full') {
        location.replace('/basic');
      }
    } catch (e) {}
  })();
</script>
<!-- The page's own rules, extracted from an inline <style>. Still loaded AFTER
     ds/o2m.css above, so its rules keep winning on equal specificity. -->
<link rel="stylesheet" href="/static/mood.css">
</head>
<body>

<div id="details-backdrop"></div>

<!-- Top zone: large cover on the left, info + controls on the right -->
<div id="top-zone">
  <div id="hero-title"></div>
  <div id="cover-col">
    <div id="cover-wrap"><img id="cover" src="" alt=""><div id="cover-gen" aria-hidden="true"></div></div>
  </div>
  <div id="top-right">

    <!-- Now playing -->
    <div id="now-playing">
      <div id="track-info">
        <!-- Status square + playback info first, the way the design system opens a
             block: eyebrow, then hero title. It also puts this line level with the
             "DETAILS" head of the panel on the right. -->
        <div id="status-line">
          <div id="track-status-badge"></div>
        </div>
        <div id="track-name" class="o2m-hero-title">—</div>
        <div id="artist-album" class="o2m-np-meta">
          <span id="artist-name" class="artist">O2M</span>
          <span id="album-name" class="album"></span>
        </div>
        <div id="track-tags-row"><span id="track-ev"></span></div>
      </div>
      <button id="btn-details" title="Track details &amp; edit" aria-label="Track details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </button>
    </div>

    <!-- Progress bar — placed BEFORE the transport (v1.5): progress describes the
         track, so it belongs to the title; the transport closes the block. -->
    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-time" class="o2m-timecode">
        <span id="prog-elapsed">0:00</span>
        <span id="prog-duration"></span>
      </div>
    </div>

    <!-- Playback controls -->
    <div id="controls">
      <button class="ctrl-btn o2m-tbtn" id="btn-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg></button>
      <button class="ctrl-btn o2m-tbtn o2m-tbtn--play" id="btn-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="ctrl-btn o2m-tbtn" id="btn-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg></button>
      <div id="volume-row">
        <span id="volume-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
        <input type="range" id="volume-slider" min="0" max="100" value="50">
        <span id="volume-val">50%</span>
        <button id="btn-snapcast" title="Snapcast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></button>
      </div>
    </div>

  </div><!-- /top-right -->

  <!-- Colonne détails du morceau courant (desktop) -->
  <div id="track-details">
    <div class="td-head">
      <span>Details</span>
      <div class="td-head-actions">
        <!-- Actions live in the header (like the modal's obj-actions). -->
        <button id="btn-track-menu" class="track-menu-trigger" title="More" aria-label="More" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
        <button id="btn-edit-lock" title="Enable editing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
        <button id="btn-details-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    </div>
    <!-- Body is generated by tdPanel.render() — same shared markup as the modal. -->
    <div class="td-body"></div>
  </div>
</div><!-- /top-zone -->

<!-- Scrollable area -->
<div id="scroll-area">

  <!-- ══ Basic view (/basic) : 4 actuators + 2 dials — replaces the 3 columns ══ -->
  <div id="basic-section">
    <div id="basic-status">
      <span class="eq-icon" id="bs-eq" title="Playback"><i></i><i></i><i></i></span>
      <span class="bs-sep">·</span>
      <span id="bs-tracks">0 tracks</span>
      <span class="bs-sep">·</span>
      <span id="bs-boxes">0 boxes</span>
      <span class="mood-forced-hint" data-mood-forced hidden></span>
    </div>
    <div class="basic-toggles" id="basic-toggles">
      <button class="basic-toggle" data-cat="music" data-o2m-actuator="music">Music</button>
      <button class="basic-toggle" data-cat="podcast" data-o2m-actuator="podcast">Podcast</button>
      <button class="basic-toggle" data-cat="info" data-o2m-actuator="info">Info</button>
      <button class="basic-toggle" data-cat="radio" data-o2m-actuator="radio">Radio</button>
      <button id="basic-all" title="All on / all off" aria-label="All on / all off" data-o2m-actuator="all">All</button>
    </div>
    <div id="basic-dials">
      <div class="dial-wrap">
        <div class="dial-label">Discovery</div>
        <!-- Same presentation as the Mood dial: wider viewBox, detent labels around
             the arc (135°→405°), clickable shortcuts. 3 detents reuse the Mood
             dial's bottom-left/top/bottom-right label positions (indices 0/2/4 of
             its 5-slot layout land exactly there). Appearance only — still the
             same continuous discover_level(0-10) underneath, just snapped. -->
        <svg class="dial-svg o2m-dial" data-axis="opening" id="dial-bdl" width="196" height="136" viewBox="-40 -14 190 126">
          <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
          <circle class="dial-fill fill" id="fill-bdl" cx="55" cy="55" r="42"
                  transform="rotate(135 55 55)"/>
          <text class="bdl-lbl" data-i="0" x="16" y="99"  text-anchor="end">focused</text>
          <text class="bdl-lbl" data-i="2" x="55" y="-4"  text-anchor="middle">regular</text>
          <text class="bdl-lbl" data-i="4" x="94" y="99"  text-anchor="start">crazy</text>
          <!-- 2 extra (unlabelled) detents between the 3 words -->
          <circle class="bdl-tick" cx="16" cy="39" r="2"/>
          <circle class="bdl-tick" cx="94" cy="39" r="2"/>
          <circle class="knob" id="knob-bdl" cx="55" cy="13" r="7"/>
          <text class="center-label" x="55" y="60" text-anchor="middle" font-weight="700" id="txt-bdl">regular</text>
        </svg>
      </div>
      <div class="dial-wrap">
        <div class="dial-label">Mood</div>
        <!-- Wider viewBox: the 5 detent labels sit around the knob, at their angle
             on the arc (135°→405°). Labels are clickable shortcuts. -->
        <svg class="dial-svg o2m-dial" data-axis="mood" id="dial-bmood" width="196" height="136" viewBox="-40 -14 190 126">
          <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
          <circle class="dial-fill fill" id="fill-bmood" cx="55" cy="55" r="42"
                  transform="rotate(135 55 55)"/>
          <text class="bmood-lbl" data-i="0" x="16" y="99"  text-anchor="end">intense</text>
          <text class="bmood-lbl" data-i="1" x="0"  y="35"  text-anchor="end">calm</text>
          <text class="bmood-lbl" data-i="2" x="55" y="-4"  text-anchor="middle">normy</text>
          <text class="bmood-lbl" data-i="3" x="110" y="35" text-anchor="start">happy</text>
          <text class="bmood-lbl" data-i="4" x="94" y="99"  text-anchor="start">energetic</text>
          <circle class="knob" id="knob-bmood" cx="55" cy="13" r="7"/>
          <text class="center-label" x="55" y="60" text-anchor="middle" font-weight="700" id="txt-bmood">normy</text>
        </svg>
      </div>
    </div>
  </div>

  <!-- 3 colonnes : Boxes | Matrice+Genres | Tracklist -->
  <div id="main-cols">

  <!-- Col 1 : Boxes (repliable en mobile) -->
  <div id="boxes-panel" class="col collapsible">
    <div class="panel-head" id="boxes-panel-label">
      <span>Boxes</span>
      <span id="boxes-count"></span>
      <button id="btn-clear-boxes" type="button" title="Clear all boxes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>

    <div class="panel-body">
      <div id="auto-bar">
        <button id="btn-auto" type="button" title="Auto: dial changes refresh the mix live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>Auto</span>
        </button>
        <span id="auto-hint">live</span>
      </div>
      <div id="boxes-wrap"></div>
    </div>
  </div>

  <!-- Col 2 : Réglages — potentiomètres + matrice + genres (repliable en mobile) -->
  <div id="left-panel" class="col collapsible">
  <div class="panel-head" id="settings-label">
    <span>Mood</span>
    <button id="btn-reset-mood" type="button" title="Reset mood to defaults"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  </div>
  <div class="panel-body">
  <div id="matrix-section">
    <canvas id="mood-matrix"></canvas>
  </div>
  <div id="dials">
    <div class="dial-wrap">
      <div class="dial-label">Energy</div>
      <svg class="dial-svg o2m-dial" data-axis="energy" id="dial-energy" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill fill" id="fill-energy" cx="55" cy="55" r="42"
                transform="rotate(135 55 55)"/>
        <circle class="knob" id="knob-energy" cx="55" cy="13" r="7"/>
        <text class="val" x="55" y="62" text-anchor="middle" font-size="18" font-weight="700" id="txt-energy">5</text>
      </svg>
      <div class="dial-sub">calm ↔ intense</div>
    </div>
    <div class="dial-wrap">
      <div class="dial-label">Ambiance</div>
      <svg class="dial-svg o2m-dial" data-axis="valence" id="dial-valence" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill fill" id="fill-valence" cx="55" cy="55" r="42"
                transform="rotate(135 55 55)"/>
        <circle class="knob" id="knob-valence" cx="55" cy="13" r="7"/>
        <text class="val" x="55" y="62" text-anchor="middle" font-size="18" font-weight="700" id="txt-valence">5</text>
      </svg>
      <div class="dial-sub">dark ↔ bright</div>
    </div>
    <div class="dial-wrap">
      <div class="dial-label">Discovery</div>
      <svg class="dial-svg o2m-dial" data-axis="dl" id="dial-dl" width="120" height="120" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill fill" id="fill-dl" cx="55" cy="55" r="42"
                transform="rotate(135 55 55)"/>
        <circle class="knob" id="knob-dl" cx="55" cy="13" r="7"/>
        <text class="val" x="55" y="62" text-anchor="middle" font-size="18" font-weight="700" id="txt-dl">5</text>
      </svg>
      <div class="dial-sub">focused ↔ adventurous</div>
    </div>
    <!-- Filled by syncMoodDials when a box forces the mood or the discover level;
         the dials would otherwise read as hand-set. -->
    <div class="mood-forced-hint" data-mood-forced hidden></div>
  </div>
  </div><!-- /panel-body -->
  </div><!-- /left-panel -->

  <!-- Col 3 : Tracklist (prioritaire) -->
  <div id="tracklist-col" class="col collapsible open">
    <div id="tracklist-section">
      <div id="tracklist-label">
        <span>Tracklist</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="tracklist-count"></span>
          <button id="btn-clear-tl" title="Clear tracklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
      </div>
      <div id="tracklist-wrap"></div>
    </div>
  </div>

  </div><!-- /main-cols -->


  <!-- ══ Object detail / edit overlay (album · artist · box) ══
       Covers the lower area. Desktop: overlays the columns in place.
       Mobile: bottom-sheet like the track edit space. Read-only for now. -->
  <div id="obj-panel" aria-hidden="true">
    <div class="obj-head">
      <button id="obj-prev" class="hide" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button id="obj-next" class="hide" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <div class="obj-head-main">
        <span class="obj-kind" id="obj-kind">—</span>
        <span class="obj-title" id="obj-title">—</span>
        <span class="obj-sub" id="obj-sub"></span>
        <!-- Editable query, shown only in search views (obj-panel.search-mode) so the
             search can be refined without closing the modal. -->
        <input id="obj-search-input" class="obj-search-input" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      </div>
      <button id="obj-actions" class="hide" title="Actions" aria-label="Actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
      <button id="obj-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="obj-body" id="obj-body"></div>
  </div>

</div><!-- /scroll-area -->

  <!-- Footer links -->
  <div id="footer-links">
    <div class="tb-brand">
      <!-- Small mark (.o2m-mark) rather than the SVG bullseye: at 15px we are below
           the ~32px threshold where five rings stop reading. Pure CSS, no mount(). -->
      <span class="o2m-mark" aria-hidden="true"></span>
      <span class="tb-mark">O2M</span>
    </div>
    <!-- Content search: collapsed to an icon; expands to a text field in place. -->
    <div id="search-box" class="footer-link">
      <button id="btn-search" title="Search content" aria-label="Search content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <input id="search-input" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
    </div>
    <button id="btn-browse" class="icon-only" title="Browse your library" aria-label="Browse your library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></button>
    <div id="theme-switcher">
      <button class="theme-chip" data-theme-set="dark">Dark</button>
      <!-- The key stays "creme": that is what existing users have persisted in
           o2m2-theme (the design system keeps it as an alias). -->
      <button class="theme-chip" data-theme-set="creme">Bulletin</button>
      <button class="theme-chip" data-theme-set="bulletin2">Bulletin2</button>
      <button class="theme-chip" data-theme-set="mono">Mono</button>
      <button class="theme-chip" data-theme-set="overprint">Overprint</button>
      <button class="theme-chip" data-theme-set="invert">Invert</button>
    </div>
    <button class="footer-link" id="footer-settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Settings</button>

<script>
const API = location.origin + '/api';

/* ── Icônes SVG inline (Feather, N&B — jamais d'emoji) ── */
const ICON = {

  plus:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',

  disc:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>',
  user:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  list:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  rss:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>',
  radio:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>',
  box:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  hash:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
  eye:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  code:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  globe:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
};

/* ── State ── */
let appState = { energy: 0.5, valence: 0.6, dl: 5, genres: [] };
let applyTimer = null;
let currentTlid = null;
let lastScrolledTlid = null;
let currentTracklistLength = 0;
let snapWsUrl = null;
let snapPlayer = null;
let backofficeUrl = null;

/* Mode mood/auto : un changement de réglage rafraîchit le mix en direct
   - autoToggle      : interrupteur manuel "Auto" (persisté)
   - moodSessionActive : actif dès qu'un mix mood a été généré (potards/matrice)
   - autoBoxActive   : une box active contient le mot "auto" */
let autoToggle = false;
let moodSessionActive = false;
let autoBoxActive = false;

/* ── Dial geometry ── */
const R = 42, CX = 55, CY = 55;
const CIRC = 2 * Math.PI * R;
const ARC  = CIRC * 270 / 360;

function setupDial(id) {
  const svg   = document.getElementById('dial-' + id);
  const track = svg.querySelector('.dial-track');
  const fill  = svg.querySelector('.dial-fill');
  track.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  track.setAttribute('stroke-dashoffset', 0);
  fill.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  fill.setAttribute('stroke-dashoffset', ARC);
}

function setDial(id, v01) {
  const fill = document.getElementById('fill-' + id);
  const knob = document.getElementById('knob-' + id);
  const txt  = document.getElementById('txt-' + id);
  fill.setAttribute('stroke-dashoffset', ARC * (1 - v01));
  const a = (135 + v01 * 270) * Math.PI / 180;
  knob.setAttribute('cx', (CX + R * Math.cos(a)).toFixed(1));
  knob.setAttribute('cy', (CY + R * Math.sin(a)).toFixed(1));
  txt.textContent = Math.round(v01 * 10);
}

function makeDraggable(id, onChange) {
  const svg = document.getElementById('dial-' + id);
  let active = false;
  function v01fromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - (rect.left + rect.width / 2);
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - (rect.top  + rect.height / 2);
    let deg = Math.atan2(py, px) * 180 / Math.PI - 135;
    if (deg < 0) deg += 360;
    return Math.min(Math.max(deg, 0), 270) / 270;
  }
  svg.addEventListener('pointerdown', e => {
    if (mixBusy) return;
    active = true; svg.setPointerCapture(e.pointerId);
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointermove', e => {
    if (!active) return; e.preventDefault();
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointerup', () => { active = false; scheduleApply(); });
}

/* ── Mode mood/auto ── */
function isAutoMode() {
  return autoToggle || moodSessionActive || autoBoxActive;
}
/* The Auto button shows isAutoMode() and, when tapped, sets it — including the
   implicit session (moodSessionActive), which used to make it a one-way switch:
   lit by a mood fill, a tap only flipped autoToggle underneath and it stayed lit.
   Two cases take the decision away from the button, and it says so:
   - a box whose name contains "auto" is active → live mode is the box's, disabled;
   - a fill is in flight (mixBusy) → disabled by setMixBusy, as the tiles are. */
function updateAutoBtn() {
  const b = document.getElementById('btn-auto');
  if (!b) return;
  b.classList.toggle('active', isAutoMode());
  b.disabled = mixBusy || autoBoxActive;
  b.title = autoBoxActive ? 'Live mode is set by the active auto box'
          : mixBusy      ? 'Applying…'
          : isAutoMode() ? 'Auto is on: dial changes refresh the mix live — tap to stop'
                         : 'Auto is off: tap so dial changes refresh the mix live';
}
function setAutoToggle(on) {
  autoToggle = on;
  if (!on) moodSessionActive = false;   // switching off ends the implicit session too
  localStorage.setItem('mood-auto', on ? '1' : '0');
  updateAutoBtn();
}

/* ── Apply ── */
function shouldApplyMood() {
  // Rafraîchit le mix si la tracklist est vide OU si on est en mode mood/auto.
  // Vue basic : les potards sont des commandes directes → toujours appliquer.
  return isBasic() || currentTracklistLength === 0 || isAutoMode();
}

/* True while the queue is being (re)built server-side. Guards the dials: a mood
   or discovery change during a fill races the fill itself. It also parks ALL and
   the AUTO button — but NOT the four category tiles: those are independent
   switches and queue up behind the running one (see requestBasicCat). */
let mixBusy = false;
function setMixBusy(on, lockTiles = false) {
  mixBusy = !!on;
  document.body.classList.toggle('mix-busy', mixBusy);
  if (mixBusy) clearTimeout(applyTimer);   // drop a change debounced just before
  document.querySelectorAll('#basic-all, #btn-auto').forEach(b => { b.disabled = mixBusy; });
  // lockTiles: a rebuild that REPLACES the whole queue (dial change, auto-mix start)
  // parks the category tiles too — a category toggled meanwhile would be half in,
  // half out of the new queue. A single tile's own fill does not (queue instead).
  if (lockTiles || !mixBusy)
    document.querySelectorAll('#basic-toggles .basic-toggle').forEach(b => { b.disabled = mixBusy; });
  updateAutoBtn();
}

/* True from the moment a dial moves until its value has actually been applied.
   syncMoodDials must not write over it: a change waits 4.5s on the debounce, and a
   poll landing inside that window put the box's forced value back into appState —
   so the debounced apply then sent the BOX's value, not the one just dialled. The
   setting appeared to snap back to the schedule on its own, which is exactly what
   losing manual control looks like. Declared here, beside the timer it guards. */
let _moodDirty = false;

function scheduleApply() {
  if (mixBusy) return;
  if (!shouldApplyMood()) return;
  // Set only once the apply is actually armed: marking it before this guard left
  // the flag stuck whenever the guard returned, and a stuck flag freezes the dials
  // against every later refresh — worse than the race it exists to prevent.
  _moodDirty = true;
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyMood, 4500);   // débounce : laisse régler plusieurs potards avant d'appliquer
}

async function applyMood() {
  if (mixBusy) { _moodDirty = false; return; }   // a fill is in flight — its result would be half-replaced
  if (!shouldApplyMood()) { _moodDirty = false; return; }
  // Basic view: the dials are settings, the actuators are the switches. With no
  // actuator on, just save the values server-side — don't launch anything.
  const basicIdle = isBasic() && basicCats
    && !Object.values(basicCats).some(l => Array.isArray(l) && l.some(b => b.active));
  setFeedback(basicIdle ? 'Saving…' : 'Applying…');
  // The server rebuilds the queue for the duration of this call: dials, tiles, ALL
  // and Auto are parked meanwhile (same pulse as a tile fill), released in finally.
  setMixBusy(true, true);
  try {
    const body = { energy: appState.energy, valence: appState.valence,
                   discover_level: appState.dl, genres: appState.genres };
    if (basicIdle) body.apply = false;
    const r = await fetch(API + '/mood', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.status === 'settings_saved') {
      setFeedback('Settings saved — turn Music on to start');
      return;
    }
    setFeedback(d.status === 'boxes_active'
      ? 'Boxes active — mood applied to recommendations (empty the boxes to rebuild)'
      : d.tracks_added > 0 ? `${d.tracks_added} tracks loaded` : 'No matching tracks');
    moodSessionActive = true;   // on est désormais dans un mix mood → potards en direct
    updateAutoBtn();
    setTimeout(refreshNowPlaying, 400);
    setTimeout(refreshBoxStates, 500);   // lights the server-activated auto box straight away
  } catch(e) { setFeedback('Network error'); }
  finally {
    setMixBusy(false);
    // Released here rather than on the happy path: a flag left set would freeze the
    // dials against every later refresh — a worse failure than the race it guards.
    _moodDirty = false;
    if (isBasic()) refreshBasicToggles();   // tiles were parked (skipped by the sync): catch up now
  }
}

/* ── Network quality indicator (green / orange / red) ──────────────────────────
   Periodic latency probe against the o2m API + Network Information API when
   available. Thresholds chosen against the snapcast reality: the web stream has
   ~1s of buffer, so RTT spikes beyond ~1.2s mean audible dropouts (red).

   The reading is published as html[data-net] and painted by the playback-target
   glyph (see its CSS). It used to have a dot of its own, and the early return that
   guarded it — `if (!el) return;` — meant the probe simply stopped on any view
   without that dot; now nothing can silence it, so the title below is always the
   last real measurement. */
let netTitle = 'Network: probing…';

async function netProbe() {
  const t0 = performance.now();
  let ms = Infinity;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 5000);
    await fetch(API + '/dl?_t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(to);
    ms = performance.now() - t0;
  } catch (e) { ms = Infinity; }
  const conn = navigator.connection || {};
  let level = 'green';
  if (ms > 1200 || conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g') level = 'red';
  else if (ms > 400 || conn.effectiveType === '3g') level = 'orange';
  document.documentElement.dataset.net = level;   // drives the glyph's colour via CSS
  netTitle = 'Network: ' + (ms === Infinity ? 'unreachable'
    : Math.round(ms) + ' ms' + (conn.effectiveType ? ' · ' + conn.effectiveType : ''));
  paintPlaybackTarget();   // the reading is only visible through that glyph now
}

/* ── Basic view (/basic — default on mobile) ─────────────────────────────────
   A simplified façade over the existing mechanisms: the 4 actuators add/remove
   pinned boxes by category via /api/box, the 2 dials drive the same appState +
   scheduleApply() pipeline as the full view. No backend behavior change. */
// Dynamic: the view can switch in place (SPA) — always read the live class.
function isBasic() { return document.documentElement.classList.contains('basic'); }
// 5 detents; the 4 moods sit at the center of their matrix quadrant (X=energy,
// Y=valence), "intense" being the dark quadrant (already labelled Intense in the UI).
const BASIC_MOODS = [
  ['intense',   0.25, 0.25],
  ['calm',      0.25, 0.75],
  ['normy',     0.50, 0.50],   // default — center
  ['happy',     0.75, 0.75],
  ['energetic', 0.75, 0.25],
];
let basicCats = null;

function basicMoodIndex() {
  let best = 2, bd = Infinity;
  BASIC_MOODS.forEach(([, e, v], i) => {
    const d = Math.hypot(appState.energy - e, appState.valence - v);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function setBasicMoodDial(i) {
  setDial('bmood', i / (BASIC_MOODS.length - 1));
  const txt = document.getElementById('txt-bmood');
  if (txt) txt.textContent = BASIC_MOODS[i][0];
  document.querySelectorAll('.bmood-lbl').forEach(l =>
    l.classList.toggle('on', Number(l.dataset.i) === i));
}

// Discovery, presented the same way as Mood (detent labels around the dial)
// — appearance only, still the same continuous discover_level(0-10) underneath.
// 5 detents but only 3 are labelled (focused/regular/crazy at indices 0/2/4);
// the 2 in-between (indices 1/3) are extra stops shown as ticks, their centre
// text is the numeric discover_level. Same underlying discover_level(0-10).
const BASIC_DL_LEVELS = [['focused', 0], ['', 3], ['regular', 5], ['', 8], ['crazy', 10]];
function basicDlIndex() {
  let best = 2, bd = Infinity;
  BASIC_DL_LEVELS.forEach(([, dl], i) => {
    const d = Math.abs((appState.dl ?? 5) - dl);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function setBasicDlDial(i) {
  setDial('bdl', i / (BASIC_DL_LEVELS.length - 1));
  const [label, dl] = BASIC_DL_LEVELS[i];
  const txt = document.getElementById('txt-bdl');
  if (txt) txt.textContent = label || String(dl);
  document.querySelectorAll('.bdl-lbl').forEach(l =>
    l.classList.toggle('on', Number(l.dataset.i) === i));
}

let basicLimit = 30;   // fill target — refreshed from api_result_limit via /api/basic_boxes

function updateBasicStatus() {
  const tl = document.getElementById('bs-tracks');
  const bx = document.getElementById('bs-boxes');
  if (tl) tl.textContent = `${currentTracklistLength} track${currentTracklistLength === 1 ? '' : 's'}`;
  if (bx && basicCats) {
    const n = ['music', 'podcast', 'info', 'radio']
      .reduce((s, c) => s + (basicCats[c] || []).filter(b => b.active).length, 0);
    bx.textContent = `${n} box${n === 1 ? '' : 'es'}`;
  }
}

// Called from the now-playing refresh (10s + WS events): re-syncs the basic box
// states/count from the server so changes made elsewhere (e.g. the full view on
// another device) show up, without refetching on every rapid WS event.
let _lastBasicRefresh = 0;
function syncBasicFromNowPlaying() {
  if (!isBasic()) return;
  updateBasicStatus();                       // cheap, local: track count always fresh
  const now = Date.now();
  if (now - _lastBasicRefresh < 3000) return;
  _lastBasicRefresh = now;
  refreshBasicToggles();                      // refetch /basic_boxes → box states + count
}

async function refreshBasicToggles() {
  if (!isBasic()) return;
  try {
    basicCats = await fetch(API + '/basic_boxes').then(r => r.json());
    if (basicCats.limit) basicLimit = basicCats.limit;
    updateBasicStatus();
    document.querySelectorAll('#basic-toggles .basic-toggle').forEach(btn => {
      // A tile waiting in the queue, or the one currently filling, shows the state
      // the user asked for — the server's mid-flight truth would flip it back.
      if (btn.classList.contains('pending') || btn.disabled) return;
      const boxes = basicCats[btn.dataset.cat] || [];
      btn.classList.toggle('on', boxes.some(b => b.active));
    });
    syncAllButton();
  } catch(e) {}
}

/* ALL is a pure function of what the four tiles SHOW, never of the server state.
   It used to be recomputed straight from basicCats while the tiles showed the state
   the user had just asked for — optimistic, queued, or mid-fill — so the two
   disagreed for as long as a fill took: turning the last category on left ALL dark
   until the next poll caught up, and turning one off left it lit. Deriving it from
   the tiles makes disagreeing impossible by construction.
   Categories with no box at all are left out of the count. They can never turn on,
   and counting them would keep ALL dark forever on an install that has no radio box
   (or no podcast box, …) — which is also why it stayed dark after ALL had switched
   on everything there was to switch on. */
function syncAllButton() {
  const allBtn = document.getElementById('basic-all');
  if (!allBtn) return;
  const tiles = [...document.querySelectorAll('#basic-toggles .basic-toggle')]
    .filter(t => ((basicCats && basicCats[t.dataset.cat]) || []).length);
  allBtn.classList.toggle('on', tiles.length > 0 && tiles.every(t => t.classList.contains('on')));
}

// ALL meta-button: any category active → everything off; nothing active → everything on.
/* The four categories, in a random order. They are activated one after another
   and the queue keeps that order, so a fixed list always opened on music. */
function shuffledCats() {
  const c = ['music', 'podcast', 'info', 'radio'];
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c;
}

let _allRunning = false;
async function toggleBasicAll(btn) {
  if (!basicCats || mixBusy || _catDraining) return;
  const cats = shuffledCats();
  const tileOn = c => !!document.querySelector(`.basic-toggle[data-cat="${c}"]`)?.classList.contains('on');
  // Read from the tiles, like everything else: the user is acting on what is shown.
  const anyActive = cats.some(tileOn);
  // ALL is a sequence over the four tiles, so it and the tiles are mutually
  // exclusive: the tiles are parked for the run (a tap meanwhile would race it).
  const tiles = [...document.querySelectorAll('#basic-toggles .basic-toggle')];
  _allRunning = true;
  btn.disabled = true; btn.classList.add('running');
  tiles.forEach(t => { t.disabled = true; });
  setMixBusy(true);
  try {
    for (const c of cats) {
      const cbtn = document.querySelector(`.basic-toggle[data-cat="${c}"]`);
      // OFF pass: only categories currently on; ON pass: only those off. The target
      // is stated rather than toggled, so a category that changed under us is a
      // no-op instead of a flip in the wrong direction.
      if (cbtn && anyActive === tileOn(c)) await toggleBasicCat(cbtn, !anyActive);
      syncAllButton();   // the disc fills in as the sequence advances
    }
  } finally {
    _allRunning = false;
    setMixBusy(false); btn.disabled = false; btn.classList.remove('running');
    tiles.forEach(t => { t.disabled = false; });
  }
  await refreshBasicToggles();
}

/* ── Actuator queue ──────────────────────────────────────────────────────────
   The four categories are independent switches, so they must not lock each
   other: while podcast is filling, a tap on music is QUEUED and runs right after.
   The tile shows the requested state at once — dashed while it waits, pulsing
   while it runs — and the server confirms it when its turn is done. Only ALL and
   the single tiles are mutually exclusive (toggleBasicAll); the dials stay locked
   for the whole run as before, since a mood change during a fill races the fill.
   Robust by construction: each request carries the state the user asked for
   rather than "toggle", so an item already satisfied when its turn comes is a
   no-op; a failure drops only its own item; a second tap on a waiting tile
   cancels it. */
const _catQueue = [];          // [{cat, wantOn}] in tap order
let _catDraining = false;
const _capCat = c => c.charAt(0).toUpperCase() + c.slice(1);

function requestBasicCat(btn) {
  if (_allRunning || !basicCats) return;
  const cat = btn.dataset.cat;
  const boxes = basicCats[cat] || [];
  if (!boxes.length) { setFeedback('No ' + cat + ' box'); return; }
  const qi = _catQueue.findIndex(q => q.cat === cat);
  if (qi >= 0) {                                    // second tap while waiting: cancel
    _catQueue.splice(qi, 1);
    btn.classList.remove('pending');
    btn.classList.toggle('on', boxes.some(b => b.active));   // back to the server's truth
    syncAllButton();
    setFeedback(_capCat(cat) + ' cancelled');
    return;
  }
  const wantOn = !btn.classList.contains('on');    // relative to what the user sees
  btn.classList.toggle('on', wantOn);              // instant feedback; confirmed later
  syncAllButton();
  _catQueue.push({ cat, wantOn });
  if (_catDraining || mixBusy) {                   // something is filling: this one waits its turn
    btn.classList.add('pending');
    setFeedback(_capCat(cat) + ' queued');
  }
  drainCatQueue();
}

async function drainCatQueue() {
  if (_catDraining) return;
  _catDraining = true;
  try {
    while (_catQueue.length) {
      // ALL or a dial-triggered fill holds the lock: wait for it rather than race it.
      while (mixBusy) await new Promise(r => setTimeout(r, 250));
      const { cat, wantOn } = _catQueue.shift();
      const btn = document.querySelector(`.basic-toggle[data-cat="${cat}"]`);
      if (!btn) continue;
      btn.classList.remove('pending');
      try { await toggleBasicCat(btn, wantOn); } catch (e) {}
    }
  } finally { _catDraining = false; }
}

/* wantOn: the state requested when the tile was tapped (queue). Omitted → plain
   toggle of the current server state (ALL). */
async function toggleBasicCat(btn, wantOn) {
  const boxes = (basicCats && basicCats[btn.dataset.cat]) || [];
  if (!boxes.length) { setFeedback('No ' + btn.dataset.cat + ' box'); return; }
  const isOn = boxes.some(b => b.active);
  const turnOn = (wantOn == null) ? !isOn : wantOn;
  if (turnOn === isOn) { btn.classList.toggle('on', isOn); return; }   // already there — nothing to do
  btn.disabled = true;
  // ALL calls this in a loop and already holds the lock: only take it when free,
  // and only release what we took — otherwise the first category would free the
  // dials while the next three are still filling.
  const ownsLock = !mixBusy;
  if (ownsLock) setMixBusy(true);
  try {
    // One atomic server-side call: meta_fill (sources drawn recency × chance up
    // to the limit) or meta_remove. A reload / phone lock can't leave a partial
    // category state anymore — the server finishes the job either way.
    setFeedback((turnOn ? 'Starting ' : 'Stopping ') + btn.dataset.cat + '…');
    await fetch(API + '/basic_toggle?cat=' + encodeURIComponent(btn.dataset.cat)
                + '&mode=' + (turnOn ? 'add' : 'remove'));
    if (turnOn) {
      moodSessionActive = false;   // like toggleBox: launching boxes ends the implicit mood session
      // Basic view: an actuator is a switch — if the box fill left playback idle
      // (box_action only fills the tracklist), start playing. NOTE: from a stale
      // 'paused' state with no current track, a bare play() does nothing — target
      // the current tlid, or the first tracklist row, explicitly.
      try {
        const st = (await rpc('core.playback.get_state'))?.result;
        if (st !== 'playing') {
          const cur = (await rpc('core.playback.get_current_tl_track'))?.result;
          if (cur && cur.tlid != null) {
            await rpc('core.playback.play', {tlid: cur.tlid});
          } else {
            const tl = (await rpc('core.tracklist.get_tl_tracks'))?.result || [];
            if (tl.length) { resetProgress(); await rpc('core.playback.play', {tlid: tl[0].tlid}); }
          }
        }
      } catch(e) {}
    }
  } catch(e) { setFeedback('Box error'); }
  if (ownsLock) setMixBusy(false);
  if (!_allRunning) btn.disabled = false;   // ALL re-enables the four together at the end
  await refreshBasicToggles();
  refreshBoxStates();   // sync the hidden full-view buttons too (keeps autoBoxActive right)
  syncMoodDials();      // a box may force the mood/DL the dials show
  setTimeout(refreshNowPlaying, 800);
  setTimeout(refreshNowPlaying, 3000);
}

/* ── Basic view background ───────────────────────────────────────────────────
   The choice lives in THIS browser, deliberately: the shipped pictures ship with
   the app, so a device that has never been set up still gets a proper background
   rather than an empty box. Nothing to store server-side, nothing to keep in sync
   between instances.
     o2m-basic-bg       '' → draw at random · a /static path · 'custom'
     o2m-basic-bg-data  the uploaded picture, as a data URL
   Set on the root as --basic-bg; only the Bulletin rules read it, so the other
   themes are unaffected by the draw. */
const BASIC_BGS = ['wave-violet-lime.jpg', 'wave-orange-violet.jpg',
                   'wave-lime-pink.jpg', 'wave-orange-lime.jpg'];
const BASIC_BG_KEY  = 'o2m-basic-bg';
const BASIC_BG_DATA = 'o2m-basic-bg-data';
const BASIC_BG_MAX  = 1600;   // longest side kept for an upload

function _lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function basicBgChoice() { return _lsGet(BASIC_BG_KEY); }
function basicBgUrl() {
  const c = basicBgChoice();
  if (c === 'custom') return _lsGet(BASIC_BG_DATA);
  return c;
}
/* ── The mark's palette ──────────────────────────────────────────────────────
   The header logo is cut from --ring-a-* / --ring-b-*, which on Bulletin are the
   design system's navy and amber. Against the violet-and-lime picture behind the
   Basic dashboard the two read as unrelated brands. The choice below re-cuts the
   ramps from one of the pictures' own pairs (the CSS blocks near the top).
     o2m-mark  '' → follow the background · 'original' · a palette key
   Following the background is the default: the picture itself is drawn at random,
   so a fixed mark would clash again on the next load. A picture you uploaded has
   no known pair, so 'follow' falls back to the original rather than guessing one
   from its pixels — the same reason the palette is not extracted from the image. */
const MARK_KEY = 'o2m-mark';
const MARK_PALETTES = ['violet-lime', 'orange-violet', 'lime-pink', 'orange-lime'];
/* Swatch colours only — the ramps themselves live in the CSS blocks. 'original' is
   spelled out because reading --ring-a-1 back would return whatever override is
   active, not the design system's value. */
const MARK_SWATCH = {
  original:        ['#28285B', '#F8B132'],
  'violet-lime':   ['#584F9D', '#B9CE06'],
  'orange-violet': ['#393366', '#EA5634'],
  'lime-pink':     ['#B03F72', '#B9CE06'],
  'orange-lime':   ['#B04027', '#B9CE06'],
};
function markChoice() { return _lsGet(MARK_KEY); }
function resolvedMark() {
  const c = markChoice();
  if (c) return c;
  const m = /wave-([a-z-]+)\.jpg$/.exec(_basicBgUrl || '');   // the files are named after their pair
  return (m && MARK_PALETTES.includes(m[1])) ? m[1] : 'original';
}
function applyMark() {
  const k = resolvedMark();
  const root = document.documentElement;
  if (k === 'original') root.removeAttribute('data-mark');
  else root.setAttribute('data-mark', k);
}

let _basicBgUrl = '';
function initBasicBackground() {
  let url = basicBgUrl();
  if (!url) url = '/static/basic-bg/' + BASIC_BGS[Math.floor(Math.random() * BASIC_BGS.length)];
  _basicBgUrl = url;
  // Safe unquoted-content-wise: the shipped paths have no quotes, and a base64 data
  // URL is restricted to A-Za-z0-9+/= — neither can close the url() early.
  document.documentElement.style.setProperty('--basic-bg', 'url("' + url + '")');
  tuneBasicBackdrop(url);
  applyMark();   // the default choice follows whichever picture was just drawn
  applySkinPalette();
}

/* ── Bulletin2: three interface colours taken from the picture ───────────────
   Done at your request, and the reservation stands: a colour lifted from an
   arbitrary image carries no contrast guarantee, so this cannot be a general
   mechanism — it is a trial confined to one skin. Two things keep the trial
   readable enough to judge:
     · greys, near-black and near-white are skipped. They are most of a photograph
       and none of its identity, and picking one would hand the interface a colour
       that says nothing;
     · every pick is darkened until it clears the ground. Without that floor a pale
       pick lands around 1.5:1 and the control it drives is simply not on screen —
       you would be reading a bug, not a palette.
   What each colour drives: the darkest becomes the mark's ink half, DISCOVERY and
   energy; the lightest becomes the accent half, MOOD and valence; the middle one
   (when the picture has three) becomes the accent. With two, the accent is the
   darkest. Inline custom properties, so they also outrank the Mark picker's CSS —
   in this skin the picture decides, and the picker has no effect.
   Every other theme, and Bulletin itself, is untouched: the properties are removed
   the moment the skin is not bulletin2. */
const SKIN2_GROUND = [248, 247, 253];   // the light every pane lifts toward
const SKIN2_RAMP = [0, .105, .21, .315, .42];   // the design system's own five steps
const SKIN2_VARS = ['--accent', '--accent-press', '--accent-soft', '--c-dl',
  '--c-opening', '--c-energy', '--c-mood', '--c-valence']
  .concat([1, 2, 3, 4, 5].map(i => '--ring-a-' + i))
  .concat([1, 2, 3, 4, 5].map(i => '--ring-b-' + i));

function _hex(c) {
  return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16)
    .padStart(2, '0')).join('').toUpperCase();
}
function _deepen(c, t) { return c.map(v => v * (1 - t)); }
function _rampOf(c) { return SKIN2_RAMP.map(t => _hex(c.map(v => v + (255 - v) * t))); }
/* Darken until it clears `min` on the ground. Returns the original when it already
   does, so a picture whose colours are strong keeps them exactly. */
function _readable(c, min) {
  let out = c;
  for (let t = 0.05; t <= 0.75 && _contrast(out, SKIN2_GROUND) < min; t += 0.05) out = _deepen(c, t);
  return out;
}
function _dominantColours(data, n) {
  const buckets = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 26 || mn > 236) continue;                 // near-black, near-white
    if (mx === 0 || (mx - mn) / mx < 0.22) continue;    // greys: no identity
    const k = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);   // 4 bits per channel
    const e = buckets.get(k) || [0, 0, 0, 0];
    e[0] += r; e[1] += g; e[2] += b; e[3]++; buckets.set(k, e);
  }
  const ranked = [...buckets.values()].sort((a, b) => b[3] - a[3]);
  if (!ranked.length) return [];   // a fully grey or blown-out picture
  /* A bucket has to carry real weight to count. On a flat two-colour graphic the
     third-ranked colour is the ANTI-ALIASING SEAM between the two flats — a blend
     of lime and pink is a brown — and taking it handed the accent a muddy colour
     that is nowhere in the picture. Measured on the shipped set: the two real
     colours hold 100% and 73-98% of the top bucket, the seam 2-6%. Anything under
     a sixth of the leader is an edge, not a colour. */
  const floor = ranked[0][3] / 6;
  // Keep the picks apart too: a picture built on one colour would otherwise hand
  // back five shades of it, and the roles would be indistinguishable.
  const out = [];
  const far = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) > 60;
  for (const e of ranked) {
    if (e[3] < floor) break;
    const c = [e[0] / e[3], e[1] / e[3], e[2] / e[3]];
    if (out.every(o => far(o, c))) out.push(c);
    if (out.length === n) break;
  }
  return out;
}

function applySkinPalette() {
  const root = document.documentElement;
  const clear = () => SKIN2_VARS.forEach(v => root.style.removeProperty(v));
  if (root.getAttribute('data-skin') !== 'bulletin2' || !_basicBgUrl) { clear(); return; }
  const img = new Image();
  img.onerror = clear;
  img.onload = () => {
    if (root.getAttribute('data-skin') !== 'bulletin2') return;   // switched away mid-load
    const N = 40, cv = document.createElement('canvas');
    cv.width = N; cv.height = N;
    let d;
    try {
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, N, N);
      d = ctx.getImageData(0, 0, N, N).data;
    } catch (e) { clear(); return; }              // tainted canvas → keep the theme's
    const picks = _dominantColours(d, 3);
    if (picks.length < 2) { clear(); return; }    // too little colour to say anything
    const dark = [...picks].sort((a, b) => _lum(a) - _lum(b));
    let ink = _readable(dark[0], 4.5);                       // ink half: it carries text
    const comp = _readable(dark[dark.length - 1], 3.0);      // accent half: a graphic
    // With two colours the accent is the ink itself. That is the design system's own
    // reasoning for this theme — the accent reads as the ink raised in intensity,
    // not as a guest colour — and it is what a two-colour picture actually offers.
    const acc = _readable(dark.length > 2 ? dark[1] : dark[0], 4.5);
    // The mark is two halves parted by a ground-coloured gap; below 3:1 between them
    // it reads as one flat disc, so the ink half keeps going down until they part.
    for (let t = 0.05; t <= 0.6 && _contrast(ink, comp) < 3.0; t += 0.05) ink = _deepen(dark[0], t);
    const ra = _rampOf(ink), rb = _rampOf(comp);
    const set = (k, v) => root.style.setProperty(k, v);
    ra.forEach((v, i) => set('--ring-a-' + (i + 1), v));
    rb.forEach((v, i) => set('--ring-b-' + (i + 1), v));
    set('--accent', _hex(acc));
    set('--accent-press', _hex(_deepen(acc, .18)));
    set('--accent-soft', `rgba(${acc.map(Math.round).join(',')},.12)`);
    set('--c-dl', _hex(acc));
    set('--c-opening', _hex(ink));  set('--c-energy', _hex(ink));
    set('--c-mood', _hex(comp));    set('--c-valence', _hex(comp));
    readThemeColors();   // the matrix reads its colours from the tokens, not the DOM
  };
  img.src = _basicBgUrl;
}

/* ── The picture tunes the VEIL, not the palette ─────────────────────────────
   What adapts to the background image is how strongly it is veiled, and nothing
   else. The ink, the accent and the dial colours stay the theme's, measured once.
   That is on purpose: a colour lifted from an arbitrary image carries no contrast
   guarantee — the lime in these very pictures sits at 1.7:1 on the ground, and had
   an extractor elected it as the accent, every accent line in the app would have
   gone invisible, silently, depending on which picture was loaded.
   The veil, by contrast, is measurable end to end. We sample the image, take a dark
   percentile rather than the mean (a half-black, half-white picture has an innocent
   mean and a pane that fails over its dark half), then walk the veil up in steps
   until the ink on an INACTIVE pane — the thinnest one, so the worst case — clears
   4.5:1 over that sample. The lightest veil that passes wins, so a flat graphic
   keeps its colour and a dark photo gets veiled as much as it needs.
   Failing quietly is fine here: a cross-origin picture taints the canvas and we
   simply keep the veil the theme declares. */
const BASIC_INK_MIN = 4.5;   // WCAG AA for the pane labels
const BASIC_DARK_PCT = 0.15; // protect all but the darkest 15% of the picture
/* The veil has a second, non-negotiable job: pulling the picture toward the theme's
   ground so the panes read as belonging to it. The four shipped graphics clear the
   ink bar with no veil at all, and left to the measurement alone they would come
   back fully saturated. So the search starts at this floor and only ever goes up. */
const BASIC_VEIL_FLOOR = 0.14;
/* Blur radius, measured rather than picked. The blur is here to soften the detail
   sitting under the text and to push the picture back, and detail is measurable:
   the mean luminance step between neighbouring pixels. A flat two-colour graphic
   has almost none, a photograph has a great deal, so the radius follows the picture
   instead of being a number chosen for whichever image happened to be on screen —
   26px was right for a photograph and far too much for these waves.
   Calibrated on what there is to calibrate on: the four shipped graphics measure
   0.012 to 0.030 and land near the floor. The knee is the honest weak point — with
   no photograph in the set I could not measure where real content sits, and white
   noise is no help because downsampling averages it away and UNDER-reports it. If
   an uploaded photograph comes out too soft or too sharp, this constant is the one
   to move, and nothing else. */
const BASIC_BLUR_MIN = 6, BASIC_BLUR_MAX = 22, BASIC_DETAIL_KNEE = 0.10;

function _cssRGBA(v) {
  v = (v || '').trim();
  let m = /^#([0-9a-fA-F]{3,8})$/.exec(v);
  if (m) {
    let h = m[1];
    if (h.length === 3 || h.length === 4) h = h.split('').map(c => c + c).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16),
            h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1];
  }
  m = /rgba?\(([^)]+)\)/i.exec(v);
  if (!m) return null;
  const n = m[1].split(/[,\s/]+/).filter(Boolean).map(parseFloat);
  if (n.length < 3 || n.some(isNaN)) return null;
  return [n[0], n[1], n[2], n.length > 3 ? n[3] : 1];
}
function _lum(c) {
  const f = x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function _contrast(a, b) {
  const la = _lum(a), lb = _lum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function _mix(fg, a, bg) { return [0, 1, 2].map(i => Math.round(a * fg[i] + (1 - a) * bg[i])); }

function tuneBasicBackdrop(url) {
  if (!url) return;
  const root = document.documentElement;
  const cs = getComputedStyle(root);
  const ground = _cssRGBA(cs.getPropertyValue('--bg'));
  const off    = _cssRGBA(cs.getPropertyValue('--tile-off'));
  const ink    = _cssRGBA(cs.getPropertyValue('--text'));
  if (!ground || !off || !ink) return;   // theme without panes (dark, mono, posters)
  const img = new Image();
  img.onerror = () => {};
  img.onload = () => {
    // 48, not 24: the detail metric below needs neighbouring pixels to still be
    // neighbours. The veil's dark percentile is unchanged by the finer grid.
    const N = 48, cv = document.createElement('canvas');
    cv.width = N; cv.height = N;
    let d;
    try {
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, N, N);
      d = ctx.getImageData(0, 0, N, N).data;
    } catch (e) { return; }             // tainted canvas → keep the declared veil
    // Detail → blur radius. Rec. 601 weights, which is what the calibration above
    // was measured with. Read before the sort: it needs the pixels in place.
    const lumAt = (x, y) => { const i = (y * N + x) * 4;
      return 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; };
    let steps = 0, pairs = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (x + 1 < N) { steps += Math.abs(lumAt(x, y) - lumAt(x + 1, y)); pairs++; }
      if (y + 1 < N) { steps += Math.abs(lumAt(x, y) - lumAt(x, y + 1)); pairs++; }
    }
    const detail = pairs ? (steps / pairs) / 255 : 0;
    const blur = BASIC_BLUR_MIN + (BASIC_BLUR_MAX - BASIC_BLUR_MIN)
               * Math.min(1, detail / BASIC_DETAIL_KNEE);
    root.style.setProperty('--bg-blur', blur.toFixed(1) + 'px');

    const px = [];
    for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i + 1], d[i + 2]]);
    px.sort((a, b) => _lum(a) - _lum(b));
    const worst = px[Math.floor(px.length * BASIC_DARK_PCT)];
    let alpha = 0.85;
    for (let a = BASIC_VEIL_FLOOR; a <= 0.851; a += 0.05) {
      const pane = _mix(off, off[3], _mix(ground, a, worst));
      if (_contrast(ink, pane) >= BASIC_INK_MIN) { alpha = Math.round(a * 100) / 100; break; }
    }
    root.style.setProperty('--basic-bg-veil',
      `rgba(${Math.round(ground[0])},${Math.round(ground[1])},${Math.round(ground[2])},${alpha})`);
  };
  img.src = url;
}

/* An upload is downscaled and re-encoded through a canvas before being stored: a
   camera file is several MB and would blow the browser's storage quota outright,
   and the re-encode drops the EXIF (orientation aside, that is where the GPS tag
   lives) on the way. */
function _setBgUpload(file) {
  if (!file) return;
  setFeedback('Reading the picture…');
  const fr = new FileReader();
  fr.onerror = () => setFeedback('Could not read that picture');
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => setFeedback('Could not read that picture');
    img.onload = () => {
      const scale = Math.min(1, BASIC_BG_MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      let data;
      try {
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', .82);
      } catch (e) { setFeedback('Could not read that picture'); return; }
      try {
        localStorage.setItem(BASIC_BG_DATA, data);
        localStorage.setItem(BASIC_BG_KEY, 'custom');
      } catch (e) { setFeedback('Picture too large for this browser'); return; }
      initBasicBackground(); renderSettings(); setFeedback('Background updated');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ── Mopidy RPC ── */
// ─── Mopidy WebSocket (real-time, Iris-style) ───────────────────────────────
// RPCs go over the WS when it's open → no more POST /api/mopidy_rpc (quieter
// logs) and Mopidy events arrive via push (no more 1/s polling). Automatic
// fallback to the HTTP proxy /api/mopidy_rpc when the WS is unavailable.
let mopidyWsUrl = null, mopidyWS = null, wsReqId = 1;
const wsPending = new Map();
let _wsReadyResolve = null;
const wsReady = new Promise(res => { _wsReadyResolve = res; });   // résolu à la 1re ouverture (ou si pas de WS)
function _markWsReady() { if (_wsReadyResolve) { _wsReadyResolve(); _wsReadyResolve = null; } }
function connectMopidyWS() {
  if (!mopidyWsUrl) { _markWsReady(); return; }   // pas de WS configuré → ne bloque pas l'init
  let ws;
  try { ws = new WebSocket(mopidyWsUrl); } catch (e) { _markWsReady(); return; }
  mopidyWS = ws;
  ws.addEventListener('open', _markWsReady);
  ws.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.id != null && wsPending.has(m.id)) {
      const p = wsPending.get(m.id); wsPending.delete(m.id); clearTimeout(p.t); p.resolve(m);
    } else if (m.event) { onMopidyEvent(m); }
  });
  ws.addEventListener('close', () => {
    if (mopidyWS === ws) mopidyWS = null;
    setTimeout(connectMopidyWS, 3000);          // auto-reconnect
  });
  ws.addEventListener('error', () => { try { ws.close(); } catch (_) {} });
}
function wsRpc(method, params) {
  return new Promise((resolve) => {
    const id = wsReqId++;
    const t = setTimeout(() => { if (wsPending.has(id)) { wsPending.delete(id); resolve(null); } }, 5000);
    wsPending.set(id, { resolve, t });
    try { mopidyWS.send(JSON.stringify({ jsonrpc: '2.0', id, method, params })); }
    catch (e) { wsPending.delete(id); clearTimeout(t); resolve(null); }
  });
}
async function rpc(method, params = {}) {
  if (mopidyWS && mopidyWS.readyState === 1) {        // 1 = OPEN
    const r = await wsRpc(method, params);
    if (r) return r;                                  // otherwise HTTP fallback below
  }
  try {
    const r = await fetch(API + '/mopidy_rpc', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc: '2.0', id: 1, method, params})
    });
    return await r.json();
  } catch(e) { return null; }
}

let currentDurationMs = 0;

/* Optimistic feedback. Every transport action paints its expected outcome NOW and
   lets the server confirm it (WS event + refresh). A refresh that was already in
   flight when the user acted carries a snapshot from before the action, so it is
   dropped (refreshNowPlaying compares its start time with _lastUserActionAt) —
   otherwise it would paint the previous state back over the optimistic one. */
let _lastUserActionAt = 0;

document.getElementById('btn-play').addEventListener('click', async () => {

  const isPlaying = document.getElementById('btn-play').dataset.state === 'playing';

  setClock(clockPosMs(), !isPlaying);    // …and so does the clock
  if (isPlaying) {
    await rpc('core.playback.pause');

});
/* Optimistic skip: the destination row is already in the tracklist we hold, so
   the whole header switches to it IMMEDIATELY — title, artist, album, duration,
   cover (from the cache the prefetch filled), status, tags and details — then the
   server confirms. _optTlid remembers where a chain of quick taps has got to, so
   a second "next" before the first is confirmed moves on from the right row. */
let _optTlid = null, _expectedUri = null;
function optimisticSkip(delta) {
  const from = _optTlid != null ? _optTlid : currentTlid;
  const i = matrixTlItems.findIndex(it => it.tlid === from);
  const dest = i >= 0 ? matrixTlItems[i + delta] : null;
  if (!dest) return;
  _lastUserActionAt = Date.now();
  _optTlid = dest.tlid; _expectedUri = dest.uri || null;
  currentDurationMs = dest.length || 0;
  document.getElementById('prog-duration').textContent = msToMin(currentDurationMs);
  updateCurrentRow(document.getElementById('tracklist-wrap'), dest.tlid);
  switchNowPlayingTo(dest.uri, dest);
}

  if (OFF.on) { offSkip(1); return; }

});
document.getElementById('btn-prev').addEventListener('click', async () => {
  if (OFF.on) { offSkip(-1); return; }
  resetProgress();
  optimisticSkip(-1);
  await rpc('core.playback.previous');
  refreshNowPlaying();
});
