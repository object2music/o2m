<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>O2M Mood</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #1a1a2e; --surface: #16213e; --card: #0f3460;
    --accent: #e94560; --text: #eaeaea; --muted: #8892a4;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; height: 100dvh; }

  /* ── Now Playing ── */
  #now-playing {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--surface);
    border-bottom: 1px solid #ffffff18; flex-shrink: 0;
  }
  #cover { width: 52px; height: 52px; border-radius: 6px; object-fit: cover;
           background: var(--card); flex-shrink: 0; }
  #track-info { flex: 1; min-width: 0; }
  #track-name { font-size: 14px; font-weight: 600; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  #artist-name { font-size: 12px; color: var(--muted); margin-top: 2px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%;
                background: var(--muted); flex-shrink: 0; transition: background .3s; }
  #status-dot.playing { background: #4caf50; }

  /* track status badge */
  #track-status-badge {
    display: inline-block; margin-top: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 10px;
    background: #ffffff18; color: var(--muted);
    text-transform: uppercase; transition: background .2s, color .2s;
  }
  #track-status-badge.s-library   { background: #1565c066; color: #4fc3f7; }
  #track-status-badge.s-favorites { background: #2e7d3266; color: #81c784; }
  #track-status-badge.s-incoming  { background: #f57f1766; color: #ffb74d; }
  #track-status-badge.s-new       { background: #e65c0066; color: #ff8a65; }
  #track-status-badge.s-trash     { background: #c62828aa; color: #ef9a9a; }
  #track-status-badge.s-hidden    { background: #4a148c66; color: #ce93d8; }
  #track-status-badge.s-podcast   { background: #37474f66; color: #90a4ae; }

  /* tracklist count pill */
  #tl-count-pill {
    font-size: 11px; color: var(--muted); background: #ffffff12;
    padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
    white-space: nowrap;
  }

  /* volume row */
  #volume-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 2px 14px 0;
  }
  #volume-icon { font-size: 16px; flex-shrink: 0; color: var(--muted); }
  #volume-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px; outline: none; cursor: pointer;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--vol-pct, 50%), #ffffff28 var(--vol-pct, 50%));
  }
  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  #volume-val { font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; flex-shrink: 0; }

  /* ── Track extra bar (tags + energy/valence) ── */
  #track-tags-bar {
    padding: 5px 14px; background: var(--surface);
    border-bottom: 1px solid #ffffff18; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; min-height: 30px;
  }
  #track-tags-bar::-webkit-scrollbar { display: none; }
  .tag-chip {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    border: 1px solid #ffffff18; color: var(--muted);
    white-space: nowrap; flex-shrink: 0;
  }
  #track-ev {
    font-size: 10px; color: var(--muted); white-space: nowrap;
    flex-shrink: 0; margin-left: 4px; padding-left: 8px;
    border-left: 1px solid #ffffff18;
  }

  /* ── Controls ── */
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 28px;
    padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid #ffffff18; flex-shrink: 0;
  }
  .ctrl-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 26px; line-height: 1; padding: 6px; border-radius: 50%;
    transition: background .15s, transform .1s;
  }
  .ctrl-btn:active { background: #ffffff20; transform: scale(.92); }
  #btn-play { font-size: 34px; color: var(--accent); }

  /* ── Scrollable content ── */
  #scroll-area {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  /* ── Dials ── */
  #dials {
    display: flex; flex-direction: row; justify-content: space-around;
    align-items: flex-end; padding: 12px 8px 4px; gap: 4px;
  }
  .dial-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dial-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .08em; text-align: center; }
  .dial-svg { touch-action: none; cursor: grab; display: block; }
  .dial-svg:active { cursor: grabbing; }
  .dial-track { fill: none; stroke: #ffffff18; stroke-width: 8; stroke-linecap: round; }
  .dial-fill  { fill: none; stroke-width: 8; stroke-linecap: round;
                transition: stroke-dashoffset .05s; }
  .dial-sub { font-size: 10px; color: var(--muted); text-align: center; }

  /* ── Controls-matrix layout ── */
  #controls-matrix { display: flex; flex-direction: column; }
  #left-panel { display: flex; flex-direction: column; }
  #boxes-panel {
    padding: 12px 14px; border-top: 1px solid #ffffff0c;
  }
  #boxes-panel-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 8px;
  }
  #boxes-wrap { display: flex; flex-direction: column; gap: 5px; }
  .box-btn {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500;
    border: 1px solid #ffffff18; background: #ffffff08; color: var(--muted);
    cursor: pointer; transition: all .15s; text-align: left;
    display: flex; align-items: center; gap: 7px; width: 100%;
  }
  .box-btn .box-icon { font-size: 13px; flex-shrink: 0; }
  .box-btn.active { background: #e9456022; border-color: var(--accent); color: #fff; }
  .box-btn.active .box-icon { color: var(--accent); }
  .box-btn:active { transform: scale(.98); }
  .box-btn:disabled { opacity: .5; cursor: wait; }

  @media (min-width: 600px) {
    #controls-matrix { flex-direction: row; align-items: flex-start; }
    #left-panel { flex: 2; border-right: 1px solid #ffffff0c; }
    #boxes-panel { flex: 1; border-top: none; padding: 12px 16px; min-height: 200px; }
    #dials { padding: 10px 8px 4px; }
    #matrix-section { padding: 2px 8px 8px; min-width: 0; }
  }

  /* ── Matrix ── */
  #matrix-section { padding: 4px 14px 6px; }
  #mood-matrix { display: block; width: 100%; aspect-ratio: 1 / 1;
                 touch-action: none; cursor: crosshair; border-radius: 8px; }
  #mood-matrix.cursor-resize { cursor: ew-resize; }

  /* ── Matrix tooltip ── */
  #matrix-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 200;
    background: var(--surface); border: 1px solid #ffffff28; border-radius: 8px;
    padding: 8px 12px; max-width: 200px;
    box-shadow: 0 4px 20px #00000070;
  }
  #matrix-tooltip .tt-name   { font-size: 13px; font-weight: 600; white-space: nowrap;
                                overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-artist { font-size: 11px; color: var(--muted); margin-top: 2px;
                                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-ev     { font-size: 10px; color: var(--muted); margin-top: 5px;
                                display: flex; gap: 8px; }

  /* ── Genres ── */
  #genres-section { padding: 10px 14px 6px; }
  #genres-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                  letter-spacing: .08em; margin-bottom: 7px; }
  #genres-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre-chip {
    padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid #ffffff28; background: none; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .genre-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .genre-chip:active { transform: scale(.95); }

  /* ── Tracklist ── */
  #tracklist-section { padding: 10px 14px 4px; }
  #tracklist-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #tracklist-count { font-size: 11px; color: var(--muted); }
  #tracklist-wrap { display: flex; flex-direction: column; gap: 2px; }
  .tl-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    transition: background .12s;
  }
  .tl-item:active { background: #ffffff10; }
  .tl-item.current { background: var(--card); }
  .tl-item.current .tl-name { color: var(--accent); }
  .tl-num { font-size: 11px; color: var(--muted); min-width: 18px; text-align: right; flex-shrink: 0; }
  .tl-item.current .tl-num { color: var(--accent); }
  .tl-texts { flex: 1; min-width: 0; }
  .tl-name { font-size: 13px; font-weight: 500; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .tl-artist { font-size: 11px; color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tl-dur { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .tl-status {
    font-size: 10px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tl-status.s-library   { color: #4fc3f7; }
  .tl-status.s-favorites { color: #81c784; }
  .tl-status.s-incoming  { color: #ffb74d; }
  .tl-status.s-new       { color: #ff8a65; }
  .tl-status.s-trash     { color: #ef9a9a; }
  .tl-status.s-hidden    { color: #ce93d8; }
  .tl-status.s-podcast   { color: #90a4ae; }

  /* ── Footer links ── */
  #footer-links {
    padding: 12px 14px 20px; border-top: 1px solid #ffffff0c;
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  }
  .footer-link {
    font-size: 11px; color: var(--muted); text-decoration: none;
    padding: 3px 10px; border-radius: 10px;
    background: #ffffff08; border: 1px solid #ffffff14;
    transition: background .15s; white-space: nowrap;
  }
  .footer-link:hover { background: #ffffff18; color: var(--text); }
  button.footer-link { cursor: pointer; }

  /* ── Feedback ── */
  #feedback {
    flex-shrink: 0; padding: 6px 14px 8px;
    font-size: 11px; color: var(--muted); text-align: center; min-height: 22px;
  }
</style>
</head>
<body>

<!-- Now playing -->
<div id="now-playing">
  <img id="cover" src="" alt="">
  <div id="track-info">
    <div id="track-name">—</div>
    <div id="artist-name">O2M Mood</div>
    <div id="track-status-badge"></div>
  </div>
  <span id="tl-count-pill"></span>
  <div id="status-dot"></div>
</div>

<!-- Track extra: tags + energy/valence -->
<div id="track-tags-bar">
  <span id="track-ev"></span>
</div>

<!-- Playback controls -->
<div id="controls">
  <button class="ctrl-btn" id="btn-prev">⏮</button>
  <button class="ctrl-btn" id="btn-play">▶</button>
  <button class="ctrl-btn" id="btn-next">⏭</button>
  <div id="volume-row">
    <span id="volume-icon">🔈</span>
    <input type="range" id="volume-slider" min="0" max="100" value="50">
    <span id="volume-val">50%</span>
  </div>
</div>

<!-- Scrollable area -->
<div id="scroll-area">

  <!-- Dials + Matrix | Boxes -->
  <div id="controls-matrix">
  <div id="left-panel">
  <div id="dials">
    <div class="dial-wrap">
      <div class="dial-label">Énergie</div>
      <svg class="dial-svg" id="dial-energy" width="100" height="100" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-energy" cx="55" cy="55" r="42"
                stroke="#e94560" transform="rotate(135 55 55)"/>
        <circle id="knob-energy" cx="55" cy="13" r="7" fill="#e94560"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-energy">5</text>
      </svg>
      <div class="dial-sub">calme ↔ intense</div>
    </div>

    <div class="dial-wrap">
      <div class="dial-label">Valence</div>
      <svg class="dial-svg" id="dial-valence" width="100" height="100" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-valence" cx="55" cy="55" r="42"
                stroke="#7c4dff" transform="rotate(135 55 55)"/>
        <circle id="knob-valence" cx="55" cy="13" r="7" fill="#7c4dff"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-valence">5</text>
      </svg>
      <div class="dial-sub">sombre ↔ joyeux</div>
    </div>

    <div class="dial-wrap">
      <div class="dial-label">Découverte</div>
      <svg class="dial-svg" id="dial-dl" width="100" height="100" viewBox="0 0 110 110">
        <circle class="dial-track" cx="55" cy="55" r="42" transform="rotate(135 55 55)"/>
        <circle class="dial-fill" id="fill-dl" cx="55" cy="55" r="42"
                stroke="#00bcd4" transform="rotate(135 55 55)"/>
        <circle id="knob-dl" cx="55" cy="13" r="7" fill="#00bcd4"/>
        <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-dl">5</text>
      </svg>
      <div class="dial-sub">précis ↔ aventurier</div>
    </div>
  </div>

  <!-- Matrix energy × valence -->
  <div id="matrix-section">
    <canvas id="mood-matrix"></canvas>
  </div>
  </div><!-- /left-panel -->

  <!-- Boxes toggle panel (1/3) -->
  <div id="boxes-panel">
    <div id="boxes-panel-label">Boxes</div>
    <div id="boxes-wrap"></div>
  </div>
  </div><!-- /controls-matrix -->

  <!-- Genres -->
  <div id="genres-section">
    <div id="genres-label">Genres</div>
    <div id="genres-wrap"></div>
  </div>

  <!-- Tracklist -->
  <div id="tracklist-section">
    <div id="tracklist-label">
      <span>Tracklist</span>
      <span id="tracklist-count"></span>
    </div>
    <div id="tracklist-wrap"></div>
  </div>

  <!-- Footer links -->
  <div id="footer-links">
    <a class="footer-link" href="/stats">📊 Stats</a>
    <a class="footer-link" href="/tag_features">🏷 Tag features</a>
    <a class="footer-link" href="/mood">🎛 Mood</a>
    <button class="footer-link" onclick="triggerWarmup('moods')">⚡ Warmup moods</button>
    <button class="footer-link" onclick="triggerWarmup('retry_sentinels')">🔁 Retry sentinels</button>
    <button class="footer-link" onclick="triggerWarmup('genres')">🎸 Warmup genres</button>
  </div>

</div><!-- /scroll-area -->

<div id="matrix-tooltip">
  <div class="tt-name"></div>
  <div class="tt-artist"></div>
  <div class="tt-ev"></div>
</div>
<div id="feedback"></div>

<script>
const API = location.origin + '/api';

/* ── State ── */
let appState = { energy: 0.5, valence: 0.6, dl: 5, genres: [] };
let applyTimer = null;
let currentTlid = null;

/* ── Dial geometry ── */
const R = 42, CX = 55, CY = 55;
const CIRC = 2 * Math.PI * R;
const ARC  = CIRC * 270 / 360;

function setupDial(id) {
  const svg   = document.getElementById('dial-' + id);
  const track = svg.querySelector('.dial-track');
  const fill  = svg.querySelector('.dial-fill');
  track.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  track.setAttribute('stroke-dashoffset', 0);
  fill.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  fill.setAttribute('stroke-dashoffset', ARC);
}

function setDial(id, v01) {
  const fill = document.getElementById('fill-' + id);
  const knob = document.getElementById('knob-' + id);
  const txt  = document.getElementById('txt-' + id);
  fill.setAttribute('stroke-dashoffset', ARC * (1 - v01));
  const a = (135 + v01 * 270) * Math.PI / 180;
  knob.setAttribute('cx', (CX + R * Math.cos(a)).toFixed(1));
  knob.setAttribute('cy', (CY + R * Math.sin(a)).toFixed(1));
  txt.textContent = Math.round(v01 * 10);
}

function makeDraggable(id, onChange) {
  const svg = document.getElementById('dial-' + id);
  let active = false;
  function v01fromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - (rect.left + rect.width / 2);
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - (rect.top  + rect.height / 2);
    let deg = Math.atan2(py, px) * 180 / Math.PI - 135;
    if (deg < 0) deg += 360;
    return Math.min(Math.max(deg, 0), 270) / 270;
  }
  svg.addEventListener('pointerdown', e => {
    active = true; svg.setPointerCapture(e.pointerId);
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointermove', e => {
    if (!active) return; e.preventDefault();
    const v = v01fromEvent(e); setDial(id, v); onChange(v);
  });
  svg.addEventListener('pointerup', () => { active = false; scheduleApply(); });
}

/* ── Apply ── */
function scheduleApply() {
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyMood, 1800);
}

async function applyMood() {
  setFeedback('Application…');
  try {
    const body = { energy: appState.energy, valence: appState.valence,
                   discover_level: appState.dl, genres: appState.genres };
    const r = await fetch(API + '/mood', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    setFeedback(d.tracks_added > 0 ? `${d.tracks_added} titres chargés` : 'Aucun titre correspondant');
    setTimeout(refreshNowPlaying, 600);
  } catch(e) { setFeedback('Erreur réseau'); }
}

/* ── Mopidy RPC ── */
async function rpc(method, params = {}) {
  try {
    const r = await fetch(API + '/mopidy_rpc', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({jsonrpc: '2.0', id: 1, method, params})
    });
    return await r.json();
  } catch(e) { return null; }
}

/* ── Controls ── */
document.getElementById('btn-play').addEventListener('click', async () => {
  await fetch(API + '/toogle_play');
  setTimeout(refreshNowPlaying, 500);
});
document.getElementById('btn-next').addEventListener('click', async () => {
  await rpc('core.playback.next');
  setTimeout(refreshNowPlaying, 800);
});
document.getElementById('btn-prev').addEventListener('click', async () => {
  await rpc('core.playback.previous');
  setTimeout(refreshNowPlaying, 800);
});

/* ── Now playing + tracklist ── */
function msToMin(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function imageUrl(uri) {
  if (!uri) return '';
  if (uri.startsWith('http')) return uri;
  return API + '/mopidy_image?uri=' + encodeURIComponent(uri);
}

function renderTracklist(tracks, activeTlid) {
  const wrap = document.getElementById('tracklist-wrap');
  const count = document.getElementById('tracklist-count');
  wrap.innerHTML = '';
  count.textContent = tracks.length ? `${tracks.length} titres` : '';
  let scrollTarget = null;
  tracks.forEach(({tlid, track}, i) => {
    const item = document.createElement('div');
    item.className = 'tl-item' + (tlid === activeTlid ? ' current' : '');
    const num = document.createElement('div');
    num.className = 'tl-num';
    num.textContent = tlid === activeTlid ? '▶' : (i + 1);
    const texts = document.createElement('div');
    texts.className = 'tl-texts';
    const cached = getCachedStatus(track.uri);
    const statusHtml = cached
      ? `<div class="tl-status ${STATUS_CLASS[(cached.split(' - ')[0]||'').trim().toLowerCase()]||''}"
              data-uri="${track.uri.replace(/"/g,'&quot;')}">${formatStatus(cached)}</div>`
      : `<div class="tl-status" data-uri="${track.uri.replace(/"/g,'&quot;')}"></div>`;
    texts.innerHTML = `<div class="tl-name">${track.name || '?'}</div>
      <div class="tl-artist">${(track.artists||[]).map(a=>a.name).join(', ')}</div>
      ${statusHtml}`;
    const dur = document.createElement('div');
    dur.className = 'tl-dur';
    dur.textContent = msToMin(track.length);
    item.append(num, texts, dur);
    item.addEventListener('click', () => {
      rpc('core.playback.play', {tlid}).then(() => setTimeout(refreshNowPlaying, 500));
    });
    wrap.appendChild(item);
    if (tlid === activeTlid) scrollTarget = item;
  });
  // if (scrollTarget) scrollTarget.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  fetchTracklistStatuses(tracks);
}

const STATUS_CLASS = {
  library: 's-library', normal: 's-library',
  favorites: 's-favorites', incoming: 's-incoming',
  new: 's-new', trash: 's-trash', hidden: 's-hidden', podcast: 's-podcast',
};

/* ── Status helpers ── */
const statusCache = new Map(); // uri → {text, ts}
const STATUS_TTL  = 5 * 60 * 1000;

function getCachedStatus(uri) {
  const e = statusCache.get(uri);
  if (!e || Date.now() - e.ts > STATUS_TTL) return null;
  return e.text;
}

function formatStatus(raw) {
  if (!raw || raw === 'Manual') return '';
  const parts = raw.split(' - ');
  const ot    = parts[0] || '';
  const score = parts[1] || '';
  let lib     = (parts[2] || '').replace(/^(playlist|album|artist):/, '').trim();
  if (score && lib) return lib.startsWith('(')
    ? `${ot} · ${score} ${lib}`
    : `${ot} · ${score} · ${lib}`;
  if (score) return `${ot} · ${score}`;
  return ot;
}

function applyStatusEl(el, raw) {
  const ot  = (raw || '').split(' - ')[0].trim().toLowerCase();
  const cls = STATUS_CLASS[ot] || '';
  el.textContent = formatStatus(raw);
  el.className   = 'tl-status' + (cls ? ' ' + cls : '');
}

async function fetchStatus(uri) {
  const cached = getCachedStatus(uri);
  if (cached !== null) return cached;
  try {
    const r = await fetch(API + '/track_status?uri=' + encodeURIComponent(uri));
    const t = r.ok ? await r.text() : '';
    statusCache.set(uri, { text: t, ts: Date.now() });
    return t;
  } catch(e) { return ''; }
}

function updateStatusBadge(text) {
  const el = document.getElementById('track-status-badge');
  const ot = (text || '').split(' - ')[0].trim().toLowerCase();
  el.textContent = formatStatus(text);
  el.className   = STATUS_CLASS[ot] || '';
}

async function fetchTracklistStatuses(tracks) {
  const CONCURRENCY = 4;
  for (let i = 0; i < tracks.length; i += CONCURRENCY) {
    await Promise.all(
      tracks.slice(i, i + CONCURRENCY).map(async ({ track }) => {
        if (!track?.uri) return;
        const text = await fetchStatus(track.uri);
        const el = document.querySelector(`.tl-status[data-uri="${CSS.escape(track.uri)}"]`);
        if (el && text) applyStatusEl(el, text);
      })
    );
  }
}

async function refreshVolume() {
  const r = await rpc('core.mixer.get_volume');
  const vol = r?.result ?? null;
  if (vol === null) return;
  const slider = document.getElementById('volume-slider');
  const val = document.getElementById('volume-val');
  slider.value = vol;
  slider.style.setProperty('--vol-pct', vol + '%');
  val.textContent = vol + '%';
  document.getElementById('volume-icon').textContent = vol === 0 ? '🔇' : vol < 50 ? '🔈' : '🔊';
}

async function refreshNowPlaying() {
  const [curR, stateR, tlR] = await Promise.all([
    rpc('core.playback.get_current_tl_track'),
    rpc('core.playback.get_state'),
    rpc('core.tracklist.get_tl_tracks'),
  ]);

  const tlt   = curR?.result;
  const track = tlt?.track;
  const tlid  = tlt?.tlid ?? null;
  const playing = stateR?.result === 'playing';
  const tracks  = tlR?.result || [];

  currentTlid    = tlid;
  matrixCurUri   = track?.uri ?? null;
  matrixTlItems  = tracks.map(({tlid: id, track: t}) => ({
    uri: t?.uri, tlid: id,
    name:   t?.name || '',
    artist: (t?.artists || []).map(a => a.name).join(', '),
  }));
  fetchTrackFeatures([matrixCurUri, ...matrixTlItems.map(i => i.uri)].filter(Boolean));
  fetchAndRenderTrackTags(matrixCurUri);

  document.getElementById('status-dot').className = playing ? 'playing' : '';
  document.getElementById('btn-play').textContent  = playing ? '⏸' : '▶';

  // Tracklist count pill
  document.getElementById('tl-count-pill').textContent = tracks.length ? `${tracks.length} ♫` : '';

  if (track) {
    document.getElementById('track-name').textContent  = track.name || '—';
    document.getElementById('artist-name').textContent =
      (track.artists || []).map(a => a.name).join(', ') || '—';

    // o2m track status badge
    try {
      const statusText = await fetch(API + '/track_status?uri=' + encodeURIComponent(track.uri))
        .then(r => r.ok ? r.text() : '');
      updateStatusBadge(statusText);
    } catch(e) { updateStatusBadge(''); }

    // Fetch album art via get_images
    const imgR = await rpc('core.library.get_images', {uris: [track.uri]});
    const imgs = imgR?.result?.[track.uri] || [];
    const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
    const coverEl = document.getElementById('cover');
    coverEl.src = best ? imageUrl(best.uri || best) : '';
  } else {
    updateStatusBadge('');
  }

  renderTracklist(tracks, tlid);
}

/* ── Genres ── */
async function loadGenres() {
  try {
    const genres = await fetch(API + '/genres').then(r => r.json());
    const wrap = document.getElementById('genres-wrap');
    genres.slice(0, 20).forEach(g => {
      const chip = document.createElement('button');
      chip.className = 'genre-chip';
      chip.textContent = g.name;
      chip.dataset.name = g.name;
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        appState.genres = [...wrap.querySelectorAll('.genre-chip.active')].map(c => c.dataset.name);
        scheduleApply();
      });
      wrap.appendChild(chip);
    });
  } catch(e) {}
}

/* ── Volume slider ── */
let volumeTimer = null;
document.getElementById('volume-slider').addEventListener('input', e => {
  const vol = parseInt(e.target.value);
  e.target.style.setProperty('--vol-pct', vol + '%');
  document.getElementById('volume-val').textContent = vol + '%';
  document.getElementById('volume-icon').textContent = vol === 0 ? '🔇' : vol < 50 ? '🔈' : '🔊';
  clearTimeout(volumeTimer);
  volumeTimer = setTimeout(() => rpc('core.mixer.set_volume', {volume: vol}), 200);
});

/* ── MATRIX energy × valence ── */
const PAD = 28;
let matrixFeatures = {};   // uri → {energy, valence}
let matrixTlItems  = [];   // [{uri, tlid}]
let matrixCurUri   = null;
let matrixMode     = 'move'; // 'move' | 'resize'

function moodColor(e, v, a = 1) {
  if (e > 0.5 && v > 0.5) return `rgba(255,210,60,${a})`;   // happy
  if (e > 0.5)             return `rgba(233,69,96,${a})`;    // energetic
  if (v > 0.5)             return `rgba(130,100,255,${a})`;  // calm
  return                          `rgba(60,140,240,${a})`;   // dark
}

function initMatrix() {
  const canvas = document.getElementById('mood-matrix');
  const dpr    = window.devicePixelRatio || 1;

  function resizeCanvas() {
    const w = canvas.offsetWidth;
    canvas.width  = w * dpr;
    canvas.height = w * dpr;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(canvas);

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    matrixMode = detectMatrixMode(canvas, e);
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointermove', e => {
    if (!e.buttons) {
      const mode = detectMatrixMode(canvas, e);
      canvas.classList.toggle('cursor-resize', mode === 'resize');
      showMatrixTooltip(canvas, e);
      return;
    }
    e.preventDefault();
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointerup',    () => scheduleApply());
  canvas.addEventListener('pointerleave', () => hideMatrixTooltip());

  requestAnimationFrame(drawMatrix);
}

function detectMatrixMode(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const r  = (appState.dl / 20 + 0.05) * inner;
  const dx = Math.abs(e.clientX - tx);
  const dy = Math.abs(e.clientY - ty);
  const dist = Math.max(dx, dy);           // Chebyshev = square metric
  const HANDLE = 14;                       // px tolerance around border
  return Math.abs(dist - r) < HANDLE ? 'resize' : 'move';
}

function matrixMove(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  appState.energy  = energy;
  appState.valence = valence;
  setDial('energy', energy);
  setDial('valence', valence);
}

function matrixResize(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const dx = Math.abs(e.clientX - tx);
  const dy = Math.abs(e.clientY - ty);
  const radius01 = Math.max(dx, dy) / inner;
  const dl = Math.min(10, Math.max(0, Math.round((radius01 - 0.05) * 20)));
  appState.dl = dl;
  setDial('dl', dl / 10);
}

function drawMatrix(ts) {
  requestAnimationFrame(drawMatrix);
  const canvas = document.getElementById('mood-matrix');
  if (!canvas) return;

  const dpr   = window.devicePixelRatio || 1;
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const inner = W - 2 * PAD;
  const ctx   = canvas.getContext('2d');

  const ex = e => PAD + e * inner;
  const vy = v => PAD + (1 - v) * inner;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  /* Background */
  ctx.fillStyle = '#0b1829';
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, 8); ctx.fill();

  const mx = PAD + inner / 2, my = PAD + inner / 2;

  /* Quadrant fills */
  [
    [PAD, PAD, inner/2, inner/2, '#7c4dff14'], // calm      top-left
    [mx,  PAD, inner/2, inner/2, '#ffd74018'], // happy     top-right
    [PAD, my,  inner/2, inner/2, '#1a4a9022'], // dark      bottom-left
    [mx,  my,  inner/2, inner/2, '#e9456014'], // energetic bottom-right
  ].forEach(([x, y, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); });

  /* Center lines */
  ctx.strokeStyle = '#ffffff1e'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(mx, PAD); ctx.lineTo(mx, PAD + inner);
  ctx.moveTo(PAD, my); ctx.lineTo(PAD + inner, my);
  ctx.stroke(); ctx.setLineDash([]);

  /* Inner border */
  ctx.strokeStyle = '#ffffff18'; ctx.lineWidth = 1;
  ctx.strokeRect(PAD, PAD, inner, inner);

  /* Quadrant labels */
  ctx.font = '9px system-ui'; ctx.fillStyle = '#ffffff30'; ctx.textAlign = 'center';
  ctx.fillText('CALM',       PAD + inner * 0.25, PAD + 13);
  ctx.fillText('HAPPY',      PAD + inner * 0.75, PAD + 13);
  ctx.fillText('DARK',       PAD + inner * 0.25, PAD + inner - 5);
  ctx.fillText('ENERGETIC',  PAD + inner * 0.75, PAD + inner - 5);

  /* Axis labels */
  ctx.font = '8px system-ui'; ctx.fillStyle = '#ffffff44';
  ctx.textAlign = 'left';   ctx.fillText('◀ Calme',   2, my + 4);
  ctx.textAlign = 'right';  ctx.fillText('Intense ▶', W - 2, my + 4);
  ctx.textAlign = 'center';
  ctx.fillText('▲ Joyeux', mx, 9);
  ctx.fillText('▼ Sombre', mx, PAD + inner + PAD - 3);

  /* Tracklist dots */
  matrixTlItems.forEach(({ uri, tlid }) => {
    const f = matrixFeatures[uri];
    if (!f || tlid === currentTlid) return;
    ctx.beginPath();
    ctx.arc(ex(f.energy), vy(f.valence), 3, 0, Math.PI * 2);
    ctx.fillStyle = moodColor(f.energy, f.valence, 0.55);
    ctx.fill();
  });

  /* Currently playing — vibing dot */
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const cx = ex(curF.energy), cy = vy(curF.valence);
    const pulse = (Math.sin(ts / 600) + 1) / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 9 + pulse * 6, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.28 * (1 - pulse)})`;
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = moodColor(curF.energy, curF.valence, 1);
    ctx.lineWidth = 2.5; ctx.stroke();
  }

  /* DL area — dashed rectangle matching actual query shape */
  const { energy, valence, dl } = appState;
  const r  = (dl / 20 + 0.05) * inner;
  const tx = ex(energy), ty = vy(valence);
  const rx = Math.max(PAD, tx - r),           ry = Math.max(PAD, ty - r);
  const rw = Math.min(PAD + inner, tx + r) - rx;
  const rh = Math.min(PAD + inner, ty + r) - ry;
  ctx.fillStyle = '#00bcd40d'; ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = '#00bcd455'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]); ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([]);

  /* Target dot */
  ctx.beginPath(); ctx.arc(tx, ty, 11, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = moodColor(energy, valence, 1); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2);
  ctx.fillStyle = moodColor(energy, valence, 1); ctx.fill();

  ctx.restore();
}

function showMatrixTooltip(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const HIT   = 10; // px hit radius

  // Build candidate list: tracklist dots + currently playing
  const candidates = matrixTlItems.map(item => {
    const f = matrixFeatures[item.uri];
    if (!f) return null;
    const sx = rect.left + PAD + f.energy * inner;
    const sy = rect.top  + PAD + (1 - f.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    return d < HIT ? { item, f, d } : null;
  }).filter(Boolean);

  // Also check currently playing
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const sx = rect.left + PAD + curF.energy * inner;
    const sy = rect.top  + PAD + (1 - curF.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (d < HIT + 4) {
      const curItem = matrixTlItems.find(i => i.uri === matrixCurUri);
      candidates.push({ item: curItem || { name: '♪ En cours', artist: '' }, f: curF, d });
    }
  }

  if (!candidates.length) { hideMatrixTooltip(); return; }

  // Pick closest
  candidates.sort((a, b) => a.d - b.d);
  const { item, f } = candidates[0];

  const tip = document.getElementById('matrix-tooltip');
  tip.querySelector('.tt-name').textContent   = item?.name   || '?';
  tip.querySelector('.tt-artist').textContent = item?.artist || '';
  tip.querySelector('.tt-ev').innerHTML =
    `<span>⚡ ${f.energy.toFixed(2)}</span><span>☀ ${f.valence.toFixed(2)}</span>`;

  // Position: prefer right of dot, flip if near right edge
  const TX = 14, TY = -8;
  let left = e.clientX + TX;
  let top  = e.clientY + TY;
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  if (left + tw > window.innerWidth - 8) left = e.clientX - tw - TX;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}

function hideMatrixTooltip() {
  document.getElementById('matrix-tooltip').style.display = 'none';
}

/* ── Boxes panel ── */
const BOX_TYPE_ICON = {
  normal: '▶', favorites: '⭐', new: '🆕', incoming: '📥',
  hidden: '◎', trash: '🗑', podcast: '🎙', info: 'ℹ',
};

async function loadBoxes() {
  const wrap = document.getElementById('boxes-wrap');
  if (!wrap) return;
  try {
    const boxes = await fetch(API + '/box_favorites').then(r => r.json());
    wrap.innerHTML = '';
    boxes.forEach(box => {
      const btn = document.createElement('button');
      btn.className = 'box-btn';
      const icon = BOX_TYPE_ICON[box.option_type] || '▶';
      btn.innerHTML = `<span class="box-icon">${icon}</span> ${box.description}`;
      btn.dataset.uid = box.uid;
      btn.title = box.option_type;
      btn.addEventListener('click', () => toggleBox(box.uid, btn));
      wrap.appendChild(btn);
      checkBoxActive(box.uid, btn);
      // Refresh active state every 10min (same as o2m.js)
      setInterval(() => checkBoxActive(box.uid, btn), 600000);
    });
  } catch(e) {}
}

async function checkBoxActive(uid, btn) {
  try {
    const text = await fetch(API + '/box_activated?uid=' + encodeURIComponent(uid)).then(r => r.text());
    btn.classList.toggle('active', text.trim() === '1');
  } catch(e) {}
}

async function toggleBox(uid, btn) {
  btn.disabled = true;
  try {
    await fetch(API + '/box?uid=' + encodeURIComponent(uid) + '&mode=toogle');
    await new Promise(r => setTimeout(r, 400));
    await checkBoxActive(uid, btn);
    // Refresh tracklist after box change
    setTimeout(refreshNowPlaying, 1500);
    setFeedback(btn.classList.contains('active') ? `▶ ${btn.textContent.trim()}` : `⏹ ${btn.textContent.trim()}`);
  } catch(e) { setFeedback('Erreur box'); }
  finally { btn.disabled = false; }
}

/* ── Track tags bar ── */
async function fetchAndRenderTrackTags(uri) {
  const bar = document.getElementById('track-tags-bar');
  const evEl = document.getElementById('track-ev');
  // Clear previous tags (keep evEl)
  [...bar.querySelectorAll('.tag-chip')].forEach(el => el.remove());
  evEl.textContent = '';

  if (!uri) return;

  try {
    const tags = await fetch(API + '/track_tags?uri=' + encodeURIComponent(uri)).then(r => r.json());
    tags.slice(0, 12).forEach(({name}) => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.textContent = name;
      bar.insertBefore(chip, evEl);
    });
  } catch(e) {}

  // Energy/valence from matrixFeatures (may need a short wait for the fetch to complete)
  function updateEV() {
    const f = matrixFeatures[uri];
    if (f) evEl.textContent = `⚡ ${f.energy.toFixed(2)} · ☀ ${f.valence.toFixed(2)}`;
  }
  updateEV();
  // Retry once after features fetch completes
  setTimeout(updateEV, 1200);
}

/* ── Warmup triggers ── */
async function triggerWarmup(type) {
  const endpoints = {
    moods: '/api/warmup_moods',
    retry_sentinels: '/api/warmup_retry_sentinels',
    genres: '/api/warmup_genres',
  };
  const url = endpoints[type];
  if (!url) return;
  try {
    const d = await fetch(API.replace('/api', '') + url).then(r => r.json());
    setFeedback(`Warmup ${type} lancé — ${d.tracks_pending ?? ''} tracks en attente`);
  } catch(e) { setFeedback('Erreur warmup'); }
}

async function fetchTrackFeatures(uris) {
  const missing = [...new Set(uris)].filter(u => u && !(u in matrixFeatures));
  if (!missing.length) return;
  try {
    const qs   = missing.slice(0, 40).map(u => 'uri=' + encodeURIComponent(u)).join('&');
    const data = await fetch(API + '/track_features?' + qs).then(r => r.json());
    Object.assign(matrixFeatures, data);
  } catch(e) {}
}

/* ── Init ── */
async function init() {
  ['energy', 'valence', 'dl'].forEach(setupDial);
  makeDraggable('energy', v => { appState.energy = v; });
  makeDraggable('valence', v => { appState.valence = v; });
  makeDraggable('dl',     v => { appState.dl = Math.round(v * 10); });
  initMatrix();

  try {
    const s  = await fetch(API + '/mood').then(r => r.json());
    const e  = s.energy  ?? 0.5;
    const v  = s.valence ?? 0.6;
    const dl = s.discover_level ?? 5;
    appState.energy = e; appState.valence = v; appState.dl = dl;
    setDial('energy', e);
    setDial('valence', v);
    setDial('dl', dl / 10);
  } catch(e) {}

  await loadGenres();
  await loadBoxes();
  await refreshNowPlaying();
  await refreshVolume();
  setInterval(refreshNowPlaying, 10000);
  setInterval(refreshVolume, 15000);
}

function setFeedback(msg) {
  document.getElementById('feedback').textContent = msg;
  setTimeout(() => { document.getElementById('feedback').textContent = ''; }, 3000);
}

init();
</script>
