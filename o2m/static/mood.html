<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>O2M Mood</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #1a1a2e; --surface: #16213e; --card: #0f3460;
    --accent: #e94560; --text: #eaeaea; --muted: #8892a4;
    --dial-size: 110px;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

  /* ── Header / Now Playing ── */
  #now-playing {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: var(--surface);
    border-bottom: 1px solid #ffffff18;
  }
  #cover { width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
           background: var(--card); flex-shrink: 0; }
  #track-info { flex: 1; min-width: 0; }
  #track-name { font-size: 14px; font-weight: 600; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  #artist-name { font-size: 12px; color: var(--muted); margin-top: 2px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%;
                background: var(--muted); flex-shrink: 0; transition: background .3s; }
  #status-dot.playing { background: #4caf50; }

  /* ── Controls ── */
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 28px;
    padding: 14px 16px; background: var(--surface);
  }
  .ctrl-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 28px; line-height: 1; padding: 6px; border-radius: 50%;
    transition: background .15s, transform .1s;
  }
  .ctrl-btn:active { background: #ffffff20; transform: scale(.92); }
  #btn-play { font-size: 38px; color: var(--accent); }

  /* ── Dials section ── */
  #dials {
    display: flex; justify-content: space-around; align-items: flex-end;
    padding: 20px 8px 12px; gap: 4px;
  }
  .dial-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dial-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .08em; text-align: center; }
  .dial-value { font-size: 13px; font-weight: 700; color: var(--text); min-width: 28px;
                text-align: center; }
  .dial-svg { touch-action: none; cursor: grab; display: block; }
  .dial-svg:active { cursor: grabbing; }
  .dial-track { fill: none; stroke: #ffffff18; stroke-width: 8; stroke-linecap: round; }
  .dial-fill  { fill: none; stroke-width: 8; stroke-linecap: round;
                transition: stroke-dashoffset .05s; }
  .dial-knob  { transition: transform .05s; }

  /* ── Genres ── */
  #genres-section { padding: 12px 16px 4px; }
  #genres-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                  letter-spacing: .08em; margin-bottom: 8px; }
  #genres-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .genre-chip {
    padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid #ffffff28; background: none; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .genre-chip.active { background: var(--accent); border-color: var(--accent);
                        color: #fff; }
  .genre-chip:active { transform: scale(.95); }

  /* ── Footer feedback ── */
  #feedback {
    margin-top: auto; padding: 10px 16px;
    font-size: 11px; color: var(--muted); text-align: center; min-height: 24px;
  }
</style>
</head>
<body>

<!-- Now playing -->
<div id="now-playing">
  <img id="cover" src="" alt="">
  <div id="track-info">
    <div id="track-name">—</div>
    <div id="artist-name">O2M Mood</div>
  </div>
  <div id="status-dot"></div>
</div>

<!-- Playback controls -->
<div id="controls">
  <button class="ctrl-btn" id="btn-prev" title="Précédent">⏮</button>
  <button class="ctrl-btn" id="btn-play" title="Play/Pause">▶</button>
  <button class="ctrl-btn" id="btn-next" title="Suivant">⏭</button>
</div>

<!-- Dials -->
<div id="dials">
  <div class="dial-wrap">
    <div class="dial-label">Énergie</div>
    <svg class="dial-svg" id="dial-energy" width="110" height="110" viewBox="0 0 110 110">
      <circle class="dial-track" cx="55" cy="55" r="42"
              stroke-dasharray="227" stroke-dashoffset="57" transform="rotate(135 55 55)"/>
      <circle class="dial-fill" id="fill-energy" cx="55" cy="55" r="42"
              stroke="#e94560" stroke-dasharray="227" stroke-dashoffset="227" transform="rotate(135 55 55)"/>
      <circle class="dial-knob" id="knob-energy" cx="55" cy="13" r="7" fill="#e94560"/>
      <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-energy">5</text>
    </svg>
    <div class="dial-label" style="color:var(--text);font-size:10px" id="lbl-energy-range">calme ↔ intense</div>
  </div>

  <div class="dial-wrap">
    <div class="dial-label">Valence</div>
    <svg class="dial-svg" id="dial-valence" width="110" height="110" viewBox="0 0 110 110">
      <circle class="dial-track" cx="55" cy="55" r="42"
              stroke-dasharray="227" stroke-dashoffset="57" transform="rotate(135 55 55)"/>
      <circle class="dial-fill" id="fill-valence" cx="55" cy="55" r="42"
              stroke="#7c4dff" stroke-dasharray="227" stroke-dashoffset="227" transform="rotate(135 55 55)"/>
      <circle class="dial-knob" id="knob-valence" cx="55" cy="13" r="7" fill="#7c4dff"/>
      <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-valence">5</text>
    </svg>
    <div class="dial-label" style="color:var(--text);font-size:10px">sombre ↔ joyeux</div>
  </div>

  <div class="dial-wrap">
    <div class="dial-label">Découverte</div>
    <svg class="dial-svg" id="dial-dl" width="110" height="110" viewBox="0 0 110 110">
      <circle class="dial-track" cx="55" cy="55" r="42"
              stroke-dasharray="227" stroke-dashoffset="57" transform="rotate(135 55 55)"/>
      <circle class="dial-fill" id="fill-dl" cx="55" cy="55" r="42"
              stroke="#00bcd4" stroke-dasharray="227" stroke-dashoffset="227" transform="rotate(135 55 55)"/>
      <circle class="dial-knob" id="knob-dl" cx="55" cy="13" r="7" fill="#00bcd4"/>
      <text x="55" y="62" text-anchor="middle" fill="#eaeaea" font-size="18" font-weight="700" id="txt-dl">5</text>
    </svg>
    <div class="dial-label" style="color:var(--text);font-size:10px">précis ↔ aventurier</div>
  </div>
</div>

<!-- Genres -->
<div id="genres-section">
  <div id="genres-label">Genres</div>
  <div id="genres-wrap"></div>
</div>

<div id="feedback"></div>

<script>
const API = `${location.origin.replace(location.port, location.port)}/api`;

/* ── State ── */
let state = { energy: 0.5, valence: 0.6, dl: 5, genres: [], playing: false };
let applyTimer = null;

/* ── Dial logic ── */
// Arc: 270° starting at 135°, radius 42, center 55,55
// dasharray = 2π*42 ≈ 264. We use 227 (≈ 270° of 264 total circumference * 270/360)
// Actually: circumference = 2π*42 = 263.9. 270/360 * 263.9 = 197.9 ≈ 198
// Let's recalculate properly:
const R = 42, CX = 55, CY = 55;
const CIRC = 2 * Math.PI * R;           // 263.9
const ARC  = CIRC * 270 / 360;          // 197.9  (270° arc)
const GAP  = CIRC - ARC;                // 66.0   (90° gap at bottom)

function setupDialSVG(svg) {
  // Fix dasharray/dashoffset on track and fill
  const track = svg.querySelector('.dial-track');
  const fill  = svg.querySelector('.dial-fill');
  track.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  track.setAttribute('stroke-dashoffset', 0);
  fill.setAttribute('stroke-dasharray', ARC + ' ' + CIRC);
  fill.setAttribute('stroke-dashoffset', ARC); // starts empty
}

function setDialValue(id, value01) {
  const svg   = document.getElementById('dial-' + id);
  const fill  = document.getElementById('fill-' + id);
  const knob  = document.getElementById('knob-' + id);
  const txt   = document.getElementById('txt-' + id);

  const offset = ARC * (1 - value01);
  fill.setAttribute('stroke-dashoffset', offset);

  // Knob position: angle goes from 135° to 405° (=45°)
  const angleDeg = 135 + value01 * 270;
  const angleRad = angleDeg * Math.PI / 180;
  const kx = CX + R * Math.cos(angleRad);
  const ky = CY + R * Math.sin(angleRad);
  knob.setAttribute('cx', kx.toFixed(1));
  knob.setAttribute('cy', ky.toFixed(1));

  const display = id === 'dl' ? Math.round(value01 * 10) : Math.round(value01 * 10);
  txt.textContent = display;
}

function makeDraggable(dialId, onValue) {
  const svg = document.getElementById('dial-' + dialId);
  let dragging = false;

  function angleFromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
    let deg = Math.atan2(py, px) * 180 / Math.PI; // -180..180
    // Map to 0..270 where 0=135°, 270=45°(=405°)
    deg = deg - 135;
    if (deg < 0) deg += 360;
    return Math.min(Math.max(deg, 0), 270);
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const deg = angleFromEvent(e);
    const v01 = deg / 270;
    setDialValue(dialId, v01);
    onValue(v01);
  }

  svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture(e.pointerId); onMove(e); });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup',   () => { dragging = false; scheduleApply(); });
}

/* ── Apply changes ── */
function scheduleApply() {
  clearTimeout(applyTimer);
  applyTimer = setTimeout(applyMood, 400);
}

async function applyMood() {
  setFeedback('Application…');
  try {
    const body = { energy: state.energy, valence: state.valence,
                   discover_level: state.dl, genres: state.genres };
    const r = await fetch(API + '/mood', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    setFeedback(d.tracks_added > 0 ? `${d.tracks_added} titres chargés` : 'Aucun titre correspondant');
  } catch(e) { setFeedback('Erreur réseau'); }
}

/* ── Controls ── */
async function mopidyRPC(method, params = {}) {
  return fetch(API + '/mopidy_rpc', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) })
    .then(r => r.json()).catch(() => null);
}

document.getElementById('btn-play').addEventListener('click', async () => {
  await fetch(API + '/toogle_play');
  setTimeout(refreshNowPlaying, 500);
});
document.getElementById('btn-next').addEventListener('click', async () => {
  await mopidyRPC('core.playback.next');
  setTimeout(refreshNowPlaying, 800);
});
document.getElementById('btn-prev').addEventListener('click', async () => {
  await mopidyRPC('core.playback.previous');
  setTimeout(refreshNowPlaying, 800);
});

/* ── Now playing ── */
async function refreshNowPlaying() {
  try {
    const r = await mopidyRPC('core.playback.get_current_tl_track');
    const track = r?.result?.track;
    const state_r = await mopidyRPC('core.playback.get_state');
    const playing = state_r?.result === 'playing';

    document.getElementById('status-dot').className = playing ? 'playing' : '';
    document.getElementById('btn-play').textContent = playing ? '⏸' : '▶';

    if (track) {
      document.getElementById('track-name').textContent = track.name || '—';
      const artists = (track.artists || []).map(a => a.name).join(', ');
      document.getElementById('artist-name').textContent = artists || '—';
      const img = track.album?.images?.[0]?.uri || track.album?.images?.[0]?.url || '';
      const coverEl = document.getElementById('cover');
      if (img) coverEl.src = img; else coverEl.src = '';
    }
  } catch(e) {}
}

/* ── Genres ── */
async function loadGenres() {
  try {
    const genres = await fetch(API + '/genres').then(r => r.json());
    const wrap = document.getElementById('genres-wrap');
    wrap.innerHTML = '';
    genres.slice(0, 20).forEach(g => {
      const chip = document.createElement('button');
      chip.className = 'genre-chip';
      chip.textContent = g.name;
      chip.dataset.name = g.name;
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        state.genres = [...wrap.querySelectorAll('.genre-chip.active')].map(c => c.dataset.name);
        scheduleApply();
      });
      wrap.appendChild(chip);
    });
  } catch(e) {}
}

/* ── Init ── */
async function init() {
  ['energy', 'valence', 'dl'].forEach(id => setupDialSVG(document.getElementById('dial-' + id)));

  makeDraggable('energy', v => { state.energy = v; });
  makeDraggable('valence', v => { state.valence = v; });
  makeDraggable('dl', v => { state.dl = Math.round(v * 10); });

  try {
    const settings = await fetch(API + '/mood').then(r => r.json());
    const e = settings.energy ?? 0.5;
    const v = settings.valence ?? 0.6;
    const dl = (settings.discover_level ?? 5) / 10;
    state.energy = e; state.valence = v; state.dl = settings.discover_level ?? 5;
    setDialValue('energy', e);
    setDialValue('valence', v);
    setDialValue('dl', dl);
  } catch(e) {}

  await loadGenres();
  await refreshNowPlaying();
  setInterval(refreshNowPlaying, 10000);
}

function setFeedback(msg) {
  document.getElementById('feedback').textContent = msg;
  setTimeout(() => { document.getElementById('feedback').textContent = ''; }, 3000);
}

init();
</script>
</body>
</html>
