<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O2M">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<title>O2M Mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* Applique le thème avant le rendu pour éviter le flash.
     mood2 utilise une clé de stockage séparée (o2m2-theme) et part en dark
     (palette chaude du design system) par défaut. */
  (function () {
    var t = new URLSearchParams(location.search).get('theme')
          || localStorage.getItem('o2m2-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    /* Basic view: /basic = simplified actuators (default on mobile). Same page,
       the mode is a root class so CSS can swap the middle section without flash. */
    var basic = /\/basic\/?$/.test(location.pathname);
    if (basic) document.documentElement.classList.add('basic');
    try {
      if (location.search.indexOf('full=1') !== -1) localStorage.setItem('o2m-view', 'full');
      if (!basic && /\/mood2?\/?$/.test(location.pathname)
          && window.matchMedia('(max-width: 699px)').matches
          && localStorage.getItem('o2m-view') !== 'full') {
        location.replace('/basic');
      }
    } catch (e) {}
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ════════════ THÈME : Dark — Design System (near-black chaud, accent orange) ════════════ */
  :root, [data-theme="dark"] {
    --bg: #15120E; --surface: #1C1812; --card: #241F18; --raised: #2D2719;
    --accent: #FF5A00; --accent-press: #E64E00; --accent-soft: #FF5A0014; --on-accent: #190E04;
    --danger: #E5484D;   /* destructive actions only (delete) — inherited by every theme */
    --text: #F3EEE3; --muted: #9C9486; --faint: #6E665A;
    --border: rgba(243,238,227,.13); --border-soft: rgba(243,238,227,.07); --border-strong: rgba(243,238,227,.30);
    --fill-1: rgba(243,238,227,.04); --fill-2: rgba(243,238,227,.08); --fill-3: rgba(243,238,227,.15);
    --track-bg: #2D2719;
    --c-energy: var(--text); --c-valence: var(--muted); --c-dl: var(--accent); --dial-txt: var(--text);
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
    --head-transform: uppercase; --head-weight: 800; --head-spacing: -.015em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #FF5A00;
    --mx-bg: #1C1812;
    --mx-q-calm: rgba(243,238,227,.03); --mx-q-happy: rgba(243,238,227,.06);
    --mx-q-dark: rgba(243,238,227,.10); --mx-q-energetic: rgba(243,238,227,.05);
    --mx-line: rgba(243,238,227,.15); --mx-border: transparent;
    --mx-label: rgba(243,238,227,.22); --mx-axis: rgba(243,238,227,.40);
    --mx-dl-fill: rgba(255,90,0,.08); --mx-dl-stroke: rgba(255,90,0,.60);
    --mx-dot-core: #F3EEE3; --mx-pulse: 255,90,0;
    --mood-happy: 243,238,227; --mood-energetic: 255,90,0;
    --mood-calm: 156,148,134; --mood-dark: 110,102,90;
  }

  /* ════════════ THÈME : Light — Design System (crème papier chaude, accent orange) ════════════ */
  [data-theme="creme"] {
    --bg: #EFEADF; --surface: #E6E0D2; --card: #F7F3EA; --raised: #FCF9F2;
    --accent: #FF5A00; --accent-press: #E64E00; --accent-soft: #FF5A0016; --on-accent: #190E04;
    --text: #181410; --muted: #7A7264; --faint: #A89F8E;
    --border: rgba(24,20,16,.16); --border-soft: rgba(24,20,16,.08); --border-strong: rgba(24,20,16,.34);
    --fill-1: rgba(24,20,16,.04); --fill-2: rgba(24,20,16,.07); --fill-3: rgba(24,20,16,.12);
    --track-bg: #E0D9C9;
    --c-energy: var(--text); --c-valence: var(--muted); --c-dl: var(--accent); --dial-txt: var(--text);
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
    --head-transform: uppercase; --head-weight: 800; --head-spacing: -.015em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #FF5A00;
    --mx-bg: #E6E0D2;
    --mx-q-calm: rgba(24,20,16,.04); --mx-q-happy: rgba(24,20,16,.08);
    --mx-q-dark: rgba(24,20,16,.14); --mx-q-energetic: rgba(24,20,16,.06);
    --mx-line: rgba(24,20,16,.16); --mx-border: transparent;
    --mx-label: rgba(24,20,16,.26); --mx-axis: rgba(24,20,16,.42);
    --mx-dl-fill: rgba(255,90,0,.10); --mx-dl-stroke: rgba(255,90,0,.65);
    --mx-dot-core: #ffffff; --mx-pulse: 255,90,0;
    --mood-happy: 24,20,16; --mood-energetic: 255,90,0;
    --mood-calm: 122,114,100; --mood-dark: 60,50,40;
  }

  /* ════════════ THÈME : Mono (brut N&B) ════════════ */
  [data-theme="mono"] {
    --bg: #ffffff; --surface: #ffffff; --card: #f0f0f0;
    --accent: #111111; --accent-soft: #1111111a; --on-accent: #ffffff;
    --text: #000000; --muted: #9a9a9a;
    --border: #00000018; --border-soft: #0000000c; --border-strong: #00000033;
    --fill-1: #00000006; --fill-2: #0000000f; --fill-3: #00000016;
    --track-bg: #e2e2e2;
    --c-energy: #111111; --c-valence: #888888; --c-dl: #ff3b00; --dial-txt: #000000;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #ff3b00;
    --mx-bg: #f4f4f4;
    --mx-q-calm: #00000005; --mx-q-happy: #0000000b;
    --mx-q-dark: #00000012; --mx-q-energetic: #00000008;
    --mx-line: #00000026; --mx-border: transparent;
    --mx-label: #00000033; --mx-axis: #00000055;
    --mx-dl-fill: #ff3b0010; --mx-dl-stroke: #ff3b0099;
    --mx-dot-core: #ffffff; --mx-pulse: 0,0,0;
    --mood-happy: 60,60,60; --mood-energetic: 255,59,0;
    --mood-calm: 140,140,140; --mood-dark: 20,20,20;
  }

  /* ════════════ THÈME : Overprint (affiche éditoriale, orange) ════════════ */
  [data-theme="overprint"] {
    --bg: #ffffff; --surface: #ffffff; --card: #f0f0f0;
    --accent: #ff5a00; --accent-soft: #ff5a001a; --on-accent: #190E04;
    --text: #000000; --muted: #9a9a9a;
    --border: #00000018; --border-soft: #0000000c; --border-strong: #00000033;
    --fill-1: #00000006; --fill-2: #0000000f; --fill-3: #00000016;
    --track-bg: #e2e2e2;
    --hero-accent: #ff5a00;
    --c-energy: #111111; --c-valence: #888888; --c-dl: #ff5a00; --dial-txt: #000000;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: #ff5a00;
    --mx-bg: #f4f4f4;
    --mx-q-calm: #00000005; --mx-q-happy: #0000000b;
    --mx-q-dark: #00000012; --mx-q-energetic: #00000008;
    --mx-line: #00000026; --mx-border: transparent;
    --mx-label: #00000033; --mx-axis: #00000055;
    --mx-dl-fill: #ff5a0010; --mx-dl-stroke: #ff5a0099;
    --mx-dot-core: #ffffff; --mx-pulse: 0,0,0;
    --mood-happy: 60,60,60; --mood-energetic: 255,59,0;
    --mood-calm: 140,140,140; --mood-dark: 20,20,20;
  }

  /* ════════════ THÈME : Invert (cinématique, couleur dynamique) ════════════ */
  [data-theme="invert"] {
    --bg: #0c0c0c; --surface: #0c0c0c; --card: #1c1c1c;
    --accent: var(--hero-accent, #ff3b00); --accent-soft: #ffffff1a; --on-accent: #ffffff;
    --text: #ffffff; --muted: #777777;
    --border: #ffffff18; --border-soft: #ffffff0c; --border-strong: #ffffff33;
    --fill-1: #ffffff06; --fill-2: #ffffff0f; --fill-3: #ffffff16;
    --track-bg: #2a2a2a;
    --hero-accent: #ff3b00;
    --c-energy: #ffffff; --c-valence: #888888; --c-dl: var(--hero-accent, #ff3b00); --dial-txt: #ffffff;
    --font: 'Archivo', system-ui, sans-serif;
    --font-head: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
    --head-transform: uppercase; --head-weight: 700; --head-spacing: -.01em; --radius: 0px;
    --eyebrow-mark: "↓ "; --eyebrow-color: var(--hero-accent, #ff3b00);
    --mx-bg: #161616;
    --mx-q-calm: #ffffff04; --mx-q-happy: #ffffff09;
    --mx-q-dark: #ffffff0f; --mx-q-energetic: #ffffff07;
    --mx-line: #ffffff26; --mx-border: transparent;
    --mx-label: #ffffff33; --mx-axis: #ffffff55;
    --mx-dl-fill: #ffffff12; --mx-dl-stroke: var(--hero-accent, #ff3b00);
    --mx-dot-core: #ffffff; --mx-pulse: 255,255,255;
    --mood-happy: 210,210,210; --mood-energetic: 255,59,0;
    --mood-calm: 150,150,150; --mood-dark: 90,90,90;
  }

  /* ════════════ mood2 : couche technique JetBrains Mono (design system) ════════════
     Durées, timecodes, specs, compteurs, liens utilitaires — tout l'affichage
     "technique" passe en mono trackée, signature du design system O2M. */
  :root { --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace; }
  .tl-dur, #progress-time, #prog-elapsed, #prog-duration, #tracklist-count,
  .dial-sub, #volume-val, .footer-link, #track-status-badge, .tl-status, #td-type,
  .td-list dt, #track-ev {
    font-family: var(--font-mono);
    font-feature-settings: "tnum" 1;
  }
  .dial-sub, #tracklist-count, .footer-link, #track-status-badge {
    text-transform: uppercase; letter-spacing: .14em;
  }
  .tl-dur, #progress-time { letter-spacing: .04em; }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         display: flex; flex-direction: column; overflow: hidden; height: 100dvh;
         /* svh = smallest viewport (URL bar shown): stable from the very first paint,
            unlike dvh which some mobile browsers mis-measure on load → the footer was
            pushed just below the fold until a reflow (refresh) fixed it. */
         height: 100svh;
         transition: background .25s, color .25s; }
  /* NB: do NOT add horizontal padding to <body> — several rows use a full-bleed
     width:100vw trick (e.g. mobile #controls) that would then overflow by the
     padding width. Landscape safe-area insets are applied per-row instead. */


  /* Couleurs des potentiomètres (override des attributs SVG inline) */
  #fill-energy  { stroke: var(--c-energy);  }
  #knob-energy  { fill:   var(--c-energy);  }
  #fill-valence { stroke: var(--c-valence); }
  #knob-valence { fill:   var(--c-valence); }
  #fill-dl      { stroke: var(--c-dl);      }
  #knob-dl      { fill:   var(--c-dl);      }
  .dial-svg text { fill: var(--dial-txt); }

  /* Marqueur éditorial devant les libellés de section */
  .panel-head::before,
  #genres-label::before,
  #tracklist-label > span:first-child::before {
    content: var(--eyebrow-mark, ""); color: var(--eyebrow-color, var(--accent));
  }

  /* Sélecteur de thème */
  #theme-switcher { display: flex; gap: 6px; margin-left: auto; }
  .theme-chip {
    font-size: 11px; cursor: pointer; padding: 3px 11px; border-radius: 0;
    background: var(--fill-1); border: none; color: var(--muted);
    transition: all .15s; font-family: var(--font);
  }
  .theme-chip.active { background: var(--accent); color: #fff; }
  [data-theme="mono"] .theme-chip.active { color: #fff; }

  /* ── Top zone: cover column + info/controls on the right ── */
  #top-zone {
    display: flex; align-items: stretch; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    /* Display cutout (camera hole): with viewport-fit=cover the page extends under
       the status-bar strip in fullscreen/PWA. The inset becomes padding so the
       top-zone background claims that strip while content stays clear of the
       camera. 0 everywhere else (desktop, regular browser tab). */
    padding-top: env(safe-area-inset-top, 0px);
  }
  #cover-col { flex: 0 0 auto; display: flex; padding: 12px; }
  #top-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ── Colonne détails du morceau ── */
  #track-details {
    flex: 0 0 230px; min-width: 0; border-left: 1px solid var(--border);
    padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
  }
  /* Track lifecycle scale (read-only): trash|hidden > new > incoming > library >
     favorites. Dot centres sit at (i+0.5)/6 → 8.33%,25%,…,91.67%; the line/fill and
     the trash|hidden divider are positioned against those fixed centres. */
  .lc-scale { margin: 14px 0 2px; }
  .lc-track { position: relative; }
  .lc-line, .lc-line-fill { position: absolute; top: 5px; height: 2px; }  /* left/right/width set inline */
  .lc-line { background: var(--border-strong); }
  .lc-line-fill { background: var(--accent); }
  .lc-line-fill.excl { background: var(--muted); }
  .lc-sep { position: absolute; top: -2px; width: 1px; height: 16px; background: var(--border-strong); }
  .lc-stops { position: relative; display: flex; }
  .lc-stop { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .lc-dot { width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box;
    background: var(--surface); border: 2px solid var(--border-strong); transition: transform .15s; }
  .lc-lab { font-family: var(--font-mono); font-size: 8px; letter-spacing: .01em;
    text-transform: uppercase; color: var(--muted); text-align: center; line-height: 1.1; }
  .lc-stop.current .lc-dot { background: var(--accent); border-color: var(--accent); transform: scale(1.2); }
  .lc-stop.current.excl .lc-dot { background: var(--muted); border-color: var(--muted); }
  .lc-stop.current .lc-lab { color: var(--accent); font-weight: 700; }
  .lc-stop.current.excl .lc-lab { color: var(--text); }
  /* Per-track mood matrix inside the details panel. The quadrants are painted at
     3–10% opacity and dark's --mx-border is transparent, so on the panel surface
     the canvas was all but invisible. Giving it the matrix background + a hairline
     makes it read as a control in every theme. */
  .tp-matrix { width: 100%; max-width: 200px; aspect-ratio: 1 / 1;
    margin: 8px auto 2px; display: block; touch-action: none;
    background: var(--mx-bg); border: 1px solid var(--border); }
  body.edit-mode .tp-matrix { cursor: crosshair; }
  .tl-item.obj-openable { cursor: pointer; }
  /* ── First-launch welcome overlay ── */
  #welcome { position: fixed; inset: 0; z-index: 400; display: none;
    background: var(--bg); color: var(--text); align-items: center; justify-content: center; padding: 24px; }
  #welcome.show { display: flex; }
  .wc-card { width: 100%; max-width: 460px; text-align: center; }
  .wc-logo { font-family: var(--font-head, var(--font)); font-weight: 900; font-size: 42px;
    color: var(--accent); letter-spacing: -.03em; line-height: 1; }
  .wc-step { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .wc-title { font-size: 22px; font-weight: 700; margin: 4px 0 10px; }
  .wc-sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 22px; }
  .wc-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
    background: var(--accent); color: #fff; border: none; font: inherit; font-weight: 700; cursor: pointer; }
  .wc-btn:disabled { opacity: .5; cursor: default; }
  .wc-skip { display: block; margin: 16px auto 0; color: var(--muted); font-size: 12px;
    background: none; border: none; cursor: pointer; text-decoration: underline; }
  .wc-counts { display: flex; gap: 22px; justify-content: center; margin: 20px 0; font-family: var(--font-mono); }
  .wc-counts b { display: block; font-size: 24px; color: var(--accent); }
  .wc-counts span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .wc-warn { text-align: left; font-size: 12.5px; line-height: 1.5; margin: 0 0 20px;
    padding: 12px 14px; border: 1px solid var(--accent); border-radius: 6px;
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .wc-warn b { display: block; margin-bottom: 6px; }
  .wc-warn code { font-family: var(--font-mono); font-size: 11px; word-break: break-all;
    background: color-mix(in srgb, var(--text) 8%, transparent); padding: 1px 4px; border-radius: 3px; }
  .wc-warn-fix { margin-top: 8px; color: var(--muted); }
  #track-details .td-head {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-head); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: .02em; color: var(--text);
  }
  #btn-edit-lock {
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 2px 4px; line-height: 1; transition: color .15s;
    display: inline-flex; align-items: center;
  }
  #btn-edit-lock svg { width: 15px; height: 15px; display: block; }
  #btn-edit-lock.unlocked { color: var(--accent); }
  /* Stack holding the playlists trigger (edit-mode only) and the track-options
     "More" trigger (always visible) — each on its own line, both right-aligned. */
  .td-actions-row { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 4px; }
  /* Fixed-position dropdown, same pattern as footer "More" / playlists */
  .track-menu-dropdown {
    /* Above the mobile object modal (#obj-panel z-index 210) and track-details
       sheet (200) — otherwise the ⓘ menu opens BEHIND the sheet on phones and
       looks like it "doesn't work". */
    position: fixed; z-index: 300;
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px; min-width: 170px; max-width: 240px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .track-menu-dropdown button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; cursor: pointer; padding: 7px 8px;
    font-size: 12px; color: var(--text); text-align: left;
  }
  .track-menu-dropdown button:hover { background: var(--fill-2); color: var(--accent); }
  .track-menu-dropdown button svg { width: 14px; height: 14px; flex-shrink: 0; }
  #track-details .td-list { display: flex; flex-direction: column; gap: 7px; margin: 0; }
  #track-details .td-list > div {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  #track-details dt {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; flex-shrink: 0;
  }
  #track-details dd {
    margin: 0; font-size: 13px; color: var(--text); font-weight: 600;
    text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .td-fav { line-height: 1; user-select: none; display: inline-flex; }
  .td-fav svg { width: 16px; height: 16px; display: block; }
  .td-fav.on { color: #e0245e; }
  body.edit-mode .td-fav { cursor: pointer; }
  .td-playlists { display: none; }
  /* Right-aligned like the "More" trigger it sits under: the panel body renders
     this as a plain block child, so without the flex row the trigger hugged the
     left edge instead of the panel's right rail. */
  body.edit-mode .td-playlists {
    display: flex; justify-content: flex-end;
    border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px;
  }
  /* Trigger button — same look as footer-link / footer-more-toggle */
  .pl-trigger {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: 1px solid var(--border); cursor: pointer;
    padding: 5px 11px; font-size: 11px; letter-spacing: .04em;
    color: var(--muted); text-align: left; max-width: 100%;
  }
  .pl-trigger:hover { border-color: var(--text); background: var(--fill-2); }
  .pl-trigger .pl-count {
    background: var(--accent); color: var(--on-accent, #190E04); font-weight: 700;
    padding: 0 5px; font-size: 10px; min-width: 14px; text-align: center; line-height: 15px;
    flex-shrink: 0;
  }
  .pl-trigger .pl-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;
  }
  .pl-trigger .pl-caret { flex-shrink: 0; }
  /* Fixed-position dropdown (same pattern as footer "More") */
  .pl-dropdown {
    /* Same stacking level as .track-menu-dropdown: the picker now also lives in
       the object modal (#obj-panel z-index 210), so at 200 it opened BEHIND the
       sheet. max-height is set inline from the space actually available. */
    position: fixed; z-index: 300;
    background: var(--surface); border: 1px solid var(--border);
    padding: 8px; min-width: 200px; max-width: 280px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pl-dropdown label {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text); cursor: pointer; min-width: 0; padding: 3px 2px;
  }
  .pl-dropdown label:hover { color: var(--accent); }
  .pl-dropdown label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-dropdown input { accent-color: var(--accent); flex-shrink: 0; }
  body.edit-mode #mood-matrix { box-shadow: inset 0 0 0 2px var(--accent); }

  /* ── Now Playing ── */
  #now-playing {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 12px 16px; background: var(--surface);
    flex-shrink: 0;
  }
  #cover-wrap {
    position: relative; aspect-ratio: 1 / 1; height: 100%;
    background: var(--surface); overflow: hidden;
  }
  #cover {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    filter: none;
    /* filter: theme recolor · opacity: crossfade on track change (setCoverSmooth) */
    transition: filter .4s, opacity .22s ease;
  }
  #cover.cover-fading { opacity: 0; }
  #track-info { flex: 1; min-width: 0; padding-top: 2px; }
  #track-name { font-size: 21px; white-space: nowrap; line-height: 1.1;
                overflow: hidden; text-overflow: ellipsis; color: var(--eyebrow-color, var(--accent));
                font-family: var(--font-head); font-weight: var(--head-weight);
                text-transform: var(--head-transform); letter-spacing: var(--head-spacing); }
  /* Artist + album on a single line ("Artist · Album"). Both ellipsize; the album
     is opened from its label (the cover click is taken by the color toggle).
     The font size is set ONCE on the row so artist and album always match — the
     per-theme overrides below therefore also target #artist-album, not the artist
     alone (which used to leave the album stuck at a smaller size). */
  #artist-album { display: flex; align-items: baseline; gap: 5px; margin-top: 3px;
                  min-width: 0; font-size: 14px; }
  #artist-name { color: var(--muted); flex: 0 1 auto;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album-name { color: var(--muted); cursor: pointer; flex: 0 1 auto;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album-name:not(:empty)::before { content: "· "; color: var(--muted); }
  #album-name:hover { color: var(--text); text-decoration: underline; }
  #album-name:empty { display: none; }

  /* Status badge + network dot share one row. Both used to be siblings in the
     inline flow, so a long badge (which wraps on mobile) pushed the dot onto a
     line of its own. A flex row keeps them together: the badge takes the space it
     needs, the dot stays pinned beside it and never wraps away. */
  #status-line {
    display: flex; align-items: flex-start; gap: 7px;
    margin-top: 5px; min-width: 0;
  }
  #status-line #track-status-badge { margin-top: 0; min-width: 0; }
  #status-line #net-dot { margin-top: 3px; flex-shrink: 0; }

  /* track status badge — texte plat lisible, avec carré de couleur en tête */
  #track-status-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    font-family: var(--font-head); color: var(--text);
    text-transform: uppercase; transition: color .2s;
  }
  #track-status-badge::before {
    content: ''; width: 9px; height: 9px; flex-shrink: 0;
    background: var(--muted); /* couleur par défaut, surchargée par statut */
  }
  #track-status-badge.s-library::before   { background: #2196f3; }
  #track-status-badge.s-favorites::before { background: #4caf50; }
  #track-status-badge.s-incoming::before  { background: #ff9800; }
  #track-status-badge.s-new::before        { background: #ff5722; }
  #track-status-badge.s-trash::before      { background: #f44336; }
  #track-status-badge.s-hidden::before     { background: #9c27b0; }
  #track-status-badge.s-podcast::before    { background: #607d8b; }

  /* volume row */
  #volume-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 2px 14px 0;
  }
  #volume-icon { flex-shrink: 0; color: var(--muted); display: flex; align-items: center; }
  #volume-icon svg { width: 16px; height: 16px; display: block; }
  #volume-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 0; outline: none; cursor: pointer;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--vol-pct, 50%), var(--border-strong) var(--vol-pct, 50%));
  }
  #volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  #volume-val { font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; flex-shrink: 0; }

  /* ── Track tags row (inside now-playing) ── */
  #track-tags-row {
    display: flex; align-items: baseline; gap: 0; margin-top: 7px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; flex-wrap: nowrap;
  }
  #track-tags-row::-webkit-scrollbar { display: none; }
  .tag-chip {
    padding: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .01em;
    color: var(--text); font-weight: 600; font-family: var(--font-head);
    white-space: nowrap; flex-shrink: 0;
  }
  .tag-chip:not(:first-child)::before {
    content: "/"; margin: 0 9px; color: var(--eyebrow-color, var(--accent)); font-weight: 700;
  }
  /* Énergie/valence retirées d'à côté des tags : déjà présentes dans le status,
     les dials et le panneau détails (info redondante) */
  #track-ev { display: none; }
  #track-ev svg, #matrix-tooltip .tt-ev svg {
    width: 12px; height: 12px; vertical-align: -2px;
  }

  /* ── Controls ── */
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 28px;
    padding: 10px 16px; background: var(--surface);
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    line-height: 1; padding: 8px; border-radius: 0;
    transition: background .15s, transform .1s; display: flex; align-items: center;
  }
  .ctrl-btn svg { width: 24px; height: 24px; display: block; }
  .ctrl-btn:active { background: var(--fill-3); transform: scale(.92); }
  #btn-play { color: var(--accent); }
  #btn-play svg { width: 32px; height: 32px; }

  /* Snapcast inline dans la volume-row */
  #btn-snapcast {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 0 0 0 6px; display: flex; align-items: center; flex-shrink: 0;
    transition: color .15s;
  }
  #btn-snapcast svg { width: 18px; height: 18px; display: block; }
  #btn-snapcast.playing { color: var(--accent); }

  /* ── Progress bar ── */
  #progress-wrap {
    padding: 6px 16px 10px; background: var(--surface);
    flex-shrink: 0;
  }
  #progress-bar {
    height: 5px; background: var(--track-bg); border-radius: 0;
    cursor: pointer; position: relative; touch-action: none;
  }
  #progress-fill {
    height: 100%; background: var(--accent); border-radius: 0;
    width: 0%; transition: width 1s linear; position: relative;
  }
  /* poignée de glisser-déposer : visible au survol / pendant le seek */
  #progress-fill::after {
    content: ''; position: absolute; right: -6px; top: 50%;
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    transform: translateY(-50%) scale(0); transition: transform .14s var(--ease, ease);
  }
  #progress-wrap:hover #progress-fill::after,
  #progress-bar.seeking #progress-fill::after { transform: translateY(-50%) scale(1); }
  #progress-bar.seeking #progress-fill { transition: none; }
  #progress-time {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 3px;
  }

  /* ── Scrollable content ── */
  #scroll-area {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    position: relative;   /* anchor for the desktop object-detail overlay */
  }

  /* ── Dials ── */
  #dials {
    display: flex; flex-direction: row; justify-content: space-around;
    align-items: flex-end; padding: 6px 8px 2px; gap: 4px;
  }
  .dial-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dial-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .08em; text-align: center; margin-bottom: 1px; }
  .dial-svg { touch-action: none; cursor: grab; display: block; width: 108px; height: 108px; }
  .dial-svg:active { cursor: grabbing; }
  .dial-track { fill: none; stroke: var(--border); stroke-width: 8; stroke-linecap: round; }
  .dial-fill  { fill: none; stroke-width: 8; stroke-linecap: round;
                transition: stroke-dashoffset .05s; }
  .dial-sub { font-size: 11px; color: var(--muted); text-align: center; margin-top: -6px; }

  /* ── 3-column layout ── */
  #main-cols { display: flex; flex-direction: column; }
  #left-panel { display: flex; flex-direction: column; }
  #boxes-panel { padding: 12px 14px; border-top: 1px solid var(--border); }
  .panel-head {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: var(--text);
    margin-bottom: 10px; cursor: default;
  }
  .panel-body { display: block; }
  #boxes-wrap { display: flex; flex-direction: column; gap: 6px; }
  .box-btn {
    padding: 8px 4px; border-radius: 0;
    border: none; background: none; color: var(--muted);
    cursor: pointer; transition: color .15s, opacity .15s; text-align: left;
    display: flex; align-items: center; gap: 12px; width: 100%;
  }
  .box-swatch {
    width: 14px; height: 14px; flex-shrink: 0;
    background: currentColor; opacity: .35; transition: all .15s;
  }
  .box-name { font-size: 14px; font-weight: 600; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .box-btn.active { color: var(--text); }
  .box-btn.active .box-swatch { opacity: 1; background: var(--accent); }
  .box-btn:active { opacity: .6; }
  .box-btn:disabled { cursor: wait; animation: basic-pulse 1s ease-in-out infinite; }

  @media (min-width: 700px) {
    /* 3 colonnes scrollables indépendamment, footer fixe en bas */
    #scroll-area { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    #main-cols { flex-direction: row; align-items: stretch; flex: 1; min-height: 0; }
    .col { overflow-y: auto; min-height: 0; }

    /* Cap the header. #top-zone's height is set by its tallest column — the details
       column, which carries the field list + mood matrix + playlist picker + More —
       and the square cover follows that height (height:100%, aspect-ratio 1/1). So a
       taller details column inflated the whole header and pushed the three columns
       down. A fixed height makes every header block exactly the cover thumbnail's
       size, and the details column scrolls inside it instead of stretching it.
       Invert is excluded: its full-width cover banner sets its own header height. */
    :root:not([data-theme="invert"]) #top-zone { height: 38vh; }
    :root:not([data-theme="invert"]) #track-details {
      overflow-y: auto; min-height: 0;
    }
    /* Overprint keeps its poster grid: there the details column matches the cover
       square (--ovp-w) rather than the whole header. `:root[...]` is needed to
       out-rank both the `:not()` rule above and the generic overprint
       `#track-details { height: 100% }` declared further down. */
    :root[data-theme="overprint"] #top-zone { height: auto; }
    :root[data-theme="overprint"] #track-details { height: var(--ovp-w); }

    /* The three columns are exactly equal thirds (flex-basis 0 + equal grow). */
    #boxes-panel { flex: 1 1 0; border-top: none; border-right: 1px solid var(--border);
                   padding: 0; min-width: 0; }
    #left-panel  { flex: 1 1 0; border-right: 1px solid var(--border); min-width: 0; }
    #tracklist-col { flex: 1 1 0; min-width: 0; }
    /* En-têtes de colonnes : alignés (même top/left) et statiques au scroll */
    #boxes-panel-label, #settings-label, #tracklist-label {
      position: sticky; top: 0; z-index: 6; background: var(--bg);
      padding: 13px 12px 10px; margin: 0;
    }
    #boxes-panel .panel-body { padding: 0 12px 14px; }
    #dials { padding: 4px 10px 2px; }
    #matrix-section { padding: 2px 10px 6px; min-width: 0; }
    #genres-section { padding: 8px 10px 10px; border-top: 1px solid var(--border); }
    #tracklist-section { padding: 0; }
    #tracklist-wrap { padding: 0 12px 10px; }
  }

  @media (max-width: 699px) {
    /* En-tête compact et lisible */
    #cover-col { padding: 10px; }
    #cover-wrap { aspect-ratio: auto; width: 84px; height: 84px; }
    #now-playing { padding: 10px 12px; gap: 10px; }
    #track-name { font-size: 17px; }

    /* Colonne détails → bloc repliable pleine largeur sous l'en-tête */
    #top-zone { flex-wrap: wrap; }
    #track-details {
      flex: 1 1 100%; border-left: none; border-top: 1px solid var(--border);
      padding: 8px 12px; gap: 0;
    }
    #track-details .td-head { cursor: pointer; padding-right: 22px; position: relative; }
    #track-details .td-head::after {
      content: '▸'; position: absolute; right: 26px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 11px;
    }
    #track-details.open .td-head::after { content: '▾'; }
    #track-details:not(.open) .td-body { display: none; }
    #track-details .td-body { margin-top: 8px; }
    /* Full-width playback controls WITHOUT the old width:100vw full-bleed hack —
       that overflowed a few px to the right (and clipped the snapcast button)
       because #top-right is offset from the viewport's left edge by the cover
       thumbnail, so the viewport-centred 100vw trick miscentred. Instead promote
       #top-right's children into #top-zone's own flex-wrap row (display:contents):
       #now-playing stays beside the cover, while #controls / #progress-wrap each
       take their own real full-width row. This is how overprint/invert avoid the
       overflow too (full-width parent, no negative margins). */
    /* Scoped to the standard themes — overprint/invert have their own poster
       layout (display:block #top-zone) and must NOT get display:contents here. */
    :root:not([data-theme="overprint"]):not([data-theme="invert"]) #top-right { display: contents; }
    #now-playing { flex: 1 1 0; min-width: 0; }
    #controls, #progress-wrap { flex: 0 0 100%; width: 100%; }
    #controls {
      /* Vertical rhythm of the 3 control lines (play / volume / progress). The
         play row is kept tight — 2px above and a small row-gap below — and the
         space that frees up is handed to the two gaps underneath: volume↔progress
         and progress↔next row (both set on #progress-wrap's padding). */
      flex-wrap: wrap; column-gap: 16px; row-gap: 7px;
      padding: 2px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
      justify-content: space-evenly;
    }
    /* Receives the space reclaimed around the play row: padding-top opens the
       volume↔progress gap, padding-bottom the progress↔next-row one, so the two
       lower gaps read as even instead of the play row hogging the air. */
    #progress-wrap { padding-top: 16px; padding-bottom: 14px; }

    /* ── Mobile accordion: Boxes / Mood / Tracklist ──
       The 3 headers are always-visible fixed rows that never move; one section is
       open at a time, its body fills the remaining height and scrolls internally. */
    #scroll-area { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    #main-cols { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    /* padding:0 on every panel so the 3 headers align on the same left margin */
    #boxes-panel, #left-panel, #tracklist-col {
      display: flex; flex-direction: column; min-height: 0; padding: 0;
      border-top: 1px solid var(--border);
    }
    /* 2-id selectors so these beat the base #tracklist-section / #tracklist-label
       rules declared later in the stylesheet (which kept the tracklist indented). */
    #tracklist-col #tracklist-section { display: flex; flex-direction: column; min-height: 0; flex: 1; padding: 0; }
    #tracklist-col #tracklist-label { margin: 0; }

    /* Headers = fixed accordion rows (always visible, aligned). */
    #boxes-panel-label, #settings-label, #tracklist-label {
      position: relative; flex-shrink: 0; cursor: pointer; margin: 0;
      padding: 13px 14px; background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }
    #boxes-panel-label::before, #settings-label::before,
    #tracklist-label > span:first-child::before {
      content: '▸'; color: var(--muted); font-size: 11px; margin-right: 9px;
    }
    #boxes-panel.open #boxes-panel-label::before,
    #left-panel.open #settings-label::before,
    #tracklist-col.open #tracklist-label > span:first-child::before { content: '▾'; }

    /* Bodies: hidden when collapsed. :not(.open) raises specificity so it beats the
       base `#tracklist-wrap { display:flex }` rule declared later in the stylesheet. */
    #boxes-panel:not(.open) .panel-body,
    #left-panel:not(.open) .panel-body,
    #tracklist-col:not(.open) #tracklist-wrap { display: none; }
    #main-cols .collapsible:not(.open) { flex: 0 0 auto; }
    #main-cols .collapsible.open { flex: 1 1 auto; min-height: 0; }
    #boxes-panel.open .panel-body,
    #left-panel.open .panel-body,
    #tracklist-col.open #tracklist-wrap {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 14px 14px;
    }
  }

  /* ── Matrix ── */
  #matrix-section { padding: 4px 14px 6px; }
  #mood-matrix { display: block; width: 100%; aspect-ratio: 1 / 1;
                 touch-action: none; cursor: crosshair; border-radius: 0; }
  #mood-matrix.cursor-resize { cursor: ew-resize; }
  /* Phone: let vertical swipes on the matrix scroll the page (pan-y). Taps still
     set the target, and drags that START on the handle/ring take over the gesture
     (a non-passive touchstart preventDefault claims it). See matrix pointer JS. */
  @media (max-width: 699px) {
    #mood-matrix { touch-action: pan-y; }
  }

  /* ── Auto toggle (mood en direct) ── */
  #auto-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #btn-auto {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 0; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    border: 1px solid var(--muted); background: transparent; color: var(--muted);
    text-transform: uppercase; transition: color .15s, border-color .15s, background .15s;
  }
  #btn-auto svg { width: 14px; height: 14px; display: block; }
  #btn-auto.active {
    color: var(--bg); background: var(--accent); border-color: var(--accent);
  }
  #auto-hint { font-size: 11px; color: var(--muted); }

  /* ── Matrix tooltip ── */
  #matrix-tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 200;
    background: var(--surface); border-radius: 0;
    padding: 8px 12px; max-width: 200px;
    box-shadow: 0 4px 20px #00000070;
  }
  #matrix-tooltip .tt-name   { font-size: 13px; font-weight: 600; white-space: nowrap;
                                overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-artist { font-size: 11px; color: var(--muted); margin-top: 2px;
                                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #matrix-tooltip .tt-ev     { font-size: 10px; color: var(--muted); margin-top: 5px;
                                display: flex; gap: 8px; }

  /* ── Genres ── */
  #genres-section { padding: 10px 14px 6px; }
  #genres-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                  letter-spacing: .08em; margin-bottom: 8px; }
  #genres-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .genre-chip {
    padding: 5px 13px; border-radius: 0; font-size: 13px; font-weight: 500;
    border: none; background: var(--fill-2); color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .genre-chip.active { background: var(--accent); color: #fff; }
  .genre-chip:active { transform: scale(.95); }

  /* ── Tracklist ── */
  #tracklist-section { padding: 10px 14px 4px; }
  #tracklist-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #tracklist-count { font-size: 11px; color: var(--muted); }

  /* Harmonisation des titres de section (comme les tags sous le titre) */
  .panel-head, .dial-label, #genres-label,
  #tracklist-label > span:first-child {
    font-family: var(--font-head); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: .02em; color: var(--text);
  }

  /* ── Equalizer playing animation ── */
  .eq-icon {
    display: inline-flex; align-items: flex-end; gap: 2px;
    width: 18px; height: 18px; flex-shrink: 0;
  }
  .eq-icon i {
    flex: 1; background: var(--accent); display: block; border-radius: 0;
    animation: eq-bounce 0.9s ease-in-out infinite alternate;
  }
  .eq-icon i:nth-child(1) { animation-duration: 0.8s; animation-delay: 0s; }
  .eq-icon i:nth-child(2) { animation-duration: 1.1s; animation-delay: 0.2s; }
  .eq-icon i:nth-child(3) { animation-duration: 0.7s; animation-delay: 0.1s; }
  body.is-paused .eq-icon i { animation-play-state: paused; }
  @keyframes eq-bounce {
    from { height: 3px; opacity: .5; }
    to   { height: 16px; opacity: 1; }
  }

  #tracklist-wrap { display: flex; flex-direction: column; gap: 2px; }
  .tl-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 4px; border-radius: 0; cursor: pointer;
    transition: background .12s;
  }
  .tl-item:active { background: var(--fill-2); }
  .tl-item.current .tl-name { color: var(--accent); }
  .tl-num {
    font-family: var(--font-head); font-size: 22px; font-weight: 800;
    color: var(--muted); min-width: 36px; text-align: left; flex-shrink: 0;
    letter-spacing: -.03em; line-height: 1; opacity: .55;
    display: flex; align-items: center;
  }
  .tl-item.current .tl-num { color: var(--accent); opacity: 1; }
  .tl-texts { flex: 1; min-width: 0; align-self: center; }
  .tl-name { font-size: 14px; font-weight: 600; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .tl-artist { font-size: 12px; color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tl-dur { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .tl-status {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tl-status.s-library   { color: #4fc3f7; }
  .tl-status.s-favorites { color: #81c784; }
  .tl-status.s-incoming  { color: #ffb74d; }
  .tl-status.s-new       { color: #ff8a65; }
  .tl-status.s-trash     { color: #ef9a9a; }
  .tl-status.s-hidden    { color: #ce93d8; }
  .tl-status.s-podcast   { color: #90a4ae; }
  .tl-status svg { width: 11px; height: 11px; vertical-align: -1px; }

  /* ── Footer links ──
     A direct child of <body> (not of #scroll-area): as a sibling of the header and
     the columns it can never be squeezed out of view by a tall #top-zone — which is
     what made it vanish in the Invert theme, whose full-width cover banner pushed
     #scroll-area's height to zero. flex-shrink:0 keeps it at its natural height. */
  #footer-links {
    position: relative; flex-shrink: 0;
    padding: 7px 14px; padding-bottom: max(7px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  }
  /* Order: brand · styles (themes) · nav buttons all on the LEFT; the 3 warmups are
     grouped and glued to the RIGHT (margin-left:auto absorbs the free space).
     .footer-extra wraps "Clear today" + the warmups group; display:contents on
     desktop/mobile keeps them as plain flex children of #footer-links (no visual
     change) — only the tablet breakpoint below turns it into a collapsible panel. */
  #footer-links .tb-brand       { order: 0; }
  #footer-links #theme-switcher { order: 1; margin-left: 0; }
  #footer-links .footer-link    { order: 2; }
  #footer-links .footer-extra   { display: contents; }
  #footer-links .footer-more-toggle { display: none; }
  #footer-links .footer-warmups { order: 3; margin-left: auto; display: flex; align-items: center; gap: 7px; }
  #footer-links .footer-pick { display: inline-flex; align-items: center; gap: 5px; opacity: .85; }
  #footer-links .footer-pick svg { width: 15px; height: 15px; }
  #footer-links .footer-pick select { font: inherit; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: 6px; padding: 2px 6px; cursor: pointer; }
  /* Mobile: keep the footer on a single line, swipe horizontally to reach all items.
     touch-action:pan-x makes the browser commit slightly-diagonal swipes to THIS bar
     instead of hijacking them as vertical page scrolls; the taller padding gives the
     thumb a real grab area. */
  @media (max-width: 699px) {
    #footer-links {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      touch-action: pan-x;
      padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-shrink: 0;   /* never let the flex column squeeze the footer off-screen */
    }
    #footer-links::-webkit-scrollbar { display: none; }
    #footer-links > * { flex-shrink: 0; }
    #footer-links #theme-switcher { margin-left: 0; }
  }
  /* Tablet: too many items to fit (or wrap) gracefully on one line → fold the
     secondary actions (Clear today, pick-mode, warmups) into a "More" dropdown
     so the bar stays a single row. */
  @media (min-width: 700px) and (max-width: 1024px) {
    #footer-links { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
    #footer-links > * { flex-shrink: 0; }
    #footer-links .footer-more-toggle { display: inline-flex; order: 3; margin-left: auto; }
    #footer-links .footer-extra { display: none; }
    /* Fixed positioning so the popup escapes #footer-links's overflow-y:hidden clip. */
    #footer-links .footer-extra.open {
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      position: fixed; right: 14px; bottom: 50px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 10px; min-width: 220px; z-index: 50;
    }
    #footer-links .footer-extra.open .footer-warmups {
      margin-left: 0; flex-direction: column; align-items: stretch; gap: 8px;
    }
  }
  /* Overprint: same single-line + "More" dropdown as tablet, but at every width
     ≥700px (not just the 700–1024 tablet band) — frees the vertical room the
     matrix needs in fullscreen too. */
  @media (min-width: 700px) {
    [data-theme="overprint"] #footer-links {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    }
    [data-theme="overprint"] #footer-links > * { flex-shrink: 0; }
    [data-theme="overprint"] #footer-links .footer-more-toggle { display: inline-flex; order: 3; margin-left: auto; }
    [data-theme="overprint"] #footer-links .footer-extra { display: none; }
    [data-theme="overprint"] #footer-links .footer-extra.open {
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      position: fixed; right: 14px; bottom: 50px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 10px; min-width: 220px; z-index: 50;
    }
    [data-theme="overprint"] #footer-links .footer-extra.open .footer-warmups {
      margin-left: 0; flex-direction: column; align-items: stretch; gap: 8px;
    }
  }
  .footer-link {
    font-size: 11px; color: var(--muted); text-decoration: none;
    padding: 3px 10px; border-radius: 0;
    background: var(--fill-1); border: none;
    transition: background .15s; white-space: nowrap;
  }
  .footer-link:hover { background: var(--border); color: var(--text); }
  button.footer-link { cursor: pointer; }

  /* ── Feedback (toast flottant, ne réserve plus de ligne) ── */
  #feedback {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(8px);
    z-index: 250; pointer-events: none; max-width: 90vw;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); box-shadow: 0 6px 24px #00000055;
    font-size: 12px; padding: 9px 16px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility .2s;
  }
  #feedback.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

  /* ── Clear buttons (tracklist + boxes) ── */
  #btn-clear-tl, #btn-clear-boxes, #btn-reset-mood {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 2px; border-radius: 0; display: flex; align-items: center;
    transition: color .15s; flex-shrink: 0;
  }
  #btn-clear-tl svg, #btn-clear-boxes svg, #btn-reset-mood svg { width: 13px; height: 13px; display: block; }
  #btn-clear-tl:hover, #btn-clear-boxes:hover, #btn-reset-mood:hover { color: var(--accent); }
  /* Boxes / Mood headers carry a right-side action (like the tracklist header). */
  #boxes-panel-label, #settings-label { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; }
  #boxes-panel-label > span:first-child, #settings-label > span:first-child { flex: 1; }
  #boxes-panel-label #btn-clear-boxes, #settings-label #btn-reset-mood { margin-left: auto; }
  /* New box: a row at the END of the box list, only once editing is unlocked. */
  .box-btn.box-new { display: none; color: var(--muted); border-top: 1px solid var(--border); margin-top: 4px; }
  body.edit-mode .box-btn.box-new { display: flex; }
  .box-btn.box-new:hover { color: var(--accent); }
  .box-btn.box-new .box-name { font-weight: 500; }
  .box-btn.box-new .box-new-icon { display: inline-flex; flex-shrink: 0; width: 14px; height: 14px; }
  .box-btn.box-new .box-new-icon svg { width: 14px; height: 14px; display: block; }
  #boxes-count { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* ── Footer link SVG icons ── */
  .footer-link { display: inline-flex; align-items: center; gap: 5px; }
  .footer-link svg { width: 13px; height: 13px; flex-shrink: 0; }
  #btn-fullscreen.on { background: var(--accent); color: #fff; }
  /* App installée (PWA) : le bouton Fullscreen ne sert plus */
  @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
    #btn-fullscreen { display: none; }
  }

  /* ════════════ Styles AFFICHE : Overprint & Invert ════════════ */
  #hero-title { display: none; }

  /* — commun aux deux affiches — */
  [data-theme="overprint"] #top-zone,
  [data-theme="invert"]    #top-zone {
    position: relative; padding: 0;
  }
  [data-theme="overprint"] #now-playing #track-name,
  [data-theme="invert"]    #now-playing #track-name { display: none; }
  /* La colonne détails reste à droite du top zone (grille) */
  [data-theme="overprint"] #track-details,
  [data-theme="invert"]    #track-details {
    grid-area: details; height: 100%; border-left: 1px solid var(--border); border-top: none;
  }
  /* Titre : pleine largeur dispo ; taille ajustée en JS (fitHeroTitle), coupe à la fin si trop long */
  [data-theme="overprint"] #hero-title,
  [data-theme="invert"]    #hero-title {
    display: block; z-index: 3; pointer-events: none; text-align: left;
    font-family: var(--font-head); font-weight: 900;
    line-height: 0.86; letter-spacing: -0.03em; text-transform: uppercase;
    overflow: hidden;
  }

  /* ===== Overprint : pochette à gauche, titre pleine largeur en haut, contrôles centre-bas ===== */
  /* Largeur pochette DÉFINIE (vh/vw) : un % se résoudrait à 0 dans la grille → effondrement */
  [data-theme="overprint"] #top-zone {
    --ovp-w: min(31.4vh, 27.6vw);
    display: grid; align-items: start;
    /* details column = cover width (both --ovp-w) so the two sides are symmetric. */
    grid-template-columns: var(--ovp-w) 1fr var(--ovp-w);
    grid-template-areas: "cover mid details";
  }
  /* align-self:start → la colonne épouse la hauteur du carré (plus de bande vide
     sous la pochette) ; padding:0 → la pochette touche les bords */
  [data-theme="overprint"] #cover-col {
    grid-area: cover; position: relative; display: block; overflow: hidden;
    width: var(--ovp-w); align-self: start; padding: 0;
  }
  [data-theme="overprint"] #cover-wrap {
    aspect-ratio: 1 / 1; height: auto; width: 100%; max-width: none;
    background: var(--card);  /* tuile visible même sans visuel */
  }
  /* Overprint: cover stays monochrome; on hover (rollover) or click it is
     recolorized — and the overlaid title then switches to grey. */
  [data-theme="overprint"] #cover { filter: grayscale(1); }
  [data-theme="overprint"] #cover-wrap:hover #cover,
  [data-theme="overprint"] #top-zone.cover-lit #cover { filter: grayscale(0); }
  [data-theme="overprint"] #top-zone:has(#cover-wrap:hover) #hero-title,
  [data-theme="overprint"] #top-zone.cover-lit #hero-title { color: var(--muted); }
  [data-theme="overprint"] #cover-wrap { cursor: pointer; }
  /* Titre superposé en haut, débordant de la pochette sur l'espace central */
  [data-theme="overprint"] #hero-title {
    grid-column: 1 / 3; grid-row: 1; align-self: start; justify-self: stretch;
    margin: 12px 16px 0; white-space: normal; overflow-wrap: anywhere; line-height: 0.9;
    color: rgba(255, 90, 0, 0.92); mix-blend-mode: multiply;
  }
  /* Contrôles + infos dans l'espace central vide, alignés en bas */
  [data-theme="overprint"] #top-right {
    grid-area: mid; align-self: end; justify-self: stretch;
    width: auto; margin: 0; padding: 0 14px 14px; background: none;
  }
  [data-theme="overprint"] #now-playing  { padding: 6px 6px 2px; }
  [data-theme="overprint"] #controls     { justify-content: flex-start; padding: 2px 6px; }
  [data-theme="overprint"] #progress-wrap { padding: 2px 6px 4px; }
  [data-theme="overprint"] #artist-album { font-size: 18px; }
  [data-theme="overprint"] #artist-name  { font-weight: 600; color: var(--text); }

  /* Compact details column: Energy/Valence/Mood share one row. Capped to the cover
     square height (internal scroll) so the grid row = cover height → the centre
     controls (align-self:end) sit at the cover's bottom instead of floating below. */
  [data-theme="overprint"] #track-details { padding: 8px 12px; gap: 6px;
    max-height: var(--ovp-w); overflow-y: auto; }
  [data-theme="overprint"] #track-details .td-list {
    display: flex; flex-wrap: wrap; gap: 6px 10px;
  }
  [data-theme="overprint"] #track-details .td-list > div { flex: 1 0 100%; }
  [data-theme="overprint"] #track-details .td-list > div:nth-child(3),
  [data-theme="overprint"] #track-details .td-list > div:nth-child(4),
  [data-theme="overprint"] #track-details .td-list > div:nth-child(5) {
    flex: 1 1 30%;
  }

  /* ===== Invert : bandeau pleine largeur, titre superposé en bas ===== */
  [data-theme="invert"] #top-zone {
    display: grid; align-items: start;
    grid-template-columns: 1fr minmax(190px, 240px);
    grid-template-areas: "cover cover" "right details";
  }
  [data-theme="invert"] #cover-col {
    grid-area: cover; position: relative; display: block; padding: 0; width: 100%;
  }
  [data-theme="invert"] #top-right { grid-area: right; width: 100%; }
  [data-theme="invert"] #cover-wrap {
    aspect-ratio: 16 / 9; height: auto; width: 100%; max-height: 54vh;
    background: #000;
  }
  [data-theme="invert"] #cover { filter: grayscale(1) contrast(1.1); }
  [data-theme="invert"] #cover-wrap:hover #cover { filter: grayscale(0) contrast(1.05); }
  /* Titre superposé en bas du bandeau (même cellule que la pochette) */
  [data-theme="invert"] #hero-title {
    grid-column: 1 / 3; grid-row: 1; align-self: end; justify-self: stretch;
    margin: 0 22px 18px; white-space: nowrap;
    color: var(--hero-accent, #ffffff); mix-blend-mode: difference;
  }
  [data-theme="invert"] #now-playing { padding-top: 14px; }
  [data-theme="invert"] #artist-album { font-size: 16px; }
  /* Cap the details column (internal scroll) so a populated panel (lifecycle +
     matrix) can't grow the top-zone past the viewport and push the footer off —
     the cover already takes ~54vh above it. */
  [data-theme="invert"] #track-details { max-height: 30vh; overflow-y: auto; }

  /* Affiches en mobile : grille → bloc, détails masqués (titre en haut, pleine largeur) */
  @media (max-width: 699px) {
    [data-theme="overprint"] #top-zone,
    [data-theme="invert"]    #top-zone { display: block; }
    /* Poster themes: the full-width artwork is the first thing on screen — let it
       extend edge-to-edge UNDER the camera cutout (no reserved strip); only the
       overlaid title shifts down clear of the punch hole. Standard themes keep the
       surface strip (their top row is text, which must not sit under the camera). */
    [data-theme="overprint"] #top-zone,
    [data-theme="invert"]    #top-zone { padding-top: 0; }
    [data-theme="overprint"] #track-details,
    [data-theme="invert"]    #track-details { display: none; }
    [data-theme="overprint"] #cover-col { width: 72vw; max-width: 340px; }
    [data-theme="overprint"] #top-right,
    [data-theme="invert"]    #top-right { width: 100%; margin: 0; padding: 8px 12px; background: none; }
    /* Title overlaid on the cover (top). Clamp to a few lines and clip so a long
       title can never overflow the cover and bleed over everything. */
    [data-theme="overprint"] #hero-title,
    [data-theme="invert"]    #hero-title {
      position: absolute; top: calc(10px + env(safe-area-inset-top, 0px));
      left: 14px; right: 14px; z-index: 3;
      margin: 0; font-size: clamp(28px, 10vw, 70px);
      max-height: 64vw; overflow: hidden; overflow-wrap: anywhere; line-height: 0.95;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
    }

    /* Overprint mobile : tous les éléments empilés et alignés à gauche sur une
       même colonne (petite marge, comme les en-têtes Boxes/Tracklist) */
    [data-theme="overprint"] #top-right { display: block; padding: 6px 14px 10px; }
    [data-theme="overprint"] #now-playing { padding: 0; gap: 0; }
    [data-theme="overprint"] #track-info { width: 100%; min-width: 0; padding: 0; }
    [data-theme="overprint"] #artist-album { font-size: 14px; }
    [data-theme="overprint"] #artist-name {
      margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Spacing now lives on the badge+dot row wrapper (see #status-line). */
    [data-theme="overprint"] #status-line { margin-top: 4px; }
    [data-theme="overprint"] #track-tags-row { margin-top: 6px; }
    [data-theme="overprint"] #controls {
      justify-content: flex-start; flex-wrap: nowrap; gap: 12px; padding: 8px 0 0;
      background: none;
    }
    [data-theme="overprint"] #controls .ctrl-btn { padding: 4px; }
    /* volume à droite des boutons, sur la même ligne (gagne une ligne). On masque
       le % et on laisse le slider se compresser pour que le bouton snapcast
       (dernier enfant) reste visible à droite de la ligne. */
    [data-theme="overprint"] #volume-row {
      flex: 1 1 auto; width: auto; min-width: 0; padding: 0; margin-left: 4px; gap: 6px;
    }
    [data-theme="overprint"] #volume-val { display: none; }
    [data-theme="overprint"] #btn-snapcast { flex-shrink: 0; }
    [data-theme="overprint"] #progress-wrap { padding: 8px 0 2px; }
  }

  /* ════════════ Design System — component layer (.o2m-* look) ════════════ */
  /* Spacing scale from the handoff (used by the component overrides below). */
  :root {
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  }

  /* Brand (O2M + "Mood" eyebrow) merged into the footer bar, on the left. */
  #footer-links .tb-brand { display: flex; align-items: baseline; gap: 9px; margin-right: var(--sp-3); }
  .tb-mark {
    font-family: var(--font-head); font-weight: 900; font-size: 15px; line-height: 1;
    letter-spacing: -.02em; text-transform: uppercase; color: var(--text);
  }
  .tb-eyebrow {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tb-eyebrow::before { content: ''; width: 6px; height: 6px; background: var(--accent); flex-shrink: 0; }

  /* Genre chips → o2m-chip : square, hairline border, mono, active = solid orange. */
  #genres-wrap { gap: var(--sp-2); }
  .genre-chip {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; padding: 6px 12px; font-weight: 500;
    background: none; border: 1px solid var(--border); color: var(--muted);
  }
  .genre-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #190E04); }

  /* Status badge → o2m-badge : mono label, leading colour square (kept). */
  #track-status-badge {
    font-family: var(--font-mono); font-weight: 500; letter-spacing: .14em; font-size: 10px;
  }

  /* Footer links → o2m-btn--ghost : square, hairline border. */
  .footer-link { border: 1px solid var(--border); padding: 5px 11px; background: none; }
  .footer-link:hover { border-color: var(--text); background: var(--fill-2); }

  /* Tracklist rows → o2m-row-item : hairline separators. */
  .tl-item { border-bottom: 1px solid var(--border-soft); }
  /* Per-row info badge → opens the row actions menu (Play next, …). */
  .tl-info {
    flex-shrink: 0; align-self: center; background: none; border: none;
    color: var(--muted); cursor: pointer; padding: 2px; display: inline-flex;
    align-items: center; opacity: .5; transition: opacity .12s, color .12s;
  }
  .tl-info:hover { color: var(--accent); opacity: 1; }
  .tl-info svg { width: 15px; height: 15px; display: block; }
  .tl-thumb { width: 30px; height: 30px; object-fit: cover; border-radius: 2px; display: block;
    background: var(--card); }
  .tl-item:last-child { border-bottom: none; }

  @media (max-width: 699px) {
    #footer-links .tb-brand { margin-right: 8px; }
  }

  /* ════════════ Track details / edit space ════════════ */
  /* Mobile-only opener button (desktop already shows the details column). */
  #btn-details { display: none; }
  #details-backdrop { display: none; }
  #btn-details-close { display: none; }
  .td-head-actions { display: flex; align-items: center; gap: 6px; }

  /* Mobile "tap to start audio" splash overlay. */
  #audio-tap-overlay {
    position: fixed; inset: 0; z-index: 9999; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: rgba(10, 8, 6, 0.92);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    transition: opacity .3s var(--ease, ease);
  }
  #audio-tap-overlay.hide { opacity: 0; }
  #audio-tap-overlay .tap-icon {
    width: 84px; height: 84px; border: 2px solid var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: var(--accent);
    animation: tap-pulse 1.8s ease-in-out infinite;
  }
  #audio-tap-overlay .tap-icon svg { width: 34px; height: 34px; margin-left: 4px; }
  #audio-tap-overlay .tap-label {
    color: #F3EEE3; font-family: var(--font-mono); text-transform: uppercase;
    letter-spacing: .18em; font-size: 13px;
  }
  @keyframes tap-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,90,0,.4); }
    50%      { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(255,90,0,0); }
  }

  /* Inline editing of the current track's energy / valence / mood (edit mode). */
  body.edit-mode .tp-editable {
    cursor: pointer; border-bottom: 1px dotted var(--border-strong);
  }
  body.edit-mode .tp-editable:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .td-edit-input, .td-edit-select {
    font: inherit; font-family: var(--font-mono); width: 56px;
    background: var(--card); color: var(--text); border: 1px solid var(--accent);
    padding: 0 4px; border-radius: 0; text-align: right;
  }
  .td-edit-select { width: auto; text-align: left; }
  @media (max-width: 699px) {
    /* Opener button inside now-playing (right side). */
    #btn-details {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 38px; height: 38px; margin-left: auto; align-self: flex-start;
      background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer;
    }
    #btn-details svg { width: 18px; height: 18px; }
    #btn-details.has-edits { border-color: var(--accent); color: var(--accent); }

    /* Details column → bottom-sheet modal (works in every theme, incl. posters).
       Anchored to --sheet-top (the header's height, published by watchSheetTop)
       rather than sized by its content: every sheet then opens at the same line —
       just under the playback controls — with the same height, whatever it holds
       and wherever the button that opened it sits. */
    #track-details {
      position: fixed !important; left: 0; right: 0; bottom: 0;
      /* min(): a very tall header (poster themes) must not squeeze the sheet. */
      top: min(var(--sheet-top, 32vh), 45vh) !important;
      z-index: 200; overflow-y: auto;
      background: var(--surface); border-top: 1px solid var(--border-strong); border-left: none;
      box-shadow: 0 -12px 40px rgba(0,0,0,.45);
      /* visibility (not just the slide) is what actually hides a closed sheet: the
         translate is a percentage of the sheet's own height, so it can only be
         trusted while that height is content-driven. Now that the height is pinned
         (top+bottom), the explicit hidden state is what guarantees a closed sheet
         never shows through. */
      transform: translateY(101%); visibility: hidden;
      transition: transform .26s var(--ease, ease), visibility .26s var(--ease, ease);
      display: flex !important; flex-direction: column; padding: 16px 16px 28px; gap: 0;
    }
    body.details-open #track-details { transform: translateY(0); visibility: visible; }
    #track-details .td-body { display: block !important; margin-top: 12px; }
    #track-details .td-head { cursor: default; padding-right: 0; }
    #track-details .td-head::after { display: none !important; }
    #btn-details-close {
      display: inline-flex; align-items: center; background: none; border: none;
      color: var(--muted); cursor: pointer; padding: 2px 4px;
    }
    #btn-details-close svg { width: 18px; height: 18px; }
    .td-head-actions { display: flex; align-items: center; gap: 6px; }

    #details-backdrop {
      display: block; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,.5);
      opacity: 0; visibility: hidden; transition: opacity .26s, visibility .26s;
    }
    body.details-open #details-backdrop { opacity: 1; visibility: visible; }
  }

  /* ════════════ Object detail / edit overlay (album · artist · box) ════════════
     Covers the lower area (below the now-playing line). Mobile-first: a bottom-sheet
     like the track edit space. Desktop/tablet: overlays the columns in place.
     Read-only for now; edit affordances land later. */
  #obj-backdrop { display: none; }
  /* Same geometry as the details sheet (see --sheet-top there): fixed top line,
     fixed height — never content- or trigger-dependent. */
  #obj-panel {
    position: fixed; left: 0; right: 0; bottom: 0;
    top: min(var(--sheet-top, 32vh), 45vh);
    z-index: 210; overflow-y: auto;
    background: var(--surface); border-top: 1px solid var(--border-strong);
    box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    /* Explicit hidden state, like the details sheet: the height is pinned now, so
       the percentage slide alone can't be relied on to keep a closed sheet away. */
    transform: translateY(101%); visibility: hidden;
    transition: transform .26s var(--ease, ease), visibility .26s var(--ease, ease);
    display: flex; flex-direction: column; padding: 14px 16px 26px;
  }
  body.obj-open #obj-panel { transform: translateY(0); visibility: visible; }
  #obj-backdrop {
    position: fixed; inset: 0; z-index: 205; background: rgba(0,0,0,.5);
    opacity: 0; visibility: hidden; transition: opacity .26s, visibility .26s;
  }
  body.obj-open #obj-backdrop { display: block; opacity: 1; visibility: visible; }

  .obj-head { display: flex; align-items: flex-start; gap: 10px; }
  .obj-head-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .obj-kind {
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .14em;
    font-size: 10px; color: var(--accent);
  }
  .obj-title { font-size: 17px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj-sub { font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Inline search field in the modal header (search views only). */
  .obj-search-input { display: none; width: 100%; margin-top: 2px; padding: 4px 0;
    background: none; border: none; border-bottom: 1.5px solid var(--accent);
    color: var(--text); font-size: 17px; font-weight: 600; font-family: inherit; outline: none; }
  .obj-search-input::placeholder { color: var(--muted); font-weight: 400; }
  #obj-panel.search-mode .obj-title, #obj-panel.search-mode .obj-sub { display: none; }
  #obj-panel.search-mode .obj-search-input { display: block; }
  /* Hero views (artist/album/playlist/podcast) already repeat the name + details
     in the vignette card, so the header keeps only the kind label (line 1) and
     drops the duplicate title/sub. */
  #obj-panel.hero-head .obj-title, #obj-panel.hero-head .obj-sub { display: none; }
  #obj-close, #obj-actions, #obj-prev, #obj-next {
    flex-shrink: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 4px; display: inline-flex;
  }
  #obj-close svg, #obj-actions svg, #obj-prev svg, #obj-next svg { width: 18px; height: 18px; display: block; }
  #obj-actions:hover, #obj-prev:hover, #obj-next:hover { color: var(--accent); }
  /* Navigation rows (albums / spotify links) carry a chevron → clicking opens. */
  .obj-nav { align-items: center; }
  .obj-chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); margin-left: auto; }
  .obj-body { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }

  .obj-hero { display: flex; gap: 12px; align-items: flex-start; }
  .obj-link { cursor: pointer; }
  .obj-link:hover { color: var(--accent); text-decoration: underline; }
  .obj-cover {
    width: 84px; height: 84px; flex-shrink: 0; object-fit: cover;
    background: var(--card); border: 1px solid var(--border);
  }
  .obj-meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px;
    color: var(--muted); min-width: 0; }
  .obj-meta b { color: var(--text); font-weight: 600; }
  .obj-src { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em;
    font-size: 9px; color: var(--muted); margin-top: 3px; }
  .obj-src-db { color: var(--accent); }

  .obj-dl { display: flex; flex-direction: column; margin: 0; }   /* reset <dl> default margin */
  .obj-dl > div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px;
    padding: 7px 0; border-bottom: 1px solid var(--border); }
  .obj-dl dt { color: var(--muted); }
  .obj-dl dd { color: var(--text); text-align: right; word-break: break-word; }

  /* Box editor — one field per row, separated by a line (like album/track rows). */
  .obj-field { display: flex; align-items: center; gap: 10px; padding: 8px 2px;
    border-bottom: 1px solid var(--border); }
  .obj-field-label { flex: 0 0 42%; font-size: 12px; color: var(--muted); }
  .obj-field-ctrl { flex: 1; display: flex; justify-content: flex-end; min-width: 0; }
  .obj-data-field { flex-direction: column; align-items: stretch; gap: 6px; }
  /* In this column-direction field, flex-basis:42% would size the label to 42% of the
     field HEIGHT (huge empty gap above the textarea) — reset it to natural height. */
  .obj-data-field .obj-field-label { flex: 0 0 auto; }
  .obj-data-field .obj-field-ctrl { flex: 0 0 auto; justify-content: stretch; }
  .bx-input { font: inherit; font-family: var(--font-mono); background: var(--card);
    color: var(--text); border: 1px solid var(--border-strong); padding: 3px 6px; border-radius: 0; }
  .bx-input:focus { border-color: var(--accent); outline: none; }
  .bx-wide { width: 100%; }
  .bx-num { width: 72px; text-align: right; }
  select.bx-input { width: auto; }
  .bx-data { width: 100%; resize: vertical; font-size: 15px; line-height: 1.7;
    min-height: 220px; max-height: 60vh; overflow-y: auto; padding: 8px 10px; }
  .obj-field input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .obj-save-row { margin-top: 14px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .obj-save-btn { background: var(--accent); color: #fff; border: none; padding: 8px 18px;
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 0; }
  .obj-save-btn:hover { opacity: .9; }
  /* Destructive action: quiet until armed, then unmistakable. */
  .bx-danger-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
    background: none; border: 1px solid var(--border); color: var(--muted);
    font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 6px;
    cursor: pointer; transition: border-color .15s, color .15s, background .15s;
  }
  .bx-danger-btn svg { width: 13px; height: 13px; display: block; }
  .bx-danger-btn:hover { color: var(--danger); border-color: var(--danger); }
  .bx-danger-btn.armed {
    background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600;
  }

  .obj-tracks { display: flex; flex-direction: column; }
  .obj-row {
    display: flex; align-items: baseline; gap: 8px; padding: 5px 2px;
    border-bottom: 1px solid var(--border);
  }
  .obj-row .ot-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    width: 22px; flex-shrink: 0; }
  .obj-row .ot-name { flex: 1; font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj-row .ot-dur { font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    flex-shrink: 0; }
  .obj-row.obj-clickable { cursor: pointer; }
  .obj-row.obj-clickable:hover { background: var(--card); }
  .obj-row.obj-clickable:hover .ot-name { color: var(--accent); }
  /* Harmonized track rows (.tl-item) reused inside the modal. */
  .obj-tracks .tl-item.obj-clickable:hover { background: var(--card); }
  .obj-tracks .tl-item.obj-clickable:hover .tl-name { color: var(--accent); }
  .obj-loading, .obj-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .obj-section-label {
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em;
    font-size: 10px; color: var(--muted); margin: 4px 0 4px;
  }

  /* Clickable affordances on existing elements */
  #artist-name.obj-link { cursor: pointer; }
  #artist-name.obj-link:hover { color: var(--text); text-decoration: underline; }
  .tl-artist.obj-link { cursor: pointer; }
  .tl-artist.obj-link:hover { color: var(--text); text-decoration: underline; }
  /* Radio now-playing: the header artist/album are the live SONG's (not openable
     O2M objects), so make them inert — no pointer/hover, no dead clicks. */
  #now-playing.radio-np #artist-name,
  #now-playing.radio-np #album-name { cursor: default; pointer-events: none; text-decoration: none; }
  .box-info-btn {
    margin-left: auto; flex-shrink: 0; background: none; border: none;
    color: var(--muted); cursor: pointer; padding: 2px; display: inline-flex;
  }
  .box-info-btn:hover { color: var(--accent); }
  .box-info-btn svg { width: 15px; height: 15px; display: block; }

  /* ── Structured box-data editor ── */
  #bx-editor-host { width: 100%; }
  .bx-line {
    display: flex; align-items: center; gap: 8px; padding: 6px 2px;
    border-bottom: 1px solid var(--border); min-width: 0;
  }
  .bx-line.disabled .bx-kind, .bx-line.disabled .bx-main { opacity: .45; }
  .bx-kind { flex-shrink: 0; color: var(--muted); display: inline-flex; }
  .bx-kind svg { width: 14px; height: 14px; display: block; }
  .bx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .bx-name { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bx-name-editable { cursor: text; }
  .bx-name-editable:hover { color: var(--accent); }
  .bx-sub {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bx-label-input { width: 100%; font-size: 13px; }
  .bx-line-btn {
    flex-shrink: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 3px; display: inline-flex; transition: color .15s;
  }
  .bx-line-btn:hover { color: var(--accent); }
  .bx-line-btn svg { width: 13px; height: 13px; display: block; }
  .bx-empty { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  .bx-foot-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .bx-foot-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bx-foot-btn.ghost { color: var(--muted); }
  .bx-foot-btn svg { width: 13px; height: 13px; display: block; }

  /* ── Content editor organism: List/Raw · content · Add content ── */
  .wc { width: 100%; }
  .wc-toolbar { display: flex; gap: 6px; padding-bottom: 8px; }
  .wc-seg {
