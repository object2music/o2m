/* ── MATRIX energy × valence ── */
const PAD = 28;
const MX_FONT = 'Archivo, system-ui, sans-serif';
let matrixFeatures = {};   // uri → {energy, valence}
let matrixTlItems  = [];   // [{uri, tlid}]
let matrixCurUri   = null;
let matrixMode     = 'move'; // 'move' | 'resize'

/* Couleurs lues depuis les variables CSS du thème courant */
let themeColors = {};
function readThemeColors() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  themeColors = {
    bg: g('--mx-bg'),
    qCalm: g('--mx-q-calm'), qHappy: g('--mx-q-happy'),
    qDark: g('--mx-q-dark'), qEnergetic: g('--mx-q-energetic'),
    line: g('--mx-line'), border: g('--mx-border'),
    label: g('--mx-label'), axis: g('--mx-axis'),
    dlFill: g('--mx-dl-fill'), dlStroke: g('--mx-dl-stroke'),
    dotCore: g('--mx-dot-core') || '#fff', pulse: g('--mx-pulse') || '255,255,255',
    happy: g('--mood-happy'), energetic: g('--mood-energetic'),
    calm: g('--mood-calm'), dark: g('--mood-dark'),
  };
}

function moodColor(e, v, a = 1) {
  let t;
  if (e > 0.5 && v > 0.5) t = themeColors.happy;      // happy
  else if (e > 0.5)        t = themeColors.energetic;  // energetic
  else if (v > 0.5)        t = themeColors.calm;       // calm
  else                     t = themeColors.dark;       // dark
  return `rgba(${t || '120,120,120'},${a})`;
}

/* Theme's dominant accent color (orange), used only for the currently-playing dot */
function accentColor(a = 1) {
  return `rgba(${themeColors.pulse || '255,90,0'},${a})`;
}

/* Greyscale by popularity: darker = more popular, lighter = less popular */
function popularityColor(p) {
  if (p == null) return 'rgba(150,150,150,.5)';
  const light = Math.round(85 - 65 * Math.max(0, Math.min(1, p)));
  return `hsl(0,0%,${light}%)`;
}

function initMatrix() {
  const canvas = document.getElementById('mood-matrix');
  const dpr    = window.devicePixelRatio || 1;

  function resizeCanvas() {
    const w = canvas.offsetWidth;
    canvas.width  = w * dpr;
    canvas.height = w * dpr;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(canvas);

  /* Touch-friendly gesture routing (phone): the canvas is touch-action:pan-y, so a
     vertical swipe scrolls the page. We CLAIM the gesture (preventDefault on a
     non-passive touchstart) only when it starts on the handle, the dl ring, or the
     draggable track point — those drags control the matrix even vertically.
     Touch-drags elsewhere scroll; a tap elsewhere still sets the target (applied on
     pointerup so an aborted scroll never accidentally moves the mood). */
  function matrixShouldClaimTouch(canvas, pt) {
    const rect  = canvas.getBoundingClientRect();
    const inner = rect.width - 2 * PAD;
    const tx = rect.left + PAD + appState.energy * inner;
    const ty = rect.top  + PAD + (1 - appState.valence) * inner;
    if (Math.hypot(pt.clientX - tx, pt.clientY - ty) < 28) return true;          // handle
    const r = (appState.dl / 20 + 0.05) * inner;
    if (Math.abs(Math.hypot(pt.clientX - tx, pt.clientY - ty) - r) < 18) return true;  // ring
    if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {          // track point
      const f = matrixFeatures[matrixCurUri];
      const cx = rect.left + PAD + f.energy * inner;
      const cy = rect.top  + PAD + (1 - f.valence) * inner;
      if (Math.hypot(pt.clientX - cx, pt.clientY - cy) < 28) return true;
    }
    return false;
  }
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t && matrixShouldClaimTouch(canvas, t)) e.preventDefault();
  }, { passive: false });

  let matrixDeferred = null;   // touch started off-handle: apply only if it ends as a tap
  canvas.addEventListener('pointerdown', e => {
    matrixMode = detectMatrixMode(canvas, e);
    if (e.pointerType === 'touch' && !matrixShouldClaimTouch(canvas, e)) {
      matrixDeferred = { x: e.clientX, y: e.clientY, mode: matrixMode };
      return;   // may become a page scroll — don't move the target yet
    }
    matrixDeferred = null;
    canvas.setPointerCapture(e.pointerId);
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointermove', e => {
    if (!e.buttons) {
      const mode = detectMatrixMode(canvas, e);
      canvas.classList.toggle('cursor-resize', mode === 'resize');
      showMatrixTooltip(canvas, e);
      return;
    }
    if (matrixDeferred) return;   // pending tap-or-scroll: let the browser decide
    e.preventDefault();
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointerup', e => {
    if (matrixDeferred) {
      const tap = Math.hypot(e.clientX - matrixDeferred.x, e.clientY - matrixDeferred.y) < 12;
      const mode = matrixDeferred.mode; matrixDeferred = null;
      if (!tap) return;   // it was a swipe the browser turned into a scroll
      matrixMode = mode;
      if (mode === 'edittrack') { matrixEditTrack(canvas, e); saveCurrentTrackFeatures(); matrixMode = 'move'; }
      else { matrixMove(canvas, e); scheduleApply(); }
      return;
    }
    if (matrixMode === 'edittrack') { saveCurrentTrackFeatures(); matrixMode = 'move'; }
    else scheduleApply();
  });
  canvas.addEventListener('pointercancel', () => { matrixDeferred = null; });
  canvas.addEventListener('pointerleave', () => hideMatrixTooltip());

  requestAnimationFrame(drawMatrix);
}

function detectMatrixMode(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  // Mode édition : priorité au point du morceau courant (draggable)
  if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {
    const f = matrixFeatures[matrixCurUri];
    const cx = rect.left + PAD + f.energy * inner;
    const cy = rect.top  + PAD + (1 - f.valence) * inner;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 16) return 'edittrack';
  }
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const r  = (appState.dl / 20 + 0.05) * inner;
  const dist = Math.hypot(e.clientX - tx, e.clientY - ty);
  const HANDLE = 14;
  if (Math.abs(dist - r) < HANDLE) return 'resize';
  // Edit mode + current track has no energy/valence yet → click the matrix to set them.
  if (editUnlocked && matrixCurUri && !matrixFeatures[matrixCurUri]) return 'edittrack';
  return 'move';
}

function matrixMove(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  appState.energy  = energy;
  appState.valence = valence;
  setDial('energy', energy);
  setDial('valence', valence);
}

function matrixEditTrack(canvas, e) {
  if (!matrixCurUri) return;
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  matrixFeatures[matrixCurUri] = { energy, valence };
  const set = (id, x) => { const el = document.getElementById(id); if (el) el.textContent = Math.round(x * 10) + '/10'; };
  set('td-energy', energy); set('td-valence', valence);
}

/* ── Per-track mood matrix (in the track-details panel) ──
   Shows the details track's energy/valence as a draggable dot; dragging (in edit
   mode) repositions it and saves to /api/track_features. The state and the drag
   handling live on the shared panel object (see makeTrackPanel /
   initTrackPanelMatrix); only the pure renderer below is standalone. */
const TD_PAD = 10;
// Pure renderer: draws the energy(X)/valence(Y) quadrant matrix onto `canvas`,
// with an optional {energy,valence} dot. Shared by the details panel and the
// modal track view so every mood matrix looks and behaves identically.
function drawMoodMatrix(canvas, ev, pad) {
  if (!canvas) return;
  pad = pad || 10;
  const cssW = canvas.offsetWidth;
  if (cssW <= 0) return;                       // panel hidden / not laid out
  const dpr = window.devicePixelRatio || 1;
  const need = Math.round(cssW * dpr);
  // The HEIGHT has to be tested too, not just the width. A freshly rendered <canvas>
  // starts at the HTML default 300x150. On a display with devicePixelRatio 1 and the
  // matrix at its 300px max-width (which is exactly what the mobile layout gives it),
  // `need` comes out at 300 — equal to that default width — so a width-only test found
  // nothing to do and left the height at 150. The backing store stayed 300x150 and the
  // browser stretched it into the square CSS box: everything came out twice as tall,
  // the two bottom quadrant names fell outside it, and the dot sat far below its value.
  if (canvas.width !== need || canvas.height !== need) { canvas.width = need; canvas.height = need; }
  const ctx = canvas.getContext('2d');
  const W = canvas.width / dpr, inner = W - 2 * pad;
  const mx = pad + inner / 2, my = pad + inner / 2;
  ctx.save(); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, W);
  [[pad, pad, themeColors.qCalm], [mx, pad, themeColors.qHappy],
   [pad, my, themeColors.qDark], [mx, my, themeColors.qEnergetic]]
    .forEach(([x, y, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, inner / 2, inner / 2); });
  ctx.strokeStyle = themeColors.line; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(mx, pad); ctx.lineTo(mx, pad + inner);
  ctx.moveTo(pad, my); ctx.lineTo(pad + inner, my); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = themeColors.border; ctx.strokeRect(pad, pad, inner, inner);
  ctx.fillStyle = themeColors.label; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.font = '700 9px ' + MX_FONT;
  ctx.fillText('CALM', pad + inner * 0.25, pad + inner * 0.1);
  ctx.fillText('HAPPY', pad + inner * 0.75, pad + inner * 0.1);
  ctx.fillText('INTENSE', pad + inner * 0.25, pad + inner * 0.9);
  ctx.fillText('ENERGETIC', pad + inner * 0.75, pad + inner * 0.9);
  if (ev) {
    const x = pad + ev.energy * inner, y = pad + (1 - ev.valence) * inner;
    const col = moodColor(ev.energy, ev.valence, 1);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = themeColors.dotCore; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  } else {
    ctx.fillStyle = themeColors.axis; ctx.font = '10px ' + MX_FONT;
    ctx.fillText(editUnlocked ? 'tap to set' : 'no mood data', mx, my);
  }
  ctx.restore();
}
// Map a pointer/touch event to an {energy,valence} position inside `canvas`.
function _matrixEVFromEvent(canvas, e, pad) {
  pad = pad || 10;
  const rect = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * pad;
  const px = (e.touches ? e.touches[0].clientX : e.clientX);
  const py = (e.touches ? e.touches[0].clientY : e.clientY);
  return {
    energy:  Math.min(1, Math.max(0, (px - rect.left - pad) / inner)),
    valence: Math.min(1, Math.max(0, 1 - (py - rect.top - pad) / inner)),
  };
}
// Thin aliases kept for the now-playing panel's call sites.
function initTdMatrix() { initTrackPanelMatrix(tdPanel); }

/* ── Modal track view (obj-panel) — the track "See details" sheet.
   Lives in the shared object modal so it inherits the ◂ ▸ nav bar and the same
   height as album/artist/box; and — unlike the now-playing #track-details panel —
   it is never overwritten by the now-playing refresh (no more value reset). */
/* Read-only lifecycle scale: where the track sits on
   trash|hidden > new > incoming > library > favorites. trash/hidden are the
   "excluded" zone (muted dot) before a | divider; new→favorites is the forward
   progression (accent dot + fill). Podcast/info/unknown → no scale. */
const LC_STAGES = [
  ['trash', 'Trash', true], ['hidden', 'Hidden', true],
  ['new', 'New', false], ['incoming', 'Incoming', false],
  ['library', 'Library', false], ['favorites', 'Favorites', false],
];
// Generic stop-scale renderer. stages = [[key,label,excl?]…]; dot centres at
// (i+0.5)/n → the line/fill/divider are positioned against those centres inline
// (so it works for any stop count). No caption.
function _scaleHTML(stages, idx, divAfter) {
  const n = stages.length;
  const centre = i => (i + 0.5) / n * 100;
  const edge = centre(0);
  const excl = !!(stages[idx] && stages[idx][2]);
  const sep = (divAfter != null && divAfter >= 0 && divAfter < n - 1)
    ? `<div class="lc-sep" style="left:${(centre(divAfter) + centre(divAfter + 1)) / 2}%"></div>` : '';
  const stops = stages.map((s, i) =>
    `<div class="lc-stop${s[2] ? ' excl' : ''}${i === idx ? ' current' : ''}">`
    + `<span class="lc-dot"></span><span class="lc-lab">${s[1]}</span></div>`).join('');
  return `<div class="lc-scale"><div class="lc-track">
    <div class="lc-line" style="left:${edge}%;right:${edge}%"></div>
    <div class="lc-line-fill${excl ? ' excl' : ''}" style="left:${edge}%;width:${centre(idx) - edge}%"></div>
    ${sep}<div class="lc-stops">${stops}</div>
  </div></div>`;
}
function lifecycleScaleHTML(info) {
  const ot = info && info.option_type;
  // Podcast/info = consume-once → listening progress, not the affinity ladder.
  if (ot === 'podcast' || ot === 'info') {
    const done = (info.read_count_end || 0) >= 1;
    const started = !done && (info.read_end || 0) > 0.02;
    return _scaleHTML([['unplayed', 'Unplayed'], ['progress', 'In progress'], ['finished', 'Finished']],
      done ? 2 : (started ? 1 : 0));
  }
  const idx = LC_STAGES.findIndex(s => s[0] === ot);
  if (idx < 0) return '';   // unknown type → no scale
  return _scaleHTML(LC_STAGES, idx, 1);   // divider after hidden (index 1)
}

function initObjTMatrix() { initTrackPanelMatrix(objPanel); }

/* ── Inline editing of the current track's energy / valence / mood (edit mode) ── */
const MOOD_EDIT_OPTIONS = [['calm','Calm'],['energetic','Energetic'],['dark','Intense'],['happy','Happy']];

/* The now-playing panel's editors are the shared implementations, bound to its
   panel instance. */
function editTrackNumber(kind) { editTrackPanelNumber(tdPanel, kind); }
function editTrackMood() { editTrackPanelMood(tdPanel); }

function matrixResize(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const radius01 = Math.hypot(e.clientX - tx, e.clientY - ty) / inner;
  const dl = Math.min(10, Math.max(0, Math.round((radius01 - 0.05) * 20)));
  appState.dl = dl;
  setDial('dl', dl / 10);
}

function drawMatrix(ts) {
  requestAnimationFrame(drawMatrix);
  const canvas = document.getElementById('mood-matrix');
  if (!canvas) return;

  const dpr   = window.devicePixelRatio || 1;
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const inner = W - 2 * PAD;
  if (inner <= 0) return;   // canvas pas encore dimensionné / panneau replié → on saute la frame
  const ctx   = canvas.getContext('2d');

  const ex = e => PAD + e * inner;
  const vy = v => PAD + (1 - v) * inner;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  /* Background */
  ctx.fillStyle = themeColors.bg || '#0b1829';
  ctx.fillRect(0, 0, W, H);

  const mx = PAD + inner / 2, my = PAD + inner / 2;

  /* Quadrant fills */
  [
    [PAD, PAD, inner/2, inner/2, themeColors.qCalm],      // calm      top-left
    [mx,  PAD, inner/2, inner/2, themeColors.qHappy],     // happy     top-right
    [PAD, my,  inner/2, inner/2, themeColors.qDark],      // dark      bottom-left
    [mx,  my,  inner/2, inner/2, themeColors.qEnergetic], // energetic bottom-right
  ].forEach(([x, y, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); });

  /* Center lines */
  ctx.strokeStyle = themeColors.line; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(mx, PAD); ctx.lineTo(mx, PAD + inner);
  ctx.moveTo(PAD, my); ctx.lineTo(PAD + inner, my);
  ctx.stroke(); ctx.setLineDash([]);

  /* Inner border */
  ctx.strokeStyle = themeColors.border; ctx.lineWidth = 1;
  ctx.strokeRect(PAD, PAD, inner, inner);

  /* Quadrant names — big watermark centered in each quadrant, sized so the text
     spans ~50% of the quadrant's width (each word gets its own font size to match). */
  const qW = inner / 2, targetW = qW * 0.5;
  ctx.save();
  ctx.fillStyle = themeColors.label; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  // Size fixed once from the top-left word (CALM) and reused for all 4, so every
  // quadrant name renders at the same font size (no per-word rescaling).
  ctx.font = '800 40px ' + MX_FONT;
  const qFontSize = Math.round(40 * targetW / ctx.measureText('CALM').width);
  ctx.font = `800 ${qFontSize}px ` + MX_FONT;
  [
    ['CALM',      PAD + inner * 0.25, PAD + inner * 0.25],
    ['HAPPY',     PAD + inner * 0.75, PAD + inner * 0.25],
    ['INTENSE',   PAD + inner * 0.25, PAD + inner * 0.75],
    ['ENERGETIC', PAD + inner * 0.75, PAD + inner * 0.75],
  ].forEach(([text, cx, cy]) => ctx.fillText(text, cx, cy));
  ctx.restore();

  /* Axis labels */
  ctx.font = '11px ' + MX_FONT; ctx.fillStyle = themeColors.axis;
  ctx.textAlign = 'left';   ctx.fillText('◀ Calm',  2, my + 4);
  ctx.textAlign = 'right';  ctx.fillText('Rapid ▶', W - 2, my + 4);
  ctx.textAlign = 'center';
  ctx.fillText('▲ Bright', mx, 12);
  ctx.fillText('▼ Dark',   mx, PAD + inner + PAD - 2);

  /* Tracklist dots — color correlated to popularity (darker = more popular) */
  matrixTlItems.forEach(({ uri, tlid }) => {
    const f = matrixFeatures[uri];
    if (!f || tlid === currentTlid) return;
    ctx.beginPath();
    ctx.arc(ex(f.energy), vy(f.valence), 3, 0, Math.PI * 2);
    ctx.fillStyle = popularityColor(f.popularity);
    ctx.fill();
  });

  /* Currently playing — blinking dot in the theme's accent color */
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const cx = ex(curF.energy), cy = vy(curF.valence);
    const pulse = (Math.sin(ts / 450) + 1) / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 9 + pulse * 6, 0, Math.PI * 2);
    ctx.strokeStyle = accentColor(0.28 * (1 - pulse));
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = accentColor(0.45 + 0.55 * pulse);
    ctx.fill();
    ctx.strokeStyle = accentColor(1);
    ctx.lineWidth = 2.5; ctx.stroke();
  }

  /* DL area — dashed circle */
  const { energy, valence, dl } = appState;
  const r  = (dl / 20 + 0.05) * inner;
  const tx = ex(energy), ty = vy(valence);
  ctx.save();
  ctx.beginPath(); ctx.rect(PAD, PAD, inner, inner); ctx.clip();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dlFill; ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.strokeStyle = themeColors.dlStroke; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  /* Target dot */
  ctx.beginPath(); ctx.arc(tx, ty, 11, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dotCore; ctx.fill();
  ctx.strokeStyle = moodColor(energy, valence, 1); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2);
  ctx.fillStyle = moodColor(energy, valence, 1); ctx.fill();

  ctx.restore();
}

function showMatrixTooltip(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const HIT   = 10; // px hit radius

  // Build candidate list: tracklist dots + currently playing
  const candidates = matrixTlItems.map(item => {
    const f = matrixFeatures[item.uri];
    if (!f) return null;
    const sx = rect.left + PAD + f.energy * inner;
    const sy = rect.top  + PAD + (1 - f.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    return d < HIT ? { item, f, d } : null;
  }).filter(Boolean);

  // Also check currently playing
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const sx = rect.left + PAD + curF.energy * inner;
    const sy = rect.top  + PAD + (1 - curF.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (d < HIT + 4) {
      const curItem = matrixTlItems.find(i => i.uri === matrixCurUri);
      candidates.push({ item: curItem || { name: '♪ Playing', artist: '' }, f: curF, d });
    }
  }

  if (!candidates.length) { hideMatrixTooltip(); return; }

  // Pick closest
  candidates.sort((a, b) => a.d - b.d);
  const { item, f } = candidates[0];

  const tip = document.getElementById('matrix-tooltip');
  tip.querySelector('.tt-name').textContent   = item?.name   || '?';
  tip.querySelector('.tt-artist').textContent = item?.artist || '';
  tip.querySelector('.tt-ev').innerHTML =
    `<span>${ICON.zap} ${f.energy.toFixed(2)}</span><span>${ICON.sun} ${f.valence.toFixed(2)}</span>`;

  // Position: prefer right of dot, flip if near right edge
  const TX = 14, TY = -8;
  let left = e.clientX + TX;
  let top  = e.clientY + TY;
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  if (left + tw > window.innerWidth - 8) left = e.clientX - tw - TX;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}

function hideMatrixTooltip() {
  document.getElementById('matrix-tooltip').style.display = 'none';
}

/* ── Boxes panel ── */
/* ════════════ Object detail overlay (album · artist · box) ════════════
   Read-only for now. Opens over the lower area; edit affordances come later.
   Album/artist detail is sourced from mopidy RPC (browse/lookup/get_images);
   box detail from the O2M API (/box_info). */
let currentTrackObj = null;

/* ── Back gesture closes modals (history-based) ──
   Opening a modal pushes one history entry; the Android back swipe/button pops it
   and we close the modal instead of leaving the app. Closing through the UI
   (X / backdrop / Escape) consumes our entry with history.back() so the history
   stack stays balanced. */
let _modalPop = null;        // tag of the history entry we pushed ('obj' | 'details')
let _consumingModal = false; // our own history.back() consuming a modal entry
function modalHistoryPush(tag) {
  if (_modalPop) return;   // one modal entry at a time is enough
  _modalPop = tag;
  try { history.pushState({ o2mModal: tag }, ''); } catch (e) {}
}
function modalHistoryConsume(tag) {
  if (_modalPop !== tag) return;
  _modalPop = null;
  _consumingModal = true;
  try { history.back(); } catch (e) { _consumingModal = false; }
}
/* Root back-trap: O2M is a music player — an accidental back swipe used to kill
   the app AND the audio (the phone is the Snapcast speaker). Keep a sentinel
   history entry armed under the modal entries so a back gesture with no modal
   open is swallowed (re-armed) instead of exiting. Leaving the app is done with
   the Home/recents gesture, like any fullscreen player. */
function armBackTrap() {
  const s = history.state || {};
  if (s.o2mTrap || s.o2mModal) return;   // already armed (or a modal is on top)
  try { history.pushState({ o2mTrap: true }, ''); } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (_consumingModal) { _consumingModal = false; return; }  // balanced UI close
  const tag = _modalPop;
  if (tag) {               // back gesture with a modal open → close the modal
    _modalPop = null;
    if (tag === 'obj') closeObjPanel(true);
    else if (tag === 'details') document.body.classList.remove('details-open');
    return;
  }
  // Back gesture at app root → swallow it and stay alive.
  armBackTrap();
  setFeedback('Use the Home gesture to leave O2M');
});
armBackTrap();

/* Reopening the app after it was backgrounded/closed can restore a frozen
   bfcache copy (dead WebSockets, suspended audio, stale UI stuck on the splash).
   A persisted pageshow means exactly that → force a clean reload. */
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
window.addEventListener('resize', () => { try { syncDetailsWidth(); } catch (e) {} });

function openObjPanel() {
  if (!document.body.classList.contains('obj-open')) modalHistoryPush('obj');
  document.body.classList.add('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'false');
}
function closeObjPanel(fromPop) {
  objClearNav();
  document.body.classList.remove('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'true');
  if (fromPop !== true) modalHistoryConsume('obj');   // UI close → consume our entry
}
function objSetHead(kind, title, sub) {
  document.getElementById('obj-kind').textContent  = kind;
  document.getElementById('obj-title').textContent = title || '—';
  document.getElementById('obj-sub').textContent   = sub || '';
  // Search views get an editable query field in the header (refine without closing).
  // Centralised here so it also re-applies when a search view is restored via ◂ ▸.
  const searchMode = (kind === 'Search');
  document.getElementById('obj-panel')?.classList.toggle('search-mode', searchMode);
  // Views whose body already shows the name in a hero card → hide the redundant
  // header title/sub (kept in the DOM for snapshots + search-input seeding).
  document.getElementById('obj-panel')?.classList.toggle('hero-head',
    ['Artist', 'Album', 'Playlist', 'Podcast', 'Track'].includes(kind));
  const si = document.getElementById('obj-search-input');
  if (si && searchMode && document.activeElement !== si) si.value = title || '';
}
function objBody()  { return document.getElementById('obj-body'); }
function objLoading(msg) { objBody().innerHTML = `<div class="obj-loading">${msg || 'Loading…'}</div>`; }

/* ── Modal navigation history (prev/next within the object modal) ──
   Search → open an artist → Back returns to the search results; Forward returns
   to the artist. Snapshots the rendered view (head + body + action state) so
   navigation is instant and never re-fetches. Two-stack browser model. */
const _objBack = [], _objFwd = [];
let _objRestoring = false;
function _objSnap() {
  // Banking the box editor away → keep its unsaved form edits in _boxEditInfo
  // (the snapshot only stores innerHTML; typed values don't survive a restore).
  if (document.getElementById('bx-editor-host') && !document.getElementById('bx-wizard')) _bxCaptureEditorFields();
  return {
    kind:  document.getElementById('obj-kind').textContent,
    title: document.getElementById('obj-title').textContent,
    sub:   document.getElementById('obj-sub').textContent,
    html:  objBody().innerHTML,
    playUris: objCurrentPlayUris.slice(),
    ownUri: objCurrentUri,
  };
}
function _objApply(s) {
  _objRestoring = true;
  objSetHead(s.kind, s.title, s.sub);
  objBody().innerHTML = s.html;
  objSetActionUris(s.playUris, s.ownUri);
  _objRestoring = false;
  _objUpdateNav();
  // A restored track view carries an inert body (innerHTML only) → re-wire it.
  if (document.getElementById('obj-tmatrix')) {
    objTMatrixUri = s.ownUri;
    if (matrixFeatures[s.ownUri]) objPanel.ev = { ...matrixFeatures[s.ownUri] };
    objPanel.rewire();
    renderPlaylistEditor(editUnlocked ? s.ownUri : null, 'obj-playlists');
    requestAnimationFrame(() => objPanel.draw());
  }
  // Same for a restored wizard or box-editor view: re-render from live state
  // (draft / edit info) so the buttons work and unsaved content is kept.
  else if (document.getElementById('bx-wizard')) {
    if (_boxDraft) renderWizardStep();
  }
  else if (document.getElementById('bx-editor-host')) {
    const uid = (s.ownUri || '').startsWith('box:') ? s.ownUri.slice(4) : null;
    if (_boxEditInfo && uid === _boxEditInfo.uid) {
      _bxHost = 'editor';
      objBody().innerHTML = renderBoxEditor(_boxEditInfo);
      wireBoxEditor(_boxEditInfo);
    } else if (uid) {
      openBox(uid);   // a different box was edited since → reload this one fresh
    }
  }
}
function _objUpdateNav() {
  // The wizard drives its own sequence with Back/Next at the bottom; the modal's
  // ◂ ▸ (which jump between *views*, not steps) would contradict it, so they are
  // hidden for as long as a wizard is on screen.
  const inWizard = !!document.getElementById('bx-wizard');
  document.getElementById('obj-prev')?.classList.toggle('hide', inWizard || _objBack.length === 0);
  document.getElementById('obj-next')?.classList.toggle('hide', inWizard || _objFwd.length === 0);
}
// Called at the top of each fresh modal navigation: bank the outgoing view.
function objNavTo() {
  if (_objRestoring) return;
  if (document.body.classList.contains('obj-open')
      && objBody().innerHTML.trim()
      && !objBody().querySelector('.obj-loading')) {
    _objBack.push(_objSnap());
    _objFwd.length = 0;
  }
  _objUpdateNav();
}
function objBackNav() { if (_objBack.length) { _objFwd.push(_objSnap()); _objApply(_objBack.pop()); } }
function objFwdNav()  { if (_objFwd.length)  { _objBack.push(_objSnap()); _objApply(_objFwd.pop()); } }
function objClearNav() { _objBack.length = 0; _objFwd.length = 0; _objUpdateNav(); }
const objEsc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The header title is clamped to one ellipsised line, so mirror it into the title
   attribute: hovering (or long-pressing on touch) then shows it in full. Set in one
   place because three call sites write this line. */
/* For a podcast or an info item the header's artist/album lines carry the feed's
   author and its own name — the same thing twice, and neither says where the
   episode came from. Replace them with what actually helps while listening: the
   show it belongs to, the box currently serving it, and its publication date.
   Music and radios are untouched. */
async function updateSpokenHeader(track) {
  if (!track || !track.uri || !_isSpokenUri(track.uri)) return;
  try {
    const d = await fetch(API + '/track_info?uri=' + encodeURIComponent(track.uri))
                      .then(r => r.json());
    if (!d || !['podcast', 'info'].includes(d.option_type || '')) return;
    const cur = (currentTrackObj && currentTrackObj.uri) || '';
    if (cur && cur !== track.uri) return;          // track changed meanwhile
    const line = [d.channel, d.source].filter(Boolean).join(' · ');
    const artistEl = document.getElementById('artist-name');
    if (artistEl && line) { artistEl.textContent = line; artistEl.classList.remove('obj-link'); }
    const albumEl = document.getElementById('album-name');
    if (albumEl) albumEl.textContent = d.published ? fmtDay(d.published) : '';
  } catch (e) {}
}

/* 'YYYY-MM-DD' -> 'DD-MM-YYYY'; anything else is passed through untouched. */
function fmtDay(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || '').trim());
  return m ? `${m[3]}-${m[2]}-${m[1]}` : (v || '—');
}

function setTrackName(text) {
  const el = document.getElementById('track-name');
  if (!el) return;
  el.textContent = text;
  el.title = (text && text !== '—') ? text : '';
}

/* Modal hero: the real artwork when there is one, else a generated cover (declared
   with `function` → hoisted, so the renderers defined above can call it).
   The SVG is injected inline, never through <img src>: it reads the theme's var(--…). */
function objCoverHTML(url, seed) {
  if (url) return `<img class="obj-cover" src="${objEsc(url)}" alt="">`;
  if (!window.O2M) return '';
  return `<div class="obj-cover obj-cover--gen">${O2M.coverFor(seed || '')}</div>`;
}

async function objCover(uri) {
  try {
    const r = await rpc('core.library.get_images', {uris: [uri]});
    const imgs = r?.result?.[uri] || [];
    const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
    return best ? imageUrl(best.uri || best) : '';
  } catch(e) { return ''; }
}

// Track list (album/artist) — same row pattern as the tracklist (.tl-item). The
// row is NOT click-to-play (that was ambiguous): all actions are explicit and
// labelled behind the info badge (Play next / Play now).
function objRenderTracks(tracks, kind = '', placeholder = false) {
  if (!tracks.length) return '<div class="obj-empty">No tracks.</div>';
  return '<div class="obj-tracks">' + tracks.map((t, i) => {
    // Per-track O2M cache fields (status/mood/energy/local) → compact meta line.
    const meta = [];
    if (t.option_type) meta.push(objEsc(t.option_type));
    if (t.energy != null)  meta.push(ICON.zap + ' ' + Number(t.energy).toFixed(1));
    if (t.valence != null) meta.push(ICON.sun + ' ' + Number(t.valence).toFixed(1));
    if (t.mood) meta.push(objEsc(t.mood));
    if (t.local) meta.push('local');
    const statusCls = t.option_type ? ('s-' + objEsc(t.option_type)) : '';
    const statusHtml = meta.length ? `<div class="tl-status ${statusCls}">${meta.join(' · ')}</div>` : '';
    const inner = trackRowInnerHTML({
      indexLabel: String(i + 1).padStart(2, '0'),
      name: t.name,
      artist: (t.artists || []).map(a => a.name).join(', '),
      artistUri: (t.artists || [])[0]?.uri || '',
      uri: t.uri,
      durText: t.length ? msToMin(t.length) : '',
      statusHtml,
      kind,
      // In search results (placeholder=true) fall back to a generated cover instead
      // of the index; album/artist track lists keep the meaningful track number.
      image: t.image || '',
      coverSeed: placeholder ? t.uri : '',
    });
    // obj-openable → clicking the row (not the + / artist link) opens the track detail.
    return `<div class="tl-item obj-openable" data-uri="${objEsc(t.uri)}" data-kind="${objEsc(kind || 'track')}">${inner}</div>`;
  }).join('') + '</div>';
}

/* Frontend memo cache — the overlay refetches via RPC on each open even though
   mopidy-spotify already caches the web responses (images in a permanent dict,
   album/artist/track metadata via an etag/Cache-Control response cache). Caching
   the rendered result here makes reopening the same object instant. */
const OBJ_TTL = 10 * 60 * 1000;
const objCache = new Map();
function objShowCached(key) {
  const c = objCache.get(key);
  if (c && (Date.now() - c.ts) < OBJ_TTL) {
    objSetHead(c.kind, c.title, c.sub); objBody().innerHTML = c.html; return true;
  }
  return false;
}
function objStore(key, kind, title, sub) {
  objCache.set(key, { kind, title, sub, html: objBody().innerHTML, ts: Date.now() });
}

// Small tag showing where the content came from (O2M DB cache vs live Spotify).
function objSourceTag(source) {
  return `<span class="obj-src obj-src-${source}">${source === 'db' ? 'from cache' : 'live'}</span>`;
}

function renderArtist(uri, { name = 'Artist', image = '', genres = [], tracks = [], albums = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Artist', name, '');
  const coverHtml = objCoverHTML(image, uri);
  const genreLine = genres.length ? `<span>${genres.slice(0, 6).map(objEsc).join(' · ')}</span>` : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b>`
    + `<span>${tracks.length} tracks · ${albums.length} albums</span>${genreLine}${objSourceTag(source)}</div></div>`;
  if (tracks.length)
    html += `<div><div class="obj-section-label">Tracks</div>${objRenderTracks(tracks)}</div>`;
  if (albums.length)
    html += `<div><div class="obj-section-label">Albums</div>`
      + _searchObjRows(albums.map(a => ({ uri: a.uri, name: a.name, image: a.image || '' })), 'album')
      + `</div>`;
  objBody().innerHTML = html || '<div class="obj-empty">No data.</div>';
  objStore('artist:' + uri, 'Artist', name, '');
}

// DB-first (O2M cache); falls back to a live Spotify browse when not cached.
async function openArtist(uri, seedName) {
  if (!uri) { setFeedback('No artist link'); return; }
  objNavTo();
  const title = seedName || 'Artist';
  objSetHead('Artist', title, '');
  openObjPanel();
  if (objShowCached('artist:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/artist_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached) {
      // Cached rows often lack an image_url (Last.fm genre warmup stores no cover);
      // fetch the real cover live so the vignette is never a blank/placeholder.
      let image = d.image;
      if (!image) { try { image = await objCover(uri); } catch (e) {} }
      renderArtist(uri, {
        name: d.name || title, image, genres: d.genres || [], albums: d.albums || [], source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [browseR, cover] = await Promise.all([ rpc('core.library.browse', {uri}), objCover(uri) ]);
    const rows = browseR?.result || [];
    renderArtist(uri, {
      name: title, image: cover, genres: [], source: 'live',
      tracks: rows.filter(r => r.type === 'track').map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
      albums: rows.filter(r => r.type !== 'track').map(a => ({ uri: a.uri, name: a.name })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load artist.</div>'; }
}

function renderAlbum(uri, { name = 'Album', artist = '', image = '', release = '', tracks = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Album', name, artist);
  const totalMs = tracks.reduce((s, t) => s + (t.length || 0), 0);
  const coverHtml = objCoverHTML(image, uri);
  const yr = release ? (' · ' + objEsc(String(release).slice(0, 4))) : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b><span>${objEsc(artist)}</span>`
    + `<span>${tracks.length} tracks · ${msToMin(totalMs)}${yr}</span>${objSourceTag(source)}</div></div>`;
  html += objRenderTracks(tracks);
  objBody().innerHTML = html;
  objStore('album:' + uri, 'Album', name, artist);
}

// DB-first (O2M cache); falls back to a live Spotify lookup when not cached.
async function openAlbum(uri, seed) {
  if (!uri) { setFeedback('No album link'); return; }
  objNavTo();
  objSetHead('Album', seed?.name || 'Album', seed?.artist || '');
  openObjPanel();
  if (objShowCached('album:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/album_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached && !d.partial) {   // full album cached → serve from DB; partial → live
      let image = d.image;
      if (!image) { try { image = await objCover(uri); } catch (e) {} }
      renderAlbum(uri, {
        name: d.name || seed?.name, artist: d.artist || seed?.artist, image, release: d.release, source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [lookupR, cover] = await Promise.all([ rpc('core.library.lookup', {uris: [uri]}), objCover(uri) ]);
    let tracks = lookupR?.result?.[uri] || lookupR?.result || [];
    if (!Array.isArray(tracks)) tracks = [];
    const first = tracks[0];
    renderAlbum(uri, {
      name: first?.album?.name || seed?.name || 'Album',
      artist: (first?.artists || []).map(a => a.name).join(', ') || seed?.artist || '',
      image: cover, source: 'live',
      tracks: tracks.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load album.</div>'; }
}

let _boxEditUid = null;
let _boxEditInfo = null;          // last /api/box_info payload (explicit re-render after picking)

let _bxItems = null;              // parsed data items (aliases _boxDraft.items in the wizard)
let _bxHost = 'editor';           // 'editor' | 'wizard' — where the content editor lives
let _bxRawMode = false;           // true = raw textarea view
const _resolveCache = new Map();  // uri → {name, kind, sub} from /api/resolve_uris

function renderBoxContent(info) {
  const lines = String(info.data || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '';
  return `<div><div class="obj-section-label">Content</div><div class="obj-tracks">`
    + lines.map(l => {
        let attr = '', cls = 'obj-row', nav = false;
        if (/^spotify:album:/.test(l))       { attr = ` data-album-uri="${objEsc(l)}"`;  nav = true; }
        else if (/^spotify:artist:/.test(l)) { attr = ` data-artist-uri="${objEsc(l)}"`; nav = true; }
        else if (/^box:/.test(l))            { attr = ` data-box-uid="${objEsc(l.slice(4).trim())}"`; nav = true; }
        if (nav) cls += ' obj-clickable obj-nav';
        return `<div class="${cls}"${attr}><span class="ot-name">${objEsc(l)}</span>${nav ? CHEVRON_SVG : ''}</div>`;
      }).join('')
    + `</div></div>`;
}

function renderBoxReadonly(info) {
  const lines = String(info.data || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  return `<div class="obj-dl">
      <div><dt>Type</dt><dd>${objEsc(info.option_type || '—')}</dd></div>
      <div><dt>Discover</dt><dd>${info.option_discover_level ?? '—'}</dd></div>
      <div><dt>Sort</dt><dd>${objEsc(info.option_sort || '—')}</dd></div>

      <div><dt>UID</dt><dd>${objEsc(info.uid)}</dd></div>
      <div><dt>Content lines</dt><dd>${lines.length}</dd></div>
