    + `<div class="${aCls}"${aAttr}>${objEsc(artist)}</div>${statusHtml}</div>`
    + `<div class="tl-dur">${objEsc(durText)}</div>`
    + `<button class="tl-info" title="Track actions" aria-label="Track actions"${infoAttr}>${TL_INFO_SVG}</button>`;
}

function updateCurrentRow(wrap, activeTlid) {
  wrap.querySelectorAll('.tl-item').forEach((item, i) => {
    const num = item.querySelector('.tl-num');
    if (Number(item.dataset.tlid) === activeTlid) {
      item.classList.add('current');
      if (num && !num.querySelector('.eq-icon'))
        num.innerHTML = '<span class="eq-icon"><i></i><i></i><i></i></span>';
    } else {
      item.classList.remove('current');
      if (num && num.querySelector('.eq-icon'))
        num.textContent = String(i + 1).padStart(2, '0');
    }
  });
  const cur = wrap.querySelector('.tl-item.current');
  if (cur && activeTlid !== lastScrolledTlid) {
    lastScrolledTlid = activeTlid;
    requestAnimationFrame(() => scrollTracklistToCurrent(cur));
  }
}

function renderTracklist(tracks, activeTlid) {
  const wrap = document.getElementById('tracklist-wrap');
  const count = document.getElementById('tracklist-count');
  currentTracklistLength = tracks.length;

  const sig = tracks.map(({tlid, track}) => tlid + ':' + (track?.uri || '')).join('|');
  if (sig === lastTracklistSig) {
    // Same list — at most the current row changed. No wipe, no re-fetch.
    updateCurrentRow(wrap, activeTlid);
    return;
  }
  lastTracklistSig = sig;

  wrap.innerHTML = '';
  count.textContent = tracks.length ? `${tracks.length} tracks` : '';
  let scrollTarget = null;
  tracks.forEach(({tlid, track}, i) => {
    registerTrackMeta(track);   // so the row's "Copy link" can resolve a podcast episode page
    const item = document.createElement('div');
    item.className = 'tl-item' + (tlid === activeTlid ? ' current' : '');
    item.dataset.tlid = tlid;
    item.dataset.uri = track.uri || '';   // read by the offline badge pass
    const cached = getCachedStatus(track.uri);
    const statusCls = cached ? (STATUS_CLASS[(cached.split(' - ')[0]||'').trim().toLowerCase()] || '') : '';
    const statusHtml = `<div class="tl-status ${statusCls}" data-uri="${(track.uri||'').replace(/"/g,'&quot;')}">${cached ? formatStatus(cached) : ''}</div>`;
    item.innerHTML = trackRowInnerHTML({
      indexLabel: String(i + 1).padStart(2, '0'),
      name: track.name,
      artist: (track.artists || []).map(a => a.name).join(', '),
      artistUri: (track.artists || [])[0]?.uri || '',
      uri: track.uri,
      durText: msToMin(track.length),
      statusHtml,
      isCurrent: tlid === activeTlid,
    });
    item.addEventListener('click', (e) => {
      // Info badge → row actions menu.
      const ib = e.target.closest('.tl-info');
      if (ib) { e.stopPropagation(); openActionMenu(ib, trackMenuItems(ib.dataset.uri || track.uri, tlid)); return; }
      // Clicking the artist name opens the artist detail instead of playing the row.
      const al = e.target.closest('.tl-artist[data-artist-uri]');
      if (al) { e.stopPropagation(); openArtist(al.dataset.artistUri, al.textContent.trim()); return; }
      resetProgress();
      if (OFF.on) { offPlayAt(tlid); return; }   // tlid is the local queue index
      rpc('core.playback.play', {tlid}).then(() => setTimeout(refreshNowPlaying, 200));
    });
    wrap.appendChild(item);
    if (tlid === activeTlid) scrollTarget = item;
  });
  // Auto-scroll vers le titre en cours (uniquement quand il change, pour ne pas gêner)
  if (scrollTarget && activeTlid !== lastScrolledTlid) {
    lastScrolledTlid = activeTlid;
    requestAnimationFrame(() => scrollTracklistToCurrent(scrollTarget));
  }
  offRenderBadges();
  if (!OFF.on) fetchTracklistStatuses(tracks);   // a server read, pointless offline
}

/* Remonte jusqu'au premier ancêtre réellement scrollable (desktop = .col,
   mobile = #scroll-area). */
function scrollableAncestor(el) {
  for (let n = el && el.parentElement; n && n !== document.body; n = n.parentElement) {
    const oy = getComputedStyle(n).overflowY;
    if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 4) return n;
  }
  return null;
}

/* Cale le titre courant en haut de son conteneur scrollable, sous l'en-tête
   sticky s'il y en a un (no-op si rien ne scrolle) */
function scrollTracklistToCurrent(item) {
  const container = scrollableAncestor(item);
  if (!container) return;
  const cRect = container.getBoundingClientRect();
  const iRect = item.getBoundingClientRect();
  const header = container.querySelector('#tracklist-label');
  const topPad = (header && getComputedStyle(header).position === 'sticky')
    ? header.getBoundingClientRect().height
    : 0;
  const offset = (iRect.top - cRect.top) - topPad - 6;
  container.scrollBy({ top: offset, behavior: 'smooth' });
}

const STATUS_CLASS = {
  library: 's-library', normal: 's-library',
  favorites: 's-favorites', incoming: 's-incoming',
  new: 's-new', trash: 's-trash', hidden: 's-hidden', podcast: 's-podcast',
};

/* ── Status helpers ── */
const statusCache = new Map(); // uri → {text, ts}
const STATUS_TTL  = 5 * 60 * 1000;

function getCachedStatus(uri) {
  const e = statusCache.get(uri);
  if (!e || Date.now() - e.ts > STATUS_TTL) return null;
  return e.text;
}

function formatStatus(raw) {
  if (!raw || raw === 'Manual') return '';
  const parts = raw.split(' - ');
  const ot    = parts[0] || '';
  const score = parts[1] || '';
  let lib     = (parts[2] || '').replace(/^(playlist|album|artist):/, '').trim();
  if (score && lib) return lib.startsWith('(')
    ? `${ot} · ${score} ${lib}`
    : `${ot} · ${score} · ${lib}`;
  if (score) return `${ot} · ${score}`;
  return ot;
}

function applyStatusEl(el, raw) {
  const ot  = (raw || '').split(' - ')[0].trim().toLowerCase();
  const cls = STATUS_CLASS[ot] || '';
  el.textContent = formatStatus(raw);
  el.className   = 'tl-status' + (cls ? ' ' + cls : '');
}

async function fetchStatus(uri) {
  const cached = getCachedStatus(uri);
  if (cached !== null) return cached;
  try {
    const r = await fetch(API + '/track_status?uri=' + encodeURIComponent(uri));
    const t = r.ok ? await r.text() : '';
    statusCache.set(uri, { text: t, ts: Date.now() });
    return t;
  } catch(e) { return ''; }
}

function updateStatusBadge(text) {
  const el = document.getElementById('track-status-badge');
  const ot = (text || '').split(' - ')[0].trim().toLowerCase();
  const label = formatStatus(text);
  const changed = el.textContent !== label;
  el.textContent = label;
  el.className   = STATUS_CLASS[ot] || '';
  if (changed && label) npAnimateIn(el);
}

/* Header badge for a track that just became current: the cached value at once when
   there is one (never the previous track's), then a fresh read — guarded, so a slow
   answer for a track already skipped again cannot land on the next one. */
let _badgeReq = null;
function loadStatusBadge(uri) {
  if (uri === _badgeReq) return;
  _badgeReq = uri;
  updateStatusBadge(getCachedStatus(uri) || '');
  fetch(API + '/track_status?uri=' + encodeURIComponent(uri))
    .then(r => r.ok ? r.text() : '')
    .then(t => {
      statusCache.set(uri, { text: t, ts: Date.now() });
      if (npTargetUri() === uri) updateStatusBadge(t);
    })
    .catch(() => {});
}

async function fetchTracklistStatuses(tracks) {
  const CONCURRENCY = 4;
  for (let i = 0; i < tracks.length; i += CONCURRENCY) {
    await Promise.all(
      tracks.slice(i, i + CONCURRENCY).map(async ({ track }) => {
        if (!track?.uri) return;
        const text = await fetchStatus(track.uri);
        const el = document.querySelector(`.tl-status[data-uri="${CSS.escape(track.uri)}"]`);
        if (el && text) applyStatusEl(el, text);
      })
    );
  }
}

async function refreshVolume() {
  const r = await rpc('core.mixer.get_volume');
  const vol = r?.result ?? null;
  if (vol === null) return;
  const slider = document.getElementById('volume-slider');
  const val = document.getElementById('volume-val');
  slider.value = vol;
  slider.style.setProperty('--vol-pct', vol + '%');
  val.textContent = vol + '%';
  const volSvg = vol === 0
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
    : vol < 50
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
  document.getElementById('volume-icon').innerHTML = volSvg;
}

/* Refresh generation. Every WS event and the 10s poll start a refresh, and several
   are routinely in flight at once — a single track change fires
   playback_state_changed, track_playback_ended, track_playback_started and
   tracklist_changed. Each awaits the network, so an OLDER refresh could resume
   after a NEWER one had painted, and repaint its stale snapshot over it: the
   previous title back on top of the new one, or a whole track back onto a header
   that had just been emptied (the "0 tracks · 0 boxes" screen still showing a
   title). Only the latest refresh may paint; the others drop out at their await. */
let _npGen = 0, _npEmptyPainted = false;
function npTargetUri() { return _expectedUri || matrixCurUri; }

/* The play/pause glyph. Only rewritten when the state actually flips — rewriting
   innerHTML on every refresh repainted the button and made it flicker. Also called
   optimistically by the button itself. */
function paintPlayState(playing) {
  const playBtn = document.getElementById('btn-play');
  const playState = playing ? 'playing' : 'paused';
  if (playBtn.dataset.state === playState) return;
  playBtn.dataset.state = playState;
  playBtn.innerHTML = playing
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
}

/* Restart the entrance fade on an element whose content was just replaced. The new
   content lands at once — nothing waits on a fade-out — and comes in from nothing,
   so the change registers without the previous text lingering for a beat. */
function npAnimateIn(...els) {
  els.forEach(el => { if (!el) return; el.classList.remove('np-in'); void el.offsetWidth; el.classList.add('np-in'); });
}

/* Title / artist / album, from a tracklist row (optimistic skip) or the confirmed
   track (refresh). Returns whether anything changed: the refresh confirming an
   optimistic skip paints the same text and must not re-run the fade. */
function paintTrackText(name, artist, album, artistUri) {
  const nameEl = document.getElementById('track-name'), heroEl = document.getElementById('hero-title');
  const artistEl = document.getElementById('artist-name'), albumEl = document.getElementById('album-name');
  const n = name || '—', a = artist || '—', al = album || '';
  const changed = nameEl.textContent !== n || artistEl.textContent !== a || (albumEl && albumEl.textContent !== al);
  if (!changed) return false;
  setTrackName(n);
  heroEl.textContent = name || '';
  fitHeroTitle();
  artistEl.textContent = a;
  artistEl.classList.toggle('obj-link', !!artistUri);
  if (albumEl) albumEl.textContent = al;
  npAnimateIn(nameEl, heroEl, document.getElementById('artist-album'));
  return true;
}

/* Everything that changes when the current track does, in one place — called by
   the optimistic skip with the tracklist row and by the refresh with the confirmed
   track. Idempotent per uri: the refresh that confirms a skip must not wipe what
   the skip has already loaded (tags, badge, details, cover). */
let _switchUri = null;
function switchNowPlayingTo(uri, { name, artist, artistUri, album }) {
  if (!uri || _switchUri === uri) return;
  _switchUri = uri;
  _npEmptyPainted = false;
  document.getElementById('track-details')?.classList.add('switching');   // fades the old details out
  document.getElementById('now-playing')?.classList.toggle('radio-np', _isStreamUri(uri));
  // For a radio this is the station name (or a neutral label when mopidy only has
  // the stream url as name); maybeShowRadioTitle refines it with the live title.
  const isStream = _isStreamUri(uri);
  paintTrackText(isStream && (!name || _isStreamUri(name)) ? 'Radio' : name, artist, album, artistUri);
  updateHeroAccent(uri);
  clearTrackTags();
  fetchAndRenderTrackTags(uri);
  loadStatusBadge(uri);
  renderTrackDetails(uri);
  loadCover(uri);
}

/* No current track: the header goes back to its empty state — ALL of it. The old
   code cleared the hero title, cover, badge and details but left the title line,
   artist, album, tags and progress bar showing the last track. */
function clearNowPlayingHeader(playing) {
  _switchUri = null;
  paintTrackText('', 'O2M', '', '');
  document.getElementById('now-playing')?.classList.remove('radio-np');
  clearTrackTags();
  _badgeReq = null; updateStatusBadge('');
  setCoverGenerated(null);
  resetProgress();
  document.getElementById('prog-duration').textContent = '';
  renderTrackDetails(null);
  updateMediaSession(null, playing, '');
  _radioLast = { title: null, artist: null, album: null, visual: null };
}

/* Tracks Mopidy holds under a uri that is not their own — see /api/played_meta.
   Only uris that look substituted and are not already known are ever asked for,
   and the answer is kept for the session, so the steady state costs nothing: a
   tracklist whose items have all been seen makes no call at all. */
const _playedMeta = new Map();          // played uri -> {uri, name, length} | null
async function patchSubstitutedNames(tracks, current) {
  const candidates = [...new Set([current, ...(tracks || []).map(t => t && t.track)]
    .filter(t => t && t.uri && !t.name && /^https?:/.test(t.uri) && !_playedMeta.has(t.uri))
    .map(t => t.uri))];
  if (candidates.length) {
    try {
      const qs = candidates.slice(0, 60).map(u => 'uri=' + encodeURIComponent(u)).join('&');
      const d = await fetch(API + '/played_meta?' + qs).then(r => r.json());
      // A uri the server did not answer for is not substituted: remember that
      // too, or every refresh asks again about the same radio stream.
      candidates.forEach(u => _playedMeta.set(u, (d && d[u]) || null));
    } catch (e) {
      candidates.forEach(u => _playedMeta.set(u, null));
    }
  }
  const apply = t => {
    if (!t || !t.uri) return;
    const m = _playedMeta.get(t.uri);
    if (!m) return;
    if (!t.name && m.name) t.name = m.name;
    if (!t.length && m.length) t.length = m.length;
  };
  (tracks || []).forEach(x => apply(x && x.track));
  apply(current);
}

async function refreshNowPlaying() {
  // While the device plays its own files, the server's state describes a room
  // nobody is listening to. Painting it here would fight the local player for
  // the header, the clock and the tracklist.
  if (OFF.on) return;
  const gen = ++_npGen, startedAt = Date.now();
  // All four reads go out together: the position used to wait for the other
  // three — one more round trip before anything was painted.
  const [curR, stateR, tlR, posR] = await Promise.all([
    rpc('core.playback.get_current_tl_track'),
    rpc('core.playback.get_state'),
    rpc('core.tracklist.get_tl_tracks'),
    rpc('core.playback.get_time_position'),
  ]);
  if (gen !== _npGen) return;                 // superseded while waiting: the newer snapshot wins
  if (startedAt <= _lastUserActionAt) return; // taken before (or in the same ms as) the user's action: stale

  const tlt   = curR?.result;
  const track = tlt?.track;
  const tlid  = tlt?.tlid ?? null;
  const playing = stateR?.result === 'playing';
  const tracks  = tlR?.result || [];

  // Mopidy reports what it was HANDED. For a 'web:' media that is a signed CDN
  // url with no name at all, so the row would show an address where its title
  // belongs. This is the one place Mopidy's view enters the page, so it is the
  // one place worth translating: everything downstream reads these objects.
  await patchSubstitutedNames(tracks, track);

  currentTlid      = tlid;
  _optTlid = null; _expectedUri = null;       // the server has spoken; optimistic pointers are done
  matrixCurUri     = track?.uri ?? null;
  registerTrackMeta(track);   // so the "More" menu's Copy link can resolve a podcast episode page
  currentTrackObj  = track || null;
  currentDurationMs = track?.length || 0;
  document.getElementById('prog-duration').textContent = msToMin(currentDurationMs);
  matrixTlItems  = tracks.map(({tlid: id, track: t}) => ({
    uri: t?.uri, tlid: id,
    name:   t?.name || '',
    artist: (t?.artists || []).map(a => a.name).join(', '),
    artistUri: (t?.artists || [])[0]?.uri || '',
    album:  (t?.album && t.album.uri) ? (t.album.name || '') : '',   // what the optimistic skip paints
    length: t?.length || 0,
  }));
  const trackChanged = matrixCurUri !== lastNpUri;
  lastNpUri = matrixCurUri;
  setClock(posR?.result ?? 0, playing);

  fetchTrackFeatures([matrixCurUri, ...matrixTlItems.map(i => i.uri)].filter(Boolean));
  paintPlayState(playing);

  if (track) {
    if (trackChanged) {
      switchNowPlayingTo(track.uri, {
        name: track.name, album: (track.album && track.album.uri) ? track.album.name : '',
        artist: (track.artists || []).map(a => a.name).join(', '),
        artistUri: (track.artists || [])[0]?.uri || '',
      });
      // Podcasts / news: channel · source and the publication date replace artist/album.
      updateSpokenHeader(track);
      prefetchNextCover();
    }
    // Radios: live now-playing (song title on line 1, "STATION · artist" on line 2).
    maybeShowRadioTitle(track);
    updateMediaSession(track, playing, lastCoverUrl);
  } else if (trackChanged || !_npEmptyPainted) {
    clearNowPlayingHeader(playing);
    _npEmptyPainted = true;
  }

  renderTracklist(tracks, tlid);
  if (typeof syncBasicFromNowPlaying === 'function') syncBasicFromNowPlaying();   // basic status line: tracks + boxes
}

/* ── Media Session API (Bluetooth / notification controls) ── */
/* Headset and notification controls. Each one asks the same question the
   on-screen transport does — which player has the hand — because a Bluetooth
   "next" while offline was going to Mopidy: unreachable with no network, and
   worse when there IS one, since it skipped a track in a room nobody was
   listening to while the phone carried on. The <audio> element gives us the
   media session for free; routing it was the missing half. */
function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const setH = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e) {} };
  setH('play',          async () => {
    if (OFF.on) { offTogglePlay(); return; }
    await rpc('core.playback.resume');   setTimeout(refreshNowPlaying, 300); });
  setH('pause',         async () => {
    if (OFF.on) { offTogglePlay(); return; }
    await rpc('core.playback.pause');    setTimeout(refreshNowPlaying, 300); });
  setH('previoustrack', async () => {
    if (OFF.on) { offSkip(-1); return; }
    resetProgress(); await rpc('core.playback.previous'); setTimeout(refreshNowPlaying, 300); });
  setH('nexttrack',     async () => {
    if (OFF.on) { offSkip(1); return; }
    resetProgress(); await rpc('core.playback.next');     setTimeout(refreshNowPlaying, 300); });
  setH('seekto', async (d) => {
    if (!d || d.seekTime == null) return;
    if (OFF.on) {
      const t = OFF.queue[OFF.i];
      if (t && t.length) offSeekFraction((d.seekTime * 1000) / t.length);
      return;
    }
    await rpc('core.playback.seek', { time_position: Math.round(d.seekTime * 1000) });
    setTimeout(refreshNowPlaying, 300);
  });
  // Headsets that send a relative jump rather than a track change. Only wired
  // for the local player: the server transport has never exposed them.
  setH('seekbackward',  (d) => { if (OFF.on && OFF.el)
    offSeekAbsolute(OFF.el.currentTime * 1000 - ((d && d.seekOffset) || 10) * 1000); });
  setH('seekforward',   (d) => { if (OFF.on && OFF.el)
    offSeekAbsolute(OFF.el.currentTime * 1000 + ((d && d.seekOffset) || 10) * 1000); });
  setH('stop',          () => { if (OFF.on && OFF.el) { try { OFF.el.pause(); } catch (e) {} } });
}

function updateMediaSession(track, isPlaying, coverUrl) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  if (track) {
    // Only rebuild metadata when the track or cover actually changes. Assigning a
    // new MediaMetadata makes Android re-fetch the artwork and redraw the media
    // notification — doing it on every 10s refresh flashes the system controls.
    const sig = (track.uri || '') + '|' + (coverUrl || '');
    if (sig !== _mediaMetaSig) {
      _mediaMetaSig = sig;
      navigator.mediaSession.metadata = new MediaMetadata({
        title:  track.name || '',
        artist: (track.artists || []).map(a => a.name).join(', ') || '',
        album:  track.album?.name || '',
        artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [],
      });
    }
  } else {
    _mediaMetaSig = null;
  }
}
let _mediaMetaSig = null;

/* ── Media Session anchor ─────────────────────────────────────────────────────
   Snapcast plays through WebAudio (gainNode → ctx.destination, unchanged). WebAudio
   alone does NOT create an OS media session, and an <audio srcObject=MediaStream>
   is treated as "communication" audio → no notification on Android. So we loop a
   real audio file in an <audio> element: Chrome/Android recognizes it as active
   "content" media → metadata + controls surface. The file is named silence.wav but
   actually carries a faint 40 Hz tone at -54 dBFS (acoustically imperceptible):
   Chrome exempts fully *silent* players from the "audio becoming noisy" auto-pause
   (BT/headphone removal), and we rely on that pause to detect route loss. */
let mediaAnchorEl = null;
let _anchorIntentionalPause = false;   // set when WE pause the anchor (vs. the OS)

function _ensureMediaAnchor() {
  if (!mediaAnchorEl) {
    mediaAnchorEl = document.createElement('audio');
    mediaAnchorEl.id = 'media-anchor';
    mediaAnchorEl.src = '/static/silence.wav';
    mediaAnchorEl.loop = true;
    mediaAnchorEl.preload = 'auto';
    mediaAnchorEl.setAttribute('aria-hidden', 'true');
    mediaAnchorEl.style.display = 'none';
    // Auto-pause on "audio becoming noisy": when a Bluetooth/wired output is
    // removed (or audio focus is lost to a call/another app), the OS pauses this
    // <audio>. WebAudio (the Snapcast stream) does NOT honor this, so we mirror it
    // to the server. Note: Chrome only auto-pauses *audible* players, which is why
    // silence.wav actually carries a faint -54dBFS tone (see its generator note).
    mediaAnchorEl.addEventListener('pause', () => {
      if (_anchorIntentionalPause) { _anchorIntentionalPause = false; return; }
      console.log('[media-anchor] external pause');
      pauseFromRouteLoss('output lost');
    });
    document.body.appendChild(mediaAnchorEl);
  }
  return mediaAnchorEl;
}

function startMediaAnchor() {
  const el = _ensureMediaAnchor();
  // Doit être appelé dans un geste utilisateur (cas via _snapStart / armMediaAnchor)
  if (!el.paused) return;
  el.play().then(() => console.log('[media-anchor] playing'))
           .catch(e => console.warn('[media-anchor] play blocked', e));
}

function stopMediaAnchor() {
  // Only arm the flag when a pause event will actually fire (element is playing),
  // otherwise it would stay set and swallow the next genuine external pause.
  if (mediaAnchorEl && !mediaAnchorEl.paused) {
    _anchorIntentionalPause = true;
    try { mediaAnchorEl.pause(); } catch(e) {}
  }
}

/* Shared reaction to "the audio route died" (BT/headphones removed, audio focus
   lost). Fed by two detectors: the media-anchor pause event above and the
   devicechange watcher below. Only acts when this device is the audio sink
   (snapPlayer active) and we believe playback is running. */
function pauseFromRouteLoss(source) {
  if (!snapPlayer || !progPlaying) return;
  console.log('[route-loss] ' + source + ' → pausing server');
  rpc('core.playback.pause').catch(() => {});
  try { snapPlayer.stop(); } catch (e) {}
  snapPlayer = null;
  _releaseWakeLock();
  _snapBtnOff();
  setFeedback('Paused (' + source + ')');
  setTimeout(refreshNowPlaying, 300);
}

/* Publish the playback header's height as --sheet-top. Every bottom sheet (track
   details, object modal) anchors its top edge there, so they all open at the same
   line — right under the controls — with the same height, instead of each one
   sizing itself from its content. Kept in sync because the header's height changes
   with the theme, the track (wrapped titles) and orientation. */
function watchSheetTop() {
  const tz = document.getElementById('top-zone');
  if (!tz) return;
  const publish = () =>
    document.documentElement.style.setProperty('--sheet-top', tz.offsetHeight + 'px');
  publish();
  try { new ResizeObserver(publish).observe(tz); } catch (e) {}
  window.addEventListener('resize', publish);
  window.addEventListener('orientationchange', () => setTimeout(publish, 200));
}

/* Fallback detector: Bluetooth audio devices almost always expose a microphone
   (HFP), so unpairing/powering one off fires mediaDevices.devicechange with a
   shorter device list. Counting works without mic permission (entries are just
   unlabeled). We react only to a *shrinking* list — connecting a device grows it. */
function watchAudioDevices() {
  const md = navigator.mediaDevices;
  if (!md || !md.enumerateDevices || !md.addEventListener) return;
  let lastCount = null;
  const countDevices = () => md.enumerateDevices()
    .then(ds => ds.filter(d => d.kind === 'audioinput' || d.kind === 'audiooutput').length)
    .catch(() => null);
  countDevices().then(n => { lastCount = n; });
  md.addEventListener('devicechange', async () => {
    const n = await countDevices();
    const prev = lastCount;
    lastCount = n;
    console.log('[route-loss] devicechange: audio devices ' + prev + ' → ' + n);
    if (n != null && prev != null && n < prev) pauseFromRouteLoss('device removed');
  });
}

/* Arme l'ancre dès le 1er geste utilisateur, indépendamment de Snapcast :
   la session média OS (titre/pochette/contrôles BT) doit remonter aussi en
   mode « télécommande » desktop (comme Iris), même sans flux Snapcast local. */
function armMediaAnchor() {
  const onGesture = () => {
    startMediaAnchor();
    setTimeout(refreshNowPlaying, 400);  // pousse les métadonnées une fois la session active
  };
  document.addEventListener('click',      onGesture, { once: true });
  document.addEventListener('touchstart', onGesture, { once: true, passive: true });
  document.addEventListener('keydown',    onGesture, { once: true });
}

/* ── Colonne détails du morceau (read-only) ── */
let detailsUri = null;            // uri actuellement affichée (détecte le changement)
let favLocal = false, favSpotify = null;  // états favori courants
let editablePlaylists = null;     // cache des playlists possédées (éditables)

let _plDropdown = null;
function _closePlDropdown() {
  _plDropdown?.remove(); _plDropdown = null;
  document.removeEventListener('click', _plOutsideClick, true);
}
function _plOutsideClick(e) {
  if (_plDropdown && !_plDropdown.contains(e.target) && !e.target.closest('.pl-trigger'))
    _closePlDropdown();
}

/* ══ Harmonized object action menu (the "i"/⋯ context menu used everywhere:
   tracklist rows, the current-track "More" button, and album/artist/box
   headers in the detail modal) ══
   One shared dropdown builder + one shared open/close/outside-click lifecycle,
   fed by a per-context list of {label, icon, action} items — instead of three
   diverging ad-hoc menus. */
let _actionMenuEl = null;
function _closeActionMenu() {
  _actionMenuEl?.remove(); _actionMenuEl = null;
  document.removeEventListener('click', _actionMenuOutside, true);
  document.getElementById('btn-track-menu')?.setAttribute('aria-expanded', 'false');
}
function _actionMenuOutside(e) {
  if (_actionMenuEl && !_actionMenuEl.contains(e.target)
      && !e.target.closest('.tl-info') && !e.target.closest('#obj-actions')
      && !e.target.closest('#btn-track-menu')) _closeActionMenu();
}
/* Place a fixed popup under its trigger — or above it when there isn't enough
   room below (rows near the bottom of a list, which is where the ⊕/ⓘ buttons
   usually are). max-height is capped to the space available in the chosen
   direction so the menu is always fully reachable by its own scroll.
   The popup must already be in the DOM: scrollHeight is measured here. */
function _placePopup(el, btn) {
  const rect = btn.getBoundingClientRect();
  el.style.right = (window.innerWidth - rect.right) + 'px';
  const spaceBelow = window.innerHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  if (el.scrollHeight > spaceBelow && spaceAbove > spaceBelow) {
    el.style.top = 'auto';
    el.style.bottom    = (window.innerHeight - rect.top + 4) + 'px';
    el.style.maxHeight = Math.max(120, spaceAbove) + 'px';
  } else {
    el.style.bottom = 'auto';
    el.style.top       = (rect.bottom + 4) + 'px';
    el.style.maxHeight = Math.max(120, spaceBelow) + 'px';
  }
}
function openActionMenu(triggerBtn, items) {
  if (_actionMenuEl) { _closeActionMenu(); return; }
  if (!items || !items.length) return;
  const menu = document.createElement('div');
  menu.className = 'track-menu-dropdown';
  menu.innerHTML = items.map((it, i) =>
    `<button type="button" data-i="${i}">${it.icon}${objEsc(it.label)}</button>`).join('');
  items.forEach((it, i) => menu.querySelector(`[data-i="${i}"]`)
    .addEventListener('click', () => { it.action(); _closeActionMenu(); }));
  // Append first: _placePopup measures the menu's height to decide up vs down.
  document.body.appendChild(menu);
  _placePopup(menu, triggerBtn);
  _actionMenuEl = menu;
  triggerBtn.setAttribute?.('aria-expanded', 'true');
  setTimeout(() => document.addEventListener('click', _actionMenuOutside, true), 0);
}

/* ── Smart shareable link resolution ──
   Internal URIs aren't directly useful to share/open outside O2M — resolve them
   to something usable: spotify:track:ID → open.spotify.com (works for anyone,
   no app needed); yt:URL → the plain YouTube URL; a podcast episode → its own page
   on the publisher's site, read from mopidy-podcast's `comment` field; a box → its
   box:<uid> reference, directly paste-able into another box's raw data to build a
   cascade. */
const trackMeta = new Map();   // uri -> track object (populated wherever rows render)
function registerTrackMeta(t) { if (t && t.uri) trackMeta.set(t.uri, t); }
function extractHrefFromComment(comment) {
  const m = /<a\s+href="([^"]+)"/i.exec(comment || '');
  return m ? m[1] : null;
}
/* The same field also carries plain advertising. Radio France ends every episode
   description with a link to radiofrance.fr itself — a site ROOT with nothing but
   campaign parameters — so taking the first href blindly copies a promo url and
   calls it the episode. A path is what separates the two, and it is enough:
   sampled over ten feeds, nine carried the episode's own page and one this promo. */
function episodePageHref(comment) {
  const href = extractHrefFromComment(comment);
  if (!href) return null;
  try {
    const path = new URL(href, location.href).pathname;
    return (path && path !== '/') ? href : null;
  } catch (e) { return href; }
}
/* A Browse row never went through mopidy, so nothing registered its comment — which
   is how "Copy link" ended up handing back the feed for an episode. One lookup fills
   it in on demand, and only for an episode that has no meta yet. */
async function episodeMeta(uri) {
  if (trackMeta.has(uri)) return trackMeta.get(uri);
  try {
    const r = await rpc('core.library.lookup', { uris: [uri] });
    const t = (r?.result?.[uri] || [])[0];
    if (t) registerTrackMeta(t);
    return t || null;
  } catch (e) { return null; }
}
function shareableLink(uri) {
  if (!uri) return null;
  let m;
  if ((m = /^spotify:(track|album|artist|playlist):([A-Za-z0-9]+)/.exec(uri)))
    return `https://open.spotify.com/${m[1]}/${m[2]}`;
  if (uri.startsWith('yt:')) return uri.slice(3);
  if (uri.startsWith('podcast+')) {
    const fromComment = episodePageHref(trackMeta.get(uri)?.comment);
    if (fromComment) return fromComment;
    // An EPISODE falls back to its own uri. Stripping it to the feed used to copy
    // the CHANNEL — a different object, and one nothing on screen had named: what
    // was copied then no longer matched what was clicked.
    if (uri.includes('#')) return uri;
    return uri.slice('podcast+'.length);                 // a channel: its feed URL
  }
  return uri;   // local file / box / anything else — copy the raw reference
}
async function copyLink(uri) {
  if (uri && uri.startsWith('podcast+') && uri.includes('#')) await episodeMeta(uri);
  const link = shareableLink(uri);
  if (!link) { setFeedback('No link'); return; }
  try { await navigator.clipboard.writeText(link); setFeedback('Link copied'); }
  catch (e) { setFeedback('Copy failed'); }
}

/* Track row menu: Play next / Play now always available; Remove only when a
   tlid is known (i.e. the row IS a tracklist entry — not a browse-only row from
   an album/artist/box listing); Copy link resolves smartly per uri kind. */
function trackMenuItems(uri, tlid) {
  const items = [
    { label: 'Play next', icon: ICON_PLAYNEXT, action: () => playNext(uri) },
    { label: 'Play now',  icon: ICON_PLAYNOW,  action: () => playNow(uri) },
  ];
  if (tlid != null) items.push({ label: 'Remove', icon: ICON_REMOVE, action: () => removeFromTracklist(tlid) });
  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openTrackDetailSheet(uri) });
  items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(uri) });
  return items;
}
async function removeFromTracklist(tlid) {
  try {
    await rpc('core.tracklist.remove', { criteria: { tlid: [tlid] } });
    setFeedback('Removed');
    setTimeout(refreshNowPlaying, 200);
  } catch (e) { setFeedback('Remove error'); }
}

/* Kind-aware menu for a search-result row. track/radio act on the single uri;
   artist/album resolve the object's tracks (mopidy lookup expands them) and
   queue those, plus a "See details" that opens the existing detail sheet. */
function objMenuItems(uri, kind) {
  const single = (kind === 'track' || kind === 'radio' || !kind);
  const items = [];
  // A box isn't directly playable/queueable as a uri — it's activated as a whole.
  if (kind !== 'box') {
    items.push({ label: 'Play next', icon: ICON_PLAYNEXT, action: () => single ? playNext(uri) : objPlayObject(uri, 'next') });
    items.push({ label: 'Play now',  icon: ICON_PLAYNOW,  action: () => single ? playNow(uri)  : objPlayObject(uri, 'now') });
  }
  if (kind === 'artist') items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openArtist(uri) });
  if (kind === 'album')  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openAlbum(uri, {}) });
  // The library/favorite toggle is appended asynchronously by the menu opener
  // (menuItemsWithLibrary) so its label reflects the live saved/followed state.
  if (kind === 'box')    items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openBox(uri.replace(/^box:/, '')) });
  if (kind === 'podcast')items.push({ label: 'See episodes', icon: ICON_DETAILS, action: () => openPodcast(uri) });
  if (kind === 'playlist')items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openPlaylist(uri) });
  if (kind === 'track')  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openTrackDetailSheet(uri) });
  items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(uri) });
  return items;
}
// Library toggle (write-through to Spotify + local DB). `add` = desired state.
// Album → saved albums, artist → follow, track → liked. All synchronized.
async function _libToggle(endpoint, key, uri, add, okAdd, okRemove) {
  try {
    const r = await fetch(API + endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uri, [key]: add }),
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    const d = await r.json().catch(() => ({}));
    setFeedback(d.error ? 'Error' : (add ? okAdd : okRemove));
  } catch (e) { setFeedback('Error'); }
}
const setAlbumInLibrary  = (uri, add) => _libToggle('/album_save',   'saved',    uri, add, 'Album added to library',  'Album removed from library');
const setArtistInLibrary = (uri, add) => _libToggle('/artist_follow','followed', uri, add, 'Artist added to library', 'Artist removed from library');
const setTrackFavorite   = (uri, add) => _libToggle('/track_favorite','favorite',uri, add, 'Added to favorites',      'Removed from favorites');

// Live library state for a (uri, kind): true = in library, false = not, null = unknown.
async function fetchLibState(uri, kind) {
  try {
    if (kind === 'album')  return !!(await fetch(API + '/album_saved?uri='     + encodeURIComponent(uri)).then(r => r.json())).saved;
    if (kind === 'artist') return !!(await fetch(API + '/artist_followed?uri=' + encodeURIComponent(uri)).then(r => r.json())).followed;
    if (kind === 'track')  return !!(await fetch(API + '/track_saved?uri='     + encodeURIComponent(uri)).then(r => r.json())).saved;
  } catch (e) {}
  return null;
}
// The library/favorite toggle item, label + icon reflecting current state.
function libraryToggleItem(uri, kind, inLib) {
  const add = !inLib;
  const label = kind === 'track'
    ? (inLib ? 'Remove from favorites' : 'Add to favorites')
    : (inLib ? 'Remove from library'   : 'Add to library');
  const fn = kind === 'album' ? setAlbumInLibrary : kind === 'artist' ? setArtistInLibrary : setTrackFavorite;
  return { label, icon: inLib ? ICON_REMOVE : ICON_ADD, action: () => fn(uri, add) };
}
// Base menu items + the async library/favorite toggle (album/artist/track only).
async function menuItemsWithLibrary(uri, kind) {
  const items = kind ? objMenuItems(uri, kind) : trackMenuItems(uri, null);
  const k = kind || 'track';
  if (['album', 'artist', 'track'].includes(k) && uri.startsWith('spotify:')) {
    const inLib = await fetchLibState(uri, k);
    if (inLib !== null) items.push(libraryToggleItem(uri, k, inLib));
  }
  return items;
}
// Open an object's detail view from its (uri, kind) — used by the row-click handler.
function objOpenByKind(uri, kind, name) {
  if (kind === 'artist')  return openArtist(uri, name);
  if (kind === 'album')   return openAlbum(uri, { name });
  if (kind === 'box')     return openBox(String(uri).replace(/^box:/, ''));
  if (kind === 'podcast') return openPodcast(uri, { name });
  if (kind === 'playlist')return openPlaylist(uri, { name });
  return renderTrackObj(uri, { name });
}
// Track "See details" → a track view hosted in the shared object modal (with the
// per-track mood matrix). Same modal = same height + the ◂ ▸ nav back to results,
// and it is immune to the now-playing refresh that drives #track-details.
function openTrackDetailSheet(uri, seed) { renderTrackObj(uri, seed); }
// Play an album/artist: resolve its tracks (mopidy expands album→tracks,
// artist→all tracks, so cap it) then queue next / play now.
async function objPlayObject(uri, mode) {
  try {
    const r = await rpc('core.library.lookup', { uris: [uri] });
    let uris = (r?.result?.[uri] || []).map(t => t.uri).filter(Boolean);
    if (!uris.length && String(uri).startsWith('podcast+')) {
      // A feed is a directory, not a track: ask O2M for its episodes (mopidy's
      // browse is disabled without a configured podcast root — see podcastEpisodes).
      uris = (await podcastEpisodes(uri, 0, 50)).rows.map(r => r.uri).filter(Boolean);
    }
    if (!uris.length) { setFeedback('No tracks'); return; }
    if (uris.length > 40) uris = uris.slice(0, 40);
    if (mode === 'now') await playNow(uris); else await playNext(uris);
  } catch (e) { setFeedback('Play error'); }
}

/* Episodes of a channel, from O2M rather than mopidy's browse.

   mopidy only registers a backend as browsable when its library has a ROOT
   directory, and mopidy-podcast's is None unless `browse_root` is configured —
   it is not here, so core._browse returned an empty list before ever reaching
   the provider, and every channel looked empty. O2M parses feeds itself and has
   the episodes of every box-referenced feed in its catalogue, so it answers
   instantly and does not depend on a per-instance mopidy setting. */
async function podcastEpisodes(uri, offset, limit) {
  const d = await _wcJson('/podcast_episodes?uri=' + encodeURIComponent(uri)
                          + '&limit=' + (limit || 50) + '&offset=' + (offset || 0));
  return { rows: (d && d.items) || [], hasMore: !!(d && d.has_more) };
}
async function openPodcast(uri, seed) {
  if (!uri) return;
  objNavTo();
  objSetHead('Podcast', seed?.name || 'Podcast', '');
  objSetActionUris([], uri);
  openObjPanel();
  objLoading();
  try {
    const [ep, cover] = await Promise.all([ podcastEpisodes(uri, 0, 50), objCover(uri) ]);
    const eps = ep.rows.map(r => ({ uri: r.uri, name: r.name, length: null, sub: r.sub }));
    objSetActionUris(eps.map(e => e.uri).filter(Boolean), uri);
    const coverHtml = objCoverHTML(cover, uri);
    let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(seed?.name || 'Podcast')}</b>`
      + `<span>${eps.length} episode${eps.length === 1 ? '' : 's'}</span></div></div>`;
    html += objRenderTracks(eps.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: [] })), 'track');
    objBody().innerHTML = html;
  } catch (e) { objBody().innerHTML = '<div class="obj-empty">Could not load podcast.</div>'; }
}

// Playlist detail: resolve the playlist's tracks (mopidy lookup on the
// spotify:playlist uri) and render them as a track list, like an album.
async function openPlaylist(uri, seed) {
  if (!uri) return;
  objNavTo();
  objSetHead('Playlist', seed?.name || 'Playlist', '');
  objSetActionUris([], uri);
  openObjPanel();
  objLoading();
  try {
    const [lookupR, cover] = await Promise.all([ rpc('core.library.lookup', { uris: [uri] }), objCover(uri) ]);
    let tracks = lookupR?.result?.[uri] || [];
    if (!Array.isArray(tracks)) tracks = [];
    objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
    const coverHtml = objCoverHTML(cover, uri);
    let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(seed?.name || 'Playlist')}</b>`
      + `<span>${tracks.length} track${tracks.length === 1 ? '' : 's'}</span></div></div>`;
    html += objRenderTracks(tracks.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })), 'track');
    objBody().innerHTML = html;
  } catch (e) { objBody().innerHTML = '<div class="obj-empty">Could not load playlist.</div>'; }
}

/* Object-level actions (album / artist / box header, the ⋯ button) — Play next
   the whole set (album/artist only) + Copy link for the object itself (its own
   shareable link, or box:<uid> for a box). */
let objCurrentPlayUris = [];
let objCurrentUri = null;
function objSetActionUris(list, uri) {
  objCurrentPlayUris = Array.isArray(list) ? list.filter(Boolean) : [];
  objCurrentUri = uri || null;
  document.getElementById('obj-actions')?.classList.toggle('hide',
    objCurrentPlayUris.length === 0 && !objCurrentUri);
}
async function openObjActions(btn) {
  const items = [];
  // Three ways to start what this object holds — an album, an artist, a channel, a
  // playlist all answer the same three questions: now, after, or just one of them.
  // "One at random" is what a channel of 400 episodes is usually for.
  if (objCurrentPlayUris.length) {
    items.push({ label: 'Play now', icon: ICON_PLAYNOW,
                 action: () => playNow(objCurrentPlayUris) });
    items.push({ label: 'Play next', icon: ICON_PLAYNEXT,
                 action: () => playNext(objCurrentPlayUris) });
    if (objCurrentPlayUris.length > 1)
      items.push({ label: 'Play one at random', icon: ICON_SHUFFLE,
                   action: () => playNow([objCurrentPlayUris[
                     Math.floor(Math.random() * objCurrentPlayUris.length)]]) });
  }
  if (objCurrentUri)
    items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(objCurrentUri) });
  // Library toggle for the whole object (album saved / artist followed), live state.
  const kind = (document.getElementById('obj-kind')?.textContent || '').toLowerCase();
  if (objCurrentUri && (kind === 'album' || kind === 'artist')) {
    const inLib = await fetchLibState(objCurrentUri, kind);
    if (inLib !== null) items.push(libraryToggleItem(objCurrentUri, kind, inLib));
  }
  openActionMenu(btn, items);
}

/* Queue via O2M (live URI adaptation + stat mapping for externally-cached
   content). Accepts a single uri or a list (album/artist). */
function _playNextReq(uris) {
  const list = (Array.isArray(uris) ? uris : [uris]).filter(Boolean);
  const qs = list.map(u => 'uri=' + encodeURIComponent(u)).join('&');
  return fetch(API + '/play_next?' + qs).then(r => r.json());
}
async function playNext(uris) {
  try {
    const r = await _playNextReq(uris);
    if (r.ok) { setFeedback(r.count > 1 ? ('Queued ' + r.count + ' tracks next') : 'Added to play next'); setTimeout(refreshNowPlaying, 300); }
    else setFeedback(r.error || 'Could not queue');
  } catch(e) { setFeedback('Queue error'); }
}
async function playNow(uri) {
  try {
    const r = await _playNextReq(uri);
    if (r.ok && r.tlid != null) {
      resetProgress();
      await rpc('core.playback.play', {tlid: r.tlid});
      setTimeout(refreshNowPlaying, 200);
      setFeedback('Playing');
    } else setFeedback(r.error || 'Could not play');
  } catch(e) { setFeedback('Play error'); }
}

/* Playlist picker. Rendered into any container, so both track panels (the
   now-playing column and the modal "See details" sheet) get the same control.
   Each rendered box is registered with the uri it shows, so a membership change
   can refresh every visible copy at once (both can be on screen together). */
const _plBoxes = new Map();   // boxId -> uri currently rendered there

function refreshPlaylistEditors(uri) {
  for (const [boxId, u] of _plBoxes) if (u === uri) renderPlaylistEditor(uri, boxId);
}

async function renderPlaylistEditor(uri, boxId = 'td-playlists') {
  const box = document.getElementById(boxId);
  if (!box) { _plBoxes.delete(boxId); return; }
  _closePlDropdown();
  if (!editUnlocked || !uri) { box.innerHTML = ''; _plBoxes.delete(boxId); return; }
  _plBoxes.set(boxId, uri);
  const pls = await loadEditablePlaylists();
  const inSet = new Set();
  try {
    const inPls = await fetch(API + '/track_playlists?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (Array.isArray(inPls)) inPls.forEach(p => inSet.add(p.id));
  } catch(e) {}
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const active = pls.filter(p => inSet.has(p.id));
  const labelText = active.length ? active.map(p => p.name || p.id).join(', ') : '—';
  box.innerHTML =
    '<button type="button" class="pl-trigger">'
    + '<span class="pl-count">' + active.length + '</span>'
    + '<span class="pl-label">' + esc(labelText) + '</span>'
    + '<span class="pl-caret">▸</span></button>';
  box.querySelector('.pl-trigger').addEventListener('click', e => {
    e.stopPropagation();
    if (_plDropdown) { _closePlDropdown(); return; }
    const dropdown = document.createElement('div');
    dropdown.className = 'pl-dropdown';
    dropdown.innerHTML = pls.length
      ? pls.map(p =>
          '<label><input type="checkbox" data-pid="' + esc(p.id) + '"' + (inSet.has(p.id) ? ' checked' : '') + '>'
          + '<span>' + esc(p.name || p.id) + '</span></label>').join('')
      : '<span style="font-size: var(--t-label);color:var(--muted)">No editable playlists cached.</span>';
    dropdown.querySelectorAll('input[type=checkbox]').forEach(cb =>
      cb.addEventListener('change', () => togglePlaylistMembership(cb, uri)));
    // Append first, then place: _placePopup measures the list to decide up vs
    // down and caps its height to the room actually available (shared with the
    // ⊕/ⓘ action menus).
    document.body.appendChild(dropdown);
    _placePopup(dropdown, box.querySelector('.pl-trigger'));
    _plDropdown = dropdown;
    setTimeout(() => document.addEventListener('click', _plOutsideClick, true), 0);
    box.querySelector('.pl-caret').textContent = '▾';
  });
}

async function togglePlaylistMembership(cb, uri) {
  const pid = cb.dataset.pid, add = cb.checked;
  cb.disabled = true;
  try {
    const r = await fetch(API + '/track_playlist', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri, playlist_id: pid, action: add ? 'add' : 'remove' })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); cb.checked = !add; return; }
    const j = await r.json().catch(() => ({}));
    if (j.error) { setFeedback('Playlist: ' + j.error); cb.checked = !add; return; }
    setFeedback(add ? 'Added to playlist' : 'Removed from playlist');
    refreshPlaylistEditors(uri);   // refresh active list + count in every panel
  } catch(e) { setFeedback('Playlist error'); cb.checked = !add; }
  finally { cb.disabled = false; }
}

function renderFav(p) {
  const el = p && p.favEl();
  if (!el) return;
  const fav = p.favLocal || p.favSpotify === true;
  el.innerHTML = ICON.heart(fav);
  el.classList.toggle('on', fav);
  const src = [p.favLocal ? 'local' : null, p.favSpotify === true ? 'Spotify' : null].filter(Boolean).join(' + ');
  el.title = (fav ? 'Favorite' + (src ? ' (' + src + ')' : '') : 'Not a favorite')
           + (editUnlocked ? ' — click to toggle' : '');
}

/* ── Shared track-detail logic ────────────────────────────────────────────────
   Two panels show a track's details: the now-playing column (#track-details,
   cells td-*) and the modal "See details" sheet (cells obj-td-*). They list the
   same fields, expose the same click-to-edit cells, draw the same mood matrix and
   now offer the same playlist picker. All of that is written once here; a panel
   only supplies its element ids and the uri it follows. */

const fmtEV = x => (x === null || x === undefined) ? '—' : Math.round(x * 10) + '/10';

// [label, cell key, value(info)] — the single source of truth for which rows a
// track panel shows and in which order. The key is the cell-id suffix, so the
// same descriptor drives td-* and obj-td-*. EDITABLE_FIELDS says which are
// click-to-edit.
const TRACK_FIELDS = [
  ['Status',     'type',       i => i.option_type || '—'],
  // Source = strict live provenance (the box/source it's served from right now);
  // '—' when the track isn't in the running mix. Status is the persisted state,
  // Source the live one — a clean dichotomy. Placed under Status for readability.
  ['Source',     'source',     i => i.source || '—'],
  ['Energy',     'energy',     i => fmtEV(i.energy)],
  ['Valence',    'valence',    i => fmtEV(i.valence)],
  ['Mood',       'mood',       i => i.mood || '—'],
  ['Popularity', 'popularity', i => fmtEV(i.popularity)],
  ['Plays',      'plays',      i => (i.read_count_end ?? 0) + ''],
  // Spoken content only: when an episode was published is the one genuinely
  // useful fact beyond its title. Hidden for music by _tpSyncSpokenRows.
  // Stored ISO (sortable); shown day-first, which is how a listener reads a date.
  ['Date',       'published',  i => fmtDay(i.published)],
  // The show a spoken item comes from. Persisted, unlike Source — which is
  // strict live provenance and is empty whenever the track isn't in the mix
  // currently playing.
  ['Channel',    'channel',    i => i.channel || '—'],
];
const EDITABLE_FIELDS = ['energy', 'valence', 'mood'];
// Row order for the shared panel body (Favorite added to TRACK_FIELDS' text rows).
const TRACK_PANEL_ROWS = [
  ['Status', 'type'], ['Source', 'source'], ['Favorite', 'fav'], ['Energy', 'energy'], ['Valence', 'valence'],
  ['Mood', 'mood'], ['Popularity', 'popularity'], ['Plays', 'plays'], ['Date', 'published'],
  ['Channel', 'channel'], ['Playlists', 'playlists'],
];

/* THE single source of the track-detail body markup, shared by both panels. The
   ids come from the panel (cellId/canvasId/…) so the now-playing column and the
   modal render byte-for-byte the same content; only the container skin (listClass)
   and the optional hero differ per context. */
// Spoken content — an RSS podcast, a YouTube item, or a Radio France episode.
// Mirrors O2mToMopidy._is_spoken_uri: Radio France episodes are plain https mp3
// links with no 'podcast+' marker, so their hosts have to be named.
const _SPOKEN_URI_RE = /podcast\+|youtube:video|(?:^|:)yt:|proxycast\.radiofrance\.fr|radiofrance-podcast\.net/i;
function _isSpokenUri(u) {
  return typeof u === 'string' && _SPOKEN_URI_RE.test(u);
}
function _isStreamUri(u) {
  // A downloadable episode is NOT a live stream: it has a real title, a real
  // status and real stats. Testing http(s) alone made every Radio France episode
  // render as a radio — station name in the header, "Source: Radio" in the
  // details, artist/album inert — instead of the podcast it is.
  return typeof u === 'string'
      && (/^https?:/.test(u) || u.startsWith('tunein:'))
      && !_isSpokenUri(u);
}
// Radios: overlay the LIVE now-playing title/artist (from /api/radio_now_playing —
// FIP livemeta or ICY stream title) into the header, in place of the stream's own
// name/artist. Runs on every now-playing refresh so it follows song changes live.
let _radioLast = { title: null, artist: null, album: null, visual: null };
async function maybeShowRadioTitle(track) {
  if (!track || !_isStreamUri(track.uri)) { _radioLast = { title: null, artist: null, album: null, visual: null }; return; }
  try {
    const d = await fetch(API + '/radio_now_playing').then(r => r.json());
    if (!d || !d.playing) return;
    const station = d.station || (track.name && !_isStreamUri(track.name) ? track.name : '');
    // No current item (station-only, e.g. a station without a live feed) → show the
    // station name as the title. With an item: title = the item (song OR show),
    // line 2 = "STATION · artist" (artist only for songs) or just the station.
    const displayTitle = d.title || station || 'Radio';
    const artistLine = d.title ? [station, d.artist].filter(Boolean).join(' · ') : '';
    const albumLine  = (d.title && d.album) ? d.album : '';
    // Only touch the DOM when a value actually changes → static (no flicker).
    if (displayTitle !== _radioLast.title) {
      const heroEl = document.getElementById('hero-title');
      const nameEl = document.getElementById('track-name');
      if (heroEl) heroEl.textContent = displayTitle;
      if (nameEl) setTrackName(displayTitle);
      fitHeroTitle();
      _radioLast.title = displayTitle;
      renderRadioDetails(d);   // keep the radio-adapted DETAILS in sync
    }
    // Cover: the item's own artwork when available (songs; some shows), else the
    // station brand logo (repli 1), else a clean placeholder — never a stale cover,
    // never a broken UUID image.
    const coverUrl = d.visual || d.station_logo || '';
    if (coverUrl !== _radioLast.visual) {
      // '' is a sentinel distinct from _radioLast.visual (null initially) → first tick ok
      try { if (coverUrl) setCoverSmooth(coverUrl); else setCoverGenerated(track.uri); } catch (e) {}
      _radioLast.visual = coverUrl;
    }
    if (artistLine !== _radioLast.artist) {
      const artistEl = document.getElementById('artist-name');
      if (artistEl) { artistEl.textContent = artistLine; artistEl.classList.remove('obj-link'); }
      _radioLast.artist = artistLine;
    }
    if (albumLine !== _radioLast.album) {
      const albumEl = document.getElementById('album-name');
      if (albumEl) albumEl.textContent = albumLine;
      _radioLast.album = albumLine;
    }
  } catch (e) {}
}

function trackPanelBodyHTML(p, { hero, cover, uri, name, artist, artistUri, album, albumUri } = {}) {
  // Artist and album are clickable when their uri is known (the #obj-body handler
  // opens them via data-artist-uri / data-album-uri). Shown as "artist · album".
  const link = (txt, attr) => `<span class="obj-link" ${attr}>${objEsc(txt)}</span>`;
  const artistHtml = artist ? (artistUri ? link(artist, `data-artist-uri="${objEsc(artistUri)}"`) : objEsc(artist)) : '';
  const albumHtml  = album  ? (albumUri  ? link(album,  `data-album-uri="${objEsc(albumUri)}" data-name="${objEsc(album)}"`) : objEsc(album)) : '';
  const sub = [artistHtml, albumHtml].filter(Boolean).join(' · ');
  const heroHtml = hero
    ? `<div class="obj-hero">${objCoverHTML(cover, uri || albumUri || name)}`
      + `<div class="obj-meta"><b>${objEsc(name || '')}</b><span>${sub}</span></div></div>`
    : '';
  // data-row lets a host hide a row by name without touching this markup — the
  // cell itself stays in the DOM, so the matrix sync and the inline editors that
  // write into it keep working.
  const rows = TRACK_PANEL_ROWS.map(([label, key]) => {
    const cls = key === 'fav' ? 'td-fav' : (EDITABLE_FIELDS.includes(key) ? 'tp-editable' : '');
    if (key === 'playlists') {
      return `<div data-row="${key}"><dt>${label}</dt><dd><div id="${p.playlistsId}" class="td-playlists"></div></dd></div>`;
    }
    return `<div data-row="${key}"><dt>${label}</dt><dd id="${p.cellId(key)}"${cls ? ` class="${cls}"` : ''}>—</dd></div>`;
  }).join('');
  return heroHtml
    + `<dl class="${p.listClass}">${rows}</dl>`
    + `<div id="${p.lifecycleId}"></div>`
    + `<canvas id="${p.canvasId}" class="tp-matrix" title="Drag to set the track's mood (edit mode)"></canvas>`;
}

/* The Date row is meaningful for spoken content only — a publication date says
   something about an episode, nothing about a song. Toggled per track rather
   than dropped from the markup, so the cell stays addressable like every other. */
function _tpSyncSpokenRows(p, info) {
  try {
    const host = p.body && p.body();
    const cell = document.getElementById(p.cellId('published'));
    const row = cell && cell.closest('[data-row="published"]');
    const chCell = document.getElementById(p.cellId('channel'));
    const chRow = chCell && chCell.closest('[data-row="channel"]');
    if (chRow) chRow.style.display = (info && info.channel) ? '' : 'none';
    if (!row) return;
    // Show it whenever a date is known, not only when the type says podcast/info:
    // a freshly queued episode still carries the fill-time default 'new' until its
    // first play, and its date is exactly what makes it worth choosing.
    const spoken = !!(info && info.published)
                || ['podcast', 'info'].includes((info && info.option_type) || '');
    row.style.display = spoken ? '' : 'none';
  } catch (e) {}
}

/* One panel instance. `cellId(kind)` maps 'energy' → the dd element id used by
   that panel; `body()` is the container it fills; `getUri()` is the shown track. */
function makeTrackPanel({ cellId, canvasId, playlistsId, lifecycleId, listClass, body, getUri }) {
  const p = {
    ev: null,                          // {energy, valence} shown by this panel
    favLocal: false, favSpotify: null, // per-panel favourite state (own uri)
    cellId, canvasId, playlistsId, lifecycleId, listClass, body, getUri,
    el:  kind => document.getElementById(cellId(kind)),
    favEl: () => document.getElementById(cellId('fav')),
    // Never clobber a cell that holds an open inline editor.
    set(kind, txt) {
      const el = p.el(kind);
      if (el && !el.querySelector('input,select')) el.textContent = txt;
    },
    canvas: () => document.getElementById(canvasId),
    draw() { drawMoodMatrix(p.canvas(), p.ev, TD_PAD); },
    // Build the shared body once, then populate cells + lifecycle + matrix + fav +
    // playlists and wire all interactions. Both panels go through this.
    render(info, opts = {}) {
      const host = p.body();
      if (!host) return;
      host.innerHTML = trackPanelBodyHTML(p, opts);
      TRACK_FIELDS.forEach(([, key, val]) => p.set(key, val(info)));
      _tpSyncSpokenRows(p, info);
      const lc = document.getElementById(lifecycleId);
      if (lc) lc.innerHTML = lifecycleScaleHTML(info);
      p.seed(getUri(), info);
      p.rewire();
      p.favLocal = !!(info && info.liked); p.favSpotify = null;
      renderFav(p);
      const uri = getUri();
      if (uri && uri.startsWith('spotify:track:')) {
        fetch(API + '/track_saved?uri=' + encodeURIComponent(uri)).then(r => r.json())
          .then(d => {
            // The answer is about `uri`, not about whatever the panel shows when it
            // lands. Spotify's round-trip outlives a short track or a skip, so
            // without this the previous track's heart was painted onto the new one —
            // a filled heart on a track that had never been a favourite, with the
            // DB and the live check both saying otherwise.
            if (getUri() !== uri) return;
            p.favSpotify = d.saved; renderFav(p);
          }).catch(() => {});
      }
      renderPlaylistEditor(editUnlocked ? uri : null, playlistsId);
    },
    // Re-attach handlers to an already-rendered body (fresh render OR nav restore).
    rewire() {
      initTrackPanelMatrix(p);
      wireTrackPanelEdits(p);
      const f = p.favEl();
      if (f && !f.dataset.wired) { f.dataset.wired = '1'; f.addEventListener('click', () => toggleFavorite(p)); }
    },
    // Seed the matrix dot: a pending manual edit for this uri wins over the
    // server values, so an in-flight drag is never clobbered by a refresh.
    seed(uri, info) {
      p.ev = matrixFeatures[uri] ? { ...matrixFeatures[uri] }
           : (info && info.energy != null && info.valence != null)
             ? { energy: info.energy, valence: info.valence } : null;
      p.draw();
    },
    async save(patch, okMsg) {
      const uri = getUri();
      if (!uri) return false;
      try {
        const r = await fetch(API + '/track_features', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.assign({ uri }, patch)),
        });
        if (r.status === 401) { setFeedback('Editing not authorized'); return false; }
        const d = await r.json().catch(() => ({}));
        if (d.error) { setFeedback('Save error'); return false; }
        setFeedback(okMsg || 'Saved');
        return d || true;
      } catch (e) { setFeedback('Save error'); return false; }
    },
    // Persist the current dot position and keep the big matrix in sync.
    async saveEV(okMsg) {
      const uri = getUri();
      if (!uri || !p.ev) return;
      const d = await p.save({ energy: p.ev.energy, valence: p.ev.valence }, okMsg);
      if (d) {
        matrixFeatures[uri] = { ...p.ev };
        if (d.mood) p.set('mood', d.mood);   // backend derives mood from e/v
      }
    },
  };
  return p;
}

/* Drag-to-set mood matrix — identical behaviour in both panels. */
function initTrackPanelMatrix(p) {
  const canvas = p.canvas();
  if (!canvas) return;
  let active = false;
  const apply = e => {
    p.ev = _matrixEVFromEvent(canvas, e, TD_PAD);
    p.set('energy',  fmtEV(p.ev.energy));
    p.set('valence', fmtEV(p.ev.valence));
    p.draw();
  };
  canvas.addEventListener('pointerdown', e => {
    if (!editUnlocked) { setFeedback('Enable editing first'); return; }
    active = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    apply(e);
  });
  canvas.addEventListener('pointermove', e => { if (active) { e.preventDefault(); apply(e); } });
  canvas.addEventListener('pointerup', () => {
    if (!active) return; active = false;
    if (editUnlocked) p.saveEV('Energy / valence saved');
  });
  new ResizeObserver(() => p.draw()).observe(canvas);
}

/* Click-to-edit an Energy/Valence cell (0–10) — identical in both panels. */
function editTrackPanelNumber(p, kind) {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!p.getUri()) return;
  const dd = p.el(kind);
  if (!dd || dd.querySelector('input')) return;
  const cur = p.ev ? p.ev[kind] : null;
  dd.innerHTML = '<input class="td-edit-input" type="number" min="0" max="10" step="1" value="'
    + (cur != null ? Math.round(cur * 10) : 5) + '">';
  const inp = dd.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    let v = parseInt(inp.value, 10);
    // Assign textContent directly here: it must replace the live input.
    if (isNaN(v)) { dd.textContent = fmtEV(cur); return; }
    v = Math.min(10, Math.max(0, v)) / 10;
    const base = p.ev || { energy: 0.5, valence: 0.5 };
    p.ev = { energy: kind === 'energy' ? v : base.energy,
             valence: kind === 'valence' ? v : base.valence };
    dd.textContent = fmtEV(v);
    p.set(kind === 'energy' ? 'valence' : 'energy',
          fmtEV(kind === 'energy' ? p.ev.valence : p.ev.energy));
    p.draw();
    await p.saveEV();
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    else if (e.key === 'Escape') { done = true; dd.textContent = fmtEV(cur); }
  });
}

/* Click-to-edit the Mood cell — identical in both panels. */
function editTrackPanelMood(p) {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!p.getUri()) return;
  const dd = p.el('mood');
  if (!dd || dd.querySelector('select')) return;
  const cur = (dd.textContent || '').trim().toLowerCase();
  dd.innerHTML = '<select class="td-edit-select">'
    + MOOD_EDIT_OPTIONS.map(([v, l]) =>
        '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select>';
  const sel = dd.querySelector('select'); sel.focus();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    dd.textContent = sel.value || '—';   // direct → replaces the live select
    await p.save({ mood: sel.value });
  };
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
}

/* Wire the three editable cells of a panel. */
function wireTrackPanelEdits(p) {
  p.el('energy')?.addEventListener('click',  () => editTrackPanelNumber(p, 'energy'));
  p.el('valence')?.addEventListener('click', () => editTrackPanelNumber(p, 'valence'));
  p.el('mood')?.addEventListener('click',    () => editTrackPanelMood(p));
}

// The two instances. The now-playing column follows the playing track; the modal
// follows whichever track was opened in it.
const tdPanel  = makeTrackPanel({ cellId: k => 'td-' + k, canvasId: 'td-matrix', playlistsId: 'td-playlists', lifecycleId: 'td-lifecycle', listClass: 'td-list', body: () => document.querySelector('#track-details .td-body'), getUri: () => matrixCurUri });
const objPanel = makeTrackPanel({ cellId: k => 'obj-td-' + k, canvasId: 'obj-tmatrix', playlistsId: 'obj-playlists', lifecycleId: 'obj-lifecycle', listClass: 'obj-dl', body: () => document.getElementById('obj-body'), getUri: () => objTMatrixUri });

// Desktop only: match the details column width to the (square) cover on the left.
// The cover's width = its height (aspect-ratio 1/1) = the top-zone height, so it
// isn't a CSS-referenceable value → sync it here. Widening details doesn't change
// its own height (rows fixed, matrix capped at 200px), so the top-zone height and
// thus the cover width stay put — no feedback loop.
function syncDetailsWidth() {
  const cover = document.getElementById('cover-wrap');
  const details = document.getElementById('track-details');
  if (!cover || !details) return;
  // overprint/invert use a CSS grid (width driven by grid-template-columns) — leave them.
  const theme = document.documentElement.getAttribute('data-theme');
  if (theme === 'overprint' || theme === 'invert' || !window.matchMedia('(min-width: 700px)').matches) {
    details.style.flex = ''; return;
  }
  const w = cover.offsetWidth;
  if (w > 0) details.style.flex = '0 0 ' + w + 'px';
}

// Radio-adapted DETAILS: a stream isn't a library track, so show the station +
// current song + Source=Radio, and DROP the lifecycle fields (status/plays/energy/
// library scale) which don't apply. `d` = /api/radio_now_playing payload.
function renderRadioDetails(d) {
  const host = tdPanel.body();
  if (!host) return;
  const isSong = !!(d && d.kind === 'song');
  const rows = [];
  // 'Title' is generic — the current item is a song OR a show/segment. Artist/album
  // only apply to songs.
  if (d && d.title)        rows.push(['Title', d.title]);
  if (isSong && d.artist)  rows.push(['Artist', d.artist]);
  if (isSong && d.album)   rows.push(['Album', d.album]);
  if (d && d.station)      rows.push(['Station', d.station]);
  rows.push(['Source', 'Radio']);
  let html = '<dl class="td-list td-radio">'
    + rows.map(([l, v]) => `<div><dt>${objEsc(l)}</dt><dd>${objEsc(v)}</dd></div>`).join('');
  // Manual Favorite + Playlists ONLY for a real (resolvable) song — a show/segment
  // can't be attached to the library.
  if (isSong) {
    html += `<div><dt>Favorite</dt><dd class="td-fav" id="radio-fav">${ICON.heart(false)}</dd></div>`
          + `<div><dt>Playlists</dt><dd id="radio-playlists"></dd></div>`;
  }
  host.innerHTML = html + '</dl>';
  tdPanel.ev = null;
  if (isSong) wireRadioActions();
}

// Resolve the current radio song → Spotify track, then wire the manual Favorite
// heart + playlist picker onto it (both hit the same endpoints as normal tracks).
async function wireRadioActions() {
  const favEl = document.getElementById('radio-fav');
  let uri = null;
  try { uri = ((await fetch(API + '/radio_resolve').then(r => r.json())) || {}).uri; } catch (e) {}
  if (!uri) { if (favEl) favEl.title = 'No Spotify match for this song'; return; }
  if (favEl) {
    let saved = false;
    try { saved = !!(((await fetch(API + '/track_saved?uri=' + encodeURIComponent(uri)).then(r => r.json())) || {}).saved); } catch (e) {}
    favEl.innerHTML = ICON.heart(saved);
    favEl.classList.toggle('on', saved);
    favEl.title = editUnlocked ? 'Click to toggle favorite' : 'Enable editing to favorite';
    favEl.addEventListener('click', async () => {
      if (!editUnlocked) { setFeedback('Enable editing first'); return; }
      const on = !favEl.classList.contains('on');
      await setTrackFavorite(uri, on);
      favEl.classList.toggle('on', on);
      favEl.innerHTML = ICON.heart(on);
    });
  }
  renderPlaylistEditor(uri, 'radio-playlists');   // no-op unless editing is unlocked
}

let _detailsReq = null;   // uri of the latest request: an older, slower fetch must not paint over it
async function renderTrackDetails(uri) {
  const host = tdPanel.body();
  const panel = document.getElementById('track-details');
  if (uri !== null && uri === _detailsReq) {          // already shown, or loading
    if (detailsUri === uri) panel?.classList.remove('switching');
    return;
  }
  _detailsReq = uri;
  if (!uri) { if (host) host.innerHTML = ''; detailsUri = null; tdPanel.ev = null; panel?.classList.remove('switching'); return; }
  // Radios: render the radio-context panel instead of the (meaningless) stream stats.
  if (_isStreamUri(uri)) {
    let d = null;
    try { d = await fetch(API + '/radio_now_playing').then(r => r.json()); } catch (e) {}
    if (_detailsReq !== uri) return;
    detailsUri = uri;
    renderRadioDetails(d);
    panel?.classList.remove('switching');
    requestAnimationFrame(syncDetailsWidth);
    return;
  }
  try {
    const info = await fetch(API + '/track_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (_detailsReq !== uri) return;
    detailsUri = uri;
    tdPanel.render(info, { hero: false });   // hero off: the now-playing cover is already up top
    requestAnimationFrame(syncDetailsWidth);
  } catch (e) { if (_detailsReq === uri && host) host.innerHTML = ''; }
  if (_detailsReq === uri) panel?.classList.remove('switching');
}

// Per-panel favourite toggle. Reads the current state from the DOM (the cell's .on
// class) so it stays correct even after a nav-stack restore (no captured state).
async function toggleFavorite(p) {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  const uri = p.getUri();
  if (!uri) return;
  const next = !p.favEl()?.classList.contains('on');
  try {
    const r = await fetch(API + '/track_favorite', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri, favorite: next })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    const d = await r.json();
    if ('liked_local' in d) p.favLocal = d.liked_local;
    if ('liked_spotify' in d) p.favSpotify = d.liked_spotify;
    else if (!uri.startsWith('spotify:track:')) p.favSpotify = null;
    renderFav(p);
    setFeedback(next ? 'Added to favorites' : 'Removed from favorites');
  } catch (e) { setFeedback('Favorite error'); }

function startEditAuth() {
  if (editUnlocked) {  // déjà déverrouillé → déconnexion
    fetch(API + '/edit_logout', {method: 'POST'}).then(() => {
      setEditUnlocked(false); setFeedback('Editing disabled');
    });
    return;
  }
  // Spotify OAuth for the Web API side: opens /api/spotipy_init (the login that feeds Spotipy).
  // Playback has its OWN authorisation since 2026-08-10 — /api/spotify_stream_auth, see
  // SPOTIFY_STREAMING_KEYMASTER.md. On success the server sets the edit cookie (fan-out),
  // so we just poll /api/edit_status until it flips to unlocked.
  const popup = window.open(API + '/spotipy_init', 'o2m_spotify_auth', 'height=700,width=480');
  if (!popup) { setFeedback('Popup blocked - allow popups'); return; }
  setFeedback('Connecting to Spotify...');
  let tries = 0;
  const watch = setInterval(async () => {
    tries++;
    try {
      const s = await fetch(API + '/edit_status').then(r => r.json());
      if (s.unlocked) {
        clearInterval(watch);
        setEditUnlocked(true, s.id);
        setFeedback('Editing enabled');
        try { popup.close(); } catch(e) {}
        return;
      }
    } catch(e) {}
    if (popup.closed || tries > 180) {
      clearInterval(watch);
      if (!editUnlocked) setFeedback('Auth not completed');
    }
  }, 1000);
}
