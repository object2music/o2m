/* ── MATRIX energy × valence ── */
const PAD = 28;
const MX_FONT = 'Archivo, system-ui, sans-serif';
let matrixFeatures = {};   // uri → {energy, valence}
let matrixTlItems  = [];   // [{uri, tlid}]
let matrixCurUri   = null;
let matrixMode     = 'move'; // 'move' | 'resize'

/* Couleurs lues depuis les variables CSS du thème courant */
let themeColors = {};
function readThemeColors() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  themeColors = {
    bg: g('--mx-bg'),
    qCalm: g('--mx-q-calm'), qHappy: g('--mx-q-happy'),
    qDark: g('--mx-q-dark'), qEnergetic: g('--mx-q-energetic'),
    line: g('--mx-line'), border: g('--mx-border'),
    label: g('--mx-label'), axis: g('--mx-axis'),
    dlFill: g('--mx-dl-fill'), dlStroke: g('--mx-dl-stroke'),
    dotCore: g('--mx-dot-core') || '#fff', pulse: g('--mx-pulse') || '255,255,255',
    happy: g('--mood-happy'), energetic: g('--mood-energetic'),
    calm: g('--mood-calm'), dark: g('--mood-dark'),
  };
}

function moodColor(e, v, a = 1) {
  let t;
  if (e > 0.5 && v > 0.5) t = themeColors.happy;      // happy
  else if (e > 0.5)        t = themeColors.energetic;  // energetic
  else if (v > 0.5)        t = themeColors.calm;       // calm
  else                     t = themeColors.dark;       // dark
  return `rgba(${t || '120,120,120'},${a})`;
}

/* Theme's dominant accent color (orange), used only for the currently-playing dot */
function accentColor(a = 1) {
  return `rgba(${themeColors.pulse || '255,90,0'},${a})`;
}

/* Greyscale by popularity: darker = more popular, lighter = less popular */
function popularityColor(p) {
  if (p == null) return 'rgba(150,150,150,.5)';
  const light = Math.round(85 - 65 * Math.max(0, Math.min(1, p)));
  return `hsl(0,0%,${light}%)`;
}

function initMatrix() {
  const canvas = document.getElementById('mood-matrix');
  const dpr    = window.devicePixelRatio || 1;

  function resizeCanvas() {
    const w = canvas.offsetWidth;
    canvas.width  = w * dpr;
    canvas.height = w * dpr;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(canvas);

  /* Touch-friendly gesture routing (phone): the canvas is touch-action:pan-y, so a
     vertical swipe scrolls the page. We CLAIM the gesture (preventDefault on a
     non-passive touchstart) only when it starts on the handle, the dl ring, or the
     draggable track point — those drags control the matrix even vertically.
     Touch-drags elsewhere scroll; a tap elsewhere still sets the target (applied on
     pointerup so an aborted scroll never accidentally moves the mood). */
  function matrixShouldClaimTouch(canvas, pt) {
    const rect  = canvas.getBoundingClientRect();
    const inner = rect.width - 2 * PAD;
    const tx = rect.left + PAD + appState.energy * inner;
    const ty = rect.top  + PAD + (1 - appState.valence) * inner;
    if (Math.hypot(pt.clientX - tx, pt.clientY - ty) < 28) return true;          // handle
    const r = (appState.dl / 20 + 0.05) * inner;
    if (Math.abs(Math.hypot(pt.clientX - tx, pt.clientY - ty) - r) < 18) return true;  // ring
    if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {          // track point
      const f = matrixFeatures[matrixCurUri];
      const cx = rect.left + PAD + f.energy * inner;
      const cy = rect.top  + PAD + (1 - f.valence) * inner;
      if (Math.hypot(pt.clientX - cx, pt.clientY - cy) < 28) return true;
    }
    return false;
  }
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t && matrixShouldClaimTouch(canvas, t)) e.preventDefault();
  }, { passive: false });

  let matrixDeferred = null;   // touch started off-handle: apply only if it ends as a tap
  canvas.addEventListener('pointerdown', e => {
    matrixMode = detectMatrixMode(canvas, e);
    if (e.pointerType === 'touch' && !matrixShouldClaimTouch(canvas, e)) {
      matrixDeferred = { x: e.clientX, y: e.clientY, mode: matrixMode };
      return;   // may become a page scroll — don't move the target yet
    }
    matrixDeferred = null;
    canvas.setPointerCapture(e.pointerId);
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointermove', e => {
    if (!e.buttons) {
      const mode = detectMatrixMode(canvas, e);
      canvas.classList.toggle('cursor-resize', mode === 'resize');
      showMatrixTooltip(canvas, e);
      return;
    }
    if (matrixDeferred) return;   // pending tap-or-scroll: let the browser decide
    e.preventDefault();
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointerup', e => {
    if (matrixDeferred) {
      const tap = Math.hypot(e.clientX - matrixDeferred.x, e.clientY - matrixDeferred.y) < 12;
      const mode = matrixDeferred.mode; matrixDeferred = null;
      if (!tap) return;   // it was a swipe the browser turned into a scroll
      matrixMode = mode;
      if (mode === 'edittrack') { matrixEditTrack(canvas, e); saveCurrentTrackFeatures(); matrixMode = 'move'; }
      else { matrixMove(canvas, e); scheduleApply(); }
      return;
    }
    if (matrixMode === 'edittrack') { saveCurrentTrackFeatures(); matrixMode = 'move'; }
    else scheduleApply();
  });
  canvas.addEventListener('pointercancel', () => { matrixDeferred = null; });
  canvas.addEventListener('pointerleave', () => hideMatrixTooltip());

  requestAnimationFrame(drawMatrix);
}

function detectMatrixMode(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  // Mode édition : priorité au point du morceau courant (draggable)
  if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {
    const f = matrixFeatures[matrixCurUri];
    const cx = rect.left + PAD + f.energy * inner;
    const cy = rect.top  + PAD + (1 - f.valence) * inner;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 16) return 'edittrack';
  }
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const r  = (appState.dl / 20 + 0.05) * inner;
  const dist = Math.hypot(e.clientX - tx, e.clientY - ty);
  const HANDLE = 14;
  if (Math.abs(dist - r) < HANDLE) return 'resize';
  // Edit mode + current track has no energy/valence yet → click the matrix to set them.
  if (editUnlocked && matrixCurUri && !matrixFeatures[matrixCurUri]) return 'edittrack';
  return 'move';
}

function matrixMove(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  appState.energy  = energy;
  appState.valence = valence;
  setDial('energy', energy);
  setDial('valence', valence);
}

function matrixEditTrack(canvas, e) {
  if (!matrixCurUri) return;
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  matrixFeatures[matrixCurUri] = { energy, valence };
  const set = (id, x) => { const el = document.getElementById(id); if (el) el.textContent = Math.round(x * 10) + '/10'; };
  set('td-energy', energy); set('td-valence', valence);
}

async function saveCurrentTrackFeatures() {
  const f = matrixCurUri && matrixFeatures[matrixCurUri];
  if (!f) return;
  try {
    const r = await fetch(API + '/track_features', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri: matrixCurUri, energy: f.energy, valence: f.valence })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    setFeedback('Energy / valence saved');
    
  } catch(e) { setFeedback('Save error'); }
}

/* ── Inline editing of the current track's energy / valence / mood (edit mode) ── */
const MOOD_EDIT_OPTIONS = [['calm','Calm'],['energetic','Energetic'],['dark','Intense'],['happy','Happy']];

async function saveTrackFeature(patch) {
  if (!matrixCurUri) return false;
  try {
    const r = await fetch(API + '/track_features', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({ uri: matrixCurUri }, patch))
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return false; }
    const d = await r.json().catch(() => ({}));
    if (d.error) { setFeedback('Save error'); return false; }
    setFeedback('Saved');
    return true;
  } catch (e) { setFeedback('Save error'); return false; }
}

function editTrackNumber(kind) {            // kind = 'energy' | 'valence'
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!matrixCurUri) return;
  const dd = document.getElementById('td-' + kind);
  if (!dd || dd.querySelector('input')) return;
  const f = matrixFeatures[matrixCurUri] || {};
  const start = f[kind] != null ? Math.round(f[kind] * 10) : 5;
  dd.innerHTML = '<input class="td-edit-input" type="number" min="0" max="10" step="1" value="' + start + '">';
  const inp = dd.querySelector('input');
  inp.focus(); inp.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    let v = parseInt(inp.value, 10);
    if (isNaN(v)) { renderTrackDetails(matrixCurUri); return; }
    v = Math.min(10, Math.max(0, v));
    const cur = matrixFeatures[matrixCurUri] || {};
    const energy  = kind === 'energy'  ? v / 10 : (cur.energy  ?? 0.5);
    const valence = kind === 'valence' ? v / 10 : (cur.valence ?? 0.5);
    matrixFeatures[matrixCurUri] = { energy, valence };
    document.getElementById('td-energy').textContent  = Math.round(energy * 10)  + '/10';
    document.getElementById('td-valence').textContent = Math.round(valence * 10) + '/10';
    
    await saveTrackFeature({ energy, valence });
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    else if (e.key === 'Escape') { done = true; renderTrackDetails(matrixCurUri); }
  });
}

function editTrackMood() {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!matrixCurUri) return;
  const dd = document.getElementById('td-mood');
  if (!dd || dd.querySelector('select')) return;
  const cur = (dd.textContent || '').trim().toLowerCase();
  const opts = MOOD_EDIT_OPTIONS.map(([v, l]) =>
    '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>').join('');
  dd.innerHTML = '<select class="td-edit-select">' + opts + '</select>';
  const sel = dd.querySelector('select');
  sel.focus();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    const v = sel.value;
    dd.textContent = v || '—';
    await saveTrackFeature({ mood: v });
  };
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
}

function matrixResize(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const radius01 = Math.hypot(e.clientX - tx, e.clientY - ty) / inner;
  const dl = Math.min(10, Math.max(0, Math.round((radius01 - 0.05) * 20)));
  appState.dl = dl;
  setDial('dl', dl / 10);
}

function drawMatrix(ts) {
  requestAnimationFrame(drawMatrix);
  const canvas = document.getElementById('mood-matrix');
  if (!canvas) return;

  const dpr   = window.devicePixelRatio || 1;
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const inner = W - 2 * PAD;
  if (inner <= 0) return;   // canvas pas encore dimensionné / panneau replié → on saute la frame
  const ctx   = canvas.getContext('2d');

  const ex = e => PAD + e * inner;
  const vy = v => PAD + (1 - v) * inner;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  /* Background */
  ctx.fillStyle = themeColors.bg || '#0b1829';
  ctx.fillRect(0, 0, W, H);

  const mx = PAD + inner / 2, my = PAD + inner / 2;

  /* Quadrant fills */
  [
    [PAD, PAD, inner/2, inner/2, themeColors.qCalm],      // calm      top-left
    [mx,  PAD, inner/2, inner/2, themeColors.qHappy],     // happy     top-right
    [PAD, my,  inner/2, inner/2, themeColors.qDark],      // dark      bottom-left
    [mx,  my,  inner/2, inner/2, themeColors.qEnergetic], // energetic bottom-right
  ].forEach(([x, y, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); });

  /* Center lines */
  ctx.strokeStyle = themeColors.line; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(mx, PAD); ctx.lineTo(mx, PAD + inner);
  ctx.moveTo(PAD, my); ctx.lineTo(PAD + inner, my);
  ctx.stroke(); ctx.setLineDash([]);

  /* Inner border */
  ctx.strokeStyle = themeColors.border; ctx.lineWidth = 1;
  ctx.strokeRect(PAD, PAD, inner, inner);

  /* Quadrant names — big watermark centered in each quadrant, sized so the text
     spans ~50% of the quadrant's width (each word gets its own font size to match). */
  const qW = inner / 2, targetW = qW * 0.5;
  ctx.save();
  ctx.fillStyle = themeColors.label; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  // Size fixed once from the top-left word (CALM) and reused for all 4, so every
  // quadrant name renders at the same font size (no per-word rescaling).
  ctx.font = '800 40px ' + MX_FONT;
  const qFontSize = Math.round(40 * targetW / ctx.measureText('CALM').width);
  ctx.font = `800 ${qFontSize}px ` + MX_FONT;
  [
    ['CALM',      PAD + inner * 0.25, PAD + inner * 0.25],
    ['HAPPY',     PAD + inner * 0.75, PAD + inner * 0.25],
    ['INTENSE',   PAD + inner * 0.25, PAD + inner * 0.75],
    ['ENERGETIC', PAD + inner * 0.75, PAD + inner * 0.75],
  ].forEach(([text, cx, cy]) => ctx.fillText(text, cx, cy));
  ctx.restore();

  /* Axis labels */
  ctx.font = '11px ' + MX_FONT; ctx.fillStyle = themeColors.axis;
  ctx.textAlign = 'left';   ctx.fillText('◀ Calm',  2, my + 4);
  ctx.textAlign = 'right';  ctx.fillText('Intense ▶', W - 2, my + 4);
  ctx.textAlign = 'center';
  ctx.fillText('▲ Bright', mx, 12);
  ctx.fillText('▼ Dark',   mx, PAD + inner + PAD - 2);

  /* Tracklist dots — color correlated to popularity (darker = more popular) */
  matrixTlItems.forEach(({ uri, tlid }) => {
    const f = matrixFeatures[uri];
    if (!f || tlid === currentTlid) return;
    ctx.beginPath();
    ctx.arc(ex(f.energy), vy(f.valence), 3, 0, Math.PI * 2);
    ctx.fillStyle = popularityColor(f.popularity);
    ctx.fill();
  });

  /* Currently playing — blinking dot in the theme's accent color */
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const cx = ex(curF.energy), cy = vy(curF.valence);
    const pulse = (Math.sin(ts / 450) + 1) / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 9 + pulse * 6, 0, Math.PI * 2);
    ctx.strokeStyle = accentColor(0.28 * (1 - pulse));
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = accentColor(0.45 + 0.55 * pulse);
    ctx.fill();
    ctx.strokeStyle = accentColor(1);
    ctx.lineWidth = 2.5; ctx.stroke();
  }

  /* DL area — dashed circle */
  const { energy, valence, dl } = appState;
  const r  = (dl / 20 + 0.05) * inner;
  const tx = ex(energy), ty = vy(valence);
  ctx.save();
  ctx.beginPath(); ctx.rect(PAD, PAD, inner, inner); ctx.clip();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dlFill; ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.strokeStyle = themeColors.dlStroke; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  /* Target dot */
  ctx.beginPath(); ctx.arc(tx, ty, 11, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dotCore; ctx.fill();
  ctx.strokeStyle = moodColor(energy, valence, 1); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2);
  ctx.fillStyle = moodColor(energy, valence, 1); ctx.fill();

  ctx.restore();
}

function showMatrixTooltip(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const HIT   = 10; // px hit radius

  // Build candidate list: tracklist dots + currently playing
  const candidates = matrixTlItems.map(item => {
    const f = matrixFeatures[item.uri];
    if (!f) return null;
    const sx = rect.left + PAD + f.energy * inner;
    const sy = rect.top  + PAD + (1 - f.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    return d < HIT ? { item, f, d } : null;
  }).filter(Boolean);

  // Also check currently playing
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const sx = rect.left + PAD + curF.energy * inner;
    const sy = rect.top  + PAD + (1 - curF.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (d < HIT + 4) {
      const curItem = matrixTlItems.find(i => i.uri === matrixCurUri);
      candidates.push({ item: curItem || { name: '♪ Playing', artist: '' }, f: curF, d });
    }
  }

  if (!candidates.length) { hideMatrixTooltip(); return; }

  // Pick closest
  candidates.sort((a, b) => a.d - b.d);
  const { item, f } = candidates[0];

  const tip = document.getElementById('matrix-tooltip');
  tip.querySelector('.tt-name').textContent   = item?.name   || '?';
  tip.querySelector('.tt-artist').textContent = item?.artist || '';
  tip.querySelector('.tt-ev').innerHTML =
    `<span>${ICON.zap} ${f.energy.toFixed(2)}</span><span>${ICON.sun} ${f.valence.toFixed(2)}</span>`;

  // Position: prefer right of dot, flip if near right edge
  const TX = 14, TY = -8;
  let left = e.clientX + TX;
  let top  = e.clientY + TY;
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  if (left + tw > window.innerWidth - 8) left = e.clientX - tw - TX;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}

function hideMatrixTooltip() {
  document.getElementById('matrix-tooltip').style.display = 'none';
}

/* ── Boxes panel ── */
/* ════════════ Object detail overlay (album · artist · box) ════════════
   Read-only for now. Opens over the lower area; edit affordances come later.
   Album/artist detail is sourced from mopidy RPC (browse/lookup/get_images);
   box detail from the O2M API (/box_info). */
let currentTrackObj = null;

/* ── Back gesture closes modals (history-based) ──
   Opening a modal pushes one history entry; the Android back swipe/button pops it
   and we close the modal instead of leaving the app. Closing through the UI
   (X / backdrop / Escape) consumes our entry with history.back() so the history
   stack stays balanced. */
let _modalPop = null;        // tag of the history entry we pushed ('obj' | 'details')
let _consumingModal = false; // our own history.back() consuming a modal entry
function modalHistoryPush(tag) {
  if (_modalPop) return;   // one modal entry at a time is enough
  _modalPop = tag;
  try { history.pushState({ o2mModal: tag }, ''); } catch (e) {}
}
function modalHistoryConsume(tag) {
  if (_modalPop !== tag) return;
  _modalPop = null;
  _consumingModal = true;
  try { history.back(); } catch (e) { _consumingModal = false; }
}
/* Root back-trap: O2M is a music player — an accidental back swipe used to kill
   the app AND the audio (the phone is the Snapcast speaker). Keep a sentinel
   history entry armed under the modal entries so a back gesture with no modal
   open is swallowed (re-armed) instead of exiting. Leaving the app is done with
   the Home/recents gesture, like any fullscreen player. */
function armBackTrap() {
  const s = history.state || {};
  if (s.o2mTrap || s.o2mModal) return;   // already armed (or a modal is on top)
  try { history.pushState({ o2mTrap: true }, ''); } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (_consumingModal) { _consumingModal = false; return; }  // balanced UI close
  const tag = _modalPop;
  if (tag) {               // back gesture with a modal open → close the modal
    _modalPop = null;
    if (tag === 'obj') closeObjPanel(true);
    else if (tag === 'details') document.body.classList.remove('details-open');
    return;
  }
  // Back gesture at app root → swallow it and stay alive.
  armBackTrap();
  setFeedback('Use the Home gesture to leave O2M');
});
armBackTrap();

/* Reopening the app after it was backgrounded/closed can restore a frozen
   bfcache copy (dead WebSockets, suspended audio, stale UI stuck on the splash).
   A persisted pageshow means exactly that → force a clean reload. */
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

function openObjPanel() {
  if (!document.body.classList.contains('obj-open')) modalHistoryPush('obj');
  document.body.classList.add('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'false');
}
function closeObjPanel(fromPop) {
  document.body.classList.remove('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'true');
  if (fromPop !== true) modalHistoryConsume('obj');   // UI close → consume our entry
}
function objSetHead(kind, title, sub) {
  document.getElementById('obj-kind').textContent  = kind;
  document.getElementById('obj-title').textContent = title || '—';
  document.getElementById('obj-sub').textContent   = sub || '';
}
function objBody()  { return document.getElementById('obj-body'); }
function objLoading(msg) { objBody().innerHTML = `<div class="obj-loading">${msg || 'Loading…'}</div>`; }
const objEsc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function objCover(uri) {
  try {
    const r = await rpc('core.library.get_images', {uris: [uri]});
    const imgs = r?.result?.[uri] || [];
    const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
    return best ? imageUrl(best.uri || best) : '';
  } catch(e) { return ''; }
}

// Track list (album/artist) — same row pattern as the tracklist (.tl-item). The
// row is NOT click-to-play (that was ambiguous): all actions are explicit and
// labelled behind the info badge (Play next / Play now).
function objRenderTracks(tracks) {
  if (!tracks.length) return '<div class="obj-empty">No tracks.</div>';
  return '<div class="obj-tracks">' + tracks.map((t, i) => {
    // Per-track O2M cache fields (status/mood/energy/local) → compact meta line.
    const meta = [];
    if (t.option_type) meta.push(objEsc(t.option_type));
    if (t.energy != null)  meta.push(ICON.zap + ' ' + Number(t.energy).toFixed(1));
    if (t.valence != null) meta.push(ICON.sun + ' ' + Number(t.valence).toFixed(1));
    if (t.mood) meta.push(objEsc(t.mood));
    if (t.local) meta.push('local');
    const statusCls = t.option_type ? ('s-' + objEsc(t.option_type)) : '';
    const statusHtml = meta.length ? `<div class="tl-status ${statusCls}">${meta.join(' · ')}</div>` : '';
    const inner = trackRowInnerHTML({
      indexLabel: String(i + 1).padStart(2, '0'),
      name: t.name,
      artist: (t.artists || []).map(a => a.name).join(', '),
      artistUri: (t.artists || [])[0]?.uri || '',
      uri: t.uri,
      durText: t.length ? msToMin(t.length) : '',
      statusHtml,
    });
    return `<div class="tl-item">${inner}</div>`;
  }).join('') + '</div>';
}

/* Frontend memo cache — the overlay refetches via RPC on each open even though
   mopidy-spotify already caches the web responses (images in a permanent dict,
   album/artist/track metadata via an etag/Cache-Control response cache). Caching
   the rendered result here makes reopening the same object instant. */
const OBJ_TTL = 10 * 60 * 1000;
const objCache = new Map();
function objShowCached(key) {
  const c = objCache.get(key);
  if (c && (Date.now() - c.ts) < OBJ_TTL) {
    objSetHead(c.kind, c.title, c.sub); objBody().innerHTML = c.html; return true;
  }
  return false;
}
function objStore(key, kind, title, sub) {
  objCache.set(key, { kind, title, sub, html: objBody().innerHTML, ts: Date.now() });
}

// Small tag showing where the content came from (O2M DB cache vs live Spotify).
function objSourceTag(source) {
  return `<span class="obj-src obj-src-${source}">${source === 'db' ? 'from cache' : 'live'}</span>`;
}

function renderArtist(uri, { name = 'Artist', image = '', genres = [], tracks = [], albums = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Artist', name, '');
  const coverHtml = image ? `<img class="obj-cover" src="${objEsc(image)}" alt="">` : '';
  const genreLine = genres.length ? `<span>${genres.slice(0, 6).map(objEsc).join(' · ')}</span>` : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b>`
    + `<span>${tracks.length} tracks · ${albums.length} albums</span>${genreLine}${objSourceTag(source)}</div></div>`;
  if (tracks.length)
    html += `<div><div class="obj-section-label">Tracks</div>${objRenderTracks(tracks)}</div>`;
  if (albums.length)
    html += `<div><div class="obj-section-label">Albums</div><div class="obj-tracks">`
      + albums.map(a => `<div class="obj-row obj-clickable obj-nav" data-album-uri="${objEsc(a.uri)}" data-name="${objEsc(a.name)}"><span class="ot-name">${objEsc(a.name)}</span>${CHEVRON_SVG}</div>`).join('')
      + `</div></div>`;
  objBody().innerHTML = html || '<div class="obj-empty">No data.</div>';
  objStore('artist:' + uri, 'Artist', name, '');
}

// DB-first (O2M cache); falls back to a live Spotify browse when not cached.
async function openArtist(uri, seedName) {
  if (!uri) { setFeedback('No artist link'); return; }
  const title = seedName || 'Artist';
  objSetHead('Artist', title, '');
  openObjPanel();
  if (objShowCached('artist:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/artist_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached) {
      renderArtist(uri, {
        name: d.name || title, image: d.image, genres: d.genres || [], albums: d.albums || [], source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [browseR, cover] = await Promise.all([ rpc('core.library.browse', {uri}), objCover(uri) ]);
    const rows = browseR?.result || [];
    renderArtist(uri, {
      name: title, image: cover, genres: [], source: 'live',
      tracks: rows.filter(r => r.type === 'track').map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
      albums: rows.filter(r => r.type !== 'track').map(a => ({ uri: a.uri, name: a.name })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load artist.</div>'; }
}

function renderAlbum(uri, { name = 'Album', artist = '', image = '', release = '', tracks = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Album', name, artist);
  const totalMs = tracks.reduce((s, t) => s + (t.length || 0), 0);
  const coverHtml = image ? `<img class="obj-cover" src="${objEsc(image)}" alt="">` : '';
  const yr = release ? (' · ' + objEsc(String(release).slice(0, 4))) : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b><span>${objEsc(artist)}</span>`
    + `<span>${tracks.length} tracks · ${msToMin(totalMs)}${yr}</span>${objSourceTag(source)}</div></div>`;
  html += objRenderTracks(tracks);
  objBody().innerHTML = html;
  objStore('album:' + uri, 'Album', name, artist);
}

// DB-first (O2M cache); falls back to a live Spotify lookup when not cached.
async function openAlbum(uri, seed) {
  if (!uri) { setFeedback('No album link'); return; }
  objSetHead('Album', seed?.name || 'Album', seed?.artist || '');
  openObjPanel();
  if (objShowCached('album:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/album_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached && !d.partial) {   // full album cached → serve from DB; partial → live
      renderAlbum(uri, {
        name: d.name || seed?.name, artist: d.artist || seed?.artist, image: d.image, release: d.release, source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [lookupR, cover] = await Promise.all([ rpc('core.library.lookup', {uris: [uri]}), objCover(uri) ]);
    let tracks = lookupR?.result?.[uri] || lookupR?.result || [];
    if (!Array.isArray(tracks)) tracks = [];
    const first = tracks[0];
    renderAlbum(uri, {
      name: first?.album?.name || seed?.name || 'Album',
      artist: (first?.artists || []).map(a => a.name).join(', ') || seed?.artist || '',
      image: cover, source: 'live',
      tracks: tracks.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load album.</div>'; }
}

let _boxEditUid = null;

function renderBoxContent(info) {
  const lines = String(info.data || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '';
  return `<div><div class="obj-section-label">Content</div><div class="obj-tracks">`
    + lines.map(l => {
        let attr = '', cls = 'obj-row', nav = false;
        if (/^spotify:album:/.test(l))       { attr = ` data-album-uri="${objEsc(l)}"`;  nav = true; }
        else if (/^spotify:artist:/.test(l)) { attr = ` data-artist-uri="${objEsc(l)}"`; nav = true; }
        else if (/^box:/.test(l))            { attr = ` data-box-uid="${objEsc(l.split(':', 2)[1].trim())}"`; nav = true; }
        if (nav) cls += ' obj-clickable obj-nav';
        return `<div class="${cls}"${attr}><span class="ot-name">${objEsc(l)}</span>${nav ? CHEVRON_SVG : ''}</div>`;
      }).join('')
    + `</div></div>`;
}

function renderBoxReadonly(info) {
  const lines = String(info.data || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  return `<div class="obj-dl">

function renderBoxEditor(info) {
  const opt = (v, l, cur) => `<option value="${objEsc(v)}"${String(v) === String(cur ?? '') ? ' selected' : ''}>${objEsc(l)}</option>`;
  const types = ['library','favorites','new','incoming','hidden','trash','podcast','info'];
  const typeSel = `<select class="bx-input" id="bx-option_type">` + types.map(t => opt(t, t, info.option_type)).join('') + `</select>`;
  const sortSel = `<select class="bx-input" id="bx-option_sort">`
    + [['','—'],['shuffle','shuffle'],['asc','asc'],['desc','desc']].map(([v,l]) => opt(v, l, info.option_sort || '')).join('') + `</select>`;
  const num = (id, val, attrs) => `<input class="bx-input bx-num" type="number" id="bx-${id}" value="${val == null ? '' : val}" ${attrs}>`;
  const chk = (id, on) => `<input type="checkbox" id="bx-${id}"${on ? ' checked' : ''}>`;
  const field = (label, ctrl, cls) => `<div class="obj-field${cls ? ' ' + cls : ''}"><label class="obj-field-label">${label}</label><div class="obj-field-ctrl">${ctrl}</div></div>`;
  return field('Name', `<input class="bx-input bx-wide" type="text" id="bx-description" value="${objEsc(info.description || '')}">`)
    + field('Type', typeSel)
    + field('Discover level', num('option_discover_level', info.option_discover_level, 'min="0" max="10" step="1"'))
    + field('Sort', sortSel)
    + field('Max results', num('option_max_results', info.option_max_results, 'min="0" step="1" placeholder="default"'))
    + field('Energy', num('option_energy', info.option_energy, 'min="0" max="1" step="0.05" placeholder="inherit"'))
    + field('Ambiance', num('option_valence', info.option_valence, 'min="0" max="1" step="0.05" placeholder="inherit"'))
    + field('Favorite', chk('favorite', info.favorite))
    + field('Public', chk('public', info.public))
    + field('Data (raw)', `<textarea class="bx-input bx-data" id="bx-data" rows="4" spellcheck="false">${objEsc(info.data || '')}</textarea>`, 'obj-data-field')
    + `<div class="obj-save-row"><button class="obj-save-btn" id="bx-save">Save box</button></div>`;
}

function wireBoxEditor() {
  document.getElementById('bx-save')?.addEventListener('click', saveBox);
  // Auto-size the raw-data textarea to its content (no huge empty area, no scroll
  // until it hits max-height) — grows/shrinks as you type.
  const ta = document.getElementById('bx-data');
  if (ta) {
    const grow = () => {
      ta.style.height = 'auto';
      const max = Math.round(window.innerHeight * 0.6);
      // Honour the CSS min-height so short data still gets a comfortable box.
      const min = parseInt(getComputedStyle(ta).minHeight, 10) || 0;
      ta.style.height = Math.min(Math.max(ta.scrollHeight + 2, min), max) + 'px';
    };
    ta.addEventListener('input', grow);
    // Run after layout settles (the panel slides in) so scrollHeight is correct on desktop.
    requestAnimationFrame(() => requestAnimationFrame(grow));
  }
}

async function saveBox() {
  if (!_boxEditUid) return;
  const el = id => document.getElementById('bx-' + id);
  const numOrNull = e => (e && e.value !== '' ? Number(e.value) : null);
  const payload = {
    uid: _boxEditUid,
    description: el('description')?.value ?? '',
    option_type: el('option_type')?.value,
    option_sort: el('option_sort')?.value ?? '',
    option_discover_level: numOrNull(el('option_discover_level')),
    option_max_results: numOrNull(el('option_max_results')),
    option_energy: numOrNull(el('option_energy')),
    option_valence: numOrNull(el('option_valence')),
    favorite: !!el('favorite')?.checked,
    public: !!el('public')?.checked,
    data: el('data')?.value ?? '',
  };
  try {
    const r = await fetch(API + '/box_edit', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    }).then(r => r.json());
    if (r.ok) { setFeedback('Box saved'); if (typeof loadBoxes === 'function') loadBoxes(); openBox(_boxEditUid); }
    else if (r.error === 'edit_auth_required') setFeedback('Editing not authorized');
    else setFeedback(r.error || 'Save failed');
  } catch(e) { setFeedback('Save error'); }
}

async function openBox(uid) {
  if (!uid) return;
  objSetHead('Box', 'Box', '');
  openObjPanel(); objSetActionUris([], 'box:' + uid); objLoading();
  try {
    const info = await fetch(API + '/box_info?uid=' + encodeURIComponent(uid)).then(r => r.json());
    if (info.error) { objBody().innerHTML = `<div class="obj-empty">${objEsc(info.error)}</div>`; return; }
    _boxEditUid = uid;
    objSetHead('Box', info.description || uid, info.option_type || '');
    if (editUnlocked) { objBody().innerHTML = renderBoxEditor(info); wireBoxEditor(); }
    else { objBody().innerHTML = renderBoxReadonly(info); }
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load box.</div>'; }
}

async function loadBoxes() {
  const wrap = document.getElementById('boxes-wrap');
  if (!wrap) return;
  try {
    const boxes = await fetch(API + '/box_favorites').then(r => r.json());
    wrap.innerHTML = '';
    boxes.forEach(box => {
      const btn = document.createElement('button');
      btn.className = 'box-btn';
      btn.innerHTML = `<span class="box-swatch sw-${box.option_type}"></span><span class="box-name">${box.description}</span>`
        + `<span class="box-info-btn" role="button" tabindex="0" title="Box details" aria-label="Box details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>`;
      btn.dataset.uid = box.uid;
      btn.title = box.option_type;

        if (e.target.closest('.box-info-btn')) { e.stopPropagation(); openBox(box.uid); return; }
        toggleBox(box.uid, btn);

      checkBoxActive(box.uid, btn);

      setInterval(() => checkBoxActive(box.uid, btn), 600000);

  } catch(e) {}
}

async function checkBoxActive(uid, btn) {

    const text = await fetch(API + '/box_activated?uid=' + encodeURIComponent(uid)).then(r => r.text());
    btn.classList.toggle('active', text.trim() === '1');
    // Une box dont le nom/type contient "auto" → engage le mode auto
    const label = (btn.querySelector('.box-name')?.textContent || '') + ' ' + (btn.title || '');
    btn.dataset.auto = /auto/i.test(label) ? '1' : '0';

async function toggleBox(uid, btn) {
  btn.disabled = true;
  try {
    await fetch(API + '/box?uid=' + encodeURIComponent(uid) + '&mode=toogle');
    moodSessionActive = false;   // lancer une box termine la session mood implicite
    await new Promise(r => setTimeout(r, 200));
    await checkBoxActive(uid, btn);
    // First refresh: box badge state visible early; second: full tracklist after O2M async refill
    setTimeout(refreshNowPlaying, 800);
    setTimeout(refreshNowPlaying, 3000);

    setFeedback(btn.classList.contains('active') ? `▶ ${boxName}` : `⏹ ${boxName}`);
  } catch(e) { setFeedback('Box error'); }

/* ── Snapcast — wrapper autour de SnapStream (bundle Iris/snapstream.ts) ── */
const SNAP_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`;

function _snapBtnOff() {
  const btn = document.getElementById('btn-snapcast');
  btn.innerHTML = SNAP_SVG; btn.classList.remove('playing');
}

function _snapStart() {
  if (snapPlayer || !snapWsUrl || !window.SnapStream) return;
  snapPlayer = new window.SnapStream(snapWsUrl);
  startMediaAnchor();
  // Pousse les métadonnées une fois la session média devenue active
  setTimeout(refreshNowPlaying, 600);
  const btn = document.getElementById('btn-snapcast');
  btn.innerHTML = SNAP_SVG; btn.classList.add('playing');
  setFeedback('Connecting…');
}

function toggleSnapcast() {
  if (snapPlayer) {
    snapPlayer.stop(); snapPlayer = null;
    stopMediaAnchor();
    _snapBtnOff(); setFeedback('Snapcast stopped');
    localStorage.setItem('snap-autoconnect', '0');  // arrêt explicite (≠ « jamais décidé »)
  } else {
    if (!snapWsUrl) { setFeedback('Snapcast not configured'); return; }
    if (!window.SnapStream) { setFeedback('Snapcast module not loaded'); return; }
    _snapStart();
    localStorage.setItem('snap-autoconnect', '1');
  }
}

function autoConnectSnapIfNeeded() {
  const pref = localStorage.getItem('snap-autoconnect');
  // Phone: auto-connect (it's the designated speaker). Tablet/desktop: only
  // restore the last local state ('1' = was connected → reconnect; '0'/null = stay off).
  const shouldConnect = isPhoneDevice() || pref === '1';
  if (!shouldConnect || !snapWsUrl) return;
  // Connect on the first user gesture (browsers require it for AudioContext).
  // Don't use {once}: if the SnapStream bundle isn't loaded yet, _snapStart() is a
  // no-op — keep the listeners until a player is actually created, then detach.
  const onGesture = () => {
    _snapStart();
    if (snapPlayer) {
      document.removeEventListener('click', onGesture);
      document.removeEventListener('touchstart', onGesture);
    }
  };
  document.addEventListener('click',      onGesture);
  document.addEventListener('touchstart', onGesture, { passive: true });
}

/* Téléphone uniquement (exclut tablette + desktop) — utilisé pour tout ce qui
   doit rester "tablette ne fait rien d'auto" (auto-connect Snapcast, auto-lecture).
   Astuce UA : iPad se déclare "iPad" et n'a jamais iPhone/iPod dans l'UA. Certaines
   petites tablettes Android (≤ 7-8") gardent "Mobile" dans l'UA même si ce n'est pas
   un téléphone : on confirme donc toujours avec la taille d'écran (≤ 600px de petit
   côté) plutôt que de se fier à "Mobile" seul. */
function isPhoneDevice() {
  const ua = navigator.userAgent;
  const minSide = Math.min(window.screen?.width || 9999, window.screen?.height || 9999);
  if (/iPad/.test(ua)) return false;
  if (/iPhone|iPod/.test(ua)) return true;
  if (/Android/.test(ua) && /Mobile/.test(ua)) return minSide <= 600;
  if (/Windows Phone|BlackBerry|Opera Mini|IEMobile/.test(ua)) return true;
  // Repli : écran tactile avec petit côté ≤ 480px (téléphone), exclut tablettes/desktop
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  return touch && minSide <= 480;
}
function autoInitPlaybackIfPhone() {
  if (!isPhoneDevice()) return;
  setTimeout(() => {
    // Basic view: never auto-launch a box (unmute + resume only).
    fetch(API + '/initialize_playback' + (isBasic() ? '?nobox=1' : ''))
      .then(r => r.text())
      .then(t => { if (t && t !== 'no_action') setTimeout(refreshNowPlaying, 800); })
      .catch(() => {});
  }, 1500);
}

/* Mobile "tap to start audio" splash — a deliberate single tap that reliably
   satisfies the browser's user-gesture requirement (more robust than catching a
   random click). On tap: unlock Web Audio, connect Snapcast, start playback. */
function showAudioTapOverlay() {
  if (!isPhoneDevice() || !snapWsUrl) return;           // only when the browser is the speaker (Snapcast)
  if (document.getElementById('audio-tap-overlay')) return;
  const ov = document.createElement('div');
  ov.id = 'audio-tap-overlay';
  ov.innerHTML =
    '<div class="tap-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>'
    + '<div class="tap-label">Tap to start audio</div>';
  const go = () => {
    ov.removeEventListener('click', go);
    // 1. Unlock the Web Audio API for the whole page (resumes suspended contexts).
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { const t = new AC(); t.resume().then(() => t.close()).catch(() => {}); } } catch (e) {}
    // 2. Connect Snapcast (the phone becomes the speaker).
    _snapStart();
    localStorage.setItem('snap-autoconnect', '1');
    // 3. Make sure something is playing (basic view: resume only, no box auto-launch).
    fetch(API + '/initialize_playback' + (isBasic() ? '?nobox=1' : '')).then(() => setTimeout(refreshNowPlaying, 800)).catch(() => {});
    ov.classList.add('hide');
    setTimeout(() => ov.remove(), 320);
  };
  ov.addEventListener('click', go);
  document.body.appendChild(ov);
}

/* ── Pochette de remplacement (quand un morceau n'a pas de visuel) ── */
/* Pour utiliser tes propres images : remplace/complète cette liste par tes URLs. */
// Pochettes "maison" du design system (orange + neutres, géométrie plate)
const PLACEHOLDER_COVERS = [
  '/static/ds/covers/o2m-cover1.png',  '/static/ds/covers/o2m-cover2.png',
  '/static/ds/covers/o2m-cover3.png',  '/static/ds/covers/o2m-cover4.png',
  '/static/ds/covers/o2m-cover5.png',  '/static/ds/covers/o2m-cover6.png',
  '/static/ds/covers/o2m-cover7.png',  '/static/ds/covers/o2m-cover8.png',
  '/static/ds/covers/o2m-cover9.png',  '/static/ds/covers/o2m-cover10.png',
  '/static/ds/covers/o2m-cover11.png', '/static/ds/covers/o2m-cover12.png',
];
/* Crossfade the cover: preload the new image off-DOM, then swap + fade in.
   Avoids the blank flash of setting src directly and makes track changes feel
   snappier. No-op when the URL is unchanged. */
function setCoverSmooth(url) {
  const el = document.getElementById('cover');
  if (!el || !url || el.src === url) return;
  const img = new Image();
  img.onload = () => {
    el.classList.add('cover-fading');
    setTimeout(() => { el.src = url; el.classList.remove('cover-fading'); }, 120);
  };
  img.onerror = () => { el.src = url; };
  img.src = url;
}

/* Warm the browser image cache with the NEXT track's cover so pressing next shows
   it instantly (get_images is served from mopidy's cache; the image itself comes
   from the CDN once and stays cached). */
let _prefetchedCoverUri = null;
async function prefetchNextCover() {
  try {
    const i = matrixTlItems.findIndex(it => it.tlid === currentTlid);
    const next = (i >= 0 && matrixTlItems[i + 1]) ? matrixTlItems[i + 1] : null;
    if (!next?.uri || next.uri === _prefetchedCoverUri) return;
    _prefetchedCoverUri = next.uri;
    const r = await rpc('core.library.get_images', {uris: [next.uri]});
    const imgs = r?.result?.[next.uri] || [];
    const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
    if (best) { const im = new Image(); im.src = imageUrl(best.uri || best); }
  } catch (e) {}
}

function placeholderForUri(uri) {            // déterministe : même morceau → même pochette (pas de scintillement)
  let h = 0; const s = uri || 'o2m';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PLACEHOLDER_COVERS[h % PLACEHOLDER_COVERS.length];
}

/* ── Hero accent (couleur dynamique du style Invert) ── */
const HERO_PALETTE = ['#ff3b00','#1e6bff','#ff0091','#00c878','#ffc400','#8b5cff','#00d4d4'];
function heroAccentForUri(uri) {
  let h = 0;
  const s = uri || '';
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return HERO_PALETTE[h % HERO_PALETTE.length];
}
function updateHeroAccent(uri) {
  if (document.documentElement.getAttribute('data-theme') !== 'invert') return;
  document.documentElement.style.setProperty('--hero-accent', heroAccentForUri(uri));
  readThemeColors();
}

/* Ajuste la taille du titre pour remplir l'espace dispo (affiches) ; coupe si vraiment trop long */
function fitHeroTitle() {
  const el = document.getElementById('hero-title');
  if (!el) return;
  const theme = document.documentElement.getAttribute('data-theme');
  if ((theme !== 'overprint' && theme !== 'invert') || !el.textContent) return;
  // Mobile : pas de fit JS, on laisse le clamp CSS gérer (titre au-dessus de la pochette)
  if (window.innerWidth < 700) { el.style.fontSize = ''; return; }

  const availW = el.clientWidth;
  if (availW <= 0) return;

  // Invert : titre-légende, ajusté à la largeur (une ligne), plafonné
  if (theme === 'invert') {
    el.style.fontSize = '100px';
    const w = el.scrollWidth;
    if (w <= 0) return;
    el.style.fontSize = Math.max(22, Math.min(130, Math.floor(100 * availW / w))) + 'px';
    return;
  }

  // Overprint : remplit toute la zone (largeur ET hauteur) jusqu'au-dessus des contrôles.
  // align-self:start + hauteur auto → scrollHeight reflète bien la hauteur du texte.
  el.style.fontSize = '20px';   // base petite pour mesurer la zone de façon stable
  const right = document.getElementById('top-right');
  const titleTop = el.getBoundingClientRect().top;
  let availH = right ? right.getBoundingClientRect().top - titleTop - 8 : 0;
  if (availH <= 24) availH = Math.max(80, window.innerHeight * 0.35);  // garde-fou
  let lo = 14, hi = 480, best = 14;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + 'px';
    if (el.scrollWidth <= availW + 1 && el.scrollHeight <= availH + 1) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  el.style.fontSize = best + 'px';
}

function applyTheme(name) {
  document.documentElement.setAttribute('data-theme', name);
  localStorage.setItem('o2m2-theme', name);   // clé séparée : mood2 n'écrase pas mood

    c.classList.toggle('active', c.dataset.themeSet === name));

  else document.documentElement.style.removeProperty('--hero-accent');

function setupThemeSwitcher() {
  document.querySelectorAll('.theme-chip').forEach(c =>
    c.addEventListener('click', () => applyTheme(c.dataset.themeSet)));

function setupCollapsibles() {

  // 3 headers stay visible. On desktop the .open class has no effect (all shown).
  const heads = document.querySelectorAll(
    '#boxes-panel .panel-head, #left-panel .panel-head, #tracklist-col #tracklist-label');
  heads.forEach(h => h.addEventListener('click', (e) => {
    if (e.target.closest('#btn-clear-tl') || e.target.closest('#btn-clear-boxes')
        || e.target.closest('#btn-reset-mood')) return;   // don't toggle on a header action
    const panel = h.closest('.collapsible');

    const willOpen = !panel.classList.contains('open');

      p.classList.toggle('open', p === panel && willOpen));

}

let seekDragging = false;
function setupProgressSeek() {
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  const elapsed = document.getElementById('prog-elapsed');
  if (!bar) return;
  const pctFromEvent = (e) => {
    const rect = bar.getBoundingClientRect();
    if (rect.width <= 0) return 0;
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };
  const preview = (p) => {
    fill.style.width = (p * 100) + '%';
    if (currentDurationMs) elapsed.textContent = msToMin(p * currentDurationMs);
  };
  bar.addEventListener('pointerdown', (e) => {
    seekDragging = true;
    bar.classList.add('seeking');
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    preview(pctFromEvent(e));
    e.preventDefault();
  });
  bar.addEventListener('pointermove', (e) => { if (seekDragging) preview(pctFromEvent(e)); });
  const end = async (e) => {
    if (!seekDragging) return;
    seekDragging = false;
    bar.classList.remove('seeking');
    const p = pctFromEvent(e);
    if (currentDurationMs) {
      await rpc('core.playback.seek', { time_position: Math.round(p * currentDurationMs) });
      setTimeout(updateProgress, 300);
    }
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', () => { seekDragging = false; bar.classList.remove('seeking'); });
}

// ─── Local progress clock (no per-second RPC, Iris-style) ────────────────────
// We know the position at an instant (10s resync + seeked/started events) and
// then advance it in the browser. tickProgress() does NO network call.
let progBaseMs = 0, progBaseAt = 0, progPlaying = false, lastNpUri = null, lastCoverUrl = '';
function setClock(posMs, playing) {
  progBaseMs = Math.max(0, posMs || 0); progBaseAt = Date.now(); progPlaying = !!playing;
  document.body.classList.toggle('is-paused', !progPlaying);
  pushPositionState();   // single authoritative push; the OS interpolates from here
}
// Optimistic snap of the progress bar to 0 on next/prev, before refreshNowPlaying
// arrives. Bypasses CSS `transition: width 1s linear` so bar jumps instantly.
function resetProgress() {
  progBaseMs = 0; progBaseAt = Date.now();
  const fill = document.getElementById('progress-fill');
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(() => { fill.style.transition = ''; });
  }
  document.getElementById('prog-elapsed').textContent = msToMin(0);
}
function clockPosMs() {
  return progPlaying ? progBaseMs + (Date.now() - progBaseAt) : progBaseMs;
}
// Push the position to the OS media notification ONCE per real change (seek,
// play/pause, track change, 10s resync). The OS advances the scrubber itself
// from playbackRate, so we must NOT call this every tick — doing so redraws the
// Android media controls ~4×/s and makes them flicker.
function pushPositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if (!currentDurationMs) return;
  try {
    navigator.mediaSession.setPositionState({
      duration: currentDurationMs / 1000,
      position: Math.min(clockPosMs(), currentDurationMs) / 1000,
      playbackRate: progPlaying ? 1 : 0,
    });
  } catch(e) {}
}
function tickProgress() {
  if (seekDragging || !currentDurationMs) return;
  const pos = Math.min(clockPosMs(), currentDurationMs);
  // In-page bar only — NO mediaSession call here (see pushPositionState).
  document.getElementById('progress-fill').style.width =
    Math.min(100, (pos / currentDurationMs) * 100) + '%';
  document.getElementById('prog-elapsed').textContent = msToMin(pos);
}
async function updateProgress() {          // one-off network resync (not a 1s loop)
  if (seekDragging) return;
  const r = await rpc('core.playback.get_time_position');
  if (r && r.result != null) setClock(r.result, progPlaying);
}

// ─── Mopidy events received via push on the WebSocket ────────────────────────
// O2M refills the tracklist track-by-track during playback → a burst of
// `tracklist_changed`. Coalesce them into a single refresh to avoid replaying
// refreshNowPlaying (and its RPCs) many times per second.
let _tlChangeTimer = null;
function scheduleTracklistRefresh() {
  clearTimeout(_tlChangeTimer);
  _tlChangeTimer = setTimeout(refreshNowPlaying, 300);
}

function onMopidyEvent(m) {
  switch (m.event) {
    case 'tracklist_changed':
      scheduleTracklistRefresh(); break;   // debounced (bursty during refill)
    case 'track_playback_started':
    case 'track_playback_ended':
    case 'playback_state_changed':
      refreshNowPlaying(); break;          // reseed track + state + clock
    case 'track_playback_paused':
      if (m.time_position != null) setClock(m.time_position, false); else progPlaying = false; break;
    case 'track_playback_resumed':
      if (m.time_position != null) setClock(m.time_position, true); else progPlaying = true; break;
    case 'seeked':
      if (m.time_position != null) setClock(m.time_position, progPlaying); break;
    case 'volume_changed':
      refreshVolume(); break;
  }
}

function setFeedback(msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg || '';
  el.classList.toggle('show', !!msg);
  clearTimeout(el._t);
  if (msg) el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ── Fullscreen ── */
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFullscreen() {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el).catch(() => {});
}
function exitFullscreen() {
  (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
}
function toggleFullscreen() {
  if (isFullscreen()) exitFullscreen(); else enterFullscreen();
}
function updateFsBtn() {
  document.getElementById('btn-fullscreen')?.classList.toggle('on', isFullscreen());
}

init();

// TEMP diagnostic for the display-cutout investigation — remove once resolved.
// Shows, directly on screen (no devtools needed on the phone), which display-mode
// the browser actually granted and what env(safe-area-inset-top) resolves to.
// If inset=0px while a notch/camera is visible, the OS isn't handing us that
// strip at all (not a CSS/color issue) — display-mode is the thing to fix.
(function cutoutDebug() {
  const modes = ['fullscreen', 'standalone', 'minimal-ui', 'browser'];
  const mode = modes.find(m => window.matchMedia(`(display-mode: ${m})`).matches) || '?';
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);' +
    'min-height:2px;background:red;z-index:99999;pointer-events:none;';
  document.body.appendChild(probe);
  const label = document.createElement('div');
  label.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);left:4px;z-index:99999;' +
    'font:11px monospace;color:#0f0;background:#000;padding:2px 5px;pointer-events:none;';
  const insetPx = getComputedStyle(probe).height;
  label.textContent = `mode=${mode} inset-top=${insetPx}`;
  document.body.appendChild(label);
  console.log('[cutout-debug]', mode, insetPx);
})();

// PWA : enregistre le service worker (uniquement en contexte sécurisé HTTPS).
// En HTTP, navigator.serviceWorker est absent ou register() échoue → ignoré.
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
