    editablePlaylists = Array.isArray(all) ? all.filter(p => p.owned) : [];
  } catch(e) { editablePlaylists = []; }
  return editablePlaylists;
}

let _plDropdown = null;
function _closePlDropdown() {
  _plDropdown?.remove(); _plDropdown = null;
  document.removeEventListener('click', _plOutsideClick, true);
}
function _plOutsideClick(e) {
  if (_plDropdown && !_plDropdown.contains(e.target) && !e.target.closest('.pl-trigger'))
    _closePlDropdown();
}

/* ══ Harmonized object action menu (the "i"/⋯ context menu used everywhere:
   tracklist rows, the current-track "More" button, and album/artist/box
   headers in the detail modal) ══
   One shared dropdown builder + one shared open/close/outside-click lifecycle,
   fed by a per-context list of {label, icon, action} items — instead of three
   diverging ad-hoc menus. */
let _actionMenuEl = null;
function _closeActionMenu() {
  _actionMenuEl?.remove(); _actionMenuEl = null;
  document.removeEventListener('click', _actionMenuOutside, true);
  document.getElementById('btn-track-menu')?.setAttribute('aria-expanded', 'false');
}
function _actionMenuOutside(e) {
  if (_actionMenuEl && !_actionMenuEl.contains(e.target)
      && !e.target.closest('.tl-info') && !e.target.closest('#obj-actions')
      && !e.target.closest('#btn-track-menu')) _closeActionMenu();
}
/* Place a fixed popup under its trigger — or above it when there isn't enough
   room below (rows near the bottom of a list, which is where the ⊕/ⓘ buttons
   usually are). max-height is capped to the space available in the chosen
   direction so the menu is always fully reachable by its own scroll.
   The popup must already be in the DOM: scrollHeight is measured here. */
function _placePopup(el, btn) {
  const rect = btn.getBoundingClientRect();
  el.style.right = (window.innerWidth - rect.right) + 'px';
  const spaceBelow = window.innerHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  if (el.scrollHeight > spaceBelow && spaceAbove > spaceBelow) {
    el.style.top = 'auto';
    el.style.bottom    = (window.innerHeight - rect.top + 4) + 'px';
    el.style.maxHeight = Math.max(120, spaceAbove) + 'px';
  } else {
    el.style.bottom = 'auto';
    el.style.top       = (rect.bottom + 4) + 'px';
    el.style.maxHeight = Math.max(120, spaceBelow) + 'px';
  }
}
function openActionMenu(triggerBtn, items) {
  if (_actionMenuEl) { _closeActionMenu(); return; }
  if (!items || !items.length) return;
  const menu = document.createElement('div');
  menu.className = 'track-menu-dropdown';
  menu.innerHTML = items.map((it, i) =>
    `<button type="button" data-i="${i}">${it.icon}${objEsc(it.label)}</button>`).join('');
  items.forEach((it, i) => menu.querySelector(`[data-i="${i}"]`)
    .addEventListener('click', () => { it.action(); _closeActionMenu(); }));
  // Append first: _placePopup measures the menu's height to decide up vs down.
  document.body.appendChild(menu);
  _placePopup(menu, triggerBtn);
  _actionMenuEl = menu;
  triggerBtn.setAttribute?.('aria-expanded', 'true');
  setTimeout(() => document.addEventListener('click', _actionMenuOutside, true), 0);
}

/* ── Smart shareable link resolution ──
   Internal URIs aren't directly useful to share/open outside O2M — resolve them
   to something usable: spotify:track:ID → open.spotify.com (works for anyone,
   no app needed); yt:URL → the plain YouTube URL; a podcast episode → the site
   page link embedded in mopidy-podcast's `comment` field (falls back to the feed
   URL); a box → its box:<uid> reference, directly paste-able into another box's
   raw data to build a cascade. */
const trackMeta = new Map();   // uri -> track object (populated wherever rows render)
function registerTrackMeta(t) { if (t && t.uri) trackMeta.set(t.uri, t); }
function extractHrefFromComment(comment) {
  const m = /<a\s+href="([^"]+)"/i.exec(comment || '');
  return m ? m[1] : null;
}
function shareableLink(uri) {
  if (!uri) return null;
  let m;
  if ((m = /^spotify:(track|album|artist|playlist):([A-Za-z0-9]+)/.exec(uri)))
    return `https://open.spotify.com/${m[1]}/${m[2]}`;
  if (uri.startsWith('yt:')) return uri.slice(3);
  if (uri.startsWith('podcast+')) {
    const fromComment = extractHrefFromComment(trackMeta.get(uri)?.comment);
    if (fromComment) return fromComment;
    return uri.slice('podcast+'.length).split('#')[0];   // feed URL fallback
  }
  return uri;   // local file / box / anything else — copy the raw reference
}
async function copyLink(uri) {
  const link = shareableLink(uri);
  if (!link) { setFeedback('No link'); return; }
  try { await navigator.clipboard.writeText(link); setFeedback('Link copied'); }
  catch (e) { setFeedback('Copy failed'); }
}

/* Track row menu: Play next / Play now always available; Remove only when a
   tlid is known (i.e. the row IS a tracklist entry — not a browse-only row from
   an album/artist/box listing); Copy link resolves smartly per uri kind. */
function trackMenuItems(uri, tlid) {
  const items = [
    { label: 'Play next', icon: ICON_PLAYNEXT, action: () => playNext(uri) },
    { label: 'Play now',  icon: ICON_PLAYNOW,  action: () => playNow(uri) },
  ];
  if (tlid != null) items.push({ label: 'Remove', icon: ICON_REMOVE, action: () => removeFromTracklist(tlid) });
  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openTrackDetailSheet(uri) });
  items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(uri) });
  return items;
}
async function removeFromTracklist(tlid) {
  try {
    await rpc('core.tracklist.remove', { criteria: { tlid: [tlid] } });
    setFeedback('Removed');
    setTimeout(refreshNowPlaying, 200);
  } catch (e) { setFeedback('Remove error'); }
}

/* Kind-aware menu for a search-result row. track/radio act on the single uri;
   artist/album resolve the object's tracks (mopidy lookup expands them) and
   queue those, plus a "See details" that opens the existing detail sheet. */
function objMenuItems(uri, kind) {
  const single = (kind === 'track' || kind === 'radio' || !kind);
  const items = [];
  // A box isn't directly playable/queueable as a uri — it's activated as a whole.
  if (kind !== 'box') {
    items.push({ label: 'Play next', icon: ICON_PLAYNEXT, action: () => single ? playNext(uri) : objPlayObject(uri, 'next') });
    items.push({ label: 'Play now',  icon: ICON_PLAYNOW,  action: () => single ? playNow(uri)  : objPlayObject(uri, 'now') });
  }
  if (kind === 'artist') items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openArtist(uri) });
  if (kind === 'album')  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openAlbum(uri, {}) });
  // The library/favorite toggle is appended asynchronously by the menu opener
  // (menuItemsWithLibrary) so its label reflects the live saved/followed state.
  if (kind === 'box')    items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openBox(uri.replace(/^box:/, '')) });
  if (kind === 'podcast')items.push({ label: 'See episodes', icon: ICON_DETAILS, action: () => openPodcast(uri) });
  if (kind === 'playlist')items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openPlaylist(uri) });
  if (kind === 'track')  items.push({ label: 'See details', icon: ICON_DETAILS, action: () => openTrackDetailSheet(uri) });
  items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(uri) });
  return items;
}
// Library toggle (write-through to Spotify + local DB). `add` = desired state.
// Album → saved albums, artist → follow, track → liked. All synchronized.
async function _libToggle(endpoint, key, uri, add, okAdd, okRemove) {
  try {
    const r = await fetch(API + endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uri, [key]: add }),
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    const d = await r.json().catch(() => ({}));
    setFeedback(d.error ? 'Error' : (add ? okAdd : okRemove));
  } catch (e) { setFeedback('Error'); }
}
const setAlbumInLibrary  = (uri, add) => _libToggle('/album_save',   'saved',    uri, add, 'Album added to library',  'Album removed from library');
const setArtistInLibrary = (uri, add) => _libToggle('/artist_follow','followed', uri, add, 'Artist added to library', 'Artist removed from library');
const setTrackFavorite   = (uri, add) => _libToggle('/track_favorite','favorite',uri, add, 'Added to favorites',      'Removed from favorites');

// Live library state for a (uri, kind): true = in library, false = not, null = unknown.
async function fetchLibState(uri, kind) {
  try {
    if (kind === 'album')  return !!(await fetch(API + '/album_saved?uri='     + encodeURIComponent(uri)).then(r => r.json())).saved;
    if (kind === 'artist') return !!(await fetch(API + '/artist_followed?uri=' + encodeURIComponent(uri)).then(r => r.json())).followed;
    if (kind === 'track')  return !!(await fetch(API + '/track_saved?uri='     + encodeURIComponent(uri)).then(r => r.json())).saved;
  } catch (e) {}
  return null;
}
// The library/favorite toggle item, label + icon reflecting current state.
function libraryToggleItem(uri, kind, inLib) {
  const add = !inLib;
  const label = kind === 'track'
    ? (inLib ? 'Remove from favorites' : 'Add to favorites')
    : (inLib ? 'Remove from library'   : 'Add to library');
  const fn = kind === 'album' ? setAlbumInLibrary : kind === 'artist' ? setArtistInLibrary : setTrackFavorite;
  return { label, icon: inLib ? ICON_REMOVE : ICON_ADD, action: () => fn(uri, add) };
}
// Base menu items + the async library/favorite toggle (album/artist/track only).
async function menuItemsWithLibrary(uri, kind) {
  const items = kind ? objMenuItems(uri, kind) : trackMenuItems(uri, null);
  const k = kind || 'track';
  if (['album', 'artist', 'track'].includes(k) && uri.startsWith('spotify:')) {
    const inLib = await fetchLibState(uri, k);
    if (inLib !== null) items.push(libraryToggleItem(uri, k, inLib));
  }
  return items;
}
// Open an object's detail view from its (uri, kind) — used by the row-click handler.
function objOpenByKind(uri, kind, name) {
  if (kind === 'artist')  return openArtist(uri, name);
  if (kind === 'album')   return openAlbum(uri, { name });
  if (kind === 'box')     return openBox(String(uri).replace(/^box:/, ''));
  if (kind === 'podcast') return openPodcast(uri, { name });
  if (kind === 'playlist')return openPlaylist(uri, { name });
  return renderTrackObj(uri, { name });
}
// Track "See details" → a track view hosted in the shared object modal (with the
// per-track mood matrix). Same modal = same height + the ◂ ▸ nav back to results,
// and it is immune to the now-playing refresh that drives #track-details.
function openTrackDetailSheet(uri, seed) { renderTrackObj(uri, seed); }
// Play an album/artist: resolve its tracks (mopidy expands album→tracks,
// artist→all tracks, so cap it) then queue next / play now.
async function objPlayObject(uri, mode) {
  try {
    const r = await rpc('core.library.lookup', { uris: [uri] });
    let uris = (r?.result?.[uri] || []).map(t => t.uri).filter(Boolean);
    if (!uris.length) {   // directory-like uri (podcast feed) → browse to its episode tracks
      const b = await rpc('core.library.browse', { uri });
      uris = (b?.result || []).filter(x => x.type === 'track').map(x => x.uri).filter(Boolean);
    }
    if (!uris.length) { setFeedback('No tracks'); return; }
    if (uris.length > 40) uris = uris.slice(0, 40);
    if (mode === 'now') await playNow(uris); else await playNext(uris);
  } catch (e) { setFeedback('Play error'); }
}

// Podcast channel detail: browse the mopidy-podcast feed into its episodes and
// render them as a track list (same rows as an album). Reached from search (a

    const eps = (browseR?.result || []).filter(r => r.type === 'track');
    objSetActionUris(eps.map(e => e.uri).filter(Boolean), uri);
    const coverHtml = cover ? `<img class="obj-cover" src="${objEsc(cover)}" alt="">` : '';
    let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(seed?.name || 'Podcast')}</b>`
      + `<span>${eps.length} episode${eps.length === 1 ? '' : 's'}</span></div></div>`;
    html += objRenderTracks(eps.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: [] })), 'track');
    objBody().innerHTML = html;

// Playlist detail: resolve the playlist's tracks (mopidy lookup on the
// spotify:playlist uri) and render them as a track list, like an album.
async function openPlaylist(uri, seed) {
  if (!uri) return;
  objNavTo();

      + `<span>${tracks.length} track${tracks.length === 1 ? '' : 's'}</span></div></div>`;
    html += objRenderTracks(tracks.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })), 'track');
    objBody().innerHTML = html;
  } catch (e) { objBody().innerHTML = '<div class="obj-empty">Could not load playlist.</div>'; }

/* Object-level actions (album / artist / box header, the ⋯ button) — Play next
   the whole set (album/artist only) + Copy link for the object itself (its own
   shareable link, or box:<uid> for a box). */
let objCurrentPlayUris = [];
let objCurrentUri = null;
function objSetActionUris(list, uri) {
  objCurrentPlayUris = Array.isArray(list) ? list.filter(Boolean) : [];
  objCurrentUri = uri || null;
  document.getElementById('obj-actions')?.classList.toggle('hide',
    objCurrentPlayUris.length === 0 && !objCurrentUri);
}
async function openObjActions(btn) {
  const items = [];
  if (objCurrentPlayUris.length)
    items.push({ label: 'Play next', icon: ICON_PLAYNEXT, action: () => playNext(objCurrentPlayUris) });
  if (objCurrentUri)
    items.push({ label: 'Copy link', icon: ICON_COPY, action: () => copyLink(objCurrentUri) });
  // Library toggle for the whole object (album saved / artist followed), live state.
  const kind = (document.getElementById('obj-kind')?.textContent || '').toLowerCase();
  if (objCurrentUri && (kind === 'album' || kind === 'artist')) {
    const inLib = await fetchLibState(objCurrentUri, kind);
    if (inLib !== null) items.push(libraryToggleItem(objCurrentUri, kind, inLib));
  }
  openActionMenu(btn, items);
}

/* Queue via O2M (live URI adaptation + stat mapping for externally-cached
   content). Accepts a single uri or a list (album/artist). */
function _playNextReq(uris) {
  const list = (Array.isArray(uris) ? uris : [uris]).filter(Boolean);
  const qs = list.map(u => 'uri=' + encodeURIComponent(u)).join('&');
  return fetch(API + '/play_next?' + qs).then(r => r.json());
}
async function playNext(uris) {
  try {
    const r = await _playNextReq(uris);
    if (r.ok) { setFeedback(r.count > 1 ? ('Queued ' + r.count + ' tracks next') : 'Added to play next'); setTimeout(refreshNowPlaying, 300); }
    else setFeedback(r.error || 'Could not queue');
  } catch(e) { setFeedback('Queue error'); }
}
async function playNow(uri) {
  try {
    const r = await _playNextReq(uri);
    if (r.ok && r.tlid != null) {
      resetProgress();
      await rpc('core.playback.play', {tlid: r.tlid});
      setTimeout(refreshNowPlaying, 200);
      setFeedback('Playing');
    } else setFeedback(r.error || 'Could not play');
  } catch(e) { setFeedback('Play error'); }
}

/* Playlist picker. Rendered into any container, so both track panels (the
   now-playing column and the modal "See details" sheet) get the same control.
   Each rendered box is registered with the uri it shows, so a membership change
   can refresh every visible copy at once (both can be on screen together). */
const _plBoxes = new Map();   // boxId -> uri currently rendered there

function refreshPlaylistEditors(uri) {
  for (const [boxId, u] of _plBoxes) if (u === uri) renderPlaylistEditor(uri, boxId);
}

async function renderPlaylistEditor(uri, boxId = 'td-playlists') {
  const box = document.getElementById(boxId);
  if (!box) { _plBoxes.delete(boxId); return; }
  _closePlDropdown();
  if (!editUnlocked || !uri) { box.innerHTML = ''; _plBoxes.delete(boxId); return; }
  _plBoxes.set(boxId, uri);
  const pls = await loadEditablePlaylists();
  const inSet = new Set();
  try {
    const inPls = await fetch(API + '/track_playlists?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (Array.isArray(inPls)) inPls.forEach(p => inSet.add(p.id));
  } catch(e) {}
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const active = pls.filter(p => inSet.has(p.id));
  const labelText = active.length ? active.map(p => p.name || p.id).join(', ') : '—';
  box.innerHTML =
    '<button type="button" class="pl-trigger">'
    + '<span class="pl-count">' + active.length + '</span>'
    + '<span class="pl-label">' + esc(labelText) + '</span>'
    + '<span class="pl-caret">▸</span></button>';
  box.querySelector('.pl-trigger').addEventListener('click', e => {
    e.stopPropagation();
    if (_plDropdown) { _closePlDropdown(); return; }
    const dropdown = document.createElement('div');
    dropdown.className = 'pl-dropdown';
    dropdown.innerHTML = pls.length
      ? pls.map(p =>
          '<label><input type="checkbox" data-pid="' + esc(p.id) + '"' + (inSet.has(p.id) ? ' checked' : '') + '>'
          + '<span>' + esc(p.name || p.id) + '</span></label>').join('')
      : '<span style="font-size:11px;color:var(--muted)">No editable playlists cached.</span>';
    dropdown.querySelectorAll('input[type=checkbox]').forEach(cb =>
      cb.addEventListener('change', () => togglePlaylistMembership(cb, uri)));
    // Append first, then place: _placePopup measures the list to decide up vs
    // down and caps its height to the room actually available (shared with the
    // ⊕/ⓘ action menus).
    document.body.appendChild(dropdown);
    _placePopup(dropdown, box.querySelector('.pl-trigger'));
    _plDropdown = dropdown;
    setTimeout(() => document.addEventListener('click', _plOutsideClick, true), 0);
    box.querySelector('.pl-caret').textContent = '▾';
  });
}

async function togglePlaylistMembership(cb, uri) {
  const pid = cb.dataset.pid, add = cb.checked;
  cb.disabled = true;
  try {
    const r = await fetch(API + '/track_playlist', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri, playlist_id: pid, action: add ? 'add' : 'remove' })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); cb.checked = !add; return; }
    const j = await r.json().catch(() => ({}));
    if (j.error) { setFeedback('Playlist: ' + j.error); cb.checked = !add; return; }
    setFeedback(add ? 'Added to playlist' : 'Removed from playlist');
    refreshPlaylistEditors(uri);   // refresh active list + count in every panel
  } catch(e) { setFeedback('Playlist error'); cb.checked = !add; }
  finally { cb.disabled = false; }
}

function renderFav(p) {
  const el = p && p.favEl();
  if (!el) return;
  const fav = p.favLocal || p.favSpotify === true;
  el.innerHTML = ICON.heart(fav);
  el.classList.toggle('on', fav);
  const src = [p.favLocal ? 'local' : null, p.favSpotify === true ? 'Spotify' : null].filter(Boolean).join(' + ');
  el.title = (fav ? 'Favorite' + (src ? ' (' + src + ')' : '') : 'Not a favorite')
           + (editUnlocked ? ' — click to toggle' : '');
}

/* ── Shared track-detail logic ────────────────────────────────────────────────
   Two panels show a track's details: the now-playing column (#track-details,
   cells td-*) and the modal "See details" sheet (cells obj-td-*). They list the
   same fields, expose the same click-to-edit cells, draw the same mood matrix and
   now offer the same playlist picker. All of that is written once here; a panel
   only supplies its element ids and the uri it follows. */

const fmtEV = x => (x === null || x === undefined) ? '—' : Math.round(x * 10) + '/10';

// [label, cell key, value(info)] — the single source of truth for which rows a
// track panel shows and in which order. The key is the cell-id suffix, so the
// same descriptor drives td-* and obj-td-*. EDITABLE_FIELDS says which are
// click-to-edit.
const TRACK_FIELDS = [
  ['Status',     'type',       i => i.option_type || '—'],
  // Source = strict live provenance (the box/source it's served from right now);
  // '—' when the track isn't in the running mix. Status is the persisted state,
  // Source the live one — a clean dichotomy. Placed under Status for readability.
  ['Source',     'source',     i => i.source || '—'],
  ['Energy',     'energy',     i => fmtEV(i.energy)],
  ['Valence',    'valence',    i => fmtEV(i.valence)],
  ['Mood',       'mood',       i => i.mood || '—'],
  ['Popularity', 'popularity', i => fmtEV(i.popularity)],
  ['Plays',      'plays',      i => (i.read_count_end ?? 0) + ''],
];
const EDITABLE_FIELDS = ['energy', 'valence', 'mood'];
// Row order for the shared panel body (Favorite added to TRACK_FIELDS' text rows).
const TRACK_PANEL_ROWS = [
  ['Status', 'type'], ['Source', 'source'], ['Favorite', 'fav'], ['Energy', 'energy'], ['Valence', 'valence'],
  ['Mood', 'mood'], ['Popularity', 'popularity'], ['Plays', 'plays'],
];

/* THE single source of the track-detail body markup, shared by both panels. The
   ids come from the panel (cellId/canvasId/…) so the now-playing column and the
   modal render byte-for-byte the same content; only the container skin (listClass)
   and the optional hero differ per context. */
function _isStreamUri(u) {
  return typeof u === 'string' && (/^https?:/.test(u) || u.startsWith('tunein:'));
}
// Radios: overlay the LIVE now-playing title/artist (from /api/radio_now_playing —
// FIP livemeta or ICY stream title) into the header, in place of the stream's own
// name/artist. Runs on every now-playing refresh so it follows song changes live.
let _radioLast = { title: null, artist: null, album: null, visual: null };
async function maybeShowRadioTitle(track) {
  if (!track || !_isStreamUri(track.uri)) { _radioLast = { title: null, artist: null, album: null, visual: null }; return; }
  try {
    const d = await fetch(API + '/radio_now_playing').then(r => r.json());
    if (!d || !d.playing || !d.title) return;
    const station = d.station || (track.name && !_isStreamUri(track.name) ? track.name : '');
    // Title line = song; next line starts with the STATION then the song artist.
    const artistLine = [station, d.artist].filter(Boolean).join(' · ');
    const albumLine  = d.album || '';
    // Only touch the DOM when a value actually changes → the title stays static
    // (no flicker) between refreshes and updates cleanly on each new song.
    if (d.title !== _radioLast.title) {
      const heroEl = document.getElementById('hero-title');
      const nameEl = document.getElementById('track-name');
      if (heroEl) heroEl.textContent = d.title;
      if (nameEl) nameEl.textContent = d.title;
      fitHeroTitle();
      _radioLast.title = d.title;
      // Keep the radio-adapted DETAILS panel's song in sync with the header.
      if (_isStreamUri(track.uri)) renderRadioDetails(d);
    }
    // Cover = the current song's artwork (livemeta visual), so the "logo" tracks
    // the song instead of a blank placeholder. Updated only when it changes.
    if (d.visual && d.visual !== _radioLast.visual) {
      try { setCoverSmooth(d.visual); } catch (e) {}
      _radioLast.visual = d.visual;
    }
    if (artistLine !== _radioLast.artist) {
      const artistEl = document.getElementById('artist-name');
      if (artistEl) { artistEl.textContent = artistLine; artistEl.classList.remove('obj-link'); }
      _radioLast.artist = artistLine;
    }
    if (albumLine !== _radioLast.album) {
      const albumEl = document.getElementById('album-name');
      if (albumEl) albumEl.textContent = albumLine;
      _radioLast.album = albumLine;
    }
  } catch (e) {}
}

function trackPanelBodyHTML(p, { hero, cover, name, artist, artistUri, album, albumUri } = {}) {
  // Artist and album are clickable when their uri is known (the #obj-body handler
  // opens them via data-artist-uri / data-album-uri). Shown as "artist · album".
  const link = (txt, attr) => `<span class="obj-link" ${attr}>${objEsc(txt)}</span>`;
  const artistHtml = artist ? (artistUri ? link(artist, `data-artist-uri="${objEsc(artistUri)}"`) : objEsc(artist)) : '';
  const albumHtml  = album  ? (albumUri  ? link(album,  `data-album-uri="${objEsc(albumUri)}" data-name="${objEsc(album)}"`) : objEsc(album)) : '';
  const sub = [artistHtml, albumHtml].filter(Boolean).join(' · ');
  const heroHtml = hero
    ? `<div class="obj-hero">${cover ? `<img class="obj-cover" src="${objEsc(cover)}" alt="">` : ''}`
      + `<div class="obj-meta"><b>${objEsc(name || '')}</b><span>${sub}</span></div></div>`
    : '';
  const rows = TRACK_PANEL_ROWS.map(([label, key]) => {
    const cls = key === 'fav' ? 'td-fav' : (EDITABLE_FIELDS.includes(key) ? 'tp-editable' : '');
    return `<div><dt>${label}</dt><dd id="${p.cellId(key)}"${cls ? ` class="${cls}"` : ''}>—</dd></div>`;
  }).join('');
  return heroHtml
    + `<dl class="${p.listClass}">${rows}</dl>`
    + `<div id="${p.lifecycleId}"></div>`
    + `<canvas id="${p.canvasId}" class="tp-matrix" title="Drag to set the track's mood (edit mode)"></canvas>`
    + `<div id="${p.playlistsId}" class="td-playlists"></div>`;
}

/* One panel instance. `cellId(kind)` maps 'energy' → the dd element id used by
   that panel; `body()` is the container it fills; `getUri()` is the shown track. */
function makeTrackPanel({ cellId, canvasId, playlistsId, lifecycleId, listClass, body, getUri }) {
  const p = {
    ev: null,                          // {energy, valence} shown by this panel
    favLocal: false, favSpotify: null, // per-panel favourite state (own uri)
    cellId, canvasId, playlistsId, lifecycleId, listClass, body, getUri,
    el:  kind => document.getElementById(cellId(kind)),
    favEl: () => document.getElementById(cellId('fav')),
    // Never clobber a cell that holds an open inline editor.
    set(kind, txt) {
      const el = p.el(kind);
      if (el && !el.querySelector('input,select')) el.textContent = txt;
    },
    canvas: () => document.getElementById(canvasId),
    draw() { drawMoodMatrix(p.canvas(), p.ev, TD_PAD); },
    // Build the shared body once, then populate cells + lifecycle + matrix + fav +
    // playlists and wire all interactions. Both panels go through this.
    render(info, opts = {}) {
      const host = p.body();
      if (!host) return;
      host.innerHTML = trackPanelBodyHTML(p, opts);
      TRACK_FIELDS.forEach(([, key, val]) => p.set(key, val(info)));
      const lc = document.getElementById(lifecycleId);
      if (lc) lc.innerHTML = lifecycleScaleHTML(info);
      p.seed(getUri(), info);
      p.rewire();
      p.favLocal = !!(info && info.liked); p.favSpotify = null;
      renderFav(p);
      const uri = getUri();
      if (uri && uri.startsWith('spotify:track:')) {
        fetch(API + '/track_saved?uri=' + encodeURIComponent(uri)).then(r => r.json())
          .then(d => { p.favSpotify = d.saved; renderFav(p); }).catch(() => {});
      }
      renderPlaylistEditor(editUnlocked ? uri : null, playlistsId);
    },
    // Re-attach handlers to an already-rendered body (fresh render OR nav restore).
    rewire() {
      initTrackPanelMatrix(p);
      wireTrackPanelEdits(p);
      const f = p.favEl();
      if (f && !f.dataset.wired) { f.dataset.wired = '1'; f.addEventListener('click', () => toggleFavorite(p)); }
    },
    // Seed the matrix dot: a pending manual edit for this uri wins over the
    // server values, so an in-flight drag is never clobbered by a refresh.
    seed(uri, info) {
      p.ev = matrixFeatures[uri] ? { ...matrixFeatures[uri] }
           : (info && info.energy != null && info.valence != null)
             ? { energy: info.energy, valence: info.valence } : null;
      p.draw();
    },
    async save(patch, okMsg) {
      const uri = getUri();
      if (!uri) return false;
      try {
        const r = await fetch(API + '/track_features', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.assign({ uri }, patch)),
        });
        if (r.status === 401) { setFeedback('Editing not authorized'); return false; }
        const d = await r.json().catch(() => ({}));
        if (d.error) { setFeedback('Save error'); return false; }
        setFeedback(okMsg || 'Saved');
        return d || true;
      } catch (e) { setFeedback('Save error'); return false; }
    },
    // Persist the current dot position and keep the big matrix in sync.
    async saveEV(okMsg) {
      const uri = getUri();
      if (!uri || !p.ev) return;
      const d = await p.save({ energy: p.ev.energy, valence: p.ev.valence }, okMsg);
      if (d) {
        matrixFeatures[uri] = { ...p.ev };
        if (d.mood) p.set('mood', d.mood);   // backend derives mood from e/v
      }
    },
  };
  return p;
}

/* Drag-to-set mood matrix — identical behaviour in both panels. */
function initTrackPanelMatrix(p) {
  const canvas = p.canvas();
  if (!canvas) return;
  let active = false;
  const apply = e => {
    p.ev = _matrixEVFromEvent(canvas, e, TD_PAD);
    p.set('energy',  fmtEV(p.ev.energy));
    p.set('valence', fmtEV(p.ev.valence));
    p.draw();
  };
  canvas.addEventListener('pointerdown', e => {
    if (!editUnlocked) { setFeedback('Enable editing first'); return; }
    active = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    apply(e);
  });
  canvas.addEventListener('pointermove', e => { if (active) { e.preventDefault(); apply(e); } });
  canvas.addEventListener('pointerup', () => {
    if (!active) return; active = false;
    if (editUnlocked) p.saveEV('Energy / valence saved');
  });
  new ResizeObserver(() => p.draw()).observe(canvas);
}

/* Click-to-edit an Energy/Valence cell (0–10) — identical in both panels. */
function editTrackPanelNumber(p, kind) {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!p.getUri()) return;
  const dd = p.el(kind);
  if (!dd || dd.querySelector('input')) return;
  const cur = p.ev ? p.ev[kind] : null;
  dd.innerHTML = '<input class="td-edit-input" type="number" min="0" max="10" step="1" value="'
    + (cur != null ? Math.round(cur * 10) : 5) + '">';
  const inp = dd.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    let v = parseInt(inp.value, 10);
    // Assign textContent directly here: it must replace the live input.
    if (isNaN(v)) { dd.textContent = fmtEV(cur); return; }
    v = Math.min(10, Math.max(0, v)) / 10;
    const base = p.ev || { energy: 0.5, valence: 0.5 };
    p.ev = { energy: kind === 'energy' ? v : base.energy,
             valence: kind === 'valence' ? v : base.valence };
    dd.textContent = fmtEV(v);
    p.set(kind === 'energy' ? 'valence' : 'energy',
          fmtEV(kind === 'energy' ? p.ev.valence : p.ev.energy));
    p.draw();
    await p.saveEV();
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    else if (e.key === 'Escape') { done = true; dd.textContent = fmtEV(cur); }
  });
}

/* Click-to-edit the Mood cell — identical in both panels. */
function editTrackPanelMood(p) {
  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  if (!p.getUri()) return;
  const dd = p.el('mood');
  if (!dd || dd.querySelector('select')) return;
  const cur = (dd.textContent || '').trim().toLowerCase();
  dd.innerHTML = '<select class="td-edit-select">'
    + MOOD_EDIT_OPTIONS.map(([v, l]) =>
        '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>').join('')
    + '</select>';
  const sel = dd.querySelector('select'); sel.focus();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    dd.textContent = sel.value || '—';   // direct → replaces the live select
    await p.save({ mood: sel.value });
  };
  sel.addEventListener('change', commit);
  sel.addEventListener('blur', commit);
}

/* Wire the three editable cells of a panel. */
function wireTrackPanelEdits(p) {
  p.el('energy')?.addEventListener('click',  () => editTrackPanelNumber(p, 'energy'));
  p.el('valence')?.addEventListener('click', () => editTrackPanelNumber(p, 'valence'));
  p.el('mood')?.addEventListener('click',    () => editTrackPanelMood(p));
}

// The two instances. The now-playing column follows the playing track; the modal
// follows whichever track was opened in it.
const tdPanel  = makeTrackPanel({ cellId: k => 'td-' + k, canvasId: 'td-matrix', playlistsId: 'td-playlists', lifecycleId: 'td-lifecycle', listClass: 'td-list', body: () => document.querySelector('#track-details .td-body'), getUri: () => matrixCurUri });
const objPanel = makeTrackPanel({ cellId: k => 'obj-td-' + k, canvasId: 'obj-tmatrix', playlistsId: 'obj-playlists', lifecycleId: 'obj-lifecycle', listClass: 'obj-dl', body: () => document.getElementById('obj-body'), getUri: () => objTMatrixUri });

// Desktop only: match the details column width to the (square) cover on the left.
// The cover's width = its height (aspect-ratio 1/1) = the top-zone height, so it
// isn't a CSS-referenceable value → sync it here. Widening details doesn't change
// its own height (rows fixed, matrix capped at 200px), so the top-zone height and
// thus the cover width stay put — no feedback loop.
function syncDetailsWidth() {
  const cover = document.getElementById('cover-wrap');
  const details = document.getElementById('track-details');
  if (!cover || !details) return;
  // overprint/invert use a CSS grid (width driven by grid-template-columns) — leave them.
  const theme = document.documentElement.getAttribute('data-theme');
  if (theme === 'overprint' || theme === 'invert' || !window.matchMedia('(min-width: 700px)').matches) {
    details.style.flex = ''; return;
  }
  const w = cover.offsetWidth;
  if (w > 0) details.style.flex = '0 0 ' + w + 'px';
}

// Radio-adapted DETAILS: a stream isn't a library track, so show the station +
// current song + Source=Radio, and DROP the lifecycle fields (status/plays/energy/
// library scale) which don't apply. `d` = /api/radio_now_playing payload.
function renderRadioDetails(d) {
  const host = tdPanel.body();
  if (!host) return;
  const rows = [];
  // Distinct rows (song / artist / album) — clearer than a combined line.
  if (d && d.title)   rows.push(['Song', d.title]);
  if (d && d.artist)  rows.push(['Artist', d.artist]);
  if (d && d.album)   rows.push(['Album', d.album]);
  if (d && d.station) rows.push(['Station', d.station]);
  rows.push(['Source', 'Radio']);
  // + manual Favorite + Playlists on the resolved current song, so the user can
  // trigger the attach by hand (same controls as a normal track).
  host.innerHTML = '<dl class="td-list">'
    + rows.map(([l, v]) => `<div><dt>${objEsc(l)}</dt><dd>${objEsc(v)}</dd></div>`).join('')
    + `<div><dt>Favorite</dt><dd class="td-fav" id="radio-fav">${ICON.heart(false)}</dd></div>`
    + `<div><dt>Playlists</dt><dd id="radio-playlists"></dd></div>`
    + '</dl>';
  tdPanel.ev = null;
  if (!d || !d.title) return;
  wireRadioActions();
}

// Resolve the current radio song → Spotify track, then wire the manual Favorite
// heart + playlist picker onto it (both hit the same endpoints as normal tracks).
async function wireRadioActions() {
  const favEl = document.getElementById('radio-fav');
  let uri = null;
  try { uri = ((await fetch(API + '/radio_resolve').then(r => r.json())) || {}).uri; } catch (e) {}
  if (!uri) { if (favEl) favEl.title = 'No Spotify match for this song'; return; }
  if (favEl) {
    let saved = false;
    try { saved = !!(((await fetch(API + '/track_saved?uri=' + encodeURIComponent(uri)).then(r => r.json())) || {}).saved); } catch (e) {}
    favEl.innerHTML = ICON.heart(saved);
    favEl.classList.toggle('on', saved);
    favEl.title = editUnlocked ? 'Click to toggle favorite' : 'Enable editing to favorite';
    favEl.addEventListener('click', async () => {
      if (!editUnlocked) { setFeedback('Enable editing first'); return; }
      const on = !favEl.classList.contains('on');
      await setTrackFavorite(uri, on);
      favEl.classList.toggle('on', on);
      favEl.innerHTML = ICON.heart(on);
    });
  }
  renderPlaylistEditor(uri, 'radio-playlists');   // no-op unless editing is unlocked
}

async function renderTrackDetails(uri) {
  const host = tdPanel.body();
  if (!uri) { if (host) host.innerHTML = ''; detailsUri = null; tdPanel.ev = null; return; }
  // Radios: render the radio-context panel instead of the (meaningless) stream stats.
  if (_isStreamUri(uri)) {
    detailsUri = uri;
    try {
      const d = await fetch(API + '/radio_now_playing').then(r => r.json());
      renderRadioDetails(d);
    } catch (e) { renderRadioDetails(null); }
    requestAnimationFrame(syncDetailsWidth);
    return;
  }
  try {
    const info = await fetch(API + '/track_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    detailsUri = uri;
    tdPanel.render(info, { hero: false });   // hero off: the now-playing cover is already up top
    requestAnimationFrame(syncDetailsWidth);
  } catch (e) { if (host) host.innerHTML = ''; }
}

  if (!editUnlocked) { setFeedback('Enable editing first'); return; }
  const uri = p.getUri();
  if (!uri) return;
  const next = !p.favEl()?.classList.contains('on');
  try {
    const r = await fetch(API + '/track_favorite', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ uri, favorite: next })
    });
    if (r.status === 401) { setFeedback('Editing not authorized'); return; }
    const d = await r.json();
    if ('liked_local' in d) p.favLocal = d.liked_local;
    if ('liked_spotify' in d) p.favSpotify = d.liked_spotify;
    else if (!uri.startsWith('spotify:track:')) p.favSpotify = null;
    renderFav(p);
    setFeedback(next ? 'Added to favorites' : 'Removed from favorites');
  } catch (e) { setFeedback('Favorite error'); }

function startEditAuth() {

/* ── MATRIX energy × valence ── */
const PAD = 28;
const MX_FONT = 'Archivo, system-ui, sans-serif';
let matrixFeatures = {};   // uri → {energy, valence}
let matrixTlItems  = [];   // [{uri, tlid}]
let matrixCurUri   = null;
let matrixMode     = 'move'; // 'move' | 'resize'

/* Couleurs lues depuis les variables CSS du thème courant */
let themeColors = {};
function readThemeColors() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  themeColors = {
    bg: g('--mx-bg'),
    qCalm: g('--mx-q-calm'), qHappy: g('--mx-q-happy'),
    qDark: g('--mx-q-dark'), qEnergetic: g('--mx-q-energetic'),
    line: g('--mx-line'), border: g('--mx-border'),
    label: g('--mx-label'), axis: g('--mx-axis'),
    dlFill: g('--mx-dl-fill'), dlStroke: g('--mx-dl-stroke'),
    dotCore: g('--mx-dot-core') || '#fff', pulse: g('--mx-pulse') || '255,255,255',
    happy: g('--mood-happy'), energetic: g('--mood-energetic'),
    calm: g('--mood-calm'), dark: g('--mood-dark'),
  };
}

function moodColor(e, v, a = 1) {
  let t;
  if (e > 0.5 && v > 0.5) t = themeColors.happy;      // happy
  else if (e > 0.5)        t = themeColors.energetic;  // energetic
  else if (v > 0.5)        t = themeColors.calm;       // calm
  else                     t = themeColors.dark;       // dark
  return `rgba(${t || '120,120,120'},${a})`;
}

/* Theme's dominant accent color (orange), used only for the currently-playing dot */
function accentColor(a = 1) {
  return `rgba(${themeColors.pulse || '255,90,0'},${a})`;
}

/* Greyscale by popularity: darker = more popular, lighter = less popular */
function popularityColor(p) {
  if (p == null) return 'rgba(150,150,150,.5)';
  const light = Math.round(85 - 65 * Math.max(0, Math.min(1, p)));
  return `hsl(0,0%,${light}%)`;
}

function initMatrix() {
  const canvas = document.getElementById('mood-matrix');
  const dpr    = window.devicePixelRatio || 1;

  function resizeCanvas() {
    const w = canvas.offsetWidth;
    canvas.width  = w * dpr;
    canvas.height = w * dpr;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(canvas);

  /* Touch-friendly gesture routing (phone): the canvas is touch-action:pan-y, so a
     vertical swipe scrolls the page. We CLAIM the gesture (preventDefault on a
     non-passive touchstart) only when it starts on the handle, the dl ring, or the
     draggable track point — those drags control the matrix even vertically.
     Touch-drags elsewhere scroll; a tap elsewhere still sets the target (applied on
     pointerup so an aborted scroll never accidentally moves the mood). */
  function matrixShouldClaimTouch(canvas, pt) {
    const rect  = canvas.getBoundingClientRect();
    const inner = rect.width - 2 * PAD;
    const tx = rect.left + PAD + appState.energy * inner;
    const ty = rect.top  + PAD + (1 - appState.valence) * inner;
    if (Math.hypot(pt.clientX - tx, pt.clientY - ty) < 28) return true;          // handle
    const r = (appState.dl / 20 + 0.05) * inner;
    if (Math.abs(Math.hypot(pt.clientX - tx, pt.clientY - ty) - r) < 18) return true;  // ring
    if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {          // track point
      const f = matrixFeatures[matrixCurUri];
      const cx = rect.left + PAD + f.energy * inner;
      const cy = rect.top  + PAD + (1 - f.valence) * inner;
      if (Math.hypot(pt.clientX - cx, pt.clientY - cy) < 28) return true;
    }
    return false;
  }
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t && matrixShouldClaimTouch(canvas, t)) e.preventDefault();
  }, { passive: false });

  let matrixDeferred = null;   // touch started off-handle: apply only if it ends as a tap
  canvas.addEventListener('pointerdown', e => {
    matrixMode = detectMatrixMode(canvas, e);
    if (e.pointerType === 'touch' && !matrixShouldClaimTouch(canvas, e)) {
      matrixDeferred = { x: e.clientX, y: e.clientY, mode: matrixMode };
      return;   // may become a page scroll — don't move the target yet
    }
    matrixDeferred = null;
    canvas.setPointerCapture(e.pointerId);
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointermove', e => {
    if (!e.buttons) {
      const mode = detectMatrixMode(canvas, e);
      canvas.classList.toggle('cursor-resize', mode === 'resize');
      showMatrixTooltip(canvas, e);
      return;
    }
    if (matrixDeferred) return;   // pending tap-or-scroll: let the browser decide
    e.preventDefault();
    if (matrixMode === 'resize') matrixResize(canvas, e);
    else if (matrixMode === 'edittrack') matrixEditTrack(canvas, e);
    else matrixMove(canvas, e);
  });
  canvas.addEventListener('pointerup', e => {
    if (matrixDeferred) {
      const tap = Math.hypot(e.clientX - matrixDeferred.x, e.clientY - matrixDeferred.y) < 12;
      const mode = matrixDeferred.mode; matrixDeferred = null;
      if (!tap) return;   // it was a swipe the browser turned into a scroll
      matrixMode = mode;
      if (mode === 'edittrack') { matrixEditTrack(canvas, e); saveCurrentTrackFeatures(); matrixMode = 'move'; }
      else { matrixMove(canvas, e); scheduleApply(); }
      return;
    }
    if (matrixMode === 'edittrack') { saveCurrentTrackFeatures(); matrixMode = 'move'; }
    else scheduleApply();
  });
  canvas.addEventListener('pointercancel', () => { matrixDeferred = null; });
  canvas.addEventListener('pointerleave', () => hideMatrixTooltip());

  requestAnimationFrame(drawMatrix);
}

function detectMatrixMode(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  // Mode édition : priorité au point du morceau courant (draggable)
  if (editUnlocked && matrixCurUri && matrixFeatures[matrixCurUri]) {
    const f = matrixFeatures[matrixCurUri];
    const cx = rect.left + PAD + f.energy * inner;
    const cy = rect.top  + PAD + (1 - f.valence) * inner;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 16) return 'edittrack';
  }
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const r  = (appState.dl / 20 + 0.05) * inner;
  const dist = Math.hypot(e.clientX - tx, e.clientY - ty);
  const HANDLE = 14;
  if (Math.abs(dist - r) < HANDLE) return 'resize';
  // Edit mode + current track has no energy/valence yet → click the matrix to set them.
  if (editUnlocked && matrixCurUri && !matrixFeatures[matrixCurUri]) return 'edittrack';
  return 'move';
}

function matrixMove(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  appState.energy  = energy;
  appState.valence = valence;
  setDial('energy', energy);
  setDial('valence', valence);
}

function matrixEditTrack(canvas, e) {
  if (!matrixCurUri) return;
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const energy  = Math.min(1, Math.max(0, (e.clientX - rect.left - PAD) / inner));
  const valence = Math.min(1, Math.max(0, 1 - (e.clientY - rect.top  - PAD) / inner));
  matrixFeatures[matrixCurUri] = { energy, valence };
  const set = (id, x) => { const el = document.getElementById(id); if (el) el.textContent = Math.round(x * 10) + '/10'; };
  set('td-energy', energy); set('td-valence', valence);
}

/* ── Per-track mood matrix (in the track-details panel) ──
   Shows the details track's energy/valence as a draggable dot; dragging (in edit
   mode) repositions it and saves to /api/track_features. The state and the drag
   handling live on the shared panel object (see makeTrackPanel /
   initTrackPanelMatrix); only the pure renderer below is standalone. */
const TD_PAD = 10;
// Pure renderer: draws the energy(X)/valence(Y) quadrant matrix onto `canvas`,
// with an optional {energy,valence} dot. Shared by the details panel and the
// modal track view so every mood matrix looks and behaves identically.
function drawMoodMatrix(canvas, ev, pad) {
  if (!canvas) return;
  pad = pad || 10;
  const cssW = canvas.offsetWidth;
  if (cssW <= 0) return;                       // panel hidden / not laid out
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr)) { canvas.width = Math.round(cssW * dpr); canvas.height = canvas.width; }
  const ctx = canvas.getContext('2d');
  const W = canvas.width / dpr, inner = W - 2 * pad;
  const mx = pad + inner / 2, my = pad + inner / 2;
  ctx.save(); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, W);
  [[pad, pad, themeColors.qCalm], [mx, pad, themeColors.qHappy],
   [pad, my, themeColors.qDark], [mx, my, themeColors.qEnergetic]]
    .forEach(([x, y, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, inner / 2, inner / 2); });
  ctx.strokeStyle = themeColors.line; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(mx, pad); ctx.lineTo(mx, pad + inner);
  ctx.moveTo(pad, my); ctx.lineTo(pad + inner, my); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = themeColors.border; ctx.strokeRect(pad, pad, inner, inner);
  ctx.fillStyle = themeColors.label; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.font = '700 9px ' + MX_FONT;
  ctx.fillText('CALM', pad + inner * 0.25, pad + inner * 0.1);
  ctx.fillText('HAPPY', pad + inner * 0.75, pad + inner * 0.1);
  ctx.fillText('INTENSE', pad + inner * 0.25, pad + inner * 0.9);
  ctx.fillText('ENERGETIC', pad + inner * 0.75, pad + inner * 0.9);
  if (ev) {
    const x = pad + ev.energy * inner, y = pad + (1 - ev.valence) * inner;
    const col = moodColor(ev.energy, ev.valence, 1);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = themeColors.dotCore; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  } else {
    ctx.fillStyle = themeColors.axis; ctx.font = '10px ' + MX_FONT;
    ctx.fillText(editUnlocked ? 'tap to set' : 'no mood data', mx, my);
  }
  ctx.restore();
}
// Map a pointer/touch event to an {energy,valence} position inside `canvas`.
function _matrixEVFromEvent(canvas, e, pad) {
  pad = pad || 10;
  const rect = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * pad;
  const px = (e.touches ? e.touches[0].clientX : e.clientX);
  const py = (e.touches ? e.touches[0].clientY : e.clientY);
  return {
    energy:  Math.min(1, Math.max(0, (px - rect.left - pad) / inner)),
    valence: Math.min(1, Math.max(0, 1 - (py - rect.top - pad) / inner)),
  };
}
// Thin aliases kept for the now-playing panel's call sites.
function initTdMatrix() { initTrackPanelMatrix(tdPanel); }

/* ── Modal track view (obj-panel) — the track "See details" sheet.
   Lives in the shared object modal so it inherits the ◂ ▸ nav bar and the same
   height as album/artist/box; and — unlike the now-playing #track-details panel —
   it is never overwritten by the now-playing refresh (no more value reset). */
/* Read-only lifecycle scale: where the track sits on
   trash|hidden > new > incoming > library > favorites. trash/hidden are the
   "excluded" zone (muted dot) before a | divider; new→favorites is the forward
   progression (accent dot + fill). Podcast/info/unknown → no scale. */
const LC_STAGES = [
  ['trash', 'Trash', true], ['hidden', 'Hidden', true],
  ['new', 'New', false], ['incoming', 'Incoming', false],
  ['library', 'Library', false], ['favorites', 'Favorites', false],
];
// Generic stop-scale renderer. stages = [[key,label,excl?]…]; dot centres at
// (i+0.5)/n → the line/fill/divider are positioned against those centres inline
// (so it works for any stop count). No caption.
function _scaleHTML(stages, idx, divAfter) {
  const n = stages.length;
  const centre = i => (i + 0.5) / n * 100;
  const edge = centre(0);
  const excl = !!(stages[idx] && stages[idx][2]);
  const sep = (divAfter != null && divAfter >= 0 && divAfter < n - 1)
    ? `<div class="lc-sep" style="left:${(centre(divAfter) + centre(divAfter + 1)) / 2}%"></div>` : '';
  const stops = stages.map((s, i) =>
    `<div class="lc-stop${s[2] ? ' excl' : ''}${i === idx ? ' current' : ''}">`
    + `<span class="lc-dot"></span><span class="lc-lab">${s[1]}</span></div>`).join('');
  return `<div class="lc-scale"><div class="lc-track">
    <div class="lc-line" style="left:${edge}%;right:${edge}%"></div>
    <div class="lc-line-fill${excl ? ' excl' : ''}" style="left:${edge}%;width:${centre(idx) - edge}%"></div>
    ${sep}<div class="lc-stops">${stops}</div>
  </div></div>`;
}
function lifecycleScaleHTML(info) {
  const ot = info && info.option_type;
  // Podcast/info = consume-once → listening progress, not the affinity ladder.
  if (ot === 'podcast' || ot === 'info') {
    const done = (info.read_count_end || 0) >= 1;
    const started = !done && (info.read_end || 0) > 0.02;
    return _scaleHTML([['unplayed', 'Unplayed'], ['progress', 'In progress'], ['finished', 'Finished']],
      done ? 2 : (started ? 1 : 0));
  }
  const idx = LC_STAGES.findIndex(s => s[0] === ot);
  if (idx < 0) return '';   // unknown type → no scale
  return _scaleHTML(LC_STAGES, idx, 1);   // divider after hidden (index 1)
}

/* ── Inline editing of the current track's energy / valence / mood (edit mode) ── */
const MOOD_EDIT_OPTIONS = [['calm','Calm'],['energetic','Energetic'],['dark','Intense'],['happy','Happy']];

/* The now-playing panel's editors are the shared implementations, bound to its
   panel instance. */
function editTrackNumber(kind) { editTrackPanelNumber(tdPanel, kind); }
function editTrackMood() { editTrackPanelMood(tdPanel); }

function matrixResize(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const tx = rect.left + PAD + appState.energy * inner;
  const ty = rect.top  + PAD + (1 - appState.valence) * inner;
  const radius01 = Math.hypot(e.clientX - tx, e.clientY - ty) / inner;
  const dl = Math.min(10, Math.max(0, Math.round((radius01 - 0.05) * 20)));
  appState.dl = dl;
  setDial('dl', dl / 10);
}

function drawMatrix(ts) {
  requestAnimationFrame(drawMatrix);
  const canvas = document.getElementById('mood-matrix');
  if (!canvas) return;

  const dpr   = window.devicePixelRatio || 1;
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const inner = W - 2 * PAD;
  if (inner <= 0) return;   // canvas pas encore dimensionné / panneau replié → on saute la frame
  const ctx   = canvas.getContext('2d');

  const ex = e => PAD + e * inner;
  const vy = v => PAD + (1 - v) * inner;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  /* Background */
  ctx.fillStyle = themeColors.bg || '#0b1829';
  ctx.fillRect(0, 0, W, H);

  const mx = PAD + inner / 2, my = PAD + inner / 2;

  /* Quadrant fills */
  [
    [PAD, PAD, inner/2, inner/2, themeColors.qCalm],      // calm      top-left
    [mx,  PAD, inner/2, inner/2, themeColors.qHappy],     // happy     top-right
    [PAD, my,  inner/2, inner/2, themeColors.qDark],      // dark      bottom-left
    [mx,  my,  inner/2, inner/2, themeColors.qEnergetic], // energetic bottom-right
  ].forEach(([x, y, w, h, c]) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); });

  /* Center lines */
  ctx.strokeStyle = themeColors.line; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(mx, PAD); ctx.lineTo(mx, PAD + inner);
  ctx.moveTo(PAD, my); ctx.lineTo(PAD + inner, my);
  ctx.stroke(); ctx.setLineDash([]);

  /* Inner border */
  ctx.strokeStyle = themeColors.border; ctx.lineWidth = 1;
  ctx.strokeRect(PAD, PAD, inner, inner);

  /* Quadrant names — big watermark centered in each quadrant, sized so the text
     spans ~50% of the quadrant's width (each word gets its own font size to match). */
  const qW = inner / 2, targetW = qW * 0.5;
  ctx.save();
  ctx.fillStyle = themeColors.label; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  // Size fixed once from the top-left word (CALM) and reused for all 4, so every
  // quadrant name renders at the same font size (no per-word rescaling).
  ctx.font = '800 40px ' + MX_FONT;
  const qFontSize = Math.round(40 * targetW / ctx.measureText('CALM').width);
  ctx.font = `800 ${qFontSize}px ` + MX_FONT;
  [
    ['CALM',      PAD + inner * 0.25, PAD + inner * 0.25],
    ['HAPPY',     PAD + inner * 0.75, PAD + inner * 0.25],
    ['INTENSE',   PAD + inner * 0.25, PAD + inner * 0.75],
    ['ENERGETIC', PAD + inner * 0.75, PAD + inner * 0.75],
  ].forEach(([text, cx, cy]) => ctx.fillText(text, cx, cy));
  ctx.restore();

  /* Axis labels */
  ctx.font = '11px ' + MX_FONT; ctx.fillStyle = themeColors.axis;
  ctx.textAlign = 'left';   ctx.fillText('◀ Calm',  2, my + 4);
  ctx.textAlign = 'right';  ctx.fillText('Rapid ▶', W - 2, my + 4);
  ctx.textAlign = 'center';
  ctx.fillText('▲ Bright', mx, 12);
  ctx.fillText('▼ Dark',   mx, PAD + inner + PAD - 2);

  /* Tracklist dots — color correlated to popularity (darker = more popular) */
  matrixTlItems.forEach(({ uri, tlid }) => {
    const f = matrixFeatures[uri];
    if (!f || tlid === currentTlid) return;
    ctx.beginPath();
    ctx.arc(ex(f.energy), vy(f.valence), 3, 0, Math.PI * 2);
    ctx.fillStyle = popularityColor(f.popularity);
    ctx.fill();
  });

  /* Currently playing — blinking dot in the theme's accent color */
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const cx = ex(curF.energy), cy = vy(curF.valence);
    const pulse = (Math.sin(ts / 450) + 1) / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 9 + pulse * 6, 0, Math.PI * 2);
    ctx.strokeStyle = accentColor(0.28 * (1 - pulse));
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2);
    ctx.fillStyle = accentColor(0.45 + 0.55 * pulse);
    ctx.fill();
    ctx.strokeStyle = accentColor(1);
    ctx.lineWidth = 2.5; ctx.stroke();
  }

  /* DL area — dashed circle */
  const { energy, valence, dl } = appState;
  const r  = (dl / 20 + 0.05) * inner;
  const tx = ex(energy), ty = vy(valence);
  ctx.save();
  ctx.beginPath(); ctx.rect(PAD, PAD, inner, inner); ctx.clip();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dlFill; ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
  ctx.strokeStyle = themeColors.dlStroke; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  /* Target dot */
  ctx.beginPath(); ctx.arc(tx, ty, 11, 0, Math.PI * 2);
  ctx.fillStyle = themeColors.dotCore; ctx.fill();
  ctx.strokeStyle = moodColor(energy, valence, 1); ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2);
  ctx.fillStyle = moodColor(energy, valence, 1); ctx.fill();

  ctx.restore();
}

function showMatrixTooltip(canvas, e) {
  const rect  = canvas.getBoundingClientRect();
  const inner = rect.width - 2 * PAD;
  const HIT   = 10; // px hit radius

  // Build candidate list: tracklist dots + currently playing
  const candidates = matrixTlItems.map(item => {
    const f = matrixFeatures[item.uri];
    if (!f) return null;
    const sx = rect.left + PAD + f.energy * inner;
    const sy = rect.top  + PAD + (1 - f.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    return d < HIT ? { item, f, d } : null;
  }).filter(Boolean);

  // Also check currently playing
  const curF = matrixFeatures[matrixCurUri];
  if (curF) {
    const sx = rect.left + PAD + curF.energy * inner;
    const sy = rect.top  + PAD + (1 - curF.valence) * inner;
    const d  = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (d < HIT + 4) {
      const curItem = matrixTlItems.find(i => i.uri === matrixCurUri);
      candidates.push({ item: curItem || { name: '♪ Playing', artist: '' }, f: curF, d });
    }
  }

  if (!candidates.length) { hideMatrixTooltip(); return; }

  // Pick closest
  candidates.sort((a, b) => a.d - b.d);
  const { item, f } = candidates[0];

  const tip = document.getElementById('matrix-tooltip');
  tip.querySelector('.tt-name').textContent   = item?.name   || '?';
  tip.querySelector('.tt-artist').textContent = item?.artist || '';
  tip.querySelector('.tt-ev').innerHTML =
    `<span>${ICON.zap} ${f.energy.toFixed(2)}</span><span>${ICON.sun} ${f.valence.toFixed(2)}</span>`;

  // Position: prefer right of dot, flip if near right edge
  const TX = 14, TY = -8;
  let left = e.clientX + TX;
  let top  = e.clientY + TY;
  tip.style.display = 'block';
  const tw = tip.offsetWidth;
  if (left + tw > window.innerWidth - 8) left = e.clientX - tw - TX;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}

function hideMatrixTooltip() {
  document.getElementById('matrix-tooltip').style.display = 'none';
}

/* ── Boxes panel ── */
/* ════════════ Object detail overlay (album · artist · box) ════════════
   Read-only for now. Opens over the lower area; edit affordances come later.
   Album/artist detail is sourced from mopidy RPC (browse/lookup/get_images);
   box detail from the O2M API (/box_info). */
let currentTrackObj = null;

/* ── Back gesture closes modals (history-based) ──
   Opening a modal pushes one history entry; the Android back swipe/button pops it
   and we close the modal instead of leaving the app. Closing through the UI
   (X / backdrop / Escape) consumes our entry with history.back() so the history
   stack stays balanced. */
let _modalPop = null;        // tag of the history entry we pushed ('obj' | 'details')
let _consumingModal = false; // our own history.back() consuming a modal entry
function modalHistoryPush(tag) {
  if (_modalPop) return;   // one modal entry at a time is enough
  _modalPop = tag;
  try { history.pushState({ o2mModal: tag }, ''); } catch (e) {}
}
function modalHistoryConsume(tag) {
  if (_modalPop !== tag) return;
  _modalPop = null;
  _consumingModal = true;
  try { history.back(); } catch (e) { _consumingModal = false; }
}
/* Root back-trap: O2M is a music player — an accidental back swipe used to kill
   the app AND the audio (the phone is the Snapcast speaker). Keep a sentinel
   history entry armed under the modal entries so a back gesture with no modal
   open is swallowed (re-armed) instead of exiting. Leaving the app is done with
   the Home/recents gesture, like any fullscreen player. */
function armBackTrap() {
  const s = history.state || {};
  if (s.o2mTrap || s.o2mModal) return;   // already armed (or a modal is on top)
  try { history.pushState({ o2mTrap: true }, ''); } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (_consumingModal) { _consumingModal = false; return; }  // balanced UI close
  const tag = _modalPop;
  if (tag) {               // back gesture with a modal open → close the modal
    _modalPop = null;
    if (tag === 'obj') closeObjPanel(true);
    else if (tag === 'details') document.body.classList.remove('details-open');
    return;
  }
  // Back gesture at app root → swallow it and stay alive.
  armBackTrap();
  setFeedback('Use the Home gesture to leave O2M');
});
armBackTrap();

/* Reopening the app after it was backgrounded/closed can restore a frozen
   bfcache copy (dead WebSockets, suspended audio, stale UI stuck on the splash).
   A persisted pageshow means exactly that → force a clean reload. */
window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });
window.addEventListener('resize', () => { try { syncDetailsWidth(); } catch (e) {} });

function openObjPanel() {
  if (!document.body.classList.contains('obj-open')) modalHistoryPush('obj');
  document.body.classList.add('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'false');
}
function closeObjPanel(fromPop) {
  objClearNav();
  document.body.classList.remove('obj-open');
  document.getElementById('obj-panel')?.setAttribute('aria-hidden', 'true');
  if (fromPop !== true) modalHistoryConsume('obj');   // UI close → consume our entry
}
function objSetHead(kind, title, sub) {
  document.getElementById('obj-kind').textContent  = kind;
  document.getElementById('obj-title').textContent = title || '—';
  document.getElementById('obj-sub').textContent   = sub || '';
  // Search views get an editable query field in the header (refine without closing).
  // Centralised here so it also re-applies when a search view is restored via ◂ ▸.
  const searchMode = (kind === 'Search');
  document.getElementById('obj-panel')?.classList.toggle('search-mode', searchMode);
  // Views whose body already shows the name in a hero card → hide the redundant
  // header title/sub (kept in the DOM for snapshots + search-input seeding).
  document.getElementById('obj-panel')?.classList.toggle('hero-head',
    ['Artist', 'Album', 'Playlist', 'Podcast', 'Track'].includes(kind));
  const si = document.getElementById('obj-search-input');
  if (si && searchMode && document.activeElement !== si) si.value = title || '';
}
function objBody()  { return document.getElementById('obj-body'); }
function objLoading(msg) { objBody().innerHTML = `<div class="obj-loading">${msg || 'Loading…'}</div>`; }

/* ── Modal navigation history (prev/next within the object modal) ──
   Search → open an artist → Back returns to the search results; Forward returns
   to the artist. Snapshots the rendered view (head + body + action state) so
   navigation is instant and never re-fetches. Two-stack browser model. */
const _objBack = [], _objFwd = [];
let _objRestoring = false;
function _objSnap() {
  // Banking the box editor away → keep its unsaved form edits in _boxEditInfo
  // (the snapshot only stores innerHTML; typed values don't survive a restore).
  if (document.getElementById('bx-editor-host') && !document.getElementById('bx-wizard')) _bxCaptureEditorFields();
  return {
    kind:  document.getElementById('obj-kind').textContent,
    title: document.getElementById('obj-title').textContent,
    sub:   document.getElementById('obj-sub').textContent,
    html:  objBody().innerHTML,
    playUris: objCurrentPlayUris.slice(),
    ownUri: objCurrentUri,
  };
}
function _objApply(s) {
  _objRestoring = true;
  objSetHead(s.kind, s.title, s.sub);
  objBody().innerHTML = s.html;
  objSetActionUris(s.playUris, s.ownUri);
  _objRestoring = false;
  _objUpdateNav();
  // A restored track view carries an inert body (innerHTML only) → re-wire it.
  if (document.getElementById('obj-tmatrix')) {
    objTMatrixUri = s.ownUri;
    if (matrixFeatures[s.ownUri]) objPanel.ev = { ...matrixFeatures[s.ownUri] };
    objPanel.rewire();
    renderPlaylistEditor(editUnlocked ? s.ownUri : null, 'obj-playlists');
    requestAnimationFrame(() => objPanel.draw());
  }
  // Same for a restored wizard or box-editor view: re-render from live state
  // (draft / edit info) so the buttons work and unsaved content is kept.
  else if (document.getElementById('bx-wizard')) {
    if (_boxDraft) renderWizardStep();
  }
  else if (document.getElementById('bx-editor-host')) {
    const uid = (s.ownUri || '').startsWith('box:') ? s.ownUri.slice(4) : null;
    if (_boxEditInfo && uid === _boxEditInfo.uid) {
      _bxHost = 'editor';
      objBody().innerHTML = renderBoxEditor(_boxEditInfo);
      wireBoxEditor(_boxEditInfo);
    } else if (uid) {
      openBox(uid);   // a different box was edited since → reload this one fresh
    }
  }
}
function _objUpdateNav() {
  // The wizard drives its own sequence with Back/Next at the bottom; the modal's
  // ◂ ▸ (which jump between *views*, not steps) would contradict it, so they are
  // hidden for as long as a wizard is on screen.
  const inWizard = !!document.getElementById('bx-wizard');
  document.getElementById('obj-prev')?.classList.toggle('hide', inWizard || _objBack.length === 0);
  document.getElementById('obj-next')?.classList.toggle('hide', inWizard || _objFwd.length === 0);
}
// Called at the top of each fresh modal navigation: bank the outgoing view.
function objNavTo() {
  if (_objRestoring) return;
  if (document.body.classList.contains('obj-open')
      && objBody().innerHTML.trim()
      && !objBody().querySelector('.obj-loading')) {
    _objBack.push(_objSnap());
    _objFwd.length = 0;
  }
  _objUpdateNav();
}
function objBackNav() { if (_objBack.length) { _objFwd.push(_objSnap()); _objApply(_objBack.pop()); } }
function objFwdNav()  { if (_objFwd.length)  { _objBack.push(_objSnap()); _objApply(_objFwd.pop()); } }
function objClearNav() { _objBack.length = 0; _objFwd.length = 0; _objUpdateNav(); }
const objEsc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function objCover(uri) {
  try {
    const r = await rpc('core.library.get_images', {uris: [uri]});
    const imgs = r?.result?.[uri] || [];
    const best = imgs.sort((a, b) => (b.width || 0) - (a.width || 0))[0];
    return best ? imageUrl(best.uri || best) : '';
  } catch(e) { return ''; }
}

// Track list (album/artist) — same row pattern as the tracklist (.tl-item). The
// row is NOT click-to-play (that was ambiguous): all actions are explicit and
// labelled behind the info badge (Play next / Play now).
function objRenderTracks(tracks, kind = '', placeholder = false) {
  if (!tracks.length) return '<div class="obj-empty">No tracks.</div>';
  return '<div class="obj-tracks">' + tracks.map((t, i) => {
    // Per-track O2M cache fields (status/mood/energy/local) → compact meta line.
    const meta = [];
    if (t.option_type) meta.push(objEsc(t.option_type));
    if (t.energy != null)  meta.push(ICON.zap + ' ' + Number(t.energy).toFixed(1));
    if (t.valence != null) meta.push(ICON.sun + ' ' + Number(t.valence).toFixed(1));
    if (t.mood) meta.push(objEsc(t.mood));
    if (t.local) meta.push('local');
    const statusCls = t.option_type ? ('s-' + objEsc(t.option_type)) : '';
    const statusHtml = meta.length ? `<div class="tl-status ${statusCls}">${meta.join(' · ')}</div>` : '';
    const inner = trackRowInnerHTML({
      indexLabel: String(i + 1).padStart(2, '0'),
      name: t.name,
      artist: (t.artists || []).map(a => a.name).join(', '),
      artistUri: (t.artists || [])[0]?.uri || '',
      uri: t.uri,
      durText: t.length ? msToMin(t.length) : '',
      statusHtml,
      kind,
      // In search results (placeholder=true) fall back to a reserve cover instead
      // of the index; album/artist track lists keep the meaningful track number.
      image: t.image || (placeholder ? placeholderForUri(t.uri) : ''),
    });
    // obj-openable → clicking the row (not the + / artist link) opens the track detail.
    return `<div class="tl-item obj-openable" data-uri="${objEsc(t.uri)}" data-kind="${objEsc(kind || 'track')}">${inner}</div>`;
  }).join('') + '</div>';
}

/* Frontend memo cache — the overlay refetches via RPC on each open even though
   mopidy-spotify already caches the web responses (images in a permanent dict,
   album/artist/track metadata via an etag/Cache-Control response cache). Caching
   the rendered result here makes reopening the same object instant. */
const OBJ_TTL = 10 * 60 * 1000;
const objCache = new Map();
function objShowCached(key) {
  const c = objCache.get(key);
  if (c && (Date.now() - c.ts) < OBJ_TTL) {
    objSetHead(c.kind, c.title, c.sub); objBody().innerHTML = c.html; return true;
  }
  return false;
}
function objStore(key, kind, title, sub) {
  objCache.set(key, { kind, title, sub, html: objBody().innerHTML, ts: Date.now() });
}

// Small tag showing where the content came from (O2M DB cache vs live Spotify).
function objSourceTag(source) {
  return `<span class="obj-src obj-src-${source}">${source === 'db' ? 'from cache' : 'live'}</span>`;
}

function renderArtist(uri, { name = 'Artist', image = '', genres = [], tracks = [], albums = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Artist', name, '');
  const coverHtml = image ? `<img class="obj-cover" src="${objEsc(image)}" alt="">` : '';
  const genreLine = genres.length ? `<span>${genres.slice(0, 6).map(objEsc).join(' · ')}</span>` : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b>`
    + `<span>${tracks.length} tracks · ${albums.length} albums</span>${genreLine}${objSourceTag(source)}</div></div>`;
  if (tracks.length)
    html += `<div><div class="obj-section-label">Tracks</div>${objRenderTracks(tracks)}</div>`;
  if (albums.length)
    html += `<div><div class="obj-section-label">Albums</div>`
      + _searchObjRows(albums.map(a => ({ uri: a.uri, name: a.name, image: a.image || '' })), 'album')
      + `</div>`;
  objBody().innerHTML = html || '<div class="obj-empty">No data.</div>';
  objStore('artist:' + uri, 'Artist', name, '');
}

// DB-first (O2M cache); falls back to a live Spotify browse when not cached.
async function openArtist(uri, seedName) {
  if (!uri) { setFeedback('No artist link'); return; }
  objNavTo();
  const title = seedName || 'Artist';
  objSetHead('Artist', title, '');
  openObjPanel();
  if (objShowCached('artist:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/artist_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached) {
      // Cached rows often lack an image_url (Last.fm genre warmup stores no cover);
      // fetch the real cover live so the vignette is never a blank/placeholder.
      let image = d.image;
      if (!image) { try { image = await objCover(uri); } catch (e) {} }
      renderArtist(uri, {
        name: d.name || title, image, genres: d.genres || [], albums: d.albums || [], source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [browseR, cover] = await Promise.all([ rpc('core.library.browse', {uri}), objCover(uri) ]);
    const rows = browseR?.result || [];
    renderArtist(uri, {
      name: title, image: cover, genres: [], source: 'live',
      tracks: rows.filter(r => r.type === 'track').map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
      albums: rows.filter(r => r.type !== 'track').map(a => ({ uri: a.uri, name: a.name })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load artist.</div>'; }
}

function renderAlbum(uri, { name = 'Album', artist = '', image = '', release = '', tracks = [], source = 'db' }) {
  objSetActionUris(tracks.map(t => t.uri).filter(Boolean), uri);
  objSetHead('Album', name, artist);
  const totalMs = tracks.reduce((s, t) => s + (t.length || 0), 0);
  const coverHtml = image ? `<img class="obj-cover" src="${objEsc(image)}" alt="">` : '';
  const yr = release ? (' · ' + objEsc(String(release).slice(0, 4))) : '';
  let html = `<div class="obj-hero">${coverHtml}<div class="obj-meta"><b>${objEsc(name)}</b><span>${objEsc(artist)}</span>`
    + `<span>${tracks.length} tracks · ${msToMin(totalMs)}${yr}</span>${objSourceTag(source)}</div></div>`;
  html += objRenderTracks(tracks);
  objBody().innerHTML = html;
  objStore('album:' + uri, 'Album', name, artist);
}

// DB-first (O2M cache); falls back to a live Spotify lookup when not cached.
async function openAlbum(uri, seed) {
  if (!uri) { setFeedback('No album link'); return; }
  objNavTo();
  objSetHead('Album', seed?.name || 'Album', seed?.artist || '');
  openObjPanel();
  if (objShowCached('album:' + uri)) return;
  objLoading();
  try {
    const d = await fetch(API + '/album_info?uri=' + encodeURIComponent(uri)).then(r => r.json());
    if (d && d.cached && !d.partial) {   // full album cached → serve from DB; partial → live
      let image = d.image;
      if (!image) { try { image = await objCover(uri); } catch (e) {} }
      renderAlbum(uri, {
        name: d.name || seed?.name, artist: d.artist || seed?.artist, image, release: d.release, source: 'db',
        tracks: (d.tracks || []).map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: (t.artists || []).map(n => ({ name: n })) })),
      });
      return;
    }
  } catch(e) {}
  try {
    const [lookupR, cover] = await Promise.all([ rpc('core.library.lookup', {uris: [uri]}), objCover(uri) ]);
    let tracks = lookupR?.result?.[uri] || lookupR?.result || [];
    if (!Array.isArray(tracks)) tracks = [];
    const first = tracks[0];
    renderAlbum(uri, {
      name: first?.album?.name || seed?.name || 'Album',
      artist: (first?.artists || []).map(a => a.name).join(', ') || seed?.artist || '',
      image: cover, source: 'live',
      tracks: tracks.map(t => ({ uri: t.uri, name: t.name, length: t.length, artists: t.artists })),
    });
  } catch(e) { objBody().innerHTML = '<div class="obj-empty">Could not load album.</div>'; }
}

let _boxEditUid = null;
let _boxEditInfo = null;          // last /api/box_info payload (explicit re-render after picking)
// ── Structured box-data editor state (shared by the box editor and the wizard) ──
let _bxItems = null;              // parsed data items (aliases _boxDraft.items in the wizard)
