/* ── First-launch onboarding (increment ①: detect + connect + sync progress) ──
   Fresh-instance detection is server-side (/api/onboarding, no stored flag). The
   flow is a stepped welcome overlay; steps ③-⑤ (box wiring / first box / tour) plug
   into renderWelcome later. */
let _wcPoll = null;
/* ── Bottom sheets: one registry, one set of behaviours ────────────────────────
   Every sheet opens over the shared backdrop and is dismissed the same three ways:
   the head's ✕, Escape, or a click anywhere outside its content. `close` is what
   dismissing MEANS for that sheet — the wizard records a skip, the others just
   hide — and the array order is the stacking order, so the first one open is the
   one those three gestures act on. Add a sheet here, not in five handlers. */
const SHEETS = [
  { id: 'settings', close: () => setSheet('settings', false) },
  { id: 'pairing',  close: () => setSheet('pairing', false) },
  { id: 'welcome',  close: () => _wcSkip() },
];
const sheetIsOpen = id => !!document.getElementById(id)?.classList.contains('show');
function topSheet() { return SHEETS.find(s => sheetIsOpen(s.id)) || null; }
function closeTopSheet() { const s = topSheet(); if (s) s.close(); return !!s; }

/* The head every sheet shares: title left, ✕ right — the object panel's pattern,
   so a sheet is dismissed the same way wherever you are. Was a centred title and a
   text "Close" at the bottom of the card, which read as a different component. */
function sheetHead(title) {
  return `<div class="sheet-head">
      <div class="sheet-title">${objEsc(title || '')}</div>
      <button class="sheet-close" data-sheet-close title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>`;
}

function setSheet(id, open) {
  document.getElementById(id)?.classList.toggle('show', open);
  document.getElementById('wc-backdrop')?.classList.toggle('show', !!topSheet());
}
/* An already-populated instance never sees the wizard, so nothing would tell it that
   playback is unauthorised — every Spotify track would just fail. Show a dismissible
   notice instead, and only where Spotify is actually in use: a radio/podcast/local
   install has no reason to be nagged. */
function initPairingNotice(s) {
  const el = document.getElementById('pair-notice');
  if (!el || !s || s.streaming_paired) return;
  if (sessionStorage.getItem('o2m-pair-notice-hidden')) return;
  const c = s.counts || {};
  if ((c.liked || 0) + (c.albums || 0) + (c.playlists || 0) === 0) return;  // no Spotify here
  el.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 9v4"/><path d="M12 17h.01"/>
      <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    </svg>
    <span>Spotify playback is not authorised on this instance &mdash;
      <a href="${API}/spotify_stream_auth" id="pair-notice-link" rel="noopener">${
        s.spotify_connected ? 'authorise it' : 'sign in and authorise it'}</a>.</span>
    <button type="button" id="pair-notice-close" title="Dismiss">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>`;
  el.hidden = false;
  document.getElementById('pair-notice-link').addEventListener('click', (e) => {
    e.preventDefault();                       // a plain link opens a tab; we want the popup
    openPairingModal(() => { el.hidden = true; });
  });
  document.getElementById('pair-notice-close').addEventListener('click', () => {
    sessionStorage.setItem('o2m-pair-notice-hidden', '1');
    el.hidden = true;
  });
}

/* Playback pairing, in the app's own modal — same card as the welcome flow, so the two
   entry points (wizard step, notice) behave alike and nothing of ours opens a stray
   window. Only Spotify's own authorisation page is external, and it opens in a TAB, not
   a popup: the operator has to read and copy the redirect URL from the address bar. */
async function openPairingModal(onPaired) {
  const modal = document.getElementById('pairing');
  const body = modal?.querySelector('.wc-body');
  if (!body) return;
  const close = () => setSheet('pairing', false);

  let state = null;
  try {
    const r = await fetch(API + '/spotify_stream_auth?format=json');
    if (r.status === 401) {                   // admin-only: sign in first, then reopen
      setFeedback('Sign in to Spotify first');
      startEditAuth();
      const wait = setInterval(async () => {
        let unlocked = false;
        try { unlocked = !!(await fetch(API + '/edit_status').then(x => x.json())).unlocked; } catch (_) {}
        if (unlocked) { clearInterval(wait); try { checkEditStatus(); } catch (_) {} openPairingModal(onPaired); }
      }, 2000);
      setTimeout(() => clearInterval(wait), 5 * 60 * 1000);
      return;
    }
    state = await r.json();
  } catch (_) { setFeedback('Pairing unavailable'); return; }

  const render = (msg, ok) => {
    const note = msg ? `<div class="wc-warn"><b>${ok ? 'Done' : 'Not paired yet'}</b>${objEsc(msg)}</div>` : '';
    body.innerHTML = `${sheetHead('Playback')}
      <div class="wc-logo">O2M</div>
      <div class="wc-step">Playback</div>
      <div class="wc-title">Authorise playback</div>
      <div class="wc-sub">Spotify requires a separate authorisation to play audio. Once per instance.</div>
      ${note}
      <ol class="wc-steps">
        <li><a href="${state.authorize_url}" id="pair-open" target="_blank" rel="noopener">Open the Spotify authorisation</a> and accept.</li>
        <li>The page will fail to reach <code>127.0.0.1:8898</code> — that is expected.</li>
        <li>Copy the full address-bar URL and paste it below.</li>
      </ol>
      <input class="wc-input" id="pair-url" placeholder="http://127.0.0.1:8898/login?code=..." autocomplete="off">
      <button class="wc-btn" id="pair-submit">Authorise</button>
      <button class="wc-skip" id="pair-cancel">Cancel</button>`;
    document.getElementById('pair-cancel').addEventListener('click', close);
    const submit = document.getElementById('pair-submit');
    submit.addEventListener('click', async () => {
      const url = document.getElementById('pair-url').value.trim();
      if (!url) return;
      submit.disabled = true; submit.textContent = 'Authorising...';
      let res = {};
      try {
        res = await fetch(API + '/spotify_stream_auth', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ redirect_url: url }),
        }).then(r => r.json());
      } catch (_) { res = { ok: false, message: 'Request failed' }; }
      if (res.paired) {
        close();
        setFeedback('Spotify playback authorised');
        if (typeof onPaired === 'function') onPaired();
      } else {
        state.authorize_url = res.authorize_url || state.authorize_url;  // fresh link for the retry
        render(res.message || 'Pairing failed', false);
      }
    });
  };

  if (state.paired) {                         // already done — say so instead of asking again
    setFeedback('Playback already authorised');
    if (typeof onPaired === 'function') onPaired();
    return;
  }
  render('', null);
  setSheet('pairing', true);
}
async function initOnboarding() {
  let s;
  try { s = await fetch(API + '/onboarding').then(r => r.json()); } catch (e) { return; }
  if (!s || !s.first_launch) { initPairingNotice(s); return; }  // populated → notice only
  if (sessionStorage.getItem('o2m-wc-skip')) { initPairingNotice(s); return; }  // explore first
  renderWelcome(s);
  setSheet('welcome', true);
}
function _wcStopPoll() { if (_wcPoll) { clearInterval(_wcPoll); _wcPoll = null; } }
function _wcStartPoll() {
  if (_wcPoll) return;
  _wcPoll = setInterval(async () => {
    try { renderWelcome(await fetch(API + '/onboarding').then(r => r.json())); } catch (e) {}
  }, 4000);
}
function _wcSkip() { _wcStopPoll(); sessionStorage.setItem('o2m-wc-skip', '1'); setSheet('welcome', false); }
function renderWelcome(s) {
  const body = document.querySelector('#welcome .wc-body');
  if (!body || !s) return;
  const connected = s.spotify_connected || editUnlocked;
  const c = s.counts || {};
  const synced = (c.liked || 0) + (c.albums || 0) + (c.playlists || 0) > 0;
  if (!connected) {
    // Keep polling while we wait for the Spotify OAuth to complete — the poll re-renders
    // and auto-advances the moment `spotify_connected`/`editUnlocked` flips. (Do NOT stop
    // the poll here, or the connect step would kill its own auto-detection on the 1st tick.)
    // Read-only diagnostic: if the app's Spotify redirect doesn't match this host, the
    // OAuth round-trip will fail. Tell the operator how to fix it — we never write secrets.
    const mismatch = (s.redirect_ok === false && s.redirect_expected) ? `
      <div class="wc-warn">
        <b>Spotify redirect misconfigured — connecting will fail until fixed.</b>
        <div>Configured: <code>${objEsc(s.redirect_configured || '(unset)')}</code></div>
        <div>Expected for this host: <code>${objEsc(s.redirect_expected)}</code></div>
        <div class="wc-warn-fix">Fix (host operator): set <code>O2M_PUBLIC_URL=${objEsc(location.origin)}</code> in this instance's <code>.env</code> and recreate the <code>o2m</code> container, then register <code>${objEsc(s.redirect_expected)}</code> in the Spotify app dashboard.</div>
      </div>` : '';
    body.innerHTML = `<div class="wc-logo">O2M</div>
      <div class="wc-step">Step 1 / 6 · Connect</div>
      <div class="wc-title">Welcome</div>
      <div class="wc-sub">Connect your Spotify account to play your music and podcasts and sync your library. Everything else builds on this.</div>
      ${mismatch}
      <button class="wc-btn" id="wc-connect">Connect Spotify</button>
      <button class="wc-skip" id="wc-recheck">I've connected — continue</button>
      <button class="wc-skip" id="wc-skip">Explore first</button>`;
    document.getElementById('wc-connect').addEventListener('click', () => { startEditAuth(); _wcStartPoll(); });
    // Manual fallback: if the popup/redirect flow didn't auto-detect, re-check on demand.
    document.getElementById('wc-recheck').addEventListener('click', async (e) => {
      e.target.disabled = true; e.target.textContent = 'Checking…';
      try { await checkEditStatus(); } catch (_) {}
      try { renderWelcome(await fetch(API + '/onboarding').then(r => r.json())); } catch (_) {}
      if (!editUnlocked) { e.target.disabled = false; e.target.textContent = "I've connected — continue"; }
    });
    document.getElementById('wc-skip').addEventListener('click', _wcSkip);
  } else if (!s.streaming_paired && !sessionStorage.getItem('o2m-wc-skip-pairing')) {
    // ── Step 2 · Playback — Spotify wants a separate authorisation for streaming,
    // once per instance. Skippable: a radio/podcast/local install never needs it.
    _wcStartPoll();
    body.innerHTML = `<div class="wc-logo">O2M</div>
      <div class="wc-step">Step 2 / 6 · Playback</div>
      <div class="wc-title">Enable playback</div>
      <div class="wc-sub">Spotify requires a separate authorisation to play audio — the sign-in you just did only covers your library. This takes one round-trip and is done once per instance.</div>
      <button class="wc-btn" id="wc-pair">Authorise playback</button>
      <button class="wc-skip" id="wc-nopair">No Spotify playback here</button>`;
    document.getElementById('wc-pair').addEventListener('click', () => {
      // The pairing modal sits on top of the wizard (same card); on success the wizard
      // re-renders underneath and moves straight on to the next step.
      openPairingModal(async () => {
        try { renderWelcome(await fetch(API + '/onboarding').then(r => r.json())); } catch (_) {}
      });
    });
    document.getElementById('wc-nopair').addEventListener('click', async () => {
      sessionStorage.setItem('o2m-wc-skip-pairing', '1');
      try { renderWelcome(await fetch(API + '/onboarding').then(r => r.json())); } catch (_) {}
    });
  } else if (s.onboarding_done) {
    // ── Step 4 · First box (done wins over sync/setup, whatever the counts read) ──
    _wcStopPoll();
    body.innerHTML = `<div class="wc-logo">O2M</div>
      <div class="wc-step">Step 5 / 6 · Your first box</div>
      <div class="wc-title">All set</div>
      <div class="wc-sub">Your starter boxes are in place. Now create your own box (music, podcast or radio) — or finish and explore the interface.</div>
      <button class="wc-btn" id="wc-firstbox">Create a box</button>
      <button class="wc-skip" id="wc-finish">Finish</button>`;
    const close = () => { _wcStopPoll(); setSheet('welcome', false); };
    document.getElementById('wc-firstbox').addEventListener('click', () => { close(); if (typeof openBoxWizard === 'function') openBoxWizard(); });
    document.getElementById('wc-finish').addEventListener('click', close);
  } else if (!synced) {
    _wcStartPoll();
    body.innerHTML = `<div class="wc-logo">O2M</div>
      <div class="wc-step">Step 3 / 6 · Sync</div>
      <div class="wc-title">Syncing your library…</div>
      <div class="wc-sub">Albums, liked tracks and playlists are being cached (in the background). You can continue as soon as content appears.</div>
      <div class="wc-counts">
        <div><b>${c.albums || 0}</b><span>albums</span></div>
        <div><b>${c.liked || 0}</b><span>liked</span></div>
        <div><b>${c.playlists || 0}</b><span>playlists</span></div>
      </div>
      <button class="wc-btn" id="wc-cont">Continue</button>`;
    document.getElementById('wc-cont').addEventListener('click', _wcSkip);
  } else if (!s.onboarding_done) {
    // ── Step 3 · Boxes: sanitize + create the O2M playlists + starter boxes ──
    _wcStopPoll();
    body.innerHTML = `<div class="wc-logo">O2M</div>
      <div class="wc-step">Step 4 / 6 · Boxes</div>
      <div class="wc-title">Setting up your boxes</div>
      <div class="wc-sub" id="wc-plan">Analyzing your setup…</div>
      <button class="wc-btn" id="wc-setup">Set up my boxes</button>
      <button class="wc-skip" id="wc-skip3">Skip</button>`;
    // Preview via dry-run (no side effects).
    fetch(API + '/onboarding/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dry_run: true }) })
      .then(r => r.json()).then(p => {
        const pl = (p && p.plan) || {};
        const el = document.getElementById('wc-plan');
        if (el) el.innerHTML = `We'll clean up <b>${(pl.delete || []).length}</b> imported box(es), create your <b>O2M Incoming / Trash</b> playlists (in your Spotify account) and <b>${(pl.create_boxes || []).length}</b> starter boxes (Auto, New, Podcasts, Radio…).`;
      }).catch(() => {});
    document.getElementById('wc-setup').addEventListener('click', async (e) => {
      e.target.disabled = true; e.target.textContent = 'Setting up…';
      try { await fetch(API + '/onboarding/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) }).then(r => r.json()); } catch (_) {}
      try { if (typeof loadBoxes === 'function') loadBoxes(); } catch (_) {}
      try { renderWelcome(await fetch(API + '/onboarding').then(r => r.json())); } catch (_) {}
    });
    document.getElementById('wc-skip3').addEventListener('click', _wcSkip);
  }
}

async function init() {
  // Pochette de remplacement dès le chargement (évite l'image vide) + repli si un visuel casse
  const coverEl = document.getElementById('cover');
  // Generated cover by default; PNG fallback only if the library did not load.
  if (!setCoverGenerated(null)) coverEl.src = PLACEHOLDER_COVERS[2];
  // A broken remote image falls back to the generated cover: it cannot 404,
  // so the old anti-loop guard is no longer needed.
  coverEl.addEventListener('error', () => {
    if (!setCoverGenerated(matrixCurUri)) coverEl.src = PLACEHOLDER_COVERS[2];
  });

  readThemeColors();
  setupThemeSwitcher();
  setupCollapsibles();
  setupProgressSeek();
  ['energy', 'valence', 'dl'].forEach(setupDial);
  makeDraggable('energy', v => { appState.energy = v; });
  makeDraggable('valence', v => { appState.valence = v; });
  makeDraggable('dl',     v => { appState.dl = Math.round(v * 10); });
  initMatrix();
  initTdMatrix();

  document.getElementById('btn-clear-tl').addEventListener('click', clearTracklist);
  document.getElementById('btn-clear-boxes')?.addEventListener('click', (e) => { e.stopPropagation(); clearAllBoxes(); });
  document.getElementById('btn-reset-mood')?.addEventListener('click', (e) => { e.stopPropagation(); resetMood(); });
  // Overprint: tap/click the cover to toggle its recolorization (rollover does it on desktop).
  document.getElementById('cover-wrap')?.addEventListener('click', () =>
    document.getElementById('top-zone')?.classList.toggle('cover-lit'));
  document.getElementById('btn-snapcast')?.addEventListener('click', toggleSnapcast);
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
  autoToggle = localStorage.getItem('mood-auto') === '1';
  document.getElementById('btn-auto')?.addEventListener('click', () => setAutoToggle(!isAutoMode()));
  updateAutoBtn();
  document.addEventListener('fullscreenchange', updateFsBtn);
  document.addEventListener('webkitfullscreenchange', updateFsBtn);

  // Fetch client config (snap WebSocket URL)
  try {
    const cfg = await fetch(API + '/client_config').then(r => r.json());
    snapWsUrl = cfg.snap_ws_url || null;
    mopidyWsUrl = cfg.mopidy_ws_url || null;
    backofficeUrl = cfg.backoffice_url || null;
  } catch(e) {}
  // The button stays even with no Snapcast configured: it is the playback
  // TARGET control, and offline is reachable through it. The cycle drops the
  // middle state by itself (see cyclePlaybackTarget).
  paintPlaybackTarget();
  const backofficeLink = document.getElementById('footer-backoffice');
  if (backofficeUrl) { backofficeLink.href = backofficeUrl; }
  else { backofficeLink?.remove(); }
  connectMopidyWS();   // real-time + RPC over WebSocket (automatic HTTP fallback)

  try {
    await syncMoodDials();
  } catch(e) {}
  initBasicView();   // no-op outside /basic
  netProbe();
  setInterval(netProbe, 8000);

  initMediaSession();
  offInit();
  document.getElementById('btn-edit-lock')?.addEventListener('click', (e) => { e.stopPropagation(); startEditAuth(); });
  document.getElementById('btn-track-menu')?.addEventListener('click', (e) => { e.stopPropagation(); openActionMenu(e.currentTarget, trackMenuItems(matrixCurUri, currentTlid)); });
  document.querySelector('#track-details .td-head')?.addEventListener('click', () => {
    document.getElementById('track-details')?.classList.toggle('open');
  });
  // Mobile: open/close the details/edit space as a bottom-sheet modal.
  // History-tracked so the back gesture closes the sheet instead of the app.
  const closeDetails = () => {
    document.body.classList.remove('details-open');
    modalHistoryConsume('details');
  };
  document.getElementById('btn-details')?.addEventListener('click', () => {
    const willOpen = !document.body.classList.contains('details-open');
    if (willOpen) modalHistoryPush('details');
    document.body.classList.toggle('details-open', willOpen);
    if (!willOpen) modalHistoryConsume('details');
  });
  document.getElementById('btn-details-close')?.addEventListener('click', closeDetails);
  document.getElementById('details-backdrop')?.addEventListener('click', closeDetails);
  // (td-fav + energy/valence/mood cells are wired per-render by tdPanel.render → rewire)
  // Object detail overlay (album · artist · box)
  document.getElementById('obj-close')?.addEventListener('click', closeObjPanel);
  document.getElementById('obj-prev')?.addEventListener('click', objBackNav);
  document.getElementById('obj-next')?.addEventListener('click', objFwdNav);
  document.getElementById('obj-actions')?.addEventListener('click', (e) => { e.stopPropagation(); openObjActions(e.currentTarget); });
  document.getElementById('obj-backdrop')?.addEventListener('click', closeObjPanel);
  /* Clicking outside the object panel dismisses it, the same affordance as every
     sheet. The backdrop alone could not carry this: from 700px up the panel is an
     in-place overlay of the content area (absolute, inset 0) and the backdrop is
     switched off entirely, so there was nothing outside it to click — searching or
     opening an album simply would not close.
     pointerdown, not click, so an opener that lives outside the panel still works:
     we dismiss on the press, its own click then opens the new object, and the two
     history entries cancel out. */
  document.addEventListener('pointerdown', (e) => {
    if (!document.body.classList.contains('obj-open')) return;
    const panel = document.getElementById('obj-panel');
    if (!panel || panel.contains(e.target)) return;
    if (e.target.closest?.('#obj-backdrop')) return;   // its own handler covers it
    closeObjPanel();
  });
  // The three dismiss gestures, wired once from the registry.
  document.getElementById('wc-backdrop')?.addEventListener('click', closeTopSheet);
  SHEETS.forEach(sh => document.getElementById(sh.id)?.addEventListener('click', (e) => {
    // A sheet is a full-width panel holding a narrower card, so on a wide screen
    // there is sheet surface either side of it. Clicking there used to do nothing
    // while clicking ABOVE the sheet (the backdrop) closed — that was the
    // inconsistency. e.target is the sheet itself only for that empty surface.
    if (e.target === e.currentTarget || e.target.closest?.('[data-sheet-close]')) sh.close();
  }));
  document.getElementById('footer-settings')?.addEventListener('click', openSettings);
  document.getElementById('artist-name')?.addEventListener('click', () => {
    const a = (currentTrackObj?.artists || [])[0];
    if (a?.uri) openArtist(a.uri, a.name);
  });
  document.getElementById('album-name')?.addEventListener('click', openCurrentAlbum);
  // Delegated clicks inside the overlay → info menu, drill into albums/artists/boxes,
  // or play a track. Same info badge + row pattern as the tracklist.
  document.getElementById('obj-body')?.addEventListener('click', async (e) => {
    // Pick mode: a click on any result row ADDS it to the box-content editor
    // instead of navigating; everything else (ⓘ menus…) is swallowed.
    // The box-content editor (list rows + inline Add-content panels) handles
    // its own clicks — a result row there adds content instead of navigating.
    if (e.target.closest('#bx-editor-host')) return;
    // "Load more" at the bottom of a search: append the next page in place.
    if (e.target.closest('[data-search-more]')) { e.preventDefault(); return searchLoadMore(); }
    if (e.target.closest('[data-browse-more]')) { e.preventDefault(); return browseLoadMore(); }
    const bn = e.target.closest('[data-browse-node]');
    if (bn) { e.preventDefault(); return openBrowseNode(bn.dataset.browseNode); }
    const ib = e.target.closest('.tl-info');
    if (ib) {
      // data-kind (search results) → kind-aware menu (artist/album get Play +
      // See details); otherwise a plain track menu (detail track lists). The
      // library/favorite toggle is appended with its live state (async).
      const items = await menuItemsWithLibrary(ib.dataset.uri, ib.dataset.kind || null);
      openActionMenu(ib, items); return;
    }
    // Click on a harmonized object row (not the ⓘ, not the artist sublink) → open its detail.
    const orow = e.target.closest('.tl-item.obj-openable');
    if (orow && !e.target.closest('.tl-artist[data-artist-uri]')) {
      objOpenByKind(orow.dataset.uri, orow.dataset.kind, orow.dataset.name); return;
    }
    const row = e.target.closest('[data-artist-uri],[data-album-uri],[data-box-uid]');
    if (!row) return;
    if (row.dataset.artistUri) return openArtist(row.dataset.artistUri, (row.textContent || '').trim());
    if (row.dataset.albumUri)  return openAlbum(row.dataset.albumUri, { name: row.dataset.name || '' });
    if (row.dataset.boxUid)    return openBox(row.dataset.boxUid);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!closeTopSheet() && document.body.classList.contains('obj-open')) closeObjPanel();
  });
  // Content search: expand the field on the icon, debounce input, Enter = now.
  const searchBox = document.getElementById('search-box');
  const searchInput = document.getElementById('search-input');
  let _searchTimer = null;
  document.getElementById('btn-browse')?.addEventListener('click', openBrowse);
  document.getElementById('btn-search')?.addEventListener('click', () => {
    const open = searchBox.classList.toggle('open');
    if (open) searchInput.focus();
    else { searchInput.value = ''; clearTimeout(_searchTimer); }
  });
  const runSearch = () => { const q = searchInput.value.trim(); if (q.length >= 2) openSearch(q); };
  searchInput?.addEventListener('input', () => { clearTimeout(_searchTimer); _searchTimer = setTimeout(runSearch, 550); });
  searchInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(_searchTimer); runSearch(); } });
  // Header search field: refine the query in place (no modal close, no nav push).
  const objSearchInput = document.getElementById('obj-search-input');
  let _objSearchTimer = null;
  const runObjSearch = () => { const q = objSearchInput.value.trim(); if (q.length >= 2) openSearch(q, { inPlace: true }); };
  objSearchInput?.addEventListener('input', () => { clearTimeout(_objSearchTimer); _objSearchTimer = setTimeout(runObjSearch, 550); });
  objSearchInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(_objSearchTimer); runObjSearch(); }
    else if (e.key === 'Escape') { e.stopPropagation(); objSearchInput.blur(); }   // blur, don't close the modal
  });
  checkEditStatus();
  initOnboarding();
  await loadBoxes();
  // Laisse au WS le temps de s'ouvrir (≤300ms) → préfère WS sur HTTP mais ne bloque plus longtemps
  await Promise.race([wsReady, new Promise(r => setTimeout(r, 300))]);
  await refreshNowPlaying();
  await refreshVolume();
  setInterval(refreshNowPlaying, 10000);   // safety net + clock resync (WS events drive real-time)
  setInterval(refreshVolume, 15000);
  // A box can be activated from anywhere — an NFC tap, another device — and the
  // dials would keep showing the previous mood until the page was reloaded. Cheap
  // enough to poll: ?light=1 skips the two table-wide aggregates.
  setInterval(syncMoodDials, 15000);
  setInterval(tickProgress, 250);          // local display, NO network
  // Mobile with Snapcast → "tap to start audio" splash (handles the gesture, snap
  // connect and playback). Otherwise: desktop snap-state restore + phone auto-init.
  if (isPhoneDevice() && snapWsUrl) {
    showAudioTapOverlay();
  } else {
    autoConnectSnapIfNeeded();
    autoInitPlaybackIfPhone();
  }
  armMediaAnchor();
  watchAudioDevices();
  watchSheetTop();

  let fitTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(fitTimer); fitTimer = setTimeout(fitHeroTitle, 150);
  });
  fitHeroTitle();
}

let seekDragging = false;
function setupProgressSeek() {
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  const elapsed = document.getElementById('prog-elapsed');
  if (!bar) return;
  const pctFromEvent = (e) => {
    const rect = bar.getBoundingClientRect();
    if (rect.width <= 0) return 0;
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  };
  const preview = (p) => {
    fill.style.width = (p * 100) + '%';
    if (currentDurationMs) elapsed.textContent = msToMin(p * currentDurationMs);
  };
  bar.addEventListener('pointerdown', (e) => {
    seekDragging = true;
    bar.classList.add('seeking');
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    preview(pctFromEvent(e));
    e.preventDefault();
  });
  bar.addEventListener('pointermove', (e) => { if (seekDragging) preview(pctFromEvent(e)); });
  const end = async (e) => {
    if (!seekDragging) return;
    seekDragging = false;
    bar.classList.remove('seeking');
    const p = pctFromEvent(e);
    if (OFF.on) { offSeekFraction(p); return; }
    if (currentDurationMs) {
      await rpc('core.playback.seek', { time_position: Math.round(p * currentDurationMs) });
      setTimeout(updateProgress, 300);
    }
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', () => { seekDragging = false; bar.classList.remove('seeking'); });
}

// ─── Local progress clock (no per-second RPC, Iris-style) ────────────────────
// We know the position at an instant (10s resync + seeked/started events) and
// then advance it in the browser. tickProgress() does NO network call.
let progBaseMs = 0, progBaseAt = 0, progPlaying = false, lastNpUri = null, lastCoverUrl = '';
function setClock(posMs, playing) {
  progBaseMs = Math.max(0, posMs || 0); progBaseAt = Date.now(); progPlaying = !!playing;
  document.body.classList.toggle('is-paused', !progPlaying);
  pushPositionState();   // single authoritative push; the OS interpolates from here
}
// Optimistic snap of the progress bar to 0 on next/prev, before refreshNowPlaying
// arrives. Bypasses CSS `transition: width 1s linear` so bar jumps instantly.
function resetProgress() {
  progBaseMs = 0; progBaseAt = Date.now();
  const fill = document.getElementById('progress-fill');
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(() => { fill.style.transition = ''; });
  }
  document.getElementById('prog-elapsed').textContent = msToMin(0);
}
function clockPosMs() {
  return progPlaying ? progBaseMs + (Date.now() - progBaseAt) : progBaseMs;
}
// Push the position to the OS media notification ONCE per real change (seek,
// play/pause, track change, 10s resync). The OS advances the scrubber itself
// from playbackRate, so we must NOT call this every tick — doing so redraws the
// Android media controls ~4×/s and makes them flicker.
function pushPositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  if (!currentDurationMs) return;
  try {
    navigator.mediaSession.setPositionState({
      duration: currentDurationMs / 1000,
      position: Math.min(clockPosMs(), currentDurationMs) / 1000,
      playbackRate: progPlaying ? 1 : 0,
    });
  } catch(e) {}
}
function tickProgress() {
  if (seekDragging || !currentDurationMs) return;
  const pos = Math.min(clockPosMs(), currentDurationMs);
  // In-page bar only — NO mediaSession call here (see pushPositionState).
  document.getElementById('progress-fill').style.width =
    Math.min(100, (pos / currentDurationMs) * 100) + '%';
  document.getElementById('prog-elapsed').textContent = msToMin(pos);
}
async function updateProgress() {          // one-off network resync (not a 1s loop)
  if (seekDragging) return;
  const r = await rpc('core.playback.get_time_position');
  if (r && r.result != null) setClock(r.result, progPlaying);
}

// ─── Mopidy events received via push on the WebSocket ────────────────────────
// O2M refills the tracklist track-by-track during playback → a burst of
// `tracklist_changed`. Coalesce them into a single refresh to avoid replaying
// refreshNowPlaying (and its RPCs) many times per second.
let _tlChangeTimer = null;
function scheduleTracklistRefresh() {
  clearTimeout(_tlChangeTimer);
  _tlChangeTimer = setTimeout(refreshNowPlaying, 300);
}

function onMopidyEvent(m) {
  if (OFF.on) return;          // the server may still be talking; we are not listening
  switch (m.event) {
    case 'tracklist_changed':
      scheduleTracklistRefresh(); break;   // debounced (bursty during refill)
    case 'track_playback_started':
    case 'track_playback_ended':
    case 'playback_state_changed':
      refreshNowPlaying(); break;          // reseed track + state + clock
    case 'track_playback_paused':
      if (m.time_position != null) setClock(m.time_position, false); else progPlaying = false; break;
    case 'track_playback_resumed':
      if (m.time_position != null) setClock(m.time_position, true); else progPlaying = true; break;
    case 'seeked':
      if (m.time_position != null) setClock(m.time_position, progPlaying); break;
    case 'volume_changed':
      refreshVolume(); break;
  }
}

function setFeedback(msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg || '';
  el.classList.toggle('show', !!msg);
  clearTimeout(el._t);
  if (msg) el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ── Fullscreen ── */
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFullscreen() {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el).catch(() => {});
}
function exitFullscreen() {
  (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
}
function toggleFullscreen() {
  if (isFullscreen()) exitFullscreen(); else enterFullscreen();
}
function updateFsBtn() {
  document.getElementById('btn-fullscreen')?.classList.toggle('on', isFullscreen());
}

init();

// PWA : enregistre le service worker (uniquement en contexte sécurisé HTTPS).
// En HTTP, navigator.serviceWorker est absent ou register() échoue → ignoré.
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
