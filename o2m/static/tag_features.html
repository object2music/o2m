<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Features — O2M</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Design system : source unique des tokens (voir DESIGN_SYNC.md). -->
<link rel="stylesheet" href="/static/ds/o2m.css">
<script>
  /* Le thème suit celui choisi dans Mood : même clé, même défaut. Appliqué avant
     le rendu pour éviter le flash. Pas de sélecteur ici — Mood reste la surface
     de réglage, donc data-theme est fixe pour la durée de la page. */
  (function () {
    var t = new URLSearchParams(location.search).get('theme')
          || localStorage.getItem('o2m2-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  /* Retour arrière depuis Mood après un changement de thème : la page restaurée
     depuis le bfcache garderait l'ancien data-theme. */
  addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    var t = localStorage.getItem('o2m2-theme') || 'dark';
    if (t !== document.documentElement.getAttribute('data-theme')) location.reload();
  });
</script>
<style>
  /* Pas de :root ici : tous les tokens viennent de ds/o2m.css. */
  body { min-height: 100vh; }
  header { background: var(--surface); padding: 12px 20px; display: flex;
           align-items: center; gap: 16px; border-bottom: 1px solid var(--border); }
  header h1 { font-family: var(--font-head); font-size: var(--t-h3); font-weight: 700; text-transform: uppercase; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 12px; border-radius: var(--radius); border: 1px solid var(--border-strong);
                background: transparent; color: var(--muted); cursor: pointer;
                font-size: var(--t-body-s); transition: all .15s; }
  .filter-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .stats { margin-left: auto; font-size: var(--t-body-s); color: var(--muted); white-space: nowrap; }
  main { padding: 16px 20px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  .search { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 6px 10px; color: var(--text); width: 220px; font-size: var(--t-body-s); }
  .add-btn { padding: 6px 14px; background: var(--accent); color: var(--on-accent); border: none;
             border-radius: var(--radius); cursor: pointer; font-size: var(--t-body-s); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--surface); padding: 8px 10px; text-align: left;
       font-size: var(--t-label); text-transform: uppercase; letter-spacing: .5px;
       color: var(--muted); position: sticky; top: 0; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:hover td { background: var(--fill-1); }
  .tag-name { font-weight: 500; font-family: var(--font-mono); font-size: var(--t-body-s); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius);
           font-size: var(--t-label); font-weight: 600; }
  /* --mood-* sont des triplets « R,G,B » nus : ils s'insèrent tels quels dans
     rgba()/rgb(), et suivent donc le thème. */
  .badge-calm      { background: rgba(var(--mood-calm), .2);      color: rgb(var(--mood-calm)); }
  .badge-energetic { background: rgba(var(--mood-energetic), .2); color: rgb(var(--mood-energetic)); }
  .badge-dark      { background: rgba(var(--mood-dark), .2);      color: rgb(var(--mood-dark)); }
  .badge-happy     { background: rgba(var(--mood-happy), .2);     color: rgb(var(--mood-happy)); }
  .badge-noise     { background: var(--fill-2);                   color: var(--muted); }
  .bar-wrap { display: flex; align-items: center; gap: 6px; min-width: 90px; }
  /* Paire dédiée du système à cette distinction énergie / valence. */
  .bar { height: 6px; border-radius: var(--radius); background: var(--c-energy);
         min-width: 2px; transition: width .2s; }
  .bar-valence { background: var(--c-valence); }
  .bar-label { font-size: var(--t-label); color: var(--muted); width: 24px; text-align: right; }
  .actions { display: flex; gap: 6px; }
  .btn-edit, .btn-del { padding: 3px 8px; border-radius: var(--radius); border: none;
                        cursor: pointer; font-size: var(--t-label); }
  .btn-edit { background: var(--fill-2); color: var(--text); }
  .btn-del  { background: var(--fill-1); color: var(--danger); }
  .empty { text-align: center; padding: 40px; color: var(--muted); }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
             z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
           padding: var(--sp-5); width: 380px; max-width: 95vw; }
  .modal h2 { font-family: var(--font-head); font-size: var(--t-h3); text-transform: uppercase; margin-bottom: var(--sp-4); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: var(--t-label); color: var(--muted);
                 text-transform: uppercase; margin-bottom: 4px; }
  .field input, .field select { width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px;
    color: var(--text); font-size: var(--t-body-s); }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .range-val { width: 36px; text-align: right; font-size: var(--t-body-s); color: var(--muted); }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  /* Volontairement pas .o2m-btn : la classe force text-transform:uppercase et les
     libellés sont français (« ENREGISTRER »). On tokenise sans changer la casse. */
  .modal-btns button { padding: 7px 16px; border-radius: var(--radius); border: none;
                       cursor: pointer; font-size: var(--t-body-s); }
  .btn-cancel { background: var(--fill-2); color: var(--text); }
  .btn-save   { background: var(--accent); color: var(--on-accent); }
  .noise-row  { display: flex; align-items: center; gap: 8px; }
  .noise-row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
</style>
</head>
<body>
<header>
  <h1>Tag Features</h1>
  <div class="filters">
    <button class="filter-btn active" data-f="">Tous</button>
    <button class="filter-btn" data-f="mood">Mood</button>
    <button class="filter-btn" data-f="feature">Energy/Valence</button>
    <button class="filter-btn" data-f="noise">Noise</button>
    <button class="filter-btn" data-f="unknown">Inconnus</button>
  </div>
  <span class="stats" id="stats"></span>
</header>
<main>
  <div class="toolbar">
    <input class="search" id="search" placeholder="Filtrer..." oninput="render()">
    <button class="add-btn" onclick="openModal(null)">+ Ajouter</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Tag</th><th>Mood</th>
        <th>Energy</th><th>Valence</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Aucun tag</div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-title">Tag</h2>
    <div class="field">
      <label>Tag</label>
      <input id="m-tag" type="text" placeholder="post punk">
    </div>
    <div class="field">
      <label>Mood</label>
      <select id="m-mood">
        <option value="">— aucun —</option>
        <option value="calm">calm</option>
        <option value="energetic">energetic</option>
        <option value="dark">dark</option>
        <option value="happy">happy</option>
      </select>
    </div>
    <div class="field">
      <label>Energy <span id="m-energy-val" class="range-val">—</span></label>
      <div class="range-row">
        <input id="m-energy" type="range" min="0" max="1" step="0.01" value="0.5"
               oninput="document.getElementById('m-energy-val').textContent=parseFloat(this.value).toFixed(2)">
      </div>
    </div>
    <div class="field">
      <label>Valence <span id="m-valence-val" class="range-val">—</span></label>
      <div class="range-row">
        <input id="m-valence" type="range" min="0" max="1" step="0.01" value="0.5"
               oninput="document.getElementById('m-valence-val').textContent=parseFloat(this.value).toFixed(2)">
      </div>
    </div>
    <div class="field">
      <label>Options</label>
      <div class="noise-row">
        <input id="m-noise" type="checkbox">
        <span>Tag bruit (ignorer dans le scoring)</span>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveTag()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const BASE = window.location.origin + (window.location.pathname.replace(/\/tag_features.*/, ''));
let allTags = [];
let currentFilter = '';
let editingTag = null;
let hasEnergy = true, hasValence = true;

async function load(filter) {
  currentFilter = filter;
  const url = BASE + '/api/tag_features' + (filter ? '?filter=' + filter : '');
  const r = await fetch(url);
  allTags = await r.json();
  document.getElementById('stats').textContent = allTags.length + ' tags';
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const rows = allTags.filter(t => !q || t.tag.includes(q));
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if (!rows.length) { tbody.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  const dash = '<span style="color:var(--faint)">—</span>';
  tbody.innerHTML = rows.map(t => {
    const moodBadge = t.is_noise
      ? '<span class="badge badge-noise">noise</span>'
      : t.mood ? `<span class="badge badge-${t.mood}">${t.mood}</span>` : dash;
    const eVal = t.energy != null ? Math.round(t.energy * 100) : null;
    const vVal = t.valence != null ? Math.round(t.valence * 100) : null;
    // Largeur en % (et non en px comme avant : une valeur de 1.0 donnait 100px,
    // donc une barre qui ne remplissait jamais sa piste).
    const energyBar = eVal != null
      ? `<div class="bar-wrap"><div class="bar" style="width:${eVal}%"></div><span class="bar-label">${(t.energy).toFixed(2)}</span></div>`
      : dash;
    const valenceBar = vVal != null
      ? `<div class="bar-wrap"><div class="bar bar-valence" style="width:${vVal}%"></div><span class="bar-label">${(t.valence).toFixed(2)}</span></div>`
      : dash;
    return `<tr>
      <td class="tag-name">${t.tag}</td>
      <td>${moodBadge}</td>
      <td>${energyBar}</td>
      <td>${valenceBar}</td>
      <td class="actions">
        <button class="btn-edit" onclick='openModal(${JSON.stringify(t)})'>Éditer</button>
        <button class="btn-del" onclick='deleteTag("${t.tag}")'>✕</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal(tag) {
  editingTag = tag ? tag.tag : null;
  document.getElementById('modal-title').textContent = tag ? 'Éditer : ' + tag.tag : 'Ajouter un tag';
  document.getElementById('m-tag').value = tag ? tag.tag : '';
  document.getElementById('m-tag').readOnly = !!tag;
  document.getElementById('m-mood').value = tag ? (tag.mood || '') : '';
  document.getElementById('m-noise').checked = tag ? !!tag.is_noise : false;

  const e = tag && tag.energy != null ? tag.energy : 0.5;
  const v = tag && tag.valence != null ? tag.valence : 0.5;
  document.getElementById('m-energy').value = e;
  document.getElementById('m-valence').value = v;
  document.getElementById('m-energy-val').textContent = tag && tag.energy != null ? e.toFixed(2) : '—';
  document.getElementById('m-valence-val').textContent = tag && tag.valence != null ? v.toFixed(2) : '—';
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingTag = null;
}

async function saveTag() {
  const tag = document.getElementById('m-tag').value.trim();
  if (!tag) return;
  const noise = document.getElementById('m-noise').checked;
  const energy = noise ? null : parseFloat(document.getElementById('m-energy').value);
  const valence = noise ? null : parseFloat(document.getElementById('m-valence').value);
  const mood = noise ? null : document.getElementById('m-mood').value || null;

  await fetch(BASE + '/api/tag_features', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({tag, energy, valence, mood, is_noise: noise ? 1 : 0}),
  });
  closeModal();
  load(currentFilter);
}

async function deleteTag(tag) {
  if (!confirm('Supprimer "' + tag + '" ?')) return;
  await fetch(BASE + '/api/tag_features/' + encodeURIComponent(tag), {method: 'DELETE'});
  load(currentFilter);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    load(btn.dataset.f);
  });
});

load('');
</script>
</body>
</html>
