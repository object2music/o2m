# For information about configuration values that can be set in this file see:
#
#   https://pvincent.notion.site/938240be27ae46b4a27faaaba2c752fd
#

[o2m]
discover = false # utilise tous les tags pour de la recommandation / lance le contenu du dernier tag
api_result_limit = 30 
shuffle = false
default_volume = 70 #0-100
discover_level = 5 #0-10
podcast_newest_first = false # or asc
option_autofill_playlists = false
option_add_reco_after_track = true
default_box_uid = # UID of the box to launch at initialize_playback (empty = use history)

# Socket timeouts for the database connection, in seconds (0 = wait for ever,
# which is what it did before and is not advisable). These are a net under a DEAD
# socket, not a deadline on a query: a response that never arrives otherwise
# blocks the client for ever, and o2m cannot even finish starting. Seen on a
# Raspberry Pi over a mobile link. Generous on purpose — a value shorter than a
# real batch query would invent a failure. See o2m_core/o2mmodels._db_timeout.
db_read_timeout = 180
db_write_timeout = 180
db_connect_timeout = 15

# mysql or sqlite
db_type = mysql 
db_username = o2m     
db_password = o2m
db_host = mysql
db_port = 3306
db_name = o2m

#db_sqlite_path = data.db

# Last.fm API key for artist genre lookup (get one free at https://www.last.fm/api/account/create)
lastfm_api_key =

# Radio France OpenAPI key (get one free at https://developers.radiofrance.fr/) — used to
# resolve live show/station visuals for radios; empty = station brand logos are used instead.
radiofrance_api_key =