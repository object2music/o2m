services:
  mopidy:
    profiles:
      - dev
      - prod
    image: pvincent4/mopidy:latest
    build:
      context: ./mopidy
      dockerfile: Dockerfile
    ports:
      - ${PORT_MOPIDY}:6680 #Mopidy
      - ${PORT_MPD}:6600 #MPD server and control
    env_file:
      - .env
    volumes:
      - ./data/music:/app/Music
      - ./tmp/snapserver:/tmp
    restart: always
    healthcheck:
      test: "curl -f http://localhost:6680"
      interval: 120s
      timeout: 10s
      retries: 1
      start_period: 40s
    environment:
      - PYTHONUNBUFFERED= 1


  o2m:
    profiles:
    # - dev
      - prod
    image: pvincent4/o2m:latest
    build:
      context: ./o2m
      dockerfile: Dockerfile
    ports:
      - ${PORT_O2M_API}:6681
    depends_on: 
      - mopidy
      - mysql
    volumes:
      - ./o2m:/app
    restart: always
    healthcheck:
      test: "curl -f http://localhost/api/dl:6681"
      interval: 120s
      timeout: 10s
      retries: 1
      start_period: 40s
    env_file:
      - .env

  snapserver:
    profiles:
      - dev
      - prod
    image: jaedb/snapserver
    ports:
      - ${PORT_SNAPSERVER_1}:1704
      - ${PORT_SNAPSERVER_2}:1705
      - ${PORT_SNAPSERVER_HTTP}:1780
    volumes:
      - ./tmp/snapserver:/tmp
      - ./snapserver/snapserver.conf:/etc/snapserver.conf
      #- ./docker/snapserver/snapserver.json:/root/.config/snapserver/server.json
    restart: always
    #healthcheck:
    #  test: "curl -f http://localhost:1780"
    #  interval: 120s
    #  timeout: 10s
    #  retries: 1
    #  start_period: 40s
    depends_on: 
      - mopidy

  mysql:
    profiles:
    #  - dev
      - prod
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PORT_MYSQL}:3306"
    volumes:
      - ./data/db:/var/lib/mysql
      - ./o2m/samples/mysql:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3306"]
      interval: 120s
      timeout: 10s
      retries: 1
      start_period: 40s

  phpmyadmin:
    profiles:
    #  - dev
      - prod
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      #PMA_USER: xxx
      #PMA_PASSWORD: xxx
    ports:
      - "${PORT_PHPMYADMIN}:80"
    depends_on:
      - mysql
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 120s
      timeout: 10s
      retries: 1
      start_period: 40s

  back:
    profiles:
      - dev
    #  - prod
    build: backend/
    ports:
      - "8090:8090"
    volumes:
      - ./backend/pb_migrations/:/pb_migrations
      - ./backend/pb_data/:/pb_data/
  front:
    profiles:
      - dev
    # - prod
    build: frontend/
    volumes:
      - ./frontend/src/:/app/src
    network_mode: host
    restart: always
    env_file:
      - .env